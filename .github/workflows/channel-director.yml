name: Autonomous Channel Director (6h Quality & Growth Audit)

on:
  schedule:
    # Her 6 saatte bir (UTC 00:20, 06:20, 12:20, 18:20) otomatik kanal sağlığı, huni kuyruğu ve viral patlama denetimi
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  director-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Bağımlılıkları kur
        run: npm ci --ignore-scripts

      - name: Kanal Müdürü denetimini ve büyüme stratejisini çalıştır
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCESS_TOKEN_PHYSICS: ${{ secrets.META_ACCESS_TOKEN_PHYSICS }}
          META_ACCESS_TOKEN_EXPLAINER: ${{ secrets.META_ACCESS_TOKEN_EXPLAINER }}
          META_ACCESS_TOKEN_WEALTH: ${{ secrets.META_ACCESS_TOKEN_WEALTH }}
          META_ACCESS_TOKEN_BIO: ${{ secrets.META_ACCESS_TOKEN_BIO || secrets.ETA_ACCESS_TOKEN_BIO || secrets.META_ACCESS_TOKEN_WEALTH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_YOUTUBE }}
        run: npx tsx src/channel-director.ts

      - name: 4-Kanal YouTube Analytics KPI (İzlenme Saati & AVD)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID_PHYSICS: ${{ secrets.YOUTUBE_CLIENT_ID_PHYSICS }}
          YOUTUBE_CLIENT_SECRET_PHYSICS: ${{ secrets.YOUTUBE_CLIENT_SECRET_PHYSICS }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_PHYSICS: ${{ secrets.YOUTUBE_REFRESH_TOKEN_PHYSICS }}
          YOUTUBE_CLIENT_ID_EXPLAINER: ${{ secrets.YOUTUBE_CLIENT_ID_EXPLAINER }}
          YOUTUBE_CLIENT_SECRET_EXPLAINER: ${{ secrets.YOUTUBE_CLIENT_SECRET_EXPLAINER }}
          YOUTUBE_REFRESH_TOKEN_EXPLAINER: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EXPLAINER }}
          YOUTUBE_CLIENT_ID_EXPANSION: ${{ secrets.YOUTUBE_CLIENT_ID_EXPANSION }}
          YOUTUBE_CLIENT_SECRET_EXPANSION: ${{ secrets.YOUTUBE_CLIENT_SECRET_EXPANSION }}
          YOUTUBE_CLIENT_ID_WEALTH: ${{ secrets.YOUTUBE_CLIENT_ID_WEALTH }}
          YOUTUBE_CLIENT_SECRET_WEALTH: ${{ secrets.YOUTUBE_CLIENT_SECRET_WEALTH }}
          YOUTUBE_REFRESH_TOKEN_WEALTH: ${{ secrets.YOUTUBE_REFRESH_TOKEN_WEALTH }}
          YOUTUBE_CLIENT_ID_BIO: ${{ secrets.YOUTUBE_CLIENT_ID_BIO }}
          YOUTUBE_CLIENT_SECRET_BIO: ${{ secrets.YOUTUBE_CLIENT_SECRET_BIO }}
          YOUTUBE_REFRESH_TOKEN_BIO: ${{ secrets.YOUTUBE_REFRESH_TOKEN_BIO }}
        run: npx tsx src/analytics-kpi.ts

      - name: Denetim raporu, büyüme stratejisi ve KPI dosyasını kaydet
        run: |
          npx tsx src/safe-git-push.ts state/director-report.json "chore(director): 6 saatlik YT+IG kanal denetim raporu"
          if [ -f state/director-strategy.json ]; then
            npx tsx src/safe-git-push.ts state/director-strategy.json "chore(director): dinamik buyume stratejisi guncellendi"
          fi
          if [ -f state/kpi-weekly.json ]; then
            npx tsx src/safe-git-push.ts state/kpi-weekly.json "chore(kpi): 4-kanal YouTube Analytics KPI guncellendi"
          fi
