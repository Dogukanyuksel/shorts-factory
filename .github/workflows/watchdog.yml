name: Zamanlayıcı & Watchdog (Güvenilir Yayın Takvimi)

# GitHub'ın cron'u saatlerce gecikebiliyor/atlayabiliyor. Bu iş yayın takvimini KENDİSİ tutar:
# saati gelmiş ama çalışmamış (veya başarısız olmuş) işleri hemen başlatır.
# Çok sık ve birden fazla yoldan tetiklenir; bunlardan tek birinin gelmesi kaçırılan her şeyi telafi eder.
on:
  schedule:
    - cron: "*/10 * * * *"
  # Herhangi bir yayın/etkileşim/CI işi bittiğinde de kontrol et (cron hiç gelmese bile zincir devam eder)
  workflow_run:
    workflows:
      - "CI"
      - "Auto-Publish Physics Shorts (3x Daily — 6h Spaced)"
      - "Auto-Publish How-It-Works Shorts (3x Daily — 6h Spaced)"
      - "Auto-Publish Daily 16:9 Long-Form (Both Channels)"
      - "Organik Etkileşim — Kendi Videolarımızdaki Yorumlara Yanıt (2 saatte bir)"
      - "Telegram Monitor — YouTube & Instagram Reports (Every 6h)"
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece göster, hiçbir şey başlatma"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Sıradaki slota kadar (≤125 dk) bekleyip tam zamanında başlatabilmesi için
    timeout-minutes: 140
    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci --ignore-scripts

      - name: Saati gelmiş işleri kontrol et ve gerekirse başlat
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: npx tsx src/scheduler.ts
