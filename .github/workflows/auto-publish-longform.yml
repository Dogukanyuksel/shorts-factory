name: Auto-Publish Daily 16:9 Long-Form (Both Channels)

on:
  schedule:
    # Her gün 1 uzun video / kanal (PC kapalıyken 7/24 bulutta):
    # UTC 14:15 (17:15 TRT) -> Clear Mechanics (Explainer)
    # UTC 15:15 (18:15 TRT) -> Kinetic Lab (Physics)
    - cron: "15 14 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Hangi kanal için 16:9 uzun video yayınlansın?"
        type: choice
        default: both
        options:
          - both
          - explainer
          - physics
      privacy:
        description: "Video gizlilik durumu"
        type: choice
        default: public
        options:
          - public
          - unlisted
          - private
      dry_run:
        description: "Sadece render al, YouTube'a yükleme (test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-publish-longform-${{ github.event.inputs.channel || github.event.schedule }}
  cancel-in-progress: false

jobs:
  publish-explainer-longform:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '15 14 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.channel == 'explainer' || inputs.channel == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar + Chromium + espeak-ng
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          npx playwright-core install chromium --with-deps

      - name: Clear Mechanics 16:9 uzun video üret ve YouTube'a yükle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EXPLAINER }}
          YOUTUBE_PRIVACY: ${{ inputs.privacy || 'public' }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: npm run publish:longform:explainer

      - name: Yayın durumunu (state/published.json) güvenli kaydet
        if: inputs.dry_run != true
        run: |
          npx tsx src/safe-git-push.ts state/published.json "chore(publish): clear mechanics 16x9 uzun video yayinlandi"

      - name: Hata durumunda Telegram uyarısı
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_YOUTUBE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "🚨 <b>Long-Form HATA (Clear Mechanics)</b>"$'\n'"Log: ${RUN_URL}" '{chat_id:$chat, text:$text, parse_mode:"HTML", disable_web_page_preview:true}')" || true
          fi

  publish-physics-longform:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '15 15 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.channel == 'physics' || inputs.channel == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar + Chromium + espeak-ng
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          npx playwright-core install chromium --with-deps

      - name: Kinetic Lab 16:9 uzun video üret ve YouTube'a yükle
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_PHYSICS }}
          YOUTUBE_PRIVACY: ${{ inputs.privacy || 'public' }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: npm run publish:longform:physics

      - name: Yayın durumunu (state/published.json) güvenli kaydet
        if: inputs.dry_run != true
        run: |
          npx tsx src/safe-git-push.ts state/published.json "chore(publish): kinetic lab 16x9 uzun video yayinlandi"

      - name: Hata durumunda Telegram uyarısı
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_YOUTUBE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "🚨 <b>Long-Form HATA (Kinetic Lab)</b>"$'\n'"Log: ${RUN_URL}" '{chat_id:$chat, text:$text, parse_mode:"HTML", disable_web_page_preview:true}')" || true
          fi
