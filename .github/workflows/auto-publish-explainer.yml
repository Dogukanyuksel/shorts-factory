name: Auto-Publish How-It-Works Shorts (3x Daily — 6h Spaced)

on:
  schedule:
    # 100% ABD Prime Time (UTC 14:37, 19:37, 00:37 → New York 09:37, 14:37, 19:37 / LA 06:37, 11:37, 16:37)
    - cron: "37 14,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece render al, YouTube'a yükleme (test)"
        type: boolean
        default: false
      force:
        description: "Yayın aralığı korumasını (2 saat) yok say ve yine de yayınla"
        type: boolean
        default: false
      sync_instagram_only:
        description: "Sadece YouTube'da olup Instagram'da eksik olan Reels'leri eşitle"
        type: boolean
        default: false
      privacy:
        description: "Video gizlilik durumu"
        type: choice
        default: public
        options:
          - public
          - unlisted
          - private

permissions:
  contents: write

concurrency:
  group: auto-publish-explainer
  cancel-in-progress: false

jobs:
  publish-explainer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret kontrolü
        id: check_secrets
        env:
          HAS_ID: ${{ secrets.YOUTUBE_CLIENT_ID != '' || secrets.YOUTUBE_CLIENT_ID_EXPLAINER != '' }}
          HAS_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET != '' || secrets.YOUTUBE_CLIENT_SECRET_EXPLAINER != '' }}
          HAS_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EXPLAINER != '' }}
          IS_DRY: ${{ inputs.dry_run == true }}
        run: |
          if [ "$IS_DRY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_ID" = "true" ] && [ "$HAS_SECRET" = "true" ] && [ "$HAS_TOKEN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::YouTube Explainer secret'ları henüz tanımlanmadığı için bu çalışma atlandı. Kurulum: docs/CHANNEL_SETUP_GUIDE.md"
          fi

      - name: Node.js 22 kur
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar + Chromium + espeak-ng
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          npx playwright-core install chromium --with-deps

      - name: Render al ve YouTube + Instagram'a yükle
        id: publish
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID_EXPLAINER: ${{ secrets.YOUTUBE_CLIENT_ID_EXPLAINER }}
          YOUTUBE_CLIENT_SECRET_EXPLAINER: ${{ secrets.YOUTUBE_CLIENT_SECRET_EXPLAINER }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EXPLAINER }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_EXPLAINER }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCESS_TOKEN_EXPLAINER: ${{ secrets.META_ACCESS_TOKEN_EXPLAINER }}
          YOUTUBE_PRIVACY: ${{ inputs.privacy || 'public' }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          SYNC_INSTAGRAM_ONLY: ${{ inputs.sync_instagram_only == true && 'true' || 'false' }}
          # Gecikmiş cron + watchdog tetiklemesi aynı slotta 2. videoyu yayınlamasın
          MIN_PUBLISH_GAP_HOURS: "2"
          FORCE_PUBLISH: ${{ inputs.force == true && 'true' || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_YOUTUBE }}
        run: npm run publish:explainer

      - name: Yayın durumunu (state/published.json) güvenli kaydet
        # always(): YouTube yüklemesinden SONRA bir hata olsa bile kayıt push edilsin (tekrar yüklemeyi önler)
        if: always() && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure') && inputs.dry_run != true
        run: |
          npx tsx src/safe-git-push.ts state/published.json "chore(publish): explainer short yayinlandi"
          if [ -f state/derived-shorts-queue.json ]; then
            npx tsx src/safe-git-push.ts state/derived-shorts-queue.json "chore(funnel): vitrin short kuyrugu guncellendi"
          fi
          if [ -f state/youtube-quota.json ]; then
            npx tsx src/safe-git-push.ts state/youtube-quota.json "chore(quota): YouTube kota durumu guncellendi"
          fi

      - name: Bilgi notu (ör. kota doldu) varsa Telegram'a ilet
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_YOUTUBE }}
        run: |
          if [ -f out/publish-notice.txt ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            TEXT="ℹ️ <b>Clear Mechanics Shorts</b>"$'\n'"$(sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' out/publish-notice.txt)"
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$TEXT" '{chat_id:$chat, text:$text, parse_mode:"HTML", disable_web_page_preview:true}')" >/dev/null || true
          fi

      - name: Hata durumunda Telegram uyarısı (sebebiyle)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_YOUTUBE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            REASON="(sebep dosyası yok — render/kurulum adımında hata olabilir, logu açın)"
            [ -f out/last-error.txt ] && REASON="$(head -c 600 out/last-error.txt | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')"
            TEXT="🚨 <b>Clear Mechanics Shorts HATA</b>"$'\n'"<b>Sebep:</b> ${REASON}"$'\n'"Log: ${RUN_URL}"
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$TEXT" '{chat_id:$chat, text:$text, parse_mode:"HTML", disable_web_page_preview:true}')" >/dev/null || true
          fi
