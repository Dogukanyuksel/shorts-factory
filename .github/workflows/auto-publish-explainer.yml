name: Auto-Publish How-It-Works Shorts (3x Daily — 6h Spaced)

on:
  schedule:
    # 6 saat arayla günde 3 video (UTC 11:37, 17:37, 23:37 — :30 yoğunluğunu atlar, 0-view jail & kota güvenli)
    - cron: "37 11,17,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece render al, YouTube'a yükleme (test)"
        type: boolean
        default: false
      sync_instagram_only:
        description: "Sadece YouTube'da olup Instagram'da eksik olan Reels'leri eşitle"
        type: boolean
        default: false
      privacy:
        description: "Video gizlilik durumu"
        type: choice
        default: public
        options:
          - public
          - unlisted
          - private

permissions:
  contents: write

concurrency:
  group: auto-publish-explainer
  cancel-in-progress: false

jobs:
  publish-explainer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret kontrolü
        id: check_secrets
        env:
          HAS_ID: ${{ secrets.YOUTUBE_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET != '' }}
          HAS_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EXPLAINER != '' }}
          IS_DRY: ${{ inputs.dry_run == true }}
        run: |
          if [ "$IS_DRY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_ID" = "true" ] && [ "$HAS_SECRET" = "true" ] && [ "$HAS_TOKEN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::YouTube Explainer secret'ları henüz tanımlanmadığı için bu çalışma atlandı. Kurulum: docs/CHANNEL_SETUP_GUIDE.md"
          fi

      - name: Node.js 22 kur
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar + Chromium + espeak-ng
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
          npx playwright-core install chromium --with-deps

      - name: Render al ve YouTube + Instagram'a yükle
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EXPLAINER }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID_EXPLAINER }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          YOUTUBE_PRIVACY: ${{ inputs.privacy || 'public' }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          SYNC_INSTAGRAM_ONLY: ${{ inputs.sync_instagram_only == true && 'true' || 'false' }}
        run: npm run publish:explainer

      - name: Yayın durumunu (state/published.json) güvenli kaydet
        if: steps.check_secrets.outputs.ready == 'true' && inputs.dry_run != true
        run: |
          npx tsx src/safe-git-push.ts state/published.json "chore(publish): explainer short yayinlandi"

      - name: Hata durumunda Telegram uyarısı
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID_YOUTUBE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"🚨 <b>Shorts Factory HATA</b>\nWorkflow: <b>Auto-Publish Explainer</b>\nLog: ${RUN_URL}\",\"parse_mode\":\"HTML\",\"disable_web_page_preview\":true}" || true
          fi
