<!doctype html>
<!-- Simülasyon #6: Hypnotic 15-Pendulum Harmonic Wave -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#050712;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 720, H = 1280, FPS = 60, HOOK = 'WAIT FOR THE ALIGNMENT...';
const COUNT = 15;
let prevSign = [], events = [], simTime = 0;

window.init = (cfg) => {
  W = cfg.width || 720; H = cfg.height || 1280; FPS = cfg.fps || 60;
  HOOK = cfg.hook || 'WAIT FOR THE ALIGNMENT...';
  cv.width = W; cv.height = H;
  prevSign = Array(COUNT).fill(1);
  events = []; simTime = 0;
};

function drawFrame(t) {
  const S = W / 720, cx = W * 0.5, pivotY = H * 0.21;
  ctx.fillStyle = '#050712'; ctx.fillRect(0, 0, W, H);
  // Merkez çizgisi
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2 * S;
  ctx.beginPath(); ctx.moveTo(cx, pivotY); ctx.lineTo(cx, H * 0.86); ctx.stroke();

  const pts = [];
  for (let i = 0; i < COUNT; i++) {
    // Harmonik frekans merdiveni (her 16 sn'de tam hizalanma!)
    const freq = (12 + i) * ((Math.PI * 2) / 32);
    const angle = Math.cos(t * freq) * 0.68;
    const sign = angle >= 0 ? 1 : -1;
    if (t > 0.05 && sign !== prevSign[i]) {
      prevSign[i] = sign;
      events.push({ t, type: 'bounce', pitchIndex: i, intensity: 0.42 });
    }
    const len = (170 + i * 44) * S;
    const bx = cx + Math.sin(angle) * len;
    const by = pivotY + Math.cos(angle) * len;
    const hue = (i / COUNT) * 280 + 170;
    const col = `hsl(${hue % 360}, 95%, 62%)`;
    pts.push({ x: bx, y: by, col });

    ctx.strokeStyle = 'rgba(148,163,184,0.22)'; ctx.lineWidth = 2 * S;
    ctx.beginPath(); ctx.moveTo(cx, pivotY); ctx.lineTo(bx, by); ctx.stroke();
  }

  // Sarkaçları bağlayan neon dalga çizgisi
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 3 * S;
  ctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.stroke();

  // Parlayan sarkaç topları
  for (const p of pts) {
    ctx.save();
    ctx.fillStyle = p.col; ctx.shadowColor = p.col; ctx.shadowBlur = 18 * S;
    ctx.beginPath(); ctx.arc(p.x, p.y, 15 * S, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x - 4 * S, p.y - 4 * S, 4 * S, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  ctx.save(); ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(40 * S)}px -apple-system, sans-serif`; ctx.fillStyle = '#ffffff';
  ctx.fillText(HOOK, W * 0.5, H * 0.13);
  ctx.restore();
}

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    drawFrame((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};
window.getEvents = () => events;
window.ready = true;
</script>
