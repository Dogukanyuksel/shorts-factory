<!doctype html>
<!--
  Kinetic Lab HQ — 3D PBR: 15-Pendulum Phase Wave (Order → Helix → Chaos → Perfect Re-Sync)
  Y-LABS 3D Cinema Engine (Three.js PBR 15 Harmonic Metallic Pendulums + Glowing Phase Spine, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0B0F19;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  drawStudioHud,
  clamp,
  lerp,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let W = 720, H = 1280, FPS = 60, DUR = 26, EVENTS = [];
let stage = null, built = false;
let rigs = [], spineLine;
const COUNT = 15;

window.getEvents = () => EVENTS;

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'physics', fov: 40, fogDensity: 0.018, floorY: -2.8 });
  const { scene } = stage;
  const mats = createMaterials('physics');

  // Overhead gantry bar
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 6.2), mats.darkMetal);
  bar.position.set(0, 2.25, 0);
  scene.add(bar);

  rigs = [];
  for (let i = 0; i < COUNT; i++) {
    const z = -2.8 + (i / (COUNT - 1)) * 5.6;
    // Exact integer cycles over DUR so all 15 re-sync perfectly at t = DUR!
    const cycles = 12 + i;
    const len = lerp(2.85, 1.95, i / (COUNT - 1));
    const hueCol = new THREE.Color().setHSL(0.52 + (i / COUNT) * 0.42, 0.92, 0.58).getHex();

    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, len, 10), mats.steel);
    const bob = new THREE.Mesh(new THREE.SphereGeometry(0.21, 22, 22), mats.glow(hueCol, 0.95));
    scene.add(rod, bob);
    rigs.push({ rod, bob, z, len, cycles });
  }

  const sGeo = new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(COUNT * 3), 3));
  spineLine = new THREE.Line(sGeo, new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.85 }));
  scene.add(spineLine);

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  cv.width = W;
  cv.height = H;
  buildScene();

  EVENTS = [
    { t: DUR * 0.25, type: 'bounce', intensity: 0.8 },
    { t: DUR * 0.5, type: 'break', intensity: 1.0 },
    { t: DUR * 0.75, type: 'bounce', intensity: 0.85 },
    { t: DUR * 0.95, type: 'win', intensity: 1.0 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  const spineArr = spineLine.geometry.attributes.position.array;
  rigs.forEach((r, i) => {
    const theta = 0.72 * Math.cos(2 * Math.PI * r.cycles * p);
    const bx = r.len * Math.sin(theta);
    const by = 2.25 - r.len * Math.cos(theta);
    r.bob.position.set(bx, by, r.z);
    r.rod.position.set(bx * 0.5, (2.25 + by) * 0.5, r.z);
    r.rod.rotation.z = theta;

    spineArr[i * 3] = bx;
    spineArr[i * 3 + 1] = by;
    spineArr[i * 3 + 2] = r.z;
  });
  spineLine.geometry.attributes.position.needsUpdate = true;

  const camA = lerp(-0.42, 0.42, p) + Math.sin(t * 0.35) * 0.12;
  stage.camera.position.set(Math.sin(camA) * 8.2, 0.95, Math.cos(camA) * 8.2);
  stage.camera.lookAt(0, -0.1, 0);

  stage.renderTo(ctx, W, H);

  const phaseLabel =
    p < 0.22 ? 'TRAVELING SINE WAVE' :
    p < 0.46 ? '3-STRAND DNA HELIX' :
    p < 0.56 ? 'PERFECT 2-WAVE SPLIT' :
    p < 0.86 ? 'APPARENT CHAOS PHASE' :
    '100% HARMONIC RE-SYNC';

  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'physics',
    title: '15-PENDULUM WAVE',
    subtitle: 'HARMONIC PHASE INTERFERENCE',
    progress: p,
    caption: phaseLabel,
    metrics: [
      { label: 'PENDULUMS', value: '15', color: '#00F0FF' },
      { label: 'CYCLE', value: `${Math.round(p * 100)}%`, color: '#FFFFFF' },
      { label: 'PATTERN', value: p > 0.86 ? 'SYNC!' : p > 0.46 && p < 0.56 ? '2-WAVE' : 'HELIX', color: '#FF3B30' },
    ],
  });
};
</script>
