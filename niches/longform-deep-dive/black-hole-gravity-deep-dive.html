<!--

<meta charset="utf-8">
<style>html,body{margin:0;background:#05040d;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // --- Deterministic Math Utilities ---
  const TAU = Math.PI * 2;
  const clamp = (v, lo, hi) => (Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : lo);
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (a, b, t) => {
    const x = clamp((t - a) / Math.max(1e-5, b - a), 0, 1);
    return x * x * (3 - 2 * x);
  };
  const hash = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
  };
  const safeR = (r) => Math.max(0.5, Number.isFinite(r) ? r : 0.5);

  // --- State ---
  let W = 1920, H = 1080, FPS = 60, DUR = 240;
  let ASPECT = '16:9';
  let TITLE = 'What Actually Happens If You Fall Into a Black Hole?';
  let BRAND = 'KINETIC LAB';
  let ACCENT = '#f472b6';
  let SHORT_META = null;
  let BEATS = [];
  let EVENTS = [];

  const DEFAULT_BEATS = [
    { id: 'b1-hook-1', actIndex: 0, actKind: 'hook', actTitle: '1. The Point of No Return', visualPhase: 'event-horizon-glow', caption: 'ESCAPE VELOCITY > LIGHT', text: 'A black hole is a region where mass bends spacetime so steeply that even light cannot climb out.' },
    { id: 'b1-hook-2', actIndex: 0, actKind: 'hook', actTitle: '1. The Point of No Return', visualPhase: 'gravitational-lensing', caption: 'LIGHT BENDS AROUND IT', text: 'You are actually seeing the back side of the accretion disc bent over the top and bottom by pure gravity.' },
    { id: 'b1-hook-3', actIndex: 0, actKind: 'hook', actTitle: '1. The Point of No Return', visualPhase: 'photon-sphere', caption: 'PHOTON SPHERE ORBIT', text: 'Just outside the event horizon sits the photon sphere, where light beams orbit in circles.' },
    { id: 'b2-bridge', actIndex: 1, actKind: 'mechanism', actTitle: '2. Spacetime Curvature & Accretion', visualPhase: 'spacetime-funnel-3d', caption: '3D GRAVITY WELL', isBridge: true, text: 'Visualize spacetime curving into a 3D funnel.' },
    { id: 'b2-accretion', actIndex: 1, actKind: 'mechanism', actTitle: '2. Spacetime Curvature & Accretion', visualPhase: 'accretion-spiral', caption: 'FRICTION AT 30% LIGHT SPEED', text: 'Violent friction superheats the plasma to millions of degrees, firing relativistic jets from the poles.' },
    { id: 'b2-time-dilation', actIndex: 1, actKind: 'mechanism', actTitle: '2. Spacetime Curvature & Accretion', visualPhase: 'time-dilation-clocks', caption: 'TIME SLOWS TO ZERO', text: 'Einstein general relativity slows your clock compared to a distant observer until you appear to freeze at the horizon.' },
    { id: 'b3-bridge', actIndex: 2, actKind: 'failure', actTitle: '3. Tidal Spaghettification', visualPhase: 'spaghettification-stretch', caption: 'GRAVITY GRADIENT RIP', isBridge: true, text: 'Crossing the horizon feels quiet until the tidal gravity gradient hits its breaking point.' },
    { id: 'b3-stretch', actIndex: 2, actKind: 'failure', actTitle: '3. Tidal Spaghettification', visualPhase: 'spaghettification-stretch', caption: 'STRETCHED INTO ATOMS', text: 'The pull on your feet becomes millions of times stronger than on your head, stretching matter into a single-atom stream.' },
    { id: 'b4-bridge', actIndex: 3, actKind: 'comparison', actTitle: '4. Earth vs Sun vs Sagittarius A*', visualPhase: 'schwarzschild-scale', caption: 'SCHWARZSCHILD RADII', isBridge: true, text: 'Compare three cosmic Schwarzschild scales side by side.' },
    { id: 'b4-compare', actIndex: 3, actKind: 'comparison', actTitle: '4. Earth vs Sun vs Sagittarius A*', visualPhase: 'schwarzschild-scale', caption: '9 MM VS 3 KM VS 12 MILLION KM', text: 'Crush Earth to a 9mm marble, the Sun to 3 km, while Sagittarius A* spans 12 million kilometers across.' },
    { id: 'b4-outro', actIndex: 3, actKind: 'comparison', actTitle: '4. Earth vs Sun vs Sagittarius A*', visualPhase: 'series-outro', caption: 'SUBSCRIBE FOR NEXT DEEP DIVE', text: 'Subscribe to Kinetic Lab for our next 60fps simulation deep dive.' },
  ];

  // --- Drawing Helpers ---
  function roundRect(x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w * 0.5, h * 0.5));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function fitFont(text, basePx, maxW, weight = '800', family = 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif') {
    let px = Math.max(10, Math.round(basePx));
    ctx.font = `${weight} ${px}px ${family}`;
    const mw = ctx.measureText(text).width || 1;
    if (mw > maxW && maxW > 10) {
      px = Math.max(10, Math.floor(px * (maxW / mw)));
      ctx.font = `${weight} ${px}px ${family}`;
    }
    return px;
  }

  function wrapLines(text, maxW, maxLines) {
    const words = String(text || '').split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    for (let i = 0; i < words.length; i++) {
      const test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width <= maxW || !cur) {
        cur = test;
      } else {
        lines.push(cur);
        cur = words[i];
        if (lines.length >= maxLines - 1) {
          cur = words.slice(i).join(' ');
          break;
        }
      }
    }
    if (cur) lines.push(cur);
    if (lines.length > maxLines) lines.length = maxLines;
    if (lines.length > 0) {
      let last = lines[lines.length - 1];
      while (last.length > 4 && ctx.measureText(last).width > maxW) {
        last = last.slice(0, -4).trimEnd() + '…';
      }
      lines[lines.length - 1] = last;
    }
    return lines;
  }

  function drawCalloutPill(cx, y, text, S, col = '#f472b6', bg = 'rgba(18, 10, 32, 0.90)', maxW = 420 * S) {
    ctx.save();
    const bw = Math.min(maxW, Math.max(210 * S, text.length * 10.5 * S + 32 * S));
    const bh = 34 * S;
    ctx.fillStyle = bg;
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(1.2, 2 * S);
    roundRect(cx - bw * 0.5, y - bh * 0.5, bw, bh, 999);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    fitFont(text, 14.5 * S, bw - 22 * S, '800');
    ctx.fillText(text, cx, y);
    ctx.restore();
  }

  function drawArrow(x1, y1, x2, y2, col, lw, headSize) {
    const ang = Math.atan2(y2 - y1, x2 - x1);
    ctx.save();
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - Math.cos(ang - 0.45) * headSize, y2 - Math.sin(ang - 0.45) * headSize);
    ctx.lineTo(x2 - Math.cos(ang + 0.45) * headSize, y2 - Math.sin(ang + 0.45) * headSize);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // --- Deep Space Cosmic Background with Deterministic Starfield ---
  function drawCosmosBg(t) {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#04030c');
    bg.addColorStop(0.5, '#0b061a');
    bg.addColorStop(1, '#04020a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Subtle cosmic nebula spotlight behind simulation stage
    const sx = ASPECT === '16:9' ? W * 0.34 : W * 0.5;
    const sy = ASPECT === '16:9' ? H * 0.5 : H * 0.46;
    const sr = Math.min(W, H) * 0.56;
    const rad = ctx.createRadialGradient(sx, sy, 10, sx, sy, safeR(sr));
    rad.addColorStop(0, 'rgba(244, 114, 182, 0.13)');
    rad.addColorStop(0.45, 'rgba(124, 58, 237, 0.07)');
    rad.addColorStop(1, 'rgba(4, 3, 12, 0)');
    ctx.fillStyle = rad;
    ctx.fillRect(0, 0, W, H);

    // Deterministic Starfield (110 stars with gentle twinkle)
    const S = Math.min(W, H) / 1080;
    for (let i = 0; i < 110; i++) {
      const px = ((hash(i * 19.31 + 1) * W + t * (2 + hash(i * 3.7) * 5)) % W);
      const py = hash(i * 47.17 + 3) * H;
      const tw = 0.45 + 0.55 * Math.sin(t * (1.8 + hash(i * 7.9) * 3) + i * 2.1);
      const r = safeR((0.9 + hash(i * 11.1) * 1.9) * S);
      ctx.fillStyle = i % 7 === 0 ? `rgba(244, 114, 182, ${0.7 * tw})` : i % 5 === 0 ? `rgba(186, 230, 253, ${0.8 * tw})` : `rgba(248, 250, 252, ${0.75 * tw})`;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, TAU);
      ctx.fill();
    }

    // Very subtle lab grid
    const step = Math.max(44, Math.round(Math.min(W, H) * 0.055));
    ctx.save();
    ctx.strokeStyle = 'rgba(244, 114, 182, 0.032)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < W; x += step) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
    }
    for (let y = 0; y < H; y += step) {
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // --- Shared Gargantua-Style Black Hole Core ---
  function drawBlackHoleCore(cx, cy, bhR, S, t, opts = {}) {
    ctx.save();
    ctx.translate(cx, cy);

    // 1. Outer Relativistic Halo Glow
    const halo = ctx.createRadialGradient(0, 0, bhR * 0.85, 0, 0, safeR(bhR * 2.85));
    halo.addColorStop(0, 'rgba(255, 245, 220, 0.92)');
    halo.addColorStop(0.22, 'rgba(251, 146, 60, 0.55)');
    halo.addColorStop(0.50, 'rgba(244, 114, 182, 0.24)');
    halo.addColorStop(1, 'rgba(4, 3, 12, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, safeR(bhR * 2.85), 0, TAU);
    ctx.fill();

    // 2. Relativistic Polar Jets (if enabled for accretion-spiral)
    if (opts.polarJets) {
      for (const sign of [-1, 1]) {
        const jetLen = bhR * 3.1;
        const jg = ctx.createLinearGradient(0, sign * bhR * 0.8, 0, sign * jetLen);
        jg.addColorStop(0, 'rgba(255, 255, 255, 0.92)');
        jg.addColorStop(0.25, 'rgba(56, 189, 248, 0.72)');
        jg.addColorStop(0.65, 'rgba(244, 114, 182, 0.35)');
        jg.addColorStop(1, 'rgba(244, 114, 182, 0)');
        ctx.fillStyle = jg;
        ctx.beginPath();
        ctx.moveTo(-bhR * 0.14, sign * bhR * 0.85);
        ctx.lineTo(-bhR * 0.42, sign * jetLen);
        ctx.lineTo(bhR * 0.42, sign * jetLen);
        ctx.lineTo(bhR * 0.14, sign * bhR * 0.85);
        ctx.closePath();
        ctx.fill();

        // Animated shock knots racing up/down the polar jets
        for (let k = 0; k < 5; k++) {
          const p = (t * 1.6 + k * 0.2) % 1;
          const ky = sign * lerp(bhR * 1.0, jetLen * 0.95, p);
          ctx.fillStyle = `rgba(224, 242, 254, ${(1 - p) * 0.85})`;
          ctx.beginPath();
          ctx.ellipse(0, ky, safeR(bhR * (0.14 + p * 0.14)), safeR(bhR * 0.08), 0, 0, TAU);
          ctx.fill();
        }
      }
    }

    // 3. Gravitationally Lensed Upper & Lower Bent Accretion Arcs (Back of disc!)
    if (opts.lensingArcs) {
      for (const sign of [-1, 1]) {
        ctx.save();
        const arcR = bhR * 1.24;
        ctx.strokeStyle = sign < 0 ? 'rgba(254, 240, 138, 0.88)' : 'rgba(251, 146, 60, 0.68)';
        ctx.lineWidth = Math.max(4, bhR * (sign < 0 ? 0.24 : 0.16));
        ctx.shadowColor = '#f97316';
        ctx.shadowBlur = 18 * S;
        ctx.beginPath();
        ctx.ellipse(0, sign * bhR * 0.08, safeR(bhR * 1.48), safeR(arcR), 0, sign < 0 ? Math.PI : 0, sign < 0 ? TAU : Math.PI);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    }

    // 4. Back Half of Equatorial Accretion Disc
    const discRx = bhR * (opts.wideDisc ? 3.2 : 2.65);
    const discRy = bhR * (opts.wideDisc ? 0.62 : 0.48);
    ctx.save();
    for (let ring = 5; ring >= 0; ring--) {
      const f = ring / 5;
      const rx = lerp(bhR * 1.15, discRx, f);
      const ry = lerp(bhR * 0.22, discRy, f);
      ctx.strokeStyle = ring < 2 ? 'rgba(255, 251, 235, 0.85)' : ring < 4 ? 'rgba(251, 146, 60, 0.65)' : 'rgba(244, 114, 182, 0.42)';
      ctx.lineWidth = Math.max(2, bhR * 0.13);
      ctx.beginPath();
      ctx.ellipse(0, 0, safeR(rx), safeR(ry), -0.08, Math.PI, TAU);
      ctx.stroke();
    }
    ctx.restore();

    // 5. Event Horizon Shadow (Pure Pitch Black Void + Razor Photon Ring)
    ctx.fillStyle = '#010103';
    ctx.beginPath();
    ctx.arc(0, 0, safeR(bhR), 0, TAU);
    ctx.fill();

    // Razor-thin glowing photon ring right around shadow edge
    ctx.strokeStyle = '#fffbeb';
    ctx.lineWidth = Math.max(1.8, 3.2 * S);
    ctx.shadowColor = '#f472b6';
    ctx.shadowBlur = 14 * S;
    ctx.beginPath();
    ctx.arc(0, 0, safeR(bhR * 1.03), 0, TAU);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 6. Front Half of Equatorial Accretion Disc + Orbiting Plasma Streaks
    ctx.save();
    for (let ring = 5; ring >= 0; ring--) {
      const f = ring / 5;
      const rx = lerp(bhR * 1.15, discRx, f);
      const ry = lerp(bhR * 0.22, discRy, f);
      // Doppler beaming: left side approaching (brighter white-gold), right side receding (deeper orange-pink)
      const dg = ctx.createLinearGradient(-rx, 0, rx, 0);
      dg.addColorStop(0, 'rgba(255, 255, 240, 0.95)');
      dg.addColorStop(0.42, 'rgba(253, 186, 116, 0.85)');
      dg.addColorStop(0.75, 'rgba(244, 114, 182, 0.65)');
      dg.addColorStop(1, 'rgba(157, 23, 77, 0.35)');
      ctx.strokeStyle = dg;
      ctx.lineWidth = Math.max(2, bhR * 0.14);
      ctx.beginPath();
      ctx.ellipse(0, 0, safeR(rx), safeR(ry), -0.08, 0, Math.PI);
      ctx.stroke();
    }

    // Orbiting plasma blobs
    const blobCount = opts.wideDisc ? 48 : 28;
    for (let i = 0; i < blobCount; i++) {
      const orbitF = hash(i * 17.3);
      const spd = lerp(3.4, 1.1, orbitF);
      const a = (hash(i * 9.1) * TAU + t * spd) % TAU;
      const rx = lerp(bhR * 1.18, discRx * 0.96, orbitF);
      const ry = lerp(bhR * 0.24, discRy * 0.96, orbitF);
      const x0 = Math.cos(a) * rx;
      const y0 = Math.sin(a) * ry;
      // Rotate by -0.08 rad
      const px = x0 * Math.cos(-0.08) - y0 * Math.sin(-0.08);
      const py = x0 * Math.sin(-0.08) + y0 * Math.cos(-0.08);
      // Hide back-half particles behind shadow
      if (Math.sin(a) < 0 && Math.hypot(px, py) < bhR * 1.02) continue;
      ctx.fillStyle = px < 0 ? 'rgba(255, 251, 235, 0.92)' : 'rgba(244, 114, 182, 0.80)';
      ctx.beginPath();
      ctx.arc(px, py, safeR((2.0 + (1 - orbitF) * 2.4) * S), 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    ctx.restore();
  }

  // --- Phase 1: Event Horizon Glow (Escape Velocity > c) ---
  function drawEventHorizonPhase(cx, cy, S, t) {
    const bhR = 96 * S;
    drawBlackHoleCore(cx, cy, bhR, S, t, { lensingArcs: true });

    // Light vectors trying to escape and curving back in
    ctx.save();
    ctx.translate(cx, cy);
    for (let i = 0; i < 6; i++) {
      const baseA = (i / 6) * TAU + t * 0.35;
      const p = (t * 0.75 + i * 0.16) % 1;
      const rPeak = bhR * (1.2 + Math.sin(p * Math.PI) * 0.65);
      const ang = baseA + p * 0.75;
      const px = Math.cos(ang) * rPeak;
      const py = Math.sin(ang) * rPeak;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(px, py, safeR(3.5 * S), 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    drawCalloutPill(cx, cy - 186 * S, 'EVENT HORIZON · ESCAPE VELOCITY > c', S, '#f472b6');
  }

  // --- Phase 2: Gravitational Lensing (Light Ray Bending + Einstein Ring) ---
  function drawGravitationalLensingPhase(cx, cy, S, t) {
    const bhR = 86 * S;

    // Animated light rays coming from background stars on the left and bending around the mass!
    ctx.save();
    ctx.translate(cx, cy);
    for (let i = -3; i <= 3; i++) {
      if (i === 0) continue;
      const yStart = i * 54 * S;
      const bendSign = i > 0 ? 1 : -1;
      const pull = (1 / (Math.abs(i) * 0.55 + 0.45)) * 74 * S;
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.55)';
      ctx.lineWidth = Math.max(1.5, 2.4 * S);
      ctx.setLineDash([12 * S, 8 * S]);
      ctx.lineDashOffset = -t * 140 * S;
      ctx.beginPath();
      ctx.moveTo(-275 * S, yStart);
      ctx.quadraticCurveTo(0, yStart - bendSign * pull, 275 * S, yStart * 0.35);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Einstein ring dashed indicator
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
    ctx.lineWidth = Math.max(1.4, 2.2 * S);
    ctx.setLineDash([6 * S, 6 * S]);
    ctx.beginPath();
    ctx.arc(0, 0, safeR(bhR * 1.56), 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    drawBlackHoleCore(cx, cy, bhR, S, t, { lensingArcs: true });

    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#38bdf8';
    fitFont('EINSTEIN LENSING RING · BACK OF DISC VISIBLE', 13 * S, 380 * S, '800', 'monospace');
    ctx.fillText('EINSTEIN LENSING RING · BACK OF DISC VISIBLE', cx, cy + 178 * S);
    ctx.restore();

    drawCalloutPill(cx, cy - 186 * S, 'GRAVITATIONAL LENSING · CURVED LIGHT RAYS', S, '#facc15');
  }

  // --- Phase 3: Photon Sphere (1.5 r_s Circular Light Orbits) ---
  function drawPhotonSpherePhase(cx, cy, S, t) {
    const bhR = 78 * S;
    const psR = bhR * 1.5;

    ctx.save();
    ctx.translate(cx, cy);

    // Outer glow
    const hg = ctx.createRadialGradient(0, 0, bhR * 0.9, 0, 0, safeR(psR * 1.7));
    hg.addColorStop(0, 'rgba(244, 114, 182, 0.45)');
    hg.addColorStop(0.5, 'rgba(56, 189, 248, 0.18)');
    hg.addColorStop(1, 'rgba(4, 3, 12, 0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(0, 0, safeR(psR * 1.7), 0, TAU);
    ctx.fill();

    // Event Horizon
    ctx.fillStyle = '#010103';
    ctx.strokeStyle = '#f472b6';
    ctx.lineWidth = Math.max(2, 3 * S);
    ctx.beginPath();
    ctx.arc(0, 0, safeR(bhR), 0, TAU);
    ctx.fill();
    ctx.stroke();

    // Photon Sphere Orbit Ring (1.5 r_s)
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = Math.max(2, 3.2 * S);
    ctx.setLineDash([10 * S, 7 * S]);
    ctx.beginPath();
    ctx.arc(0, 0, safeR(psR), 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);

    // 4 Golden Photon Beams Orbiting in Closed Circles!
    for (let i = 0; i < 4; i++) {
      const a0 = t * 3.8 + (i / 4) * TAU;
      ctx.strokeStyle = 'rgba(254, 240, 138, 0.85)';
      ctx.lineWidth = Math.max(2.5, 4.5 * S);
      ctx.beginPath();
      ctx.arc(0, 0, safeR(psR), a0 - 0.55, a0);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(Math.cos(a0) * psR, Math.sin(a0) * psR, safeR(5.5 * S), 0, TAU);
      ctx.fill();
    }

    // Grazing light beam entering from left, looping around photon sphere!
    const rayProg = (t * 0.55) % 1;
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
    ctx.lineWidth = Math.max(1.6, 2.6 * S);
    ctx.beginPath();
    ctx.moveTo(-250 * S, -psR);
    ctx.lineTo(0, -psR);
    ctx.stroke();

    // Radius callouts
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f472b6';
    fitFont('r_s (EVENT HORIZON)', 12 * S, 150 * S, '800', 'monospace');
    ctx.fillText('r_s (EVENT HORIZON)', 0, 0);

    ctx.fillStyle = '#facc15';
    fitFont('1.5 r_s · PHOTON SPHERE', 14 * S, 240 * S, '900', 'monospace');
    ctx.fillText('1.5 r_s · PHOTON SPHERE', 0, psR + 28 * S);

    ctx.restore();
    drawCalloutPill(cx, cy - 186 * S, 'PHOTON SPHERE · LIGHT ORBITS IN CIRCLES', S, '#facc15');
  }

  // --- Phase 4: 3D Projected Einstein Spacetime Embedding Funnel ---
  function drawSpacetimeFunnel3D(cx, cy, S, t) {
    ctx.save();
    ctx.translate(cx, cy - 28 * S);

    const rings = 14;
    const spokes = 24;
    const maxR = 235 * S;
    const minR = 24 * S;
    const rot = t * 0.32;

    const project = (r, theta) => {
      const normR = Math.max(0.08, r / maxR);
      // Flamm's paraboloid / gravity funnel depth
      const depth = (1 / Math.pow(normR, 0.72) - 1) * 42 * S;
      const x = Math.cos(theta + rot) * r;
      const y = Math.sin(theta + rot) * r * 0.36 + depth;
      return { x, y };
    };

    // Draw Radial Geodesic Spokes
    for (let s = 0; s < spokes; s++) {
      const th = (s / spokes) * TAU;
      ctx.strokeStyle = 'rgba(244, 114, 182, 0.32)';
      ctx.lineWidth = Math.max(1, 1.5 * S);
      ctx.beginPath();
      for (let i = 0; i <= rings; i++) {
        const f = i / rings;
        const r = lerp(minR, maxR, f);
        const p = project(r, th);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    // Draw Concentric Spacetime Rings
    for (let i = 0; i <= rings; i++) {
      const f = i / rings;
      const r = lerp(minR, maxR, f);
      const hot = 1 - f;
      ctx.strokeStyle = hot > 0.65 ? `rgba(250, 204, 21, ${0.4 + hot * 0.55})` : `rgba(56, 189, 248, ${0.28 + hot * 0.45})`;
      ctx.lineWidth = Math.max(1, (1.4 + hot * 1.6) * S);
      ctx.beginPath();
      for (let s = 0; s <= 64; s++) {
        const th = (s / 64) * TAU;
        const p = project(r, th);
        if (s === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    // Spiraling Test Particles Falling Down the Gravity Well
    for (let k = 0; k < 12; k++) {
      const prog = (hash(k * 13.3) + t * 0.36) % 1;
      const r = lerp(maxR * 0.94, minR * 1.05, prog);
      const th = hash(k * 7.7) * TAU + prog * TAU * 2.2;
      const p = project(r, th);
      ctx.fillStyle = prog > 0.65 ? '#fef08a' : '#f472b6';
      ctx.beginPath();
      ctx.arc(p.x, p.y, safeR((4.2 - prog * 1.4) * S), 0, TAU);
      ctx.fill();
    }

    // Deep dark singularity throat at bottom
    const bot = project(minR, 0);
    ctx.fillStyle = '#010103';
    ctx.strokeStyle = '#f472b6';
    ctx.lineWidth = Math.max(1.5, 2.5 * S);
    ctx.beginPath();
    ctx.ellipse(0, bot.y, safeR(minR), safeR(minR * 0.36), 0, 0, TAU);
    ctx.fill();
    ctx.stroke();

    ctx.restore();
    drawCalloutPill(cx, cy - 186 * S, 'EINSTEIN SPACETIME CURVATURE · 3D WELL', S, '#f472b6');
  }

  // --- Phase 5: Accretion Spiral + Relativistic Polar Jets ---
  function drawAccretionSpiralPhase(cx, cy, S, t) {

  // --- Phase 6: Dual Relativistic Time Dilation Clocks ---
  function drawTimeDilationClocks(cx, cy, S, t, isVert) {
    const drawClock = (x, y, r, angle, label, rateText, col, redshift) => {
      ctx.save();
      ctx.translate(x, y);

      // Clock halo
      const hg = ctx.createRadialGradient(0, 0, r * 0.6, 0, 0, safeR(r * 1.38));
      hg.addColorStop(0, redshift ? 'rgba(239, 68, 68, 0.25)' : 'rgba(56, 189, 248, 0.22)');
      hg.addColorStop(1, 'rgba(4, 3, 12, 0)');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(0, 0, safeR(r * 1.38), 0, TAU);
      ctx.fill();

      // Clock face
      ctx.fillStyle = redshift ? 'rgba(30, 10, 18, 0.92)' : 'rgba(12, 18, 36, 0.92)';
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(2.5, 4 * S);
      ctx.beginPath();
      ctx.arc(0, 0, safeR(r), 0, TAU);
      ctx.fill();
      ctx.stroke();

      // 12 Tick marks
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU - Math.PI * 0.5;
        ctx.strokeStyle = i % 3 === 0 ? '#ffffff' : 'rgba(148, 163, 184, 0.55)';
        ctx.lineWidth = Math.max(1.2, (i % 3 === 0 ? 3 : 1.6) * S);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * (r * 0.80), Math.sin(a) * (r * 0.80));
        ctx.lineTo(Math.cos(a) * (r * 0.92), Math.sin(a) * (r * 0.92));
        ctx.stroke();
      }

      // Sweep hand
      const ha = angle - Math.PI * 0.5;
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(2.5, 4.5 * S);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ha) * (r * 0.72), Math.sin(ha) * (r * 0.72));
      ctx.stroke();

      // Center pin
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, safeR(6 * S), 0, TAU);
      ctx.fill();

      // Labels
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#f8fafc';
      fitFont(label, 15 * S, r * 2.5, '900');
      ctx.fillText(label, 0, -r - 24 * S);

      ctx.fillStyle = col;
      fitFont(rateText, 16 * S, r * 2.5, '900', 'monospace');
      ctx.fillText(rateText, 0, r + 28 * S);
      ctx.restore();
    };

    const r = (isVert ? 74 : 96) * S;
    const off = (isVert ? 118 : 148) * S;

    // Distant observer ticks fast (1.00x); Near horizon ticks 7x slower (0.14x) and redshifts!
    const distantTime = t * 1.0;
    const horizonTime = t * 0.14;

    if (isVert) {
      drawClock(cx - off * 0.95, cy, r, distantTime * TAU * 0.5, 'DISTANT OBSERVER', `1.00× · ${distantTime.toFixed(1)}s`, '#38bdf8', false);
      drawClock(cx + off * 0.95, cy, r, horizonTime * TAU * 0.5, 'NEAR HORIZON', `0.14× · ${horizonTime.toFixed(1)}s`, '#f43f5e', true);
    } else {
      drawClock(cx - off, cy - 8 * S, r, distantTime * TAU * 0.5, 'DISTANT OBSERVER', `1.00× RATE · ${distantTime.toFixed(1)}s`, '#38bdf8', false);
      drawClock(cx + off, cy - 8 * S, r, horizonTime * TAU * 0.5, 'NEAR HORIZON (1.02 r_s)', `0.14× RATE · ${horizonTime.toFixed(1)}s`, '#f43f5e', true);
    }

    // Relativistic Equation Pill at bottom
    drawCalloutPill(cx, cy + (isVert ? 148 : 162) * S, "dt' = dt · √(1 - r_s / r)  →  0 AT HORIZON", S, '#facc15', 'rgba(18, 10, 32, 0.92)', 470 * S);
    drawCalloutPill(cx, cy - 186 * S, 'GRAVITATIONAL TIME DILATION', S, '#f472b6');
  }

  // --- Phase 7: Tidal Spaghettification Stretch ---
  function drawSpaghettificationPhase(cx, cy, S, t) {
    const cyc = (t * 0.35) % 1;
    const stretch = smooth(0.05, 0.88, cyc);

    ctx.save();
    ctx.translate(cx, cy);

    // Massive Black Hole Horizon Curve looming at the bottom
    const bhCurveR = 320 * S;
    const bhY = 390 * S;
    const bhGlow = ctx.createRadialGradient(0, bhY, bhCurveR * 0.88, 0, bhY, safeR(bhCurveR * 1.25));
    bhGlow.addColorStop(0, '#010103');
    bhGlow.addColorStop(0.75, 'rgba(244, 114, 182, 0.65)');
    bhGlow.addColorStop(1, 'rgba(4, 3, 12, 0)');
    ctx.fillStyle = bhGlow;
    ctx.beginPath();
    ctx.arc(0, bhY, safeR(bhCurveR * 1.25), 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#010103';
    ctx.strokeStyle = '#f472b6';
    ctx.lineWidth = Math.max(2, 4 * S);
    ctx.beginPath();
    ctx.arc(0, bhY, safeR(bhCurveR), 0, TAU);
    ctx.fill();
    ctx.stroke();

    // Stretching Matter / Probe Lattice (stretches vertically 5x, crushes horizontally to 0.18x!)
    const objY = lerp(-75, -18, stretch) * S;
    const halfH = lerp(38, 148, stretch) * S;
    const halfW = lerp(42, 7.5, stretch) * S;

    // Glowing stretched atomic ribbon
    const ribG = ctx.createLinearGradient(0, objY - halfH, 0, objY + halfH);
    ribG.addColorStop(0, '#38bdf8');
    ribG.addColorStop(0.5, '#f472b6');
    ribG.addColorStop(1, '#ef4444');
    ctx.fillStyle = ribG;
    roundRect(-halfW, objY - halfH, halfW * 2, halfH * 2, Math.max(4 * S, halfW));
    ctx.fill();

    // Individual atoms separating vertically along the stream
    for (let i = 0; i < 18; i++) {
      const f = i / 17;
      const ay = lerp(objY - halfH + 8 * S, objY + halfH - 8 * S, f);
      const ax = Math.sin(i * 2.7 + t * 8) * halfW * 0.55;
      ctx.fillStyle = f > 0.6 ? '#fef08a' : '#e0f2fe';
      ctx.beginPath();
      ctx.arc(ax, ay, safeR((3.2 - stretch * 0.8) * S), 0, TAU);
      ctx.fill();
    }

    // Tidal Force Arrows: Weak pull at head, MASSIVE pull at feet, inward crush on sides!
    // Feet downward pull (huge red arrow)
    drawArrow(0, objY + halfH + 8 * S, 0, objY + halfH + (45 + stretch * 34) * S, '#ef4444', Math.max(3, 6 * S), 14 * S);
    // Head upward relative tension
    drawArrow(0, objY - halfH - 8 * S, 0, objY - halfH - (28 + stretch * 22) * S, '#38bdf8', Math.max(2, 4 * S), 11 * S);

    // Sideways compression arrows
    for (const sign of [-1, 1]) {
      drawArrow(sign * (halfW + 64 * S), objY, sign * (halfW + 14 * S), objY, '#facc15', Math.max(2, 3.8 * S), 10 * S);
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#38bdf8';
    fitFont('F_HEAD (WEAKER)', 13 * S, 150 * S, '800', 'monospace');
    ctx.fillText('F_HEAD (WEAKER)', 76 * S, objY - halfH * 0.75);

    ctx.fillStyle = '#ef4444';
    fitFont('F_FEET (10⁶× STRONGER!)', 13 * S, 180 * S, '900', 'monospace');
    ctx.fillText('F_FEET (10⁶× STRONGER!)', 76 * S, objY + halfH * 0.75);

    ctx.fillStyle = '#facc15';
    ctx.textAlign = 'right';
    fitFont('SIDEWAYS CRUSH', 13 * S, 150 * S, '800', 'monospace');
    ctx.fillText('SIDEWAYS CRUSH', -84 * S, objY);

    ctx.restore();
    drawCalloutPill(cx, cy - 188 * S, 'TIDAL SPAGHETTIFICATION · INVERSE-SQUARE RIP', S, '#ef4444', 'rgba(69, 10, 10, 0.90)', 450 * S);
  }

  // --- Phase 8: 3-Way Schwarzschild Scale (Earth 9mm vs Sun 3km vs Sagittarius A* 12M km) ---
  function drawSchwarzschildScale(rx, ry, rw, rh, t, isVert) {
    const gap = Math.min(rw, rh) * 0.032;
    const cols = isVert ? 1 : 3;
    const rows = isVert ? 3 : 1;
    const cw = (rw - gap * (cols - 1)) / cols;
    const ch = (rh - gap * (rows - 1)) / rows;
    const S = Math.min(cw / 220, ch / (isVert ? 150 : 340));

    const cards = [
      { title: 'EARTH', rs: '9 MM', sub: 'MARBLE-SIZED HORIZON', mass: '1 M⊕ · 5.97×10²⁴ kg', col: '#38bdf8', frac: 0.14, rVis: 10 },
      { title: 'THE SUN', rs: '3 KM', sub: 'CITY-SIZED HORIZON', mass: '1 M☉ · 1.99×10³⁰ kg', col: '#facc15', frac: 0.48, rVis: 24 },
      { title: 'SAGITTARIUS A*', rs: '12M KM', sub: '4.3 MILLION SUNS', mass: 'MILKY WAY CORE', col: '#f472b6', frac: 1.0, rVis: 48 },
    ];

    for (let i = 0; i < 3; i++) {
      const c = cards[i];
      const x = rx + (isVert ? 0 : i * (cw + gap));
      const y = ry + (isVert ? i * (ch + gap) : 0);

      ctx.save();
      ctx.fillStyle = 'rgba(14, 10, 28, 0.88)';
      ctx.strokeStyle = c.col;
      ctx.lineWidth = 1.8;
      roundRect(x, y, cw, ch, 16 * S);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = c.col;
      fitFont(c.title, 17 * S, cw * 0.58, '900');
      ctx.fillText(c.title, x + 16 * S, y + 24 * S);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffffff';
      fitFont(c.rs, 17 * S, cw * 0.38, '900', 'monospace');
      ctx.fillText(c.rs, x + cw - 16 * S, y + 24 * S);

      // Animated Schwarzschild Compression Graphic
      const mx = x + cw * 0.5;
      const my = y + ch * 0.50;
      const pulse = 0.92 + 0.08 * Math.sin(t * 4 + i * 1.4);
      const visR = safeR(c.rVis * S * pulse);

      // Original outer dashed reference sphere
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.30)';
      ctx.lineWidth = Math.max(1, 1.5 * S);
      ctx.setLineDash([5 * S, 5 * S]);
      ctx.beginPath();
      ctx.arc(mx, my, safeR(Math.min(cw, ch) * 0.28), 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);

      // Glow + Black Hole Sphere
      const hg = ctx.createRadialGradient(mx, my, visR * 0.7, mx, my, safeR(visR * 2.1));
      hg.addColorStop(0, c.col);
      hg.addColorStop(1, 'rgba(4, 3, 12, 0)');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(mx, my, safeR(visR * 2.1), 0, TAU);
      ctx.fill();

      ctx.fillStyle = '#010103';
      ctx.strokeStyle = c.col;
      ctx.lineWidth = Math.max(1.8, 2.8 * S);
      ctx.beginPath();
      ctx.arc(mx, my, visR, 0, TAU);
      ctx.fill();
      ctx.stroke();

      // Scale bar
      const bx = x + 16 * S;
      const bw = cw - 32 * S;
      const by = y + ch - 24 * S;
      const bh = 9 * S;
      ctx.fillStyle = 'rgba(30, 24, 52, 0.9)';
      roundRect(bx, by, bw, bh, 999);
      ctx.fill();
      ctx.fillStyle = c.col;
      roundRect(bx, by, bw * c.frac, bh, 999);
      ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.textAlign = 'left';
      fitFont(c.sub, 11 * S, bw, '700', 'monospace');
      ctx.fillText(c.sub, bx, by - 12 * S);
      ctx.restore();
    }
  }

  // --- Right 30% Glassmorphic Telemetry Card (16:9 Mode) ---
  function drawRightTelemetryCard(beat, t, tel) {
    const pad = W * 0.022;

    const cardY = pad;
    const cardW = W * 0.288;
    const cardH = H - pad * 2;
    const S = H / 1080;

    ctx.save();
    ctx.fillStyle = 'rgba(14, 9, 28, 0.84)';
    ctx.strokeStyle = 'rgba(244, 114, 182, 0.30)';
    ctx.lineWidth = 1.6;
    roundRect(cardX, cardY, cardW, cardH, 22 * S);
    ctx.fill();
    ctx.stroke();

    const ix = cardX + 24 * S;
    const iw = cardW - 48 * S;
    let y = cardY + 28 * S;

    ctx.fillStyle = ACCENT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    fitFont(BRAND, 14 * S, iw * 0.7, '900');
    ctx.fillText(BRAND, ix, y);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#94a3b8';
    const ts = `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
    fitFont(ts, 14 * S, iw * 0.3, '700', 'monospace');
    ctx.fillText(ts, ix + iw, y);

    y += 28 * S;

    // 4-Act Progress Bar
    const actGap = 8 * S;
    const segW = (iw - actGap * 3) / 4;
    for (let a = 0; a < 4; a++) {
      const sx = ix + a * (segW + actGap);
      const active = a === beat.actIndex;
      const done = a < beat.actIndex;

      roundRect(sx, y, segW, 7 * S, 999);
      ctx.fill();

      ctx.fillStyle = active ? '#f8fafc' : '#64748b';
      ctx.textAlign = 'center';
      ctx.font = `800 ${Math.round(11 * S)}px Inter, sans-serif`;
      ctx.fillText(`ACT ${a + 1}`, sx + segW * 0.5, y + 20 * S);
    }

    y += 46 * S;

    ctx.textAlign = 'left';
    ctx.fillStyle = '#f8fafc';
    fitFont(beat.actTitle || 'Black Hole Gravity', 21 * S, iw, '800');
    ctx.fillText(beat.actTitle || 'Black Hole Gravity', ix, y);

    y += 34 * S;

    const isFailure = beat.actKind === 'failure';

    ctx.strokeStyle = pillCol;

    ctx.stroke();

    ctx.fillStyle = pillCol;
    ctx.textAlign = 'center';
    fitFont(beat.caption || '', 17 * S, iw - 20 * S, '900');

    y += 66 * S;

    // Narration Subtitle Box
    ctx.fillStyle = 'rgba(22, 14, 42, 0.72)';
    roundRect(ix, y, iw, 200 * S, 14 * S);
    ctx.fill();
    ctx.strokeStyle = 'rgba(244, 114, 182, 0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#e2e8f0';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    const subPx = Math.round(18 * S);
    ctx.font = `500 ${subPx}px Inter, -apple-system, sans-serif`;
    const lines = wrapLines(beat.text || '', iw - 28 * S, 6);
    const lh = Math.round(27 * S);
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], ix + 14 * S, y + 16 * S + i * lh);
    }

    y += 224 * S;

    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#94a3b8';
    ctx.font = `800 ${Math.round(12 * S)}px monospace`;
    ctx.fillText(`TELEMETRY · ${tel.status}`, ix, y);
    y += 24 * S;

    const gauges = [
      { label: 'GRAVITY FIELD', val: tel.grav, frac: tel.f1, col: isFailure ? '#ef4444' : '#f472b6' },
      { label: 'TIME DILATION', val: tel.time, frac: tel.f2, col: '#facc15' },
      { label: 'ORBITAL SPEED', val: tel.speed, frac: tel.f3, col: '#38bdf8' },
      { label: 'TIDAL GRADIENT', val: tel.tidal, frac: tel.f4, col: isFailure ? '#ef4444' : '#c084fc' },
    ];

    for (const g of gauges) {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#94a3b8';
      ctx.font = `700 ${Math.round(12 * S)}px Inter, sans-serif`;
      ctx.fillText(g.label, ix, y);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#f8fafc';
      ctx.font = `800 ${Math.round(14 * S)}px monospace`;
      ctx.fillText(g.val, ix + iw, y);

      const by = y + 14 * S;
      ctx.fillStyle = 'rgba(34, 24, 58, 0.9)';
      roundRect(ix, by, iw, 9 * S, 999);
      ctx.fill();
      ctx.fillStyle = g.col;
      roundRect(ix, by, Math.max(8 * S, iw * clamp(g.frac, 0, 1)), 9 * S, 999);
      ctx.fill();
      y += 48 * S;
    }

    const progY = cardY + cardH - 22 * S;
    ctx.fillStyle = 'rgba(34, 24, 58, 0.9)';
    roundRect(ix, progY, iw, 6 * S, 999);
    ctx.fill();
    ctx.fillStyle = ACCENT;
    roundRect(ix, progY, iw * clamp(t / Math.max(1, DUR), 0, 1), 6 * S, 999);
    ctx.fill();
    ctx.restore();
  }

  // --- Narrative Bridge Banner (16:9, first 2.0s of beat.isBridge) ---
  function drawBridgeBanner(beat, localT) {
    if (!beat.isBridge || localT < 0 || localT >= 2.0) return;
    const S = H / 1080;
    const enter = smooth(0, 0.28, localT);
    const exit = 1 - smooth(1.65, 2.0, localT);
    const alpha = clamp(enter * exit, 0, 1);
    const slideY = lerp(-40 * S, 24 * S, enter);
    const bw = W * 0.62;
    const bh = 54 * S;
    const bx = W * 0.03;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(244, 114, 182, 0.18)';
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 2;
    roundRect(bx, slideY, bw, bh, 14 * S);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = ACCENT;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const label = `ACT ${beat.actIndex + 1} · ${beat.actTitle.toUpperCase()}`;
    fitFont(label, 19 * S, bw - 40 * S, '900');
    ctx.fillText(label, bx + 22 * S, slideY + bh * 0.5);
    ctx.restore();
  }

  // --- 9:16 Native Vertical Safe-Zone Overlay ---
  function drawVerticalOverlay(beat, t, tel) {
    // Safe zone: x in [W*0.07, W*0.88], y in [H*0.12, H*0.78]
    const safeL = W * 0.07;
    const safeRBound = W * 0.88;
    const safeW = safeRBound - safeL;
    const safeCx = (safeL + safeRBound) * 0.5;
    const S = W / 1080;

    ctx.save();
    const partLabel = (SHORT_META && SHORT_META.partLabel) || `${BRAND} · ACT ${beat.actIndex + 1}`;
    const topY = H * 0.125;
    const pillH = 38 * S;
    const pillW = Math.min(safeW * 0.88, Math.max(260 * S, safeW * 0.72));
    ctx.fillStyle = 'rgba(244, 114, 182, 0.18)';
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 2 * S;
    roundRect(safeCx - pillW * 0.5, topY, pillW, pillH, 999);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#fce7f3';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    fitFont(partLabel, 21 * S, pillW - 26 * S, '800');
    ctx.fillText(partLabel, safeCx, topY + pillH * 0.5);

    const hookText = (SHORT_META && SHORT_META.hook) || beat.actTitle.toUpperCase();
    const hookY = topY + pillH + 34 * S;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(5, 4, 13, 0.9)';
    ctx.shadowBlur = 12 * S;
    fitFont(hookText, 50 * S, safeW - 12 * S, '900');
    ctx.fillText(hookText, safeCx, hookY);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#cbd5e1';
    const strip = `${tel.grav}  ·  ${tel.time}  ·  ${tel.speed}`;
    fitFont(strip, 20 * S, safeW, '700', 'monospace');
    ctx.fillText(strip, safeCx, hookY + 42 * S);

    // Bottom caption pill (above H*0.78)
    const capPillH = 66 * S;
    const capPillY = H * 0.78 - capPillH - 12 * S;
    const isPink = beat.actIndex % 2 === 0;
    ctx.fillStyle = isPink ? '#f472b6' : '#facc15';
    roundRect(safeL, capPillY, safeW, capPillH, 16 * S);
    ctx.fill();

    ctx.fillStyle = '#05040d';
    fitFont(beat.caption || '', 34 * S, safeW - 32 * S, '900');
    ctx.fillText(beat.caption || '', safeCx, capPillY + capPillH * 0.5);

    // Last 1.2s CTA Subscribe banner
    const timeRem = DUR - t;
    if (timeRem <= 1.2 && SHORT_META && SHORT_META.ctaText) {
      const pop = smooth(0, 0.22, 1.2 - timeRem);
      const ctaH = 74 * S;
      const ctaY = capPillY - ctaH - 16 * S;
      ctx.save();
      ctx.globalAlpha = pop;
      ctx.fillStyle = '#ef4444';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3 * S;
      roundRect(safeL, ctaY, safeW, ctaH, 18 * S);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      fitFont(SHORT_META.ctaText, 30 * S, safeW - 32 * S, '900');
      ctx.fillText(SHORT_META.ctaText, safeCx, ctaY + ctaH * 0.5);
      ctx.restore();
    }
    ctx.restore();
  }

  // --- Beat Lookup ---
  function findBeat(t) {
    if (!BEATS.length) {
      return {
        id: 'default', actIndex: 0, actKind: 'hook', actTitle: 'Black Hole Gravity',
        visualPhase: 'event-horizon-glow', caption: 'KINETIC LAB', text: '', start: 0, end: DUR,
      };
    }
    for (let i = 0; i < BEATS.length; i++) {
      if (t >= BEATS[i].start && t < BEATS[i].end) return BEATS[i];
    }
    return t < BEATS[0].start ? BEATS[0] : BEATS[BEATS.length - 1];
  }

  // --- Main Frame Renderer ---
  function renderFrame(frameIdx) {
    const t = frameIdx / Math.max(1, FPS);
    const beat = findBeat(t);
    const localT = Math.max(0, t - beat.start);
    const phase = beat.visualPhase || 'event-horizon-glow';

    drawCosmosBg(t);

    const isVert = ASPECT === '9:16';
    const stageX = isVert ? W * 0.07 : W * 0.03;
    const stageY = isVert ? H * 0.24 : H * 0.08;
    const stageW = isVert ? W * 0.81 : W * 0.64;
    const stageH = isVert ? H * 0.46 : H * 0.84;
    const stageCx = stageX + stageW * 0.5;
    const stageCy = stageY + stageH * 0.5;
    const stageS = Math.min(stageW / 620, stageH / 460);

    if (phase === 'event-horizon-glow') {
      drawEventHorizonPhase(stageCx, stageCy, stageS, t);
    } else if (phase === 'gravitational-lensing') {
      drawGravitationalLensingPhase(stageCx, stageCy, stageS, t);
    } else if (phase === 'photon-sphere') {
      drawPhotonSpherePhase(stageCx, stageCy, stageS, t);
    } else if (phase === 'spacetime-funnel-3d') {
      drawSpacetimeFunnel3D(stageCx, stageCy, stageS, t);
    } else if (phase === 'accretion-spiral') {
      drawAccretionSpiralPhase(stageCx, stageCy, stageS, t);
    } else if (phase === 'time-dilation-clocks') {
      drawTimeDilationClocks(stageCx, stageCy, stageS, t, isVert);
    } else if (phase === 'spaghettification-stretch') {
      drawSpaghettificationPhase(stageCx, stageCy, stageS, t);
    } else if (phase === 'schwarzschild-scale') {
      drawSchwarzschildScale(stageX, stageY + (isVert ? 0 : H * 0.08), stageW, stageH - (isVert ? 0 : H * 0.16), t, isVert);
    } else if (phase === 'series-outro') {
      drawSeriesOutro(stageCx, stageCy, stageS * 1.12, t);
    } else {
      drawEventHorizonPhase(stageCx, stageCy, stageS, t);
    }

    const tel = getTelemetry(phase, t);

    if (isVert) {
      drawVerticalOverlay(beat, t, tel);
    } else {
      drawRightTelemetryCard(beat, t, tel);
      drawBridgeBanner(beat, localT);
    }
  }

  // --- Deterministic Audio Events ---
  function buildEvents() {
    const evs = [];
    for (let i = 0; i < BEATS.length; i++) {
      const b = BEATS[i];
      const t0 = clamp(b.start + 0.08, 0.05, Math.max(0.1, DUR - 0.1));
      if (b.visualPhase === 'spaghettification-stretch' || b.visualPhase === 'accretion-spiral') {
        evs.push({ t: t0, type: 'break', pitchIndex: 2 + (i % 5), intensity: 0.95 });
        if (b.end - b.start > 3.0) {
          evs.push({ t: clamp(b.start + 1.6, 0.1, DUR - 0.1), type: 'break', pitchIndex: 4, intensity: 0.85 });
        }
      } else if (b.visualPhase === 'series-outro') {
        evs.push({ t: t0, type: 'win', pitchIndex: 10, intensity: 0.95 });
      } else if (b.isBridge) {
        evs.push({ t: t0, type: 'win', pitchIndex: 6 + b.actIndex, intensity: 0.72 });
      } else {
        evs.push({ t: t0, type: 'bounce', pitchIndex: 2 + (i % 7), intensity: 0.62 });
      }
    }
    evs.sort((a, b) => a.t - b.t);
    return evs;
  }

  // --- Exact Window API Contract ---
  window.init = (cfg = {}) => {
    W = Math.max(160, Math.round(cfg.width || 1920));
    H = Math.max(160, Math.round(cfg.height || 1080));
    FPS = Math.max(1, Number(cfg.fps) || 60);
    ASPECT = cfg.aspect === '9:16' || H > W ? '9:16' : '16:9';
    DUR = Math.max(1, Number(cfg.duration) || 240);
    TITLE = cfg.title || TITLE;
    BRAND = cfg.brand || BRAND;
    ACCENT = cfg.accent || '#f472b6';
    SHORT_META = cfg.shortMeta || null;

    if (Array.isArray(cfg.beats) && cfg.beats.length > 0) {
      BEATS = cfg.beats.map((b, idx) => ({
        id: b.id || `b-${idx}`,
        actIndex: Number.isFinite(b.actIndex) ? b.actIndex : 0,
        actKind: b.actKind || 'hook',
        actTitle: b.actTitle || '',
        visualPhase: b.visualPhase || 'event-horizon-glow',
        caption: b.caption || '',
        text: b.text || '',
        start: Number.isFinite(b.start) ? b.start : (idx * DUR) / cfg.beats.length,
        end: Number.isFinite(b.end) ? b.end : ((idx + 1) * DUR) / cfg.beats.length,
        isBridge: Boolean(b.isBridge),
      }));
    } else {
      const seg = DUR / DEFAULT_BEATS.length;
      BEATS = DEFAULT_BEATS.map((b, idx) => ({ ...b, start: idx * seg, end: (idx + 1) * seg }));
    }

    cv.width = W;
    cv.height = H;
    EVENTS = buildEvents();
  };

  window.renderBatch = (startFrame, count) => {
    const out = [];
    const n = Math.max(0, Math.floor(count || 0));
    const s = Math.max(0, Math.floor(startFrame || 0));
    for (let i = 0; i < n; i++) {
      renderFrame(s + i);
      const dataUrl = cv.toDataURL('image/jpeg', 0.9);
      out.push(dataUrl.replace(/^data:[^,]+,/, ''));
    }
    return out;
  };

  window.getEvents = () => EVENTS;
  window.ready = true;
})();
</script>
