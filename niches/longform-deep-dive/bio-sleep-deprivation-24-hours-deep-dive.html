    const safeL = W * 0.07;
    const safeRBound = W * 0.88;
    const safeW = safeRBound - safeL;
    const safeCx = (safeL + safeRBound) * 0.5;
    const S = W / 1080;

    const actColors = [PAL.crimson, PAL.amber, PAL.emerald, PAL.cyan];
    const actCol = actColors[clamp(beat.actIndex, 0, 3)];

    ctx.save();
    // Top: Part label pill
    const partLabel = (SHORT_META && SHORT_META.partLabel) || `${BRAND} · ACT ${beat.actIndex + 1}`;
    const topY = H * 0.125;
    const pillH = 38 * S;
    const pillW = Math.min(safeW * 0.88, Math.max(260 * S, safeW * 0.72));
    ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
    ctx.strokeStyle = actCol;
    ctx.lineWidth = 2 * S;
    roundRect(safeCx - pillW * 0.5, topY, pillW, pillH, 999);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = actCol;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    fitFont(partLabel, 21 * S, pillW - 26 * S, '800');
    ctx.fillText(partLabel, safeCx, topY + pillH * 0.5);

    // Top: Huge Hook Headline (clamped cleanly inside safeW)
    const hookText = (SHORT_META && SHORT_META.hook) || String(beat.actTitle || '').toUpperCase();
    const hookY = topY + pillH + 34 * S;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(5, 7, 18, 0.92)';
    ctx.shadowBlur = 12 * S;
    fitFont(hookText, 48 * S, safeW - 12 * S, '900');
    ctx.fillText(hookText, safeCx, hookY);
    ctx.shadowBlur = 0;

    // Live Bio Telemetry Strip under Hook
    ctx.fillStyle = PAL.slate;
    const strip = `${tel.bpm} BPM  ·  ${tel.spo2}% SpO₂  ·  ${tel.output}`;
    fitFont(strip, 20 * S, safeW, '700', 'monospace');
    ctx.fillText(strip, safeCx, hookY + 42 * S);

    // Bottom (above H*0.78): High-contrast Caption Pill
    const capPillH = 66 * S;
    const capPillY = H * 0.78 - capPillH - 12 * S;
    ctx.fillStyle = actCol;
    roundRect(safeL, capPillY, safeW, capPillH, 16 * S);
    ctx.fill();

    ctx.fillStyle = '#050712';
    fitFont(beat.caption || '', 34 * S, safeW - 32 * S, '900');
    ctx.fillText(beat.caption || '', safeCx, capPillY + capPillH * 0.5);

    // Last 1.2s of duration: Crisp high-contrast CTA Subscribe banner
    const timeRem = DUR - t;
    if (timeRem <= 1.2 && SHORT_META && SHORT_META.ctaText) {
      const pop = smooth(0, 0.22, 1.2 - timeRem);
      const ctaH = 74 * S;
      const ctaY = capPillY - ctaH - 16 * S;
      ctx.save();
      ctx.globalAlpha = pop;
      ctx.fillStyle = PAL.crimsonDeep;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3 * S;
      roundRect(safeL, ctaY, safeW, ctaH, 18 * S);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      fitFont(SHORT_META.ctaText, 30 * S, safeW - 32 * S, '900');
      ctx.fillText(SHORT_META.ctaText, safeCx, ctaY + ctaH * 0.5);
      ctx.restore();
    }
    ctx.restore();
  }

  // --- Beat Lookup ---
  function findBeat(t) {
    if (!BEATS.length) {
      return {
        id: 'default', actIndex: 0, actKind: 'hook', actTitle: '1. The 100,000-Beat Engine',
        visualPhase: 'heart-cutaway-live', caption: 'BIO MECHANICS', text: '', start: 0, end: DUR,
      };
    }
    let active = BEATS[0];
    for (let i = 0; i < BEATS.length; i++) {
      if (t >= BEATS[i].start) active = BEATS[i];
      else break;
    }
    return active;
  }

  // --- Main Frame Renderer ---
  function renderFrame(frameIdx) {
    const fIdx = Number.isFinite(frameIdx) ? frameIdx : 0;
    const t = fIdx / Math.max(1, FPS);
    const beat = findBeat(t);
    const localT = Math.max(0, t - beat.start);
    const phase = beat.visualPhase || 'heart-cutaway-live';

    drawBioStudioBg(t, beat.actIndex || 0);

    // Stage bounding box (adapts natively to 16:9 vs 9:16 safe-zone)
    const isVert = ASPECT === '9:16';
    const stageX = isVert ? W * 0.07 : W * 0.03;
    const stageY = isVert ? H * 0.24 : H * 0.08;
    const stageW = isVert ? W * 0.81 : W * 0.64;
    const stageH = isVert ? H * 0.46 : H * 0.84;
    const stageCx = stageX + stageW * 0.5;
    const stageCy = stageY + stageH * 0.5;
    const stageS = Math.min(stageW / 560, stageH / 560);

    if (phase === 'heart-cutaway-live') {
      drawHeartCutaway(stageCx, stageCy, stageS, t);
    } else if (phase === 'alveoli-gas-exchange') {
      drawAlveoliGasExchange(stageCx, stageCy, stageS, t);
    } else if (phase === 'circulatory-sync') {
      drawCirculatorySync(stageCx, stageCy, stageS, t);
    } else if (phase === 'amygdala-adrenaline-surge') {
      drawAmygdalaAdrenaline(stageCx, stageCy, stageS, t);
    } else if (phase === 'caffeine-adenosine-block') {
      drawCaffeineAdenosineBlock(stageCx, stageCy, stageS, t);
    } else if (phase === 'sugar-insulin-wave') {
      drawSugarInsulinWave(stageCx, stageCy, stageS, t);
    } else if (phase === 'immune-antibody-hunt') {
      drawImmuneAntibodyHunt(stageCx, stageCy, stageS, t);
    } else if (phase === 'muscle-microtear-repair') {
      drawMuscleMicrotearRepair(stageCx, stageCy, stageS, t);
    } else if (phase === 'cellular-resilience') {
      drawCellularResilience(stageCx, stageCy, stageS, t);
    } else if (phase === 'glymphatic-brain-wash') {
      drawGlymphaticBrainWash(stageCx, stageCy, stageS, t);
    } else if (phase === 'gut-brain-vagus-highway') {
      drawGutBrainVagusHighway(stageCx, stageCy, stageS, t);
    } else if (phase === 'series-outro') {
      drawSeriesOutro(stageCx, stageCy, stageS, t);
    } else {
      drawHeartCutaway(stageCx, stageCy, stageS, t);
    }

    const tel = getTelemetry(phase, t);

    if (isVert) {
      drawVerticalOverlay(beat, t, tel);
    } else {
      drawRightTelemetryCard(beat, t, tel);
      drawBridgeBanner(beat, localT);
    }
  }

  // --- Deterministic Audio Events ---
  function buildEvents() {
    const evs = [];
    for (let i = 0; i < BEATS.length; i++) {
      const b = BEATS[i];
      const t0 = clamp(b.start + 0.08, 0.05, Math.max(0.1, DUR - 0.1));
      if (b.visualPhase === 'amygdala-adrenaline-surge' || b.visualPhase === 'immune-antibody-hunt' || b.visualPhase === 'muscle-microtear-repair') {
        evs.push({ t: t0, type: 'break', pitchIndex: 2 + (i % 5), intensity: 0.88 });
        if (b.end - b.start > 3.0) {
          evs.push({ t: clamp(b.start + 1.8, 0.1, DUR - 0.1), type: 'bounce', pitchIndex: 4, intensity: 0.72 });
        }
      } else if (b.visualPhase === 'series-outro') {
        evs.push({ t: t0, type: 'win', pitchIndex: 10, intensity: 0.95 });
      } else if (b.isBridge) {
        evs.push({ t: t0, type: 'win', pitchIndex: 6 + b.actIndex, intensity: 0.74 });
      } else {
        evs.push({ t: t0, type: 'bounce', pitchIndex: 2 + (i % 7), intensity: 0.58 });
      }
    }
    evs.sort((a, b) => a.t - b.t);
    return evs;
  }

  // --- Exact Window API Contract ---
  window.init = (cfg = {}) => {
    W = Math.max(160, Math.round(cfg.width || 1920));
    H = Math.max(160, Math.round(cfg.height || 1080));
    FPS = Math.max(1, Number(cfg.fps) || 60);
    ASPECT = cfg.aspect === '9:16' || H > W ? '9:16' : '16:9';
    DUR = Math.max(1, Number(cfg.duration) || 240);
    TITLE = cfg.title || TITLE;
    BRAND = cfg.brand || BRAND;
    ACCENT = cfg.accent || PAL.crimson;
    SHORT_META = cfg.shortMeta || null;

    if (Array.isArray(cfg.beats) && cfg.beats.length > 0) {
      BEATS = cfg.beats.map((b, idx) => ({
        id: b.id || `b-${idx}`,
        actIndex: Number.isFinite(b.actIndex) ? b.actIndex : 0,
        actKind: b.actKind || 'hook',
        actTitle: b.actTitle || '',
        visualPhase: b.visualPhase || 'heart-cutaway-live',
        caption: b.caption || '',
        text: b.text || '',
        start: Number.isFinite(b.start) ? b.start : (idx * DUR) / cfg.beats.length,
        end: Number.isFinite(b.end) ? b.end : ((idx + 1) * DUR) / cfg.beats.length,
        isBridge: Boolean(b.isBridge),
      }));
    } else {
      const seg = DUR / DEFAULT_BEATS.length;
      BEATS = DEFAULT_BEATS.map((b, idx) => ({ ...b, start: idx * seg, end: (idx + 1) * seg }));
    }

    cv.width = W;
    cv.height = H;
    EVENTS = buildEvents();
  };

  window.renderFrame = renderFrame;

  window.renderBatch = (startFrame, count) => {
    const out = [];
    const n = Math.max(0, Math.floor(count || 0));
    const s = Math.max(0, Math.floor(startFrame || 0));
    for (let i = 0; i < n; i++) {
      renderFrame(s + i);
      const dataUrl = cv.toDataURL('image/jpeg', 0.9);
      out.push(dataUrl.replace(/^data:[^,]+,/, ''));
    }
    return out;
  };

  window.getEvents = () => EVENTS;
  window.ready = true;
})();
</script>
