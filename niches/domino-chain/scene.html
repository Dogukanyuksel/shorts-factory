<!doctype html>
<!-- Exponential Domino Cascade: 14 progressively 1.25x larger glowing neon dominoes -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#050712;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 720, H = 1280, FPS = 60, DUR = 32, HOOK = 'TINY DOMINO → GIANT MONOLITH!';
let rng = 1, simTime = 0, events = [];
const COUNT = 14;
const RATIO = 1.25;
let dominoes = [], sparks = [], shockwaves = [];
let camX = 0, camZoom = 1, shake = 0, finaleTriggered = false;
let currentActive = 0;

const rand = () => { rng = (rng * 1664525 + 1013904223) >>> 0; return rng / 4294967296; };

window.init = (cfg) => {
  W = cfg.width || 720; H = cfg.height || 1280; FPS = cfg.fps || 60; DUR = cfg.seconds || 32;
  HOOK = cfg.hook || 'TINY DOMINO → GIANT MONOLITH!';
  cv.width = W; cv.height = H;
  rng = ((cfg.seed || 1) * 3266489917 + 13) >>> 0;

  dominoes = [];
  let x = 0;
  const baseH = 44;
  const baseW = 10;
  const hueOffset = Math.floor(rand() * 40);

  // Schedule deterministic accelerating-then-dramatic topple times across 0.7s -> DUR - 3.3s
  const totalFallSpan = DUR - 4.0;
  for (let i = 0; i < COUNT; i++) {
    const sc = Math.pow(RATIO, i);
    const h = baseH * sc;
    const w = baseW * sc;
    // Slight rhythmic acceleration for small ones, dramatic heavy build-up for the final monolith
    const frac = i / (COUNT - 1);
    const triggerT = 0.75 + Math.pow(frac, 1.08) * (totalFallSpan - 1.4);
    const col = i === COUNT - 1 ? '#facc15' : `hsl(${(185 + hueOffset + i * 14) % 360}, 95%, 60%)`;
    dominoes.push({
      idx: i,
      x,
      w,
      h,
      scale: sc,
      massMult: Math.pow(sc, 3),
      col,
      angle: 0,
      targetAngle: i === COUNT - 1 ? Math.PI * 0.5 : 1.08,
      triggerT,
      fallDur: i === COUNT - 1 ? 1.55 : (0.58 + frac * 0.42),
      hitTriggered: false,
      crashed: false,
    });
    // Space next domino at ~0.58 * current height so each cleanly strikes the next
    x += h * 0.62;
  }

  sparks = []; shockwaves = [];
  camX = dominoes[0].x;
  camZoom = 3.2;
  shake = 0;
  currentActive = 0;
  events = []; simTime = 0; finaleTriggered = false;
};

function spawnImpactFX(wx, wy, scale, col, count) {
  shockwaves.push({ x: wx, y: wy, r: scale * 8, maxR: scale * 95, alpha: 1.0, col });
  for (let k = 0; k < count; k++) {
    const ang = -Math.PI * 0.1 - rand() * Math.PI * 0.85;
    const spd = (55 + rand() * 145) * scale;
    sparks.push({
      x: wx, y: wy,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 1.0,
      size: Math.max(2, scale * 2.2),
      col: k % 3 === 0 ? '#ffffff' : col,
    });
  }
}

function step(dt) {
  simTime += dt;
  shake = Math.max(0, shake - dt * 28);

  for (let i = 0; i < COUNT; i++) {
    const d = dominoes[i];
    if (simTime >= d.triggerT) {
      if (!d.hitTriggered) {
        d.hitTriggered = true;
        currentActive = i;
        if (i > 0) {
          const prev = dominoes[i - 1];
          const impactY = -prev.h * 0.62;
          spawnImpactFX(d.x, impactY, d.scale * 0.65, d.col, i >= COUNT - 3 ? 22 : 10);
          shake = Math.min(26, 2.5 + i * 1.1);
          const isHeavy = i >= COUNT - 3;
          events.push({
            t: simTime,
            type: isHeavy ? 'break' : 'bounce',
            pitchIndex: Math.max(0, Math.min(13, 13 - i)),
            intensity: Math.min(1.0, 0.35 + (i / COUNT) * 0.65),
          });
        } else {
          // Initial push on domino #1
          events.push({ t: simTime, type: 'bounce', pitchIndex: 13, intensity: 0.4 });
        }
      }
      const p = Math.min(1, (simTime - d.triggerT) / d.fallDur);
      // Gravity-like ease-in acceleration (t^2.2)
      d.angle = Math.pow(p, 2.2) * d.targetAngle;

      // Final colossal monolith ground crash!
      if (i === COUNT - 1 && p >= 1 && !d.crashed) {
        d.crashed = true;
        finaleTriggered = true;
        shake = 42;
        spawnImpactFX(d.x + d.h * 0.85, 0, d.scale * 1.35, '#facc15', 56);
        spawnImpactFX(d.x + d.h * 0.5, 0, d.scale * 1.1, '#22d3ee', 32);
        events.push({ t: simTime, type: 'win', pitchIndex: 11, intensity: 1.0 });
      }
    }
  }

  // Smooth exponential camera tracking active domino + preview of next monolith
  const act = dominoes[currentActive];
  const next = dominoes[Math.min(COUNT - 1, currentActive + 1)];
  const focusX = act.x * 0.52 + next.x * 0.48 + (finaleTriggered ? act.h * 0.42 : 0);
  const desiredHeightPx = H * 0.40;
  const refH = finaleTriggered ? act.h * 1.35 : next.h;
  const targetZoom = desiredHeightPx / refH;
  camX += (focusX - camX) * 0.085;
  camZoom += (targetZoom - camZoom) * 0.075;

  // Update FX
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += (sw.maxR - sw.r) * dt * 4.5;
    sw.alpha -= dt * 1.35;
    if (sw.alpha <= 0) shockwaves.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const sp = sparks[i];
    sp.x += sp.vx * dt;
    sp.y += sp.vy * dt;
    sp.vy += 320 * (act.scale * 0.5) * dt;
    if (sp.y > 0) { sp.y = 0; sp.vy *= -0.4; }
    sp.life -= dt * 1.15;
    if (sp.life <= 0) sparks.splice(i, 1);
  }
}

function draw() {
  const S = W / 720;
  ctx.fillStyle = '#050712';
  ctx.fillRect(0, 0, W, H);

  // Background energy glow
  const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.65, 30 * S, W * 0.5, H * 0.65, 520 * S);
  bgGrad.addColorStop(0, finaleTriggered ? 'rgba(250,204,21,0.16)' : 'rgba(34,211,238,0.09)');
  bgGrad.addColorStop(1, 'rgba(5,7,18,0)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  const sxShake = shake > 0 ? (Math.sin(simTime * 85) * shake * S) : 0;
  const syShake = shake > 0 ? (Math.cos(simTime * 73) * shake * 0.6 * S) : 0;
  const groundY = H * 0.74;

  ctx.save();
  ctx.translate(W * 0.44 + sxShake, groundY + syShake);
  ctx.scale(camZoom, camZoom);
  ctx.translate(-camX, 0);

  // Glowing neon floor line
  const floorLeft = camX - (W / camZoom) * 1.2;
  const floorRight = camX + (W / camZoom) * 1.5;
  ctx.strokeStyle = finaleTriggered ? '#facc15' : '#38bdf8';
  ctx.lineWidth = Math.max(0.5, (3.5 * S) / camZoom);
  ctx.beginPath(); ctx.moveTo(floorLeft, 0); ctx.lineTo(floorRight, 0); ctx.stroke();

  // Floor perspective tick marks
  const tickStep = Math.pow(2, Math.floor(Math.log2(Math.max(10, 120 / camZoom))));
  const firstTick = Math.floor(floorLeft / tickStep) * tickStep;
  ctx.strokeStyle = 'rgba(148,163,184,0.22)';
  ctx.lineWidth = Math.max(0.4, (1.5 * S) / camZoom);
  for (let tx = firstTick; tx < floorRight; tx += tickStep) {
    ctx.beginPath(); ctx.moveTo(tx, 0); ctx.lineTo(tx, 16 / camZoom); ctx.stroke();
  }

  // Draw dominoes
  for (const d of dominoes) {
    // Cull offscreen
    const screenX = W * 0.44 + (d.x - camX) * camZoom;
    if (screenX < -d.h * camZoom - 120 || screenX > W + d.h * camZoom + 120) continue;

    ctx.save();
    // Pivot around bottom-right corner so it topples cleanly to the right
    ctx.translate(d.x + d.w * 0.5, 0);
    ctx.rotate(d.angle);

    ctx.fillStyle = d.idx === COUNT - 1 ? 'rgba(250,204,21,0.24)' : 'rgba(15,23,42,0.88)';
    ctx.strokeStyle = d.col;
    ctx.shadowColor = d.col;
    ctx.shadowBlur = Math.min(26 * S, 16 * S);
    ctx.lineWidth = Math.max(0.5, (3.2 * S) / camZoom);
    ctx.beginPath();
    ctx.rect(-d.w, -d.h, d.w, d.h);
    ctx.fill();
    ctx.stroke();

    // Inner neon core stripe
    ctx.fillStyle = d.col;
    ctx.globalAlpha = 0.72;
    ctx.fillRect(-d.w * 0.65, -d.h * 0.92, d.w * 0.3, d.h * 0.84);
    ctx.restore();
  }

  // Shockwaves
  for (const sw of shockwaves) {
    ctx.save();
    ctx.strokeStyle = sw.col;
    ctx.globalAlpha = Math.max(0, sw.alpha);
    ctx.lineWidth = Math.max(0.6, (5 * S) / camZoom);
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // Sparks
  for (const sp of sparks) {
    ctx.save();
    ctx.fillStyle = sp.col;
    ctx.globalAlpha = Math.max(0, sp.life);
    ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // Top HOOK
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(38 * S)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(HOOK, W * 0.5, H * 0.11);

  // Bottom Scale & Mass HUD
  const act = dominoes[currentActive];
  const boxX = W * 0.08, boxY = H * 0.82, boxW = W * 0.84, boxH = 108 * S;
  ctx.fillStyle = 'rgba(15,23,42,0.84)';
  ctx.strokeStyle = finaleTriggered ? '#facc15' : 'rgba(56,189,248,0.4)';
  ctx.lineWidth = 3 * S;
  ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 20 * S); ctx.fill(); ctx.stroke();

  ctx.font = `800 ${Math.round(20 * S)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('DOMINO', W * 0.22, boxY + 34 * S);
  ctx.fillText('HEIGHT', W * 0.50, boxY + 34 * S);
  ctx.fillText('FORCE / MASS', W * 0.78, boxY + 34 * S);

  ctx.font = `900 ${Math.round(30 * S)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#22d3ee';
  ctx.fillText(`#${currentActive + 1} / ${COUNT}`, W * 0.22, boxY + 78 * S);
  ctx.fillStyle = '#f472b6';
  ctx.fillText(`${act.scale.toFixed(1)}×`, W * 0.50, boxY + 78 * S);
  ctx.fillStyle = '#facc15';
  const massStr = act.massMult >= 1000 ? `${Math.round(act.massMult).toLocaleString()}×` : `${act.massMult.toFixed(1)}×`;
  ctx.fillText(massStr, W * 0.78, boxY + 78 * S);

  if (finaleTriggered) {
    ctx.fillStyle = 'rgba(2,6,18,0.88)';
    ctx.beginPath(); ctx.roundRect(W * 0.07, H * 0.40, W * 0.86, 152 * S, 26 * S); ctx.fill();
    ctx.strokeStyle = '#facc15'; ctx.lineWidth = 5 * S; ctx.stroke();
    ctx.font = `900 ${Math.round(42 * S)}px -apple-system, sans-serif`;
    ctx.fillStyle = '#fde047';
    ctx.fillText('MONOLITH CRUSHED! 💥', W * 0.5, H * 0.462);
    ctx.font = `800 ${Math.round(24 * S)}px -apple-system, sans-serif`;
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText('14 DOMINOES · 1.25× EACH → 6,000× MASS', W * 0.5, H * 0.504);
  }
  ctx.restore();
}

window.renderBatch = (_startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    step(1 / FPS);
    draw();
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};
window.getEvents = () => events;
window.ready = true;
</script>
