<!doctype html>
<!-- Langton's Ant: 10,000 steps of chaos suddenly lock into an infinite diagonal HIGHWAY! -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#050712;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 720, H = 1280, FPS = 60, DUR = 24, HOOK = 'CHAOS FOR 10,000 STEPS... THEN THIS!';
let rng = 1, events = [];

// Grid: 220x220 gives plenty of margin for 13,500+ steps (chaos blob ~±40, highway ~+65)
const GRID = 220;
const HALF = GRID >> 1;
let cells = null;      // 0 = dark, 1 = cyan-lit
let visited = null;    // 0 = untouched, 1..255 = visited trail intensity (magenta glow)
let antX = HALF, antY = HALF, antDir = 0; // 0:N, 1:E, 2:S, 3:W
let stepCount = 0;
let lastTickT = -1, highwayTriggered = false, finaleTriggered = false;
let hwStartX = HALF, hwStartY = HALF;
let camX = HALF, camY = HALF, camZoom = 1.0;

const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

const rand = () => { rng = (rng * 1664525 + 1013904223) >>> 0; return rng / 4294967296; };

window.init = (cfg) => {
  W = cfg.width || 720; H = cfg.height || 1280; FPS = cfg.fps || 60; DUR = cfg.seconds || 24;
  HOOK = cfg.hook || 'CHAOS FOR 10,000 STEPS... THEN THIS!';
  cv.width = W; cv.height = H;
  rng = ((cfg.seed || 1) * 1664525 + 1013904223) >>> 0;

  cells = new Uint8Array(GRID * GRID);
  visited = new Uint8Array(GRID * GRID);
  antX = HALF; antY = HALF;
  // Deterministic initial orientation from seed (rotates the highway diagonal cleanly)
  antDir = Math.abs(cfg.seed || 1) % 4;
  stepCount = 0;
  events = [];
  lastTickT = -1;
  highwayTriggered = false;
  finaleTriggered = false;
  hwStartX = HALF; hwStartY = HALF;
  camX = HALF; camY = HALF; camZoom = 1.65;
};

function advanceAnt(nSteps) {
  for (let i = 0; i < nSteps; i++) {
    const idx = antY * GRID + antX;
    const cur = cells[idx];
    if (cur === 0) {
      antDir = (antDir + 1) & 3; // Turn 90° right
      cells[idx] = 1;
    } else {
      antDir = (antDir + 3) & 3; // Turn 90° left
      cells[idx] = 0;
    }
    visited[idx] = 1;
    antX += DX[antDir];
    antY += DY[antDir];
    if (antX < 1) antX = 1; else if (antX >= GRID - 1) antX = GRID - 2;
    if (antY < 1) antY = 1; else if (antY >= GRID - 1) antY = GRID - 2;
    stepCount++;
    if (stepCount === 10050) {
      hwStartX = antX;
      hwStartY = antY;
    }
  }
}

// Smooth pacing curve:
//   0% -> 75% of DUR: 0 -> 10,000 steps (starts readable so early symmetry is visible, then accelerates)
//   75% -> 96% of DUR: 10,000 -> 13,200 steps (the famous diagonal highway shoots out clearly!)
function targetStepsAt(t) {
  const hwTime = DUR * 0.75;
  if (t <= hwTime) {
    const u = Math.max(0, t / hwTime);
    // Smooth acceleration: slow start (u^1.65) so viewer sees individual turns early, hits 10,000 at 75%
    return Math.floor(10000 * Math.pow(u, 1.65));
  }
  const u2 = Math.min(1, (t - hwTime) / (DUR - hwTime));
  return 10000 + Math.floor(3300 * u2);
}

function drawFrame(t) {
  const S = W / 720;
  const finaleStart = DUR * 0.88;
  const isFinale = t >= finaleStart;

  const target = targetStepsAt(t);
  if (target > stepCount) {
    advanceAnt(target - stepCount);
  }

  // Trigger highway emergence event around step 10,050 (~75% of DUR)
  if (stepCount >= 10050 && !highwayTriggered) {
    highwayTriggered = true;
    events.push({ t, type: 'break', pitchIndex: 9, intensity: 0.92 });
  }

  // Subtle musical ticks paced across chaos & highway
  const tickInterval = highwayTriggered ? 0.16 : 0.24;
  if (t > 0.15 && !isFinale && t - lastTickT >= tickInterval) {
    lastTickT = t;
    const pitch = highwayTriggered
      ? 8 + (Math.floor(stepCount / 104) % 5)
      : Math.floor(((antX + antY) % 12));
    events.push({ t, type: 'bounce', pitchIndex: pitch, intensity: highwayTriggered ? 0.52 : 0.34 });
  }

  if (isFinale && !finaleTriggered) {
    finaleTriggered = true;
    events.push({ t, type: 'win', pitchIndex: 12, intensity: 1.0 });
  }

  // Smooth camera tracking:
  // Early: zoomed in on origin (zoom 2.2) -> Chaos: zoom out to ~1.05 to show full chaotic cluster
  // Highway (step 10,000+): smoothly pan & zoom (1.42) to highlight the diagonal highway!
  let targetCamX = HALF, targetCamY = HALF, targetZoom = 1.02;
  if (stepCount < 450) {
    targetZoom = 2.4;
  } else if (stepCount < 10050) {
    const p = Math.min(1, (stepCount - 450) / 6000);
    targetZoom = 2.4 - p * 1.32;
  } else {
    // Track midpoint between highway start and current ant tip
    targetCamX = hwStartX * 0.42 + antX * 0.58;
    targetCamY = hwStartY * 0.42 + antY * 0.58;
    targetZoom = 1.48;
  }
  camX += (targetCamX - camX) * 0.08;
  camY += (targetCamY - camY) * 0.08;
  camZoom += (targetZoom - camZoom) * 0.07;

  // --- RENDER ---
  ctx.fillStyle = '#050712';
  ctx.fillRect(0, 0, W, H);

  // Viewport for the neon grid
  const viewX = 28 * S, viewY = H * 0.175, viewW = W - 56 * S, viewH = H * 0.635;
  const viewCx = viewX + viewW * 0.5;
  const viewCy = viewY + viewH * 0.5;
  const baseCell = (viewW / 120) * camZoom;

  ctx.save();
  // Clip to viewport panel
  ctx.fillStyle = '#070b1a';
  ctx.beginPath();
  ctx.roundRect(viewX, viewY, viewW, viewH, 22 * S);
  ctx.fill();
  ctx.clip();

  // Subtle background grid lines
  const minGx = Math.max(0, Math.floor(camX - (viewW * 0.5) / baseCell) - 1);
  const maxGx = Math.min(GRID - 1, Math.ceil(camX + (viewW * 0.5) / baseCell) + 1);
  const minGy = Math.max(0, Math.floor(camY - (viewH * 0.5) / baseCell) - 1);
  const maxGy = Math.min(GRID - 1, Math.ceil(camY + (viewH * 0.5) / baseCell) + 1);

  if (baseCell >= 6 * S) {
    ctx.strokeStyle = 'rgba(148,163,184,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let gx = minGx; gx <= maxGx; gx++) {
      const sx = viewCx + (gx - camX) * baseCell;
      ctx.moveTo(sx, viewY); ctx.lineTo(sx, viewY + viewH);
    }
    for (let gy = minGy; gy <= maxGy; gy++) {
      const sy = viewCy + (gy - camY) * baseCell;
      ctx.moveTo(viewX, sy); ctx.lineTo(viewX + viewW, sy);
    }
    ctx.stroke();
  }

  // Draw magenta visited (dark-flipped) cells first, then bright cyan lit cells
  const pad = baseCell > 5 ? 0.7 : 0;
  const drawSize = Math.max(1.5, baseCell - pad);

  ctx.fillStyle = 'rgba(236, 72, 153, 0.42)';
  for (let gy = minGy; gy <= maxGy; gy++) {
    const rowOff = gy * GRID;
    const sy = viewCy + (gy - camY) * baseCell;
    for (let gx = minGx; gx <= maxGx; gx++) {
      const idx = rowOff + gx;
      if (cells[idx] === 0 && visited[idx] === 1) {
        const sx = viewCx + (gx - camX) * baseCell;
        ctx.fillRect(sx, sy, drawSize, drawSize);
      }
    }
  }

  ctx.fillStyle = '#22d3ee';
  for (let gy = minGy; gy <= maxGy; gy++) {
    const rowOff = gy * GRID;
    const sy = viewCy + (gy - camY) * baseCell;
    for (let gx = minGx; gx <= maxGx; gx++) {
      const idx = rowOff + gx;
      if (cells[idx] === 1) {
        const sx = viewCx + (gx - camX) * baseCell;
        ctx.fillRect(sx, sy, drawSize, drawSize);
      }
    }
  }

  // Highlight highway trajectory corridor once step 10,050+ is reached
  if (highwayTriggered) {
    const sx0 = viewCx + (hwStartX - camX + 0.5) * baseCell;
    const sy0 = viewCy + (hwStartY - camY + 0.5) * baseCell;
    const sx1 = viewCx + (antX - camX + 0.5) * baseCell;
    const sy1 = viewCy + (antY - camY + 0.5) * baseCell;
    ctx.save();
    ctx.strokeStyle = 'rgba(250, 204, 21, 0.65)';
    ctx.lineWidth = 3 * S;
    ctx.setLineDash([10 * S, 8 * S]);
    ctx.beginPath();
    ctx.moveTo(sx0, sy0);
    ctx.lineTo(sx1, sy1);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Bright gold Ant cursor
  const ax = viewCx + (antX - camX + 0.5) * baseCell;
  const ay = viewCy + (antY - camY + 0.5) * baseCell;
  const antRad = Math.max(7 * S, baseCell * 0.95);
  ctx.save();
  ctx.fillStyle = '#facc15';
  ctx.shadowColor = '#facc15';
  ctx.shadowBlur = 22 * S;
  ctx.beginPath();
  ctx.arc(ax, ay, antRad, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(ax, ay, antRad * 0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.restore(); // end viewport clip

  // Viewport neon border
  ctx.save();
  ctx.strokeStyle = highwayTriggered ? '#facc15' : 'rgba(34,211,238,0.45)';
  ctx.lineWidth = (highwayTriggered ? 3.5 : 2.5) * S;
  ctx.beginPath();
  ctx.roundRect(viewX, viewY, viewW, viewH, 22 * S);
  ctx.stroke();
  ctx.restore();

  // Top HOOK text
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(35 * S)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(34,211,238,0.45)';
  ctx.shadowBlur = 14 * S;
  ctx.fillText(HOOK, W * 0.5, H * 0.088);
  ctx.shadowBlur = 0;

  // Phase badge
  const phaseTxt = stepCount < 500
    ? 'PHASE 1: SYMMETRY'
    : stepCount < 10000
      ? 'PHASE 2: PURE CHAOS'
      : 'PHASE 3: INFINITE HIGHWAY!';
  const phaseCol = stepCount < 500 ? '#38bdf8' : stepCount < 10000 ? '#f472b6' : '#fde047';
  ctx.font = `900 ${Math.round(23 * S)}px monospace`;
  ctx.fillStyle = phaseCol;
  ctx.fillText(phaseTxt, W * 0.5, H * 0.138);
  ctx.restore();

  // Bottom HUD: Step Counter & Progress
  const hudY = H * 0.865;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(56 * S)}px monospace`;
  ctx.fillStyle = highwayTriggered ? '#fde047' : '#ffffff';
  ctx.shadowColor = highwayTriggered ? '#facc15' : '#22d3ee';
  ctx.shadowBlur = 18 * S;
  ctx.fillText(`STEP ${stepCount.toLocaleString('en-US')}`, W * 0.5, hudY);
  ctx.shadowBlur = 0;

  // Progress bar to 10,000 highway threshold
  const bx = 64 * S, by = hudY + 26 * S, bw = W - 128 * S, bh = 14 * S;
  ctx.fillStyle = 'rgba(30,41,59,0.85)';
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 7 * S); ctx.fill();
  const barP = Math.min(1, stepCount / 13200);
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, '#ec4899');
  g.addColorStop(0.75, '#22d3ee');
  g.addColorStop(1, '#facc15');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(bx, by, bw * barP, bh, 7 * S); ctx.fill();

  // 10K marker
  const m10k = bx + bw * (10000 / 13200);
  ctx.strokeStyle = '#fde047';
  ctx.lineWidth = 3 * S;
  ctx.beginPath(); ctx.moveTo(m10k, by - 5 * S); ctx.lineTo(m10k, by + bh + 5 * S); ctx.stroke();

  ctx.font = `700 ${Math.round(18 * S)}px monospace`;
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('2 SIMPLE RULES  •  104-STEP PERIODIC HIGHWAY AT 10,000', W * 0.5, by + 40 * S);
  ctx.restore();

  // Finale banner at ~88% of DUR
  if (isFinale) {
    const finAge = Math.min(1, (t - finaleStart) / 0.35);
    const scale = 0.88 + 0.12 * Math.sin(finAge * Math.PI * 0.5);
    ctx.save();
    ctx.translate(W * 0.5, H * 0.49);
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(2,6,18,0.92)';
    ctx.beginPath();
    ctx.roundRect(-W * 0.43, -70 * S, W * 0.86, 140 * S, 28 * S);
    ctx.fill();
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 5 * S;
    ctx.shadowColor = '#facc15';
    ctx.shadowBlur = 24 * S;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.textAlign = 'center';
    ctx.font = `900 ${Math.round(44 * S)}px -apple-system, sans-serif`;
    ctx.fillStyle = '#fde047';
    ctx.fillText('HIGHWAY EMERGED! 🐜', 0, 6 * S);
    ctx.font = `800 ${Math.round(21 * S)}px monospace`;
    ctx.fillStyle = '#67e8f9';
    ctx.fillText('ORDER BORN FROM 10,000 STEPS OF CHAOS', 0, 44 * S);
    ctx.restore();
  }
}

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    drawFrame((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};
window.getEvents = () => events;
window.ready = true;
</script>
