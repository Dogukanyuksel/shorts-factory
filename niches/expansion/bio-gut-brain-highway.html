<!doctype html>
<!--
  Bio Mechanics — 3D PBR: Your Second Brain (500M Gut Neurons & Vagus Nerve Highway)
  Y-LABS 3D Cinema Engine (Three.js PBR Bioluminescent Vagus Nerve Conduit + Serotonin Pulse Orbs, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0D1117;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  easeOutCubic,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'You think your skull runs the show. Yet five hundred million neurons live in your gut.', caption: '500M GUT NEURONS' },
  { id: 'serotonin', text: 'Ninety percent of your serotonin — your mood chemical — is manufactured right inside your intestines.', caption: '90% OF SEROTONIN' },
  { id: 'vagus', text: 'Your Vagus nerve is a bioluminescent superhighway wiring your gut straight up to your brain.', caption: 'VAGUS NERVE HIGHWAY' },
  { id: 'direction', text: 'Shockingly, eighty percent of those signals travel upward — your gut talks, your brain listens.', caption: '80% SIGNALS GO UP' },
  { id: 'stress', text: 'Inflame your gut with junk food and distress pulses fire straight into your anxiety center.', caption: 'GUT STRESS = ANXIETY' },
  { id: 'verdict', text: 'Fix your gut microbiome and you literally upgrade your mood, focus, and stress resilience.', caption: 'FEED YOUR 2ND BRAIN' },
];

let W = 720, H = 1280, FPS = 60, DUR = 26, LINES = [], EVENTS = [];
let stage = null, built = false;
let brainCore, gutCore, vagusCurve, pulses = [], gutNodes = [];

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, idx) {
  const f = LINES.find((l) => l.id === id);
  if (f) return f;
  const seg = DUR / SCRIPT.length;
  return { id, start: idx * seg, end: (idx + 1) * seg, caption: SCRIPT[idx].caption };
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'bio', fov: 38, fogDensity: 0.024, floorY: -2.9 });
  const { scene } = stage;
  const mats = createMaterials('bio');

  // Top: 3D Brain Hemisphere Lattice
  brainCore = new THREE.Group();
  brainCore.position.set(0, 1.85, 0);
  const bGeo = new THREE.IcosahedronGeometry(0.92, 2);
  const bMesh = new THREE.Mesh(bGeo, mats.glass(0x34c759, 0.28));
  brainCore.add(bMesh);
  brainCore.add(addXrayEdges(bGeo, 0x34c759, 0.72));
  const bInner = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 20), mats.glow(0x34c759, 0.95));
  brainCore.add(bInner);
  scene.add(brainCore);

  // Bottom: 3D Enteric Gut Cluster
  gutCore = new THREE.Group();
  gutCore.position.set(0, -1.75, 0);
  const gGeo = new THREE.TorusKnotGeometry(0.76, 0.22, 84, 14, 2, 3);
  const gMesh = new THREE.Mesh(gGeo, mats.bioGreen);
  gutCore.add(gMesh);
  gutCore.add(addXrayEdges(gGeo, 0x34c759, 0.4));
  scene.add(gutCore);

  // Vagus Nerve Conduit (smooth S-curve from gut to brain)
  vagusCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -1.65, 0),
    new THREE.Vector3(-0.48, -0.6, 0.35),
    new THREE.Vector3(0.45, 0.45, -0.25),
    new THREE.Vector3(0, 1.65, 0),
  ]);
  const tubeGeo = new THREE.TubeGeometry(vagusCurve, 64, 0.11, 14, false);
  const tube = new THREE.Mesh(tubeGeo, mats.glass(0x34c759, 0.32));
  scene.add(tube);
  scene.add(addXrayEdges(tubeGeo, 0x34c759, 0.45));

  // Bioluminescent signal pulses (80% upward emerald, 20% downward rose)
  const pGeo = new THREE.SphereGeometry(0.11, 14, 14);
  for (let i = 0; i < 20; i++) {
    const upward = i < 16;
    const m = new THREE.Mesh(pGeo, mats.glow(upward ? 0x34c759 : 0xff2d55, 1.0));
    m.userData = { upward, offset: i / 20, speed: upward ? 0.42 : 0.35 };
    scene.add(m);
    pulses.push(m);
  }

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  LINES = Array.isArray(cfg.lines) ? cfg.lines : [];
  cv.width = W;
  cv.height = H;
  buildScene();

  const lSero = getLine('serotonin', 1);
  const lDir = getLine('direction', 3);
  const lStress = getLine('stress', 4);
  EVENTS = [
    { t: Math.max(0.1, lSero.start - 0.04), type: 'bounce', intensity: 0.75 },
    { t: Math.max(0.2, lDir.start - 0.04), type: 'break', intensity: 0.9 },
    { t: Math.max(0.3, lStress.start - 0.04), type: 'break', intensity: 1.0 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);
  const lStress = getLine('stress', 4);
  const isStress = t >= lStress.start && t <= lStress.end;

  brainCore.rotation.y = t * 0.55;
  brainCore.scale.setScalar(1 + Math.sin(t * 4.5) * 0.04);
  gutCore.rotation.y = -t * 0.45;
  gutCore.rotation.z = Math.sin(t * 1.3) * 0.12;

  pulses.forEach((m) => {
    let u = (m.userData.offset + t * m.userData.speed) % 1;
    if (!m.userData.upward) u = 1 - u;
    const pos = vagusCurve.getPoint(u);
    m.position.copy(pos);
    m.material.color.setHex(isStress ? 0xff2d55 : (m.userData.upward ? 0x34c759 : 0x38bdf8));
  });

  const camA = lerp(-0.38, 0.38, p);
  stage.camera.position.set(Math.sin(camA) * 7.6, 0.15, Math.cos(camA) * 7.6);
  stage.camera.lookAt(0, 0.05, 0);

  stage.renderTo(ctx, W, H);

  const active = LINES.find((l) => t >= l.start && t <= l.end) || SCRIPT[Math.min(SCRIPT.length - 1, Math.floor(p * SCRIPT.length))];
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'bio',
    title: 'GUT-BRAIN HIGHWAY',
    subtitle: isStress ? 'STRESS SIGNAL SURGE' : 'VAGUS NERVE TELEMETRY',
    progress: p,
    caption: active.caption,
    metrics: [
      { label: 'GUT NEURONS', value: '500M', color: '#34C759' },
      { label: 'SEROTONIN', value: '90%', color: '#FFD60A' },
      { label: 'UPWARD FLOW', value: '80%', color: isStress ? '#FF2D55' : '#38BDF8' },
    ],
  });
};
</script>
