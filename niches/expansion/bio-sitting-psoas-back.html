<!doctype html>
<!--
  Bio Mechanics — 3D PBR: What 8 Hours of Sitting Does to Your Spine & Psoas
  Y-LABS 3D Cinema Engine (Three.js PBR Articulated Spine Vertebrae + Lumbar Disc Compression + Psoas Tension Cables, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0D1117;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  easeOutCubic,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'Sitting feels relaxing, yet it crushes your lower spine harder than standing ever does.', caption: 'SITTING = +40% LOAD' },
  { id: 'psoas', text: 'After hours in a chair, your deep psoas hip flexors lock short like tight steel cables.', caption: 'PSOAS LOCKS SHORT' },
  { id: 'disc', text: 'As you slump forward, pressure on your L4 and L5 discs spikes by forty percent.', caption: 'L4–L5 DISC COMPRESSED' },
  { id: 'nerve', text: 'Fluid squeezes out of the cushion until the bulging disc pinches nearby sciatic nerves.', caption: 'BULGE PINCHES NERVE' },
  { id: 'reset', text: 'Stand up and extend your hips every thirty minutes — your discs re-hydrate like sponges.', caption: '30-MIN RESET RULE' },
  { id: 'verdict', text: 'Your spine was engineered for motion, not eight hours locked at ninety degrees.', caption: 'MOVE TO DECOMPRESS' },
];

let W = 720, H = 1280, FPS = 60, DUR = 26, LINES = [], EVENTS = [];
let stage = null, built = false;
let vertebrae = [], discs = [], psoasLeft, psoasRight, bulgeRing;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, idx) {
  const f = LINES.find((l) => l.id === id);
  if (f) return f;
  const seg = DUR / SCRIPT.length;
  return { id, start: idx * seg, end: (idx + 1) * seg, caption: SCRIPT[idx].caption };
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'bio', fov: 38, fogDensity: 0.022, floorY: -2.6 });
  const { scene } = stage;
  const mats = createMaterials('bio');

  const vGeo = new THREE.CylinderGeometry(0.68, 0.72, 0.42, 24);
  const dGeo = new THREE.CylinderGeometry(0.64, 0.64, 0.19, 24);

  vertebrae = [];
  discs = [];
  for (let i = 0; i < 6; i++) {
    const v = new THREE.Group();
    const body = new THREE.Mesh(vGeo, mats.steel);
    v.add(body);
    v.add(addXrayEdges(vGeo, 0x34c759, 0.32));
    // Posterior spinous process
    const proc = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.24, 0.65), mats.darkMetal);
    proc.position.set(0, 0, -0.68);
    v.add(proc);
    scene.add(v);
    vertebrae.push(v);

    if (i < 5) {
      const dm = new THREE.Mesh(dGeo, mats.bioGreen.clone());
      scene.add(dm);
      discs.push(dm);
    }
  }

  // Psoas tension cables flanking lumbar spine
  const cableGeo = new THREE.CylinderGeometry(0.08, 0.08, 3.2, 12);
  psoasLeft = new THREE.Mesh(cableGeo, mats.crimson.clone());
  psoasLeft.position.set(-1.05, -0.5, 0.55);
  psoasLeft.rotation.z = -0.14;
  scene.add(psoasLeft);

  psoasRight = new THREE.Mesh(cableGeo, mats.crimson.clone());
  psoasRight.position.set(1.05, -0.5, 0.55);
  psoasRight.rotation.z = 0.14;
  scene.add(psoasRight);

  // Sciatic alert halo on L4-L5 disc
  bulgeRing = new THREE.Mesh(new THREE.TorusGeometry(0.88, 0.045, 12, 36), mats.glow(0xff2d55, 0.95));
  bulgeRing.rotation.x = Math.PI / 2;
  scene.add(bulgeRing);

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  LINES = Array.isArray(cfg.lines) ? cfg.lines : [];
  cv.width = W;
  cv.height = H;
  buildScene();

  const lDisc = getLine('disc', 2);
  const lNerve = getLine('nerve', 3);
  const lReset = getLine('reset', 4);
  EVENTS = [
    { t: Math.max(0.1, lDisc.start - 0.04), type: 'break', intensity: 0.85 },
    { t: Math.max(0.2, lNerve.start - 0.04), type: 'break', intensity: 1.0 },
    { t: Math.max(0.3, lReset.start - 0.04), type: 'win', intensity: 0.9 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  const lPsoas = getLine('psoas', 1);
  const lReset = getLine('reset', 4);
  // Compression ramps up during sitting, then releases on reset
  const slumpIn = smooth(t, lPsoas.start, lReset.start - 0.5);
  const decompress = smooth(t, lReset.start, lReset.end);
  const strain = clamp(slumpIn * (1 - decompress * 0.9), 0, 1);

  const spacing = lerp(0.74, 0.56, strain);
  for (let i = 0; i < 6; i++) {
    const idx = i - 2.5;
    const curveZ = strain * Math.sin((i / 5) * Math.PI) * -0.45;
    const tiltX = strain * (i - 2.5) * 0.075;
    vertebrae[i].position.set(0, idx * spacing, curveZ);
    vertebrae[i].rotation.x = tiltX;
  }

  for (let i = 0; i < 5; i++) {
    const y = (vertebrae[i].position.y + vertebrae[i + 1].position.y) * 0.5;
    const z = (vertebrae[i].position.z + vertebrae[i + 1].position.z) * 0.5;
    discs[i].position.set(0, y, z);
    const isTarget = i === 1;
    const bulge = isTarget ? 1 + strain * 0.34 : 1 + strain * 0.14;
    discs[i].scale.set(bulge, lerp(1.0, 0.55, strain), bulge);
    discs[i].material.color.setHex(isTarget && strain > 0.35 ? 0xff2d55 : 0x34c759);
    discs[i].material.emissive.setHex(isTarget && strain > 0.35 ? 0xff2d55 : 0x10b981);
    discs[i].material.emissiveIntensity = isTarget ? 0.35 + strain * 0.65 : 0.25;
  }

  const tightScale = lerp(1.0, 0.78, strain);
  psoasLeft.scale.set(1 + strain * 0.3, tightScale, 1 + strain * 0.3);
  psoasRight.scale.set(1 + strain * 0.3, tightScale, 1 + strain * 0.3);

  bulgeRing.position.copy(discs[1].position);
  bulgeRing.visible = strain > 0.25;
  bulgeRing.scale.setScalar(1 + Math.sin(t * 7) * 0.08);

  const camA = lerp(-0.55, 0.55, p);
  stage.camera.position.set(Math.sin(camA) * 7.2, 0.25, Math.cos(camA) * 7.2);
  stage.camera.lookAt(0, -0.1, 0);

  stage.renderTo(ctx, W, H);

  const active = LINES.find((l) => t >= l.start && t <= l.end) || SCRIPT[Math.min(SCRIPT.length - 1, Math.floor(p * SCRIPT.length))];
  const loadPct = Math.round(100 + strain * 40);
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'bio',
    title: 'SPINE & PSOAS LOAD',
    subtitle: strain > 0.4 ? 'L4–L5 DISC COMPRESSION' : 'NEUTRAL DECOMPRESSION',
    progress: p,
    caption: active.caption,
    metrics: [
      { label: 'DISC LOAD', value: `${loadPct}%`, color: strain > 0.4 ? '#FF2D55' : '#34C759' },
      { label: 'PSOAS', value: strain > 0.4 ? 'LOCKED' : 'FREE', color: strain > 0.4 ? '#FF9500' : '#34C759' },
      { label: 'HYDRATION', value: `${Math.round(lerp(96, 62, strain))}%`, color: '#38BDF8' },
    ],
  });
};
</script>
