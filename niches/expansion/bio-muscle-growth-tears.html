<!doctype html>
<!--
  Bio Mechanics — How Lifting Weights Actually Rebuilds Bigger Muscles (3D PBR Myofibril Bundle + Micro-Tears + Satellite Stem Cells)
  Y-LABS 3D Cinema Engine (Three.js PBR, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0D1117;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  microShake,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'Muscles do not grow while you lift weights. They actually grow while you repair the damage.', caption: 'THE GROWTH PARADOX' },
  { id: 'bundle', text: 'Every muscle is packed with dense bundles of striated fibers and microscopic threads called myofibrils.', caption: '1. MYOFIBRIL BUNDLE' },
  { id: 'tension', text: 'Under heavy mechanical tension, those protein filaments pull against each other at extreme force.', caption: '2. HEAVY TENSION' },
  { id: 'tears', text: 'The strain creates glowing micro-tears along the Z-discs—triggering an urgent cellular repair alarm.', caption: '3. Z-DISC MICRO-TEARS' },
  { id: 'satellite', text: 'While you sleep with enough protein, luminous satellite stem cells swarm in and fuse directly into the fiber.', caption: '4. SATELLITE STEM CELLS' },
  { id: 'hypertrophy', text: 'They weave extra actin and myosin strands—rebuilding the muscle thicker, denser, and stronger than before.', caption: '5. +HYPERTROPHY' },
];

let W = 720, H = 1280, FPS = 60, DUR = 22, LINES = [], EVENTS = [];
let stage = null, built = false;
let bundleGroup, fibers = [], zRings = [], tearSparks = [], satCells = [];

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'bio',
    fov: 38,
    fogDensity: 0.028,
    addGrid: false,
  });
  const { scene } = stage;
  const mats = createMaterials('bio');

  bundleGroup = new THREE.Group();
  scene.add(bundleGroup);

  // Translucent outer sarcolemma sheath
  const sheath = new THREE.Mesh(
    new THREE.CylinderGeometry(1.75, 1.75, 5.4, 32, 1, true),
    mats.translucent(0xff2d55, 0.16),
  );
  sheath.rotation.z = Math.PI / 2;
  bundleGroup.add(sheath);

  // 19 packed 3D PBR striated myofibril cylinders
  fibers = [];
  const fiberGeo = new THREE.CylinderGeometry(0.24, 0.24, 5.2, 18);
  fiberGeo.rotateZ(Math.PI / 2);
  const coords = [[0, 0]];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    coords.push([Math.cos(a) * 0.58, Math.sin(a) * 0.58]);
  }
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    coords.push([Math.cos(a) * 1.15, Math.sin(a) * 1.15]);
  }
  for (let i = 0; i < coords.length; i++) {
    const mat = new THREE.MeshStandardMaterial({
      color: 0xe11d48,
      emissive: 0x881337,
      emissiveIntensity: 0.35,
      roughness: 0.28,
      metalness: 0.22,
    });
    const m = new THREE.Mesh(fiberGeo, mat);
    m.position.set(0, coords[i][0], coords[i][1]);
    bundleGroup.add(m);
    fibers.push({ mesh: m, mat, baseY: coords[i][0], baseZ: coords[i][1] });
  }

  // Z-Disc striation rings along the muscle bundle
  zRings = [];
  const zGeo = new THREE.TorusGeometry(1.62, 0.045, 10, 40);
  zGeo.rotateY(Math.PI / 2);
  for (let i = -2; i <= 2; i++) {
    const mat = mats.glow(0xfda4af, 0.45);
    const r = new THREE.Mesh(zGeo, mat);
    r.position.x = i * 1.05;
    bundleGroup.add(r);
    zRings.push({ mesh: r, mat, baseX: i * 1.05 });
  }

  // Glowing golden/crimson micro-tear sparks along Z-discs
  tearSparks = [];
  const spGeo = new THREE.OctahedronGeometry(0.14, 0);
  const spMat = mats.glow(0xffd60a, 1.5);
  for (let i = 0; i < 20; i++) {
    const m = new THREE.Mesh(spGeo, spMat);
    m.visible = false;
    bundleGroup.add(m);
    tearSparks.push({ mesh: m, ang: i * 2.1, x: ((i % 5) - 2) * 1.05 });
  }

  // Luminous emerald Satellite Stem Cells swarming in to repair & thicken fibers
  satCells = [];
  const satGeo = new THREE.SphereGeometry(0.22, 18, 18);
  const satMat = mats.glow(0x34c759, 1.25);
  for (let i = 0; i < 18; i++) {
    const m = new THREE.Mesh(satGeo, satMat);
    m.visible = false;
    bundleGroup.add(m);
    satCells.push({ mesh: m, ang: (i / 18) * Math.PI * 2, x: lerp(-2.1, 2.1, (i % 6) / 5), phase: i * 0.4 });
  }

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 22;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lBu = getLine('bundle', 1);
  const lTe = getLine('tension', 2);
  const lTr = getLine('tears', 3);
  const lSa = getLine('satellite', 4);
  const lHy = getLine('hypertrophy', 5);

  EVENTS = [
    { t: lBu.start + 0.14, type: 'bounce', pitchIndex: 2, intensity: 0.55 },
    { t: lTe.start + 0.16, type: 'bounce', pitchIndex: 4, intensity: 0.72 },
    { t: lTr.start + 0.18, type: 'break', pitchIndex: 1, intensity: 1.0 },
    { t: lTr.start + 0.85, type: 'break', pitchIndex: 2, intensity: 0.82 },
    { t: lSa.start + 0.20, type: 'bounce', pitchIndex: 6, intensity: 0.78 },
    { t: lSa.start + 1.05, type: 'bounce', pitchIndex: 8, intensity: 0.74 },
    { t: Math.min(DUR - 0.25, lHy.start + 0.95), type: 'win', pitchIndex: 10, intensity: 0.95 },
  ];

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  const lTe = getLine('tension', 2);
  const lTr = getLine('tears', 3);
  const lSa = getLine('satellite', 4);
  const lHy = getLine('hypertrophy', 5);

  let activeCaption = SCRIPT[0].caption;
  for (let i = 0; i < SCRIPT.length; i++) {
    const ln = getLine(SCRIPT[i].id, i);
    if (t >= ln.start) activeCaption = ln.caption || SCRIPT[i].caption;
  }

  const pTension = smooth(lTe.start, lTe.end, t) * (1 - smooth(lSa.start, lSa.start + 0.8, t));
  const pTears = smooth(lTr.start, lTr.start + 0.8, t) * (1 - smooth(lHy.start, lHy.start + 0.9, t));
  const pSat = smooth(lSa.start, lSa.start + 1.1, t);
  const pHyper = smooth(lHy.start, lHy.end, t);

  // Mechanical stretch under tension + hypertrophy thickening!
  const stretchX = 1 + 0.16 * pTension;
  const thickYZ = lerp(1.0, 1.32, pHyper) * (1 - 0.06 * pTension);
  bundleGroup.scale.set(stretchX, thickYZ, thickYZ);
  bundleGroup.rotation.set(t * 0.32, Math.sin(t * 0.4) * 0.28, 0.18);

  // Z-disc rings flash bright gold/red during micro-tears, then emerald on repair
  for (const zr of zRings) {
    if (pTears > 0.1) {
      zr.mat.color.setHex(0xffd60a);
      zr.mat.emissive.setHex(0xff3b30);
      zr.mat.emissiveIntensity = 0.7 + 0.7 * Math.sin(t * 14);
    } else if (pSat > 0.2) {
      zr.mat.color.setHex(0x34c759);
      zr.mat.emissive.setHex(0x34c759);
      zr.mat.emissiveIntensity = 0.85;
    } else {
      zr.mat.color.setHex(0xfda4af);
      zr.mat.emissive.setHex(0xf43f5e);
      zr.mat.emissiveIntensity = 0.45;
    }
  }

  // Micro-tear sparks
  for (let i = 0; i < tearSparks.length; i++) {
    const sp = tearSparks[i];
    sp.mesh.visible = pTears > 0.08;
    if (!sp.mesh.visible) continue;
    const pulse = 0.6 + 0.6 * Math.sin(t * 12 + i);
    sp.mesh.position.set(sp.x, Math.cos(sp.ang + t * 2) * 1.45, Math.sin(sp.ang + t * 2) * 1.45);
    sp.mesh.scale.setScalar(pTears * pulse);
  }

  // Satellite stem cells swarming inward and fusing
  for (const sc of satCells) {
    sc.mesh.visible = pSat > 0.05;
    if (!sc.mesh.visible) continue;
    const rad = lerp(3.4, 1.18, clamp(pSat * 1.2 - 0.1 * Math.sin(sc.phase), 0, 1));
    sc.mesh.position.set(sc.x, Math.cos(sc.ang + t * 1.3) * rad, Math.sin(sc.ang + t * 1.3) * rad);
    sc.mesh.scale.setScalar(lerp(1.15, 0.55, pHyper));
  }

  // Camera + impact micro-shake on Z-disc tears
  const shake = microShake(t, lTr.start + 0.18, 0.18, 0.22);
  const { camera } = stage;
  camera.position.set(Math.sin(t * 0.42) * 2.2 + shake, 0.85 + shake * 0.6, lerp(8.8, 7.6, pHyper));
  camera.lookAt(0, -0.1, 0);

  stage.composite(ctx, W, H);

  drawStudioHud(ctx, {
    W,
    H,
    channel: 'bio',
    badge: pHyper > 0.3 ? 'HYPERTROPHY · +32% CROSS-SECTION' : pTears > 0.2 ? 'Z-DISC MICRO-TEARS DETECTED' : '3D MYOFIBRIL CUTAWAY',
    title: 'HOW MUSCLES ACTUALLY GROW',
    subtitle: 'TENSION → MICRO-TEARS → SATELLITE CELL FUSION',
    caption: activeCaption,
    metrics: [
      { label: 'FIBER DIAMETER', value: `+${Math.round(lerp(0, 32, pHyper))}%`, color: '#34C759' },
      { label: 'REPAIR STATE', value: pHyper > 0.4 ? 'REBUILT' : pSat > 0.2 ? 'FUSING' : pTears > 0.2 ? 'MICRO-TEAR' : 'STRAIN', color: pTears > 0.2 ? '#FFD60A' : '#FF2D55' },
      { label: 'STEM CELLS', value: pSat > 0.1 ? 'ACTIVE ↑' : 'STANDBY', color: '#38BDF8' },
    ],
    progress: t / Math.max(1, DUR),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
