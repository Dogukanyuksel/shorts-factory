<!doctype html>
<!--
  Wealth Mechanics — 3D PBR: What Happens When You Hold $10K Through Every Crash (30 Years)
  Y-LABS 3D Cinema Engine (Three.js PBR 3D Market Terrain + Panic Seller vs Diamond Hold Orb, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#090D16;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  easeOutCubic,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'What if you invested ten thousand dollars right before three historic market crashes?', caption: '$10,000 VS 3 CRASHES' },
  { id: 'dotcom', text: 'First, the dot-com bubble cuts your account nearly in half. Panic sellers bail out here.', caption: '2000 CRASH: -49%' },
  { id: 'gfc', text: 'Then 2008 hits and slashes stocks fifty-six percent. Headlines scream the market is dead.', caption: '2008 CRASH: -56%' },
  { id: 'covid', text: 'Then 2020 drops thirty-four percent in thirty-three days. Fear peaks again.', caption: '2020 CRASH: -34%' },
  { id: 'hold', text: 'Yet if you never sold once, your ten thousand quietly grew past one hundred seventy thousand.', caption: '$10K → $174,000' },
  { id: 'verdict', text: 'Missing just the ten best rebound days cuts your return in half. Time beats timing.', caption: 'TIME BEATS TIMING' },
];

let W = 720, H = 1280, FPS = 60, DUR = 26, LINES = [], EVENTS = [];
let stage = null, built = false;
let bars = [], holdOrb, panicOrb, crashMarkers = [];

// Normalized 30-year S&P 500 trajectory (with 2000, 2008, 2020 crashes)
const SERIES = [
  10, 13, 17, 22, 26, 20, 14, 17, 21, 25,
  29, 32, 18, 22, 27, 33, 41, 48, 54, 62,
  74, 83, 96, 108, 78, 114, 132, 145, 161, 174,
];

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, idx) {
  const f = LINES.find((l) => l.id === id);
  if (f) return f;
  const seg = DUR / SCRIPT.length;
  return { id, start: idx * seg, end: (idx + 1) * seg, caption: SCRIPT[idx].caption };
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'wealth', fov: 38, fogDensity: 0.02, floorY: -2.5 });
  const { scene } = stage;
  const mats = createMaterials('wealth');

  const deckGeo = new THREE.BoxGeometry(6.8, 0.24, 2.2);
  const deck = new THREE.Mesh(deckGeo, mats.darkMetal);
  deck.position.set(0, -2.38, 0);
  scene.add(deck);

  bars = SERIES.map((val, i) => {
    const x = -2.9 + (i / (SERIES.length - 1)) * 5.8;
    const isCrash = i === 6 || i === 12 || i === 24;
    const mat = isCrash ? mats.crimson : (i > 24 ? mats.gold : mats.emerald);
    const geo = new THREE.BoxGeometry(0.14, 1.0, 0.65);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, -2.26, 0);
    scene.add(mesh);
    return { mesh, x, val, isCrash };
  });

  holdOrb = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 24), mats.glow(0xffd60a, 1.0));
  scene.add(holdOrb);

  panicOrb = new THREE.Mesh(new THREE.SphereGeometry(0.18, 20, 20), mats.glow(0xff3b30, 0.95));
  scene.add(panicOrb);

  crashMarkers = [6, 12, 24].map((idx) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.035, 10, 32), mats.glow(0xff3b30, 0.95));
    m.position.set(bars[idx].x, -1.5, 0.45);
    scene.add(m);
    return { m, idx };
  });

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  LINES = Array.isArray(cfg.lines) ? cfg.lines : [];
  cv.width = W;
  cv.height = H;
  buildScene();

  const lDot = getLine('dotcom', 1);
  const lGfc = getLine('gfc', 2);
  const lCov = getLine('covid', 3);
  const lHold = getLine('hold', 4);
  EVENTS = [
    { t: Math.max(0.1, lDot.start - 0.04), type: 'break', intensity: 0.8 },
    { t: Math.max(0.2, lGfc.start - 0.04), type: 'break', intensity: 0.95 },
    { t: Math.max(0.3, lCov.start - 0.04), type: 'break', intensity: 0.85 },
    { t: Math.max(0.4, lHold.start - 0.04), type: 'win', intensity: 1.0 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);
  const idxF = p * (SERIES.length - 1);
  const curIdx = Math.floor(idxF);
  const frac = idxF - curIdx;

  bars.forEach((b, i) => {
    const rev = clamp((idxF - i + 1.2) / 1.2, 0, 1);
    const h = Math.max(0.08, (b.val / 174) * 4.4 * easeOutCubic(rev));
    b.mesh.scale.y = h;
    b.mesh.position.y = -2.26 + h * 0.5;
  });

  const v0 = SERIES[curIdx];
  const v1 = SERIES[Math.min(SERIES.length - 1, curIdx + 1)];
  const curVal = lerp(v0, v1, frac);
  const curX = -2.9 + (idxF / (SERIES.length - 1)) * 5.8;
  const curY = -2.26 + (curVal / 174) * 4.4 + 0.35;
  holdOrb.position.set(curX, curY, 0.35);

  // Panic seller exits at 2008 crash (idx 12) and sits flat at $18K
  const panicVal = idxF < 12 ? curVal : 18 + (idxF - 12) * 0.5;
  panicOrb.position.set(curX, -2.26 + (panicVal / 174) * 4.4 + 0.22, -0.38);

  crashMarkers.forEach(({ m, idx }) => {
    const active = idxF >= idx;
    m.visible = active;
    m.rotation.z = t * 2.2;
    const s = 1 + Math.sin(t * 6) * 0.12;
    m.scale.setScalar(s);
  });

  const camA = lerp(-0.28, 0.28, p);
  stage.camera.position.set(Math.sin(camA) * 8.6, 0.9 + p * 0.6, Math.cos(camA) * 8.6);
  stage.camera.lookAt(0, 0.15, 0);

  stage.renderTo(ctx, W, H);

  const active = LINES.find((l) => t >= l.start && t <= l.end) || SCRIPT[Math.min(SCRIPT.length - 1, Math.floor(p * SCRIPT.length))];
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'wealth',
    title: '30 YEARS • 3 CRASHES',
    subtitle: 'HOLDING VS PANIC SELLING',
    progress: p,
    caption: active.caption,
    metrics: [
      { label: 'YEAR', value: `${Math.round(1996 + p * 30)}`, color: '#FFFFFF' },
      { label: 'HELD', value: `$${Math.round(curVal)}K`, color: '#FFD60A' },
      { label: 'PANIC', value: `$${Math.round(panicVal)}K`, color: '#FF3B30' },
    ],
  });
};
</script>
