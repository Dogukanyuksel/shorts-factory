<!doctype html>
<!--
  Bio Mechanics — Inside Your Lungs: How 480 Million Air Sacs Power Every Breath
  Y-LABS 3D Cinema Engine (Three.js PBR Bioluminescent Bronchial Tree + Expanding Alveoli + O2/CO2 Capillary Swap, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0D1117;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'Every single day, your lungs pull in eleven thousand liters of air through a microscopic living forest.', caption: '11,000 LITERS/DAY' },
  { id: 'tree', text: 'Air races down your trachea and splits twenty-three times across a glowing bronchial tree.', caption: '1. BRONCHIAL TREE' },
  { id: 'alveoli', text: 'At the very tips sit four hundred eighty million elastic air sacs called alveoli—clustered like grapes.', caption: '2. 480M ALVEOLI' },
  { id: 'membrane', text: 'Wrapped in hair-thin capillaries, oxygen crosses a membrane just half a micron thick.', caption: '3. 0.5 MICRON WALL' },
  { id: 'exchange', text: 'Cyan oxygen locks onto dark blue blood cells, turning them bright crimson while carbon dioxide escapes!', caption: '4. O₂ / CO₂ SWAP' },
  { id: 'scale', text: 'Unfolded flat, those tiny sacs would cover an entire tennis court—powering twenty thousand breaths a day.', caption: 'TENNIS COURT AREA' },
];

let W = 720, H = 1280, FPS = 60, DUR = 22, LINES = [], EVENTS = [];
let stage = null, built = false;
let lungRoot, alveoliSacs = [], capCurve = null, bloodCells = [], o2Orbs = [], co2Orbs = [];

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'bio',
    fov: 40,
    fogDensity: 0.03,
    floorY: -2.6,
  });
  const { scene } = stage;
  const mats = createMaterials('bio');

  lungRoot = new THREE.Group();
  scene.add(lungRoot);

  // Bronchial Trachea Stem + Dual Split Branches
  const stemMat = mats.translucent(0x38bdf8, 0.34);
  const stemGeo = new THREE.CylinderGeometry(0.24, 0.30, 2.2, 20);
  const stem = new THREE.Mesh(stemGeo, stemMat);
  stem.position.set(0, 2.0, 0);
  lungRoot.add(stem);
  lungRoot.add(addXrayEdges(stemGeo, 0x38bdf8, 0.35)).position.set(0, 2.0, 0);

  // Cartilage rings on trachea
  for (let i = 0; i < 6; i++) {
    const cr = new THREE.Mesh(new THREE.TorusGeometry(0.29, 0.032, 10, 24), mats.glow(0x38bdf8, 0.55));
    cr.rotation.x = Math.PI / 2;
    cr.position.set(0, 1.2 + i * 0.32, 0);
    lungRoot.add(cr);
  }

  // 3D Grape-like Alveoli Cluster (16 breathing translucent glowing air sacs)
  alveoliSacs = [];
  const sacMat = new THREE.MeshPhysicalMaterial({
    color: 0x38bdf8,
    emissive: 0x0ea5e9,
    emissiveIntensity: 0.32,
    transparent: true,
    opacity: 0.42,
    roughness: 0.14,
    metalness: 0.1,
    depthWrite: false,
  });

  const sacOffsets = [
    [0, 0.25, 0, 0.72],
    [-0.95, 0.15, 0.35, 0.58], [0.95, 0.15, 0.35, 0.58],
    [-0.85, -0.65, -0.35, 0.62], [0.85, -0.65, -0.35, 0.62],
    [0, -0.95, 0.55, 0.64], [0, -0.85, -0.65, 0.60],
    [-1.45, -0.35, -0.15, 0.50], [1.45, -0.35, -0.15, 0.50],
    [-0.45, 0.85, 0.45, 0.48], [0.45, 0.85, 0.45, 0.48],
    [-0.55, -1.45, 0.1, 0.52], [0.55, -1.45, 0.1, 0.52],
    [0, 0.15, 0.95, 0.54], [0, 0.15, -0.95, 0.54],
  ];

  for (let i = 0; i < sacOffsets.length; i++) {
    const [x, y, z, r] = sacOffsets[i];
    const geo = new THREE.SphereGeometry(r, 22, 22);
    const sac = new THREE.Mesh(geo, sacMat);
    sac.position.set(x, y, z);

    // Subtle inner glowing core
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(r * 0.52, 14, 14),
      mats.glow(0x34c759, 0.45, 0.3, 0.1),
    );
    sac.add(core);
    lungRoot.add(sac);

    // Thin bronchial twig connecting stem to sac
    const twigCurve = new THREE.LineCurve3(new THREE.Vector3(0, 1.05, 0), new THREE.Vector3(x, y, z));
    const twig = new THREE.Mesh(new THREE.TubeGeometry(twigCurve, 4, 0.055, 8, false), stemMat);
    lungRoot.add(twig);

    alveoliSacs.push({ sac, basePos: new THREE.Vector3(x, y, z), phase: i * 0.35 });
  }

  // Hair-thin Capillary Vessel wrapping around the alveoli cluster
  const capPts = [];
  for (let i = 0; i <= 48; i++) {
    const a = (i / 48) * Math.PI * 2;
    capPts.push(new THREE.Vector3(
      Math.cos(a) * 1.95,
      -0.25 + Math.sin(a * 2) * 0.85,
      Math.sin(a) * 1.55,
    ));
  }
  capCurve = new THREE.CatmullRomCurve3(capPts, true);
  const capTube = new THREE.Mesh(
    new THREE.TubeGeometry(capCurve, 80, 0.16, 12, true),
    mats.translucent(0xff2d55, 0.28),
  );
  lungRoot.add(capTube);

  // Blood cells flowing around capillary — shifting from dark blue (deoxygenated) to bright crimson (oxygenated)!
  bloodCells = [];
  const rbcGeo = new THREE.TorusGeometry(0.11, 0.055, 10, 16);
  for (let i = 0; i < 20; i++) {
    const mat = new THREE.MeshStandardMaterial({
      color: 0x3b82f6,
      emissive: 0x1d4ed8,
      emissiveIntensity: 0.6,
      roughness: 0.22,
      metalness: 0.2,
    });
    const m = new THREE.Mesh(rbcGeo, mat);
    lungRoot.add(m);
    bloodCells.push({ mesh: m, mat, offset: i / 20 });
  }

  // Cyan O2 molecules crossing outward into capillary & Amber CO2 molecules escaping inward
  o2Orbs = [];
  co2Orbs = [];
  const o2Geo = new THREE.SphereGeometry(0.085, 12, 12);
  const o2Mat = mats.glow(0x00f0ff, 1.2);
  const co2Mat = mats.glow(0xf59e0b, 1.1);
  for (let i = 0; i < 16; i++) {
    const o2 = new THREE.Mesh(o2Geo, o2Mat);
    const co2 = new THREE.Mesh(o2Geo, co2Mat);
    lungRoot.add(o2);
    lungRoot.add(co2);
    o2Orbs.push({ mesh: o2, angle: (i / 16) * Math.PI * 2, y: ((i % 5) - 2) * 0.45, offset: i / 16 });
    co2Orbs.push({ mesh: co2, angle: ((i + 0.5) / 16) * Math.PI * 2, y: (((i + 2) % 5) - 2) * 0.45, offset: (i + 0.5) / 16 });
  }

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 22;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lTre = getLine('tree', 1);
  const lAlv = getLine('alveoli', 2);
  const lMem = getLine('membrane', 3);
  const lExc = getLine('exchange', 4);
  const lSca = getLine('scale', 5);

  EVENTS = [
    { t: lTre.start + 0.14, type: 'bounce', pitchIndex: 2, intensity: 0.58 },
    { t: lAlv.start + 0.14, type: 'bounce', pitchIndex: 4, intensity: 0.72 },
    { t: lMem.start + 0.15, type: 'bounce', pitchIndex: 6, intensity: 0.75 },
    { t: lExc.start + 0.10, type: 'break', pitchIndex: 7, intensity: 0.96 },
    { t: lExc.start + 1.05, type: 'bounce', pitchIndex: 8, intensity: 0.78 },
    { t: lSca.start + 0.25, type: 'bounce', pitchIndex: 9, intensity: 0.80 },
    { t: Math.min(DUR - 0.25, lSca.start + 1.4), type: 'win', pitchIndex: 10, intensity: 0.96 },
  ];

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  const lAlv = getLine('alveoli', 2);
  const lMem = getLine('membrane', 3);
  const lExc = getLine('exchange', 4);
  const lSca = getLine('scale', 5);

  let activeCaption = SCRIPT[0].caption;
  for (let i = 0; i < SCRIPT.length; i++) {
    const ln = getLine(SCRIPT[i].id, i);
    if (t >= ln.start) activeCaption = ln.caption || SCRIPT[i].caption;
  }

  // Smooth breathing cycle (inhale -> exhale)
  const breath = 0.5 + 0.5 * Math.sin(t * 1.9);
  const breathScale = lerp(0.90, 1.15, breath);

  lungRoot.rotation.y = t * 0.28;
  for (const s of alveoliSacs) {
    const localB = 1 + 0.12 * Math.sin(t * 1.9 + s.phase * 0.4);
    s.sac.scale.setScalar(breathScale * localB);
  }

  // Animate capillary blood cells shifting blue -> crimson after gas exchange
  const pExc = smooth(lMem.start, lExc.start + 1.0, t);
  const colBlue = new THREE.Color(0x3b82f6);
  const colRed = new THREE.Color(0xff2d55);
  for (const bc of bloodCells) {
    const u = (t * 0.16 + bc.offset) % 1;
    const pos = capCurve.getPoint(u);
    bc.mesh.position.copy(pos);
    bc.mesh.rotation.set(t * 2, u * Math.PI * 4, 0);
    const oxy = smooth(0.35, 0.72, u) * Math.max(0.35, pExc);
    bc.mat.color.copy(colBlue).lerp(colRed, oxy);
    bc.mat.emissive.copy(colBlue).lerp(colRed, oxy);
  }

  // Animate O2 crossing outward & CO2 escaping inward
  for (const o of o2Orbs) {
    const u = (t * 0.65 + o.offset) % 1;
    const r = lerp(0.35, 2.05, u);
    o.mesh.position.set(Math.cos(o.angle) * r, o.y, Math.sin(o.angle) * r);
    o.mesh.scale.setScalar(Math.sin(u * Math.PI) * 1.25);
  }
  for (const c of co2Orbs) {
    const u = (t * 0.55 + c.offset) % 1;
    const r = lerp(2.05, 0.25, u);
    c.mesh.position.set(Math.cos(c.angle) * r, c.y, Math.sin(c.angle) * r);
    c.mesh.scale.setScalar(Math.sin(u * Math.PI) * 1.1 * Math.max(0.25, pExc));
  }

  // Camera Choreography: establishing -> macro alveoli zoom -> gas-exchange close-up -> wide pullback
  const { camera } = stage;
  const pZoom = smooth(lAlv.start, lMem.start + 0.8, t) * (1 - smooth(lSca.start, lSca.start + 1.2, t));
  lungRoot.position.y = -0.45;
  camera.position.set(
    Math.sin(t * 0.35) * lerp(2.0, 1.2, pZoom),
    lerp(0.8, 0.1, pZoom),
    lerp(9.8, 7.2, pZoom),
  );
  camera.lookAt(0, -0.35, 0);

  stage.composite(ctx, W, H);

  drawStudioHud(ctx, {
    W,
    H,
    channel: 'bio',
    badge: breath > 0.5 ? 'INHALE · O₂ DIFFUSING IN 3D' : 'EXHALE · CO₂ FLUSHING OUT',
    title: '480 MILLION AIR SACS',
    subtitle: '0.5-MICRON ALVEOLI MEMBRANE · 11,000 L/DAY',
    caption: activeCaption,
    metrics: [
      { label: 'AIR SACS', value: '480M', color: '#38BDF8' },
      { label: 'O₂ SATURATION', value: `${Math.round(lerp(75, 99, Math.max(0.4, pExc)))}%`, color: '#34C759' },
      { label: 'SURFACE AREA', value: '70 m²', color: '#FF2D55' },
    ],
    progress: t / Math.max(1, DUR),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
