<!doctype html>
<!--
  Wealth Mechanics — 3D PBR: The Dividend Snowball (Automatic DRIP Reinvestment)
  Y-LABS 3D Cinema Engine (Three.js PBR Rolling Gold Snowball + Orbital Dividend Coin Ring, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#090D16;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  easeOutCubic,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'Your first dividend check feels laughable — maybe twelve dollars a month. That is why most quit.', caption: '$12/MO AT YEAR 1' },
  { id: 'drip', text: 'Turn on automatic dividend reinvestment and every payout buys brand-new shares while you sleep.', caption: 'DRIP AUTO-REINVEST' },
  { id: 'loop', text: 'Those new shares pay their own dividends, which buy even more shares next quarter.', caption: 'SHARES BUYING SHARES' },
  { id: 'yr15', text: 'By year fifteen, your snowball quietly crosses three hundred fifty dollars every single month.', caption: 'YEAR 15: $350/MO' },
  { id: 'yr30', text: 'By year thirty, that tiny trickle hits fifteen hundred fifty dollars a month without working.', caption: 'YEAR 30: $1,550/MO' },
  { id: 'verdict', text: 'You never notice the snowball growing until it is big enough to pay your bills.', caption: 'NEVER STOP THE LOOP' },
];

let W = 720, H = 1280, FPS = 60, DUR = 26, LINES = [], EVENTS = [];
let stage = null, built = false;
let snowball, snowShell, orbitGroup, coins = [], rampMesh;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, idx) {
  const f = LINES.find((l) => l.id === id);
  if (f) return f;
  const seg = DUR / SCRIPT.length;
  return { id, start: idx * seg, end: (idx + 1) * seg, caption: SCRIPT[idx].caption };
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'wealth', fov: 38, fogDensity: 0.02, floorY: -2.5 });
  const { scene } = stage;
  const mats = createMaterials('wealth');

  // Inclined crystalline track
  const rampGeo = new THREE.BoxGeometry(7.0, 0.24, 2.2);
  rampMesh = new THREE.Mesh(rampGeo, mats.darkMetal);
  rampMesh.position.set(0, -1.65, 0);
  rampMesh.rotation.z = -0.18;
  scene.add(rampMesh);
  const rampEdge = addXrayEdges(rampGeo, 0x30d158, 0.45);
  rampEdge.position.copy(rampMesh.position);
  rampEdge.rotation.copy(rampMesh.rotation);
  scene.add(rampEdge);

  // Rolling 3D Gold Snowball (faceted icosahedron + glowing inner core)
  snowball = new THREE.Group();
  const coreGeo = new THREE.IcosahedronGeometry(1.0, 2);
  const core = new THREE.Mesh(coreGeo, mats.gold);
  snowball.add(core);
  snowShell = addXrayEdges(coreGeo, 0x30d158, 0.5);
  snowball.add(snowShell);
  scene.add(snowball);

  // Orbiting dividend coin stream feeding into the snowball
  orbitGroup = new THREE.Group();
  const coinGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.06, 20);
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const c = new THREE.Mesh(coinGeo, i % 2 === 0 ? mats.gold : mats.emerald);
    c.rotation.x = Math.PI / 2;
    c.userData = { angle: a, rad: 1.85 + (i % 3) * 0.35, yOff: ((i % 5) - 2) * 0.22 };
    orbitGroup.add(c);
    coins.push(c);
  }
  scene.add(orbitGroup);

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  LINES = Array.isArray(cfg.lines) ? cfg.lines : [];
  cv.width = W;
  cv.height = H;
  buildScene();

  const lDrip = getLine('drip', 1);
  const lYr15 = getLine('yr15', 3);
  const lYr30 = getLine('yr30', 4);
  EVENTS = [
    { t: Math.max(0.1, lDrip.start - 0.04), type: 'bounce', intensity: 0.7 },
    { t: Math.max(0.2, lYr15.start - 0.04), type: 'bounce', intensity: 0.9 },
    { t: Math.max(0.3, lYr30.start - 0.04), type: 'win', intensity: 1.0 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  const year = lerp(1, 30, p);
  const monthlyDiv = 12 * Math.pow(1.176, year - 1);
  const radius = lerp(0.38, 1.55, easeOutCubic(p));

  snowball.scale.setScalar(radius);
  snowball.position.set(lerp(-1.5, 0.85, p), -1.52 - lerp(-1.5, 0.85, p) * 0.18 + radius, 0);
  snowball.rotation.z = -t * (1.8 + p * 2.4);
  snowball.rotation.x = t * 0.45;

  orbitGroup.position.copy(snowball.position);
  coins.forEach((c, i) => {
    const a = c.userData.angle + t * (1.4 + p * 1.8);
    const r = radius + 0.45 + (c.userData.rad - 1.85) * (1 - p * 0.35);
    c.position.set(Math.cos(a) * r, c.userData.yOff + Math.sin(a * 2) * 0.25, Math.sin(a) * r);
    c.rotation.y = a;
    c.visible = i < Math.floor(6 + p * 18);
  });

  const camA = lerp(-0.3, 0.32, p);
  stage.camera.position.set(Math.sin(camA) * 7.8, 0.85, Math.cos(camA) * 7.8);
  stage.camera.lookAt(snowball.position.x * 0.4, 0.1, 0);

  stage.renderTo(ctx, W, H);

  const active = LINES.find((l) => t >= l.start && t <= l.end) || SCRIPT[Math.min(SCRIPT.length - 1, Math.floor(p * SCRIPT.length))];
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'wealth',
    title: 'THE DIVIDEND SNOWBALL',
    subtitle: '30-YEAR DRIP COMPOUNDING',
    progress: p,
    caption: active.caption,
    metrics: [
      { label: 'YEAR', value: `${Math.round(year)}`, color: '#FFFFFF' },
      { label: 'PASSIVE/MO', value: `$${Math.round(monthlyDiv)}`, color: '#30D158' },
      { label: 'ANNUAL', value: `$${(monthlyDiv * 12 / 1000).toFixed(1)}K`, color: '#FFD60A' },
    ],
  });
};
</script>
