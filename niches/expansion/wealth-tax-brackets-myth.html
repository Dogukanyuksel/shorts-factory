<!doctype html>
<!--
  Wealth Mechanics — Why a Raise NEVER Makes You Take Home Less Money
  Y-LABS 3D Cinema Engine (Three.js PBR X-Ray Glass Tax Buckets + 2D Safe-Zone HUD, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#090D16;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  easeOutCubic,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: "Think a raise can push you into a higher tax bracket and shrink your paycheck? That's one of finance's biggest myths.", caption: 'THE TAX BRACKET MYTH' },
  { id: 'myth', text: "People think crossing into the twenty-four percent bracket taxes their entire salary at twenty-four percent. It doesn't.", caption: 'NOT ON ALL YOUR INCOME' },
  { id: 'fill', text: 'Instead, your income fills four separate buckets in order — ten percent, twelve percent, then twenty-two percent up to one hundred thousand.', caption: 'BUCKETS FILL IN ORDER' },
  { id: 'raise', text: 'Now you get a five thousand dollar raise. Notice the first three buckets stay completely locked. Only the new five thousand spills into twenty-four percent!', caption: 'ONLY TOP DOLLARS TAXED' },
  { id: 'math', text: 'You pay twelve hundred in tax on that raise and pocket three thousand eight hundred extra. Your real tax rate is just seventeen point three percent.', caption: '+$3,800 EXTRA TAKE-HOME' },
  { id: 'law', text: 'A higher bracket only taxes the dollars inside that bucket. Never turn down a raise — you always take home more.', caption: 'ALWAYS TAKE THE RAISE' },
];

const BUCKETS = [
  { rate: 0.10, rateLbl: '10%', rangeLbl: '$0–$12K', lo: 0, hi: 12000, cap: 12000, hex: 0x30d158, css: '#30D158', h: 1.5 },
  { rate: 0.12, rateLbl: '12%', rangeLbl: '$12–$48K', lo: 12000, hi: 48000, cap: 36000, hex: 0x2dd4bf, css: '#2DD4BF', h: 2.0 },
  { rate: 0.22, rateLbl: '22%', rangeLbl: '$48–$100K', lo: 48000, hi: 100000, cap: 52000, hex: 0xffd60a, css: '#FFD60A', h: 2.5 },
  { rate: 0.24, rateLbl: '24%', rangeLbl: '$100K+', lo: 100000, hi: 120000, cap: 20000, hex: 0xff6b35, css: '#FF6B35', h: 2.8 },
];

let W = 720, H = 1280, FPS = 60, DUR = 24, LINES = [], EVENTS = [];
let stage = null, built = false;
let bucketObjs = [], coins = [], streamMesh = null, mythOverlayRing = null;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

function computeTaxStats(income) {
  let totalTax = 0;
  const fills = BUCKETS.map((b) => {
    const dollars = clamp(income - b.lo, 0, b.cap);
    const tax = dollars * b.rate;
    totalTax += tax;
    return { dollars, pct: dollars / b.cap, tax };
  });
  const effRate = income > 0 ? (totalTax / income) * 100 : 0;
  return { totalTax, effRate, takeHome: income - totalTax, fills };
}

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'wealth',
    fov: 38,
    fogDensity: 0.028,
    floorY: -2.05,
  });
  const { scene } = stage;
  const mats = createMaterials('wealth');

  // Heavy machined base platform
  const baseGeo = new THREE.BoxGeometry(7.2, 0.28, 2.4);
  const base = new THREE.Mesh(baseGeo, mats.darkMetal);
  base.position.set(0, -1.9, 0);
  scene.add(base);
  scene.add(addXrayEdges(baseGeo, 0xffd60a, 0.32));

  // Build 4 X-Ray Glass PBR Tax Buckets arranged left-to-right
  bucketObjs = [];
  const xs = [-2.25, -0.75, 0.75, 2.25];
  for (let i = 0; i < BUCKETS.length; i++) {
    const b = BUCKETS[i];
    const g = new THREE.Group();
    g.position.set(xs[i], -1.75, 0);

    const r = 0.54;
    const h = b.h;

    // Metallic bottom & top rim collars
    const collarGeo = new THREE.TorusGeometry(r, 0.045, 14, 36);
    const botCollar = new THREE.Mesh(collarGeo, mats.steel);
    botCollar.rotation.x = Math.PI / 2;
    botCollar.position.y = 0.03;
    g.add(botCollar);

    const topCollar = new THREE.Mesh(collarGeo, mats.glow(b.hex, 0.45, 0.2, 0.7));
    topCollar.rotation.x = Math.PI / 2;
    topCollar.position.y = h;
    g.add(topCollar);

    // Translucent X-Ray glass cylinder wall
    const wallGeo = new THREE.CylinderGeometry(r, r, h, 32, 1, true);
    const wall = new THREE.Mesh(wallGeo, mats.xrayGlass);
    wall.position.y = h * 0.5;
    g.add(wall);

    const edges = addXrayEdges(new THREE.CylinderGeometry(r + 0.008, r + 0.008, h, 16, 1, true), b.hex, 0.42);
    edges.position.y = h * 0.5;
    g.add(edges);

    // Glowing PBR liquid fill column inside bucket
    const liqGeo = new THREE.CylinderGeometry(r * 0.86, r * 0.86, 1.0, 28);
    const liqMat = new THREE.MeshStandardMaterial({
      color: b.hex,
      emissive: b.hex,
      emissiveIntensity: 0.42,
      metalness: 0.55,
      roughness: 0.18,
    });
    const liq = new THREE.Mesh(liqGeo, liqMat);
    liq.position.y = 0.02;
    liq.scale.set(1, 0.001, 1);
    g.add(liq);

    // Lock ring (illuminates when bucket is locked during raise phase)
    const lockRing = new THREE.Mesh(
      new THREE.TorusGeometry(r * 1.14, 0.03, 12, 36),
      mats.glow(0x30d158, 0.85, 0.2, 0.5),
    );
    lockRing.rotation.x = Math.PI / 2;
    lockRing.position.y = h * 0.5;
    lockRing.visible = false;
    g.add(lockRing);

    scene.add(g);
    bucketObjs.push({ group: g, liq, liqMat, topCollar, lockRing, h, x: xs[i], hex: b.hex });
  }

  // Flowing golden coins / droplets pouring into active bucket
  coins = [];
  const coinGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.045, 18);
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(coinGeo, mats.gold);
    m.visible = false;
    scene.add(m);
    coins.push(m);
  }

  // Luminous pouring beam above active bucket
  const streamGeo = new THREE.CylinderGeometry(0.06, 0.12, 3.2, 16);
  const streamMat = mats.glow(0xffd60a, 0.9, 0.15, 0.4);
  streamMat.transparent = true;
  streamMat.opacity = 0.72;
  streamMesh = new THREE.Mesh(streamGeo, streamMat);
  streamMesh.visible = false;
  scene.add(streamMesh);

  // Red "MYTH" warning torus that pulses in myth phase
  mythOverlayRing = new THREE.Mesh(
    new THREE.TorusGeometry(3.15, 0.045, 12, 64),
    mats.glow(0xff3b30, 1.1, 0.2, 0.3),
  );
  mythOverlayRing.rotation.x = Math.PI / 2;
  mythOverlayRing.position.y = 0.6;
  mythOverlayRing.visible = false;
  scene.add(mythOverlayRing);

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 24;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lMyth = getLine('myth', 1);
  const lFill = getLine('fill', 2);
  const lRaise = getLine('raise', 3);
  const lMath = getLine('math', 4);
  const lLaw = getLine('law', 5);

  EVENTS = [
    { t: lMyth.start + 0.2, type: 'bounce', pitchIndex: 4, intensity: 0.62 },
    { t: lFill.start + 0.15, type: 'bounce', pitchIndex: 6, intensity: 0.72 },
    { t: lRaise.start + 0.18, type: 'break', pitchIndex: 9, intensity: 0.88 },
    { t: lMath.start + 0.18, type: 'win', pitchIndex: 11, intensity: 0.94 },
    { t: lLaw.start + 0.22, type: 'win', pitchIndex: 12, intensity: 0.9 },
  ];

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  const lHook = getLine('hook', 0);
  const lMyth = getLine('myth', 1);
  const lFill = getLine('fill', 2);
  const lRaise = getLine('raise', 3);
  const lMath = getLine('math', 4);
  const lLaw = getLine('law', 5);

  // Active caption
  let activeCaption = SCRIPT[0].caption;
  for (let i = 0; i < SCRIPT.length; i++) {
    const ln = getLine(SCRIPT[i].id, i);
    if (t >= ln.start) activeCaption = ln.caption || SCRIPT[i].caption;
  }

  // Deterministic simulated income
  let income = 68000;
  let mythFlash = 0;
  if (t < lMyth.start) {
    income = lerp(42000, 96000, smooth(0, lMyth.start, t));
  } else if (t < lFill.start) {
    income = 100000;
    mythFlash = 0.5 + 0.5 * Math.sin((t - lMyth.start) * 9.0);
  } else if (t < lRaise.start) {
    income = lerp(0, 100000, easeOutCubic(clamp((t - lFill.start) / Math.max(0.1, lRaise.start - lFill.start), 0, 1)));
  } else {
    const pRaise = smooth(lRaise.start + 0.2, lRaise.start + 2.2, t);
    income = lerp(100000, 105000, pRaise);
  }

  const stats = computeTaxStats(income);
  const inRaise = t >= lRaise.start;

  // Update 3D buckets
  let activeBucketIdx = 0;
  for (let i = 0; i < bucketObjs.length; i++) {
    const bo = bucketObjs[i];
    const pct = clamp(stats.fills[i].pct, 0, 1);
    if (pct > 0.005) activeBucketIdx = i;

    const fillH = Math.max(0.02, pct * (bo.h - 0.1));
    bo.liq.scale.set(1, fillH, 1);
    bo.liq.position.y = fillH * 0.5 + 0.04;

    if (mythFlash > 0.01) {
      bo.liqMat.color.setHex(0xff3b30);
      bo.liqMat.emissive.setHex(0xff3b30);
      bo.liqMat.emissiveIntensity = 0.45 + 0.45 * mythFlash;
    } else {
      bo.liqMat.color.setHex(bo.hex);
      bo.liqMat.emissive.setHex(bo.hex);
      const spotlight = inRaise ? (i === 3 ? 0.95 : 0.24) : (i === activeBucketIdx ? 0.72 : 0.35);
      bo.liqMat.emissiveIntensity = spotlight;
    }

    // Lock rings on first 3 buckets during raise phase
    bo.lockRing.visible = inRaise && i < 3;
    if (bo.lockRing.visible) {
      bo.lockRing.rotation.z = t * 1.6 + i;
    }
  }

  // Myth warning torus
  mythOverlayRing.visible = mythFlash > 0.01;
  if (mythOverlayRing.visible) {
    const sc = 1 + 0.06 * mythFlash;
    mythOverlayRing.scale.set(sc, sc, sc);
  }

  // Pouring gold stream + cascading 3D coins into active bucket
  const pouring = (t >= lFill.start && t < lMath.start) || t < lMyth.start;
  const targetBo = bucketObjs[inRaise ? 3 : activeBucketIdx];
  streamMesh.visible = pouring && mythFlash < 0.01;
  if (streamMesh.visible) {
    streamMesh.position.set(targetBo.x, targetBo.h + 1.35, 0);
  }

  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    if (!pouring || mythFlash > 0.01) {
      c.visible = false;
      continue;
    }
    c.visible = true;
    const phase = (t * 2.2 + i / coins.length) % 1;
    const spreadX = Math.sin(i * 4.3 + t * 2) * 0.26;
    const spreadZ = Math.cos(i * 3.1 + t * 2) * 0.22;
    c.position.set(
      targetBo.x + spreadX * phase,
      lerp(targetBo.h + 2.6, -1.5 + targetBo.h * 0.45, phase * phase),
      spreadZ * phase,
    );
    c.rotation.set(t * 5 + i, t * 3.5, i * 0.7);
  }

  // Camera Choreography: wide establishing -> smooth orbit -> macro zoom onto Bucket 4 during raise -> heroic pullback
  const { camera } = stage;
  let camX = Math.sin(t * 0.35) * 1.65;
  let camY = 1.95 + Math.sin(t * 0.5) * 0.25;
  let camZ = 9.4;
  let lookX = 0;
  let lookY = -0.35;

  if (t >= lRaise.start && t < lLaw.start) {
    const pz = smooth(lRaise.start, lRaise.start + 1.1, t) * (1 - smooth(lLaw.start - 0.8, lLaw.start, t));
    camX = lerp(camX, 2.55 + Math.sin(t * 0.9) * 0.45, pz);
    camY = lerp(camY, 1.35, pz);
    camZ = lerp(camZ, 6.2, pz);
    lookX = lerp(0, 1.85, pz);
    lookY = lerp(-0.35, -0.1, pz);
  }
  camera.position.set(camX, camY, camZ);
  camera.lookAt(lookX, lookY, 0);

  stage.composite(ctx, W, H);

  // 3D-projected bucket rate tags directly above each bucket (inside Safe-Zone)
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const S = W / 720;
  for (let i = 0; i < BUCKETS.length; i++) {
    const bo = bucketObjs[i];
    const wp = new THREE.Vector3(bo.x, -1.75 + bo.h + 0.55, 0);
    wp.project(camera);
    const sx = (wp.x * 0.5 + 0.5) * W;
    const sy = (-wp.y * 0.5 + 0.5) * H;
    if (sx > W * 0.06 && sx < W * 0.86 && sy > H * 0.22 && sy < H * 0.60) {
      const b = BUCKETS[i];
      ctx.font = `900 ${Math.round(17 * S)}px ui-monospace, monospace`;
      ctx.lineWidth = 4 * S;
      ctx.strokeStyle = 'rgba(5, 8, 16, 0.92)';
      ctx.strokeText(b.rateLbl, sx, sy);
      ctx.fillStyle = mythFlash > 0.01 ? '#FF3B30' : b.css;
      ctx.fillText(b.rateLbl, sx, sy);

      ctx.font = `700 ${Math.round(10.5 * S)}px ui-monospace, monospace`;
      ctx.strokeText(b.rangeLbl, sx, sy + 16 * S);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(b.rangeLbl, sx, sy + 16 * S);
    }
  }
  ctx.restore();

  const extraNet = income > 100000 ? Math.round((income - 100000) * 0.76) : 0;
  drawStudioHud(ctx, {
    W,
    H,
    channel: 'wealth',
    badge: mythFlash > 0.01 ? 'MYTH: 24% ON ALL INCOME ✕' : 'MARGINAL TAX BUCKETS · 3D',
    title: 'WHY A RAISE NEVER HURTS',
    subtitle: inRaise ? '+$5,000 RAISE → ONLY TOP $5K AT 24%' : '4 PROGRESSIVE BUCKETS FILL IN ORDER',
    caption: activeCaption,
    metrics: [
      { label: 'SALARY', value: '$' + Math.round(income).toLocaleString('en-US'), color: '#FFD60A' },
      { label: 'REAL TAX RATE', value: mythFlash > 0.01 ? '24.0%?' : stats.effRate.toFixed(1) + '%', color: mythFlash > 0.01 ? '#FF3B30' : '#30D158' },
      { label: 'EXTRA NET', value: extraNet > 0 ? '+$' + extraNet.toLocaleString('en-US') : '$' + Math.round(stats.takeHome / 1000) + 'K', color: '#30D158' },
    ],
    progress: t / Math.max(1, DUR),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
