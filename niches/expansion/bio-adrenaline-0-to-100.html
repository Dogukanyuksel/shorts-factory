<!doctype html>
<!--
  Bio Mechanics — What Happens Inside Your Body 0.2 Seconds After Fear Hits (3D PBR Amygdala -> Spine Lightning -> Dilating Iris)
  Y-LABS 3D Cinema Engine (Three.js PBR, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0D1117;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  microShake,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'In just two tenths of a second after fear hits, your nervous system hijacks your entire body.', caption: '0.2s FEAR HIJACK' },
  { id: 'amygdala', text: 'At fifty milliseconds, your amygdala—the brain threat radar—flashes red before you even consciously react.', caption: '1. AMYGDALA (0.05s)' },
  { id: 'spine', text: 'An electric command rockets down your spinal cord straight to the adrenal glands above your kidneys.', caption: '2. SPINAL LIGHTNING' },
  { id: 'adrenaline', text: 'Instantly, a crimson flood of adrenaline surges into your bloodstream—supercharging every vital system.', caption: '3. ADRENALINE FLOOD' },
  { id: 'pupil', text: 'Your pupils dilate wide for sharper vision while your heart rate spikes from sixty-eight to one hundred fifty-two BPM.', caption: '4. PUPIL + 152 BPM' },
  { id: 'redirect', text: 'Blood is instantly diverted away from your gut and blasted into your arms and legs for explosive power.', caption: '5. MUSCLE OVERDRIVE' },
];

let W = 720, H = 1280, FPS = 60, DUR = 22, LINES = [], EVENTS = [];
let stage = null, built = false;
let neuroGroup, amygdalaOrb, amygdalaMat, spineDiscs = [], signalPulses = [], irisRing, pupilDisc, adrenalineOrbs = [];

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'bio',
    fov: 40,
    fogDensity: 0.028,
    addGrid: false,
  });
  const { scene } = stage;
  const mats = createMaterials('bio');

  neuroGroup = new THREE.Group();
  scene.add(neuroGroup);

  // Translucent 3D Brain Hemisphere Shell at top
  const brainShell = new THREE.Mesh(
    new THREE.SphereGeometry(1.32, 28, 28),
    mats.translucent(0x38bdf8, 0.22),
  );
  brainShell.scale.set(1.12, 0.92, 1.05);
  brainShell.position.set(0, 1.55, 0);
  neuroGroup.add(brainShell);

  // Glowing Amygdala Core inside brain
  amygdalaMat = mats.glow(0xff2d55, 1.4);
  amygdalaOrb = new THREE.Mesh(new THREE.SphereGeometry(0.38, 22, 22), amygdalaMat);
  amygdalaOrb.position.set(0, 1.45, 0.15);
  neuroGroup.add(amygdalaOrb);

  // 3D Spinal Cord Vertebrae descending from Brain to Adrenal Glands
  spineDiscs = [];
  const vertGeo = new THREE.CylinderGeometry(0.28, 0.32, 0.22, 18);
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(vertGeo, mats.steel);
    m.position.set(0, 0.55 - i * 0.28, -0.05);
    neuroGroup.add(m);
    spineDiscs.push(m);
  }

  // Electric Lightning Pulses racing down the spinal cord
  signalPulses = [];
  const pGeo = new THREE.TorusGeometry(0.42, 0.055, 10, 28);
  pGeo.rotateX(Math.PI / 2);
  const pMat = mats.glow(0x00f0ff, 1.5);
  for (let i = 0; i < 6; i++) {
    const m = new THREE.Mesh(pGeo, pMat);
    neuroGroup.add(m);
    signalPulses.push({ mesh: m, offset: i / 6 });
  }

  // Adrenal Glands (paired glowing amber pods at bottom of spine)
  for (const ax of [-0.65, 0.65]) {
    const gland = new THREE.Mesh(new THREE.SphereGeometry(0.36, 18, 18), mats.glow(0xffd60a, 0.9));
    gland.scale.set(1.2, 0.85, 0.85);
    gland.position.set(ax, -2.35, 0);
    neuroGroup.add(gland);
  }

  // 3D Dilating Eye / Iris Assembly hovering beside/in front during pupil phase
  const eyeGroup = new THREE.Group();
  eyeGroup.position.set(0, -0.1, 1.15);
  irisRing = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.22, 18, 44), mats.glow(0x38bdf8, 0.75));
  pupilDisc = new THREE.Mesh(new THREE.CircleGeometry(0.45, 36), new THREE.MeshBasicMaterial({ color: 0x020617 }));
  pupilDisc.position.z = 0.05;
  eyeGroup.add(irisRing, pupilDisc);
  eyeGroup.visible = false;
  neuroGroup.add(eyeGroup);
  neuroGroup.userData.eyeGroup = eyeGroup;

  // Crimson Adrenaline Surge Molecules exploding outward
  adrenalineOrbs = [];
  const adGeo = new THREE.OctahedronGeometry(0.14, 0);
  const adMat = mats.glow(0xff2d55, 1.35);
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(adGeo, adMat);
    m.visible = false;
    neuroGroup.add(m);
    adrenalineOrbs.push({ mesh: m, ang: (i / 24) * Math.PI * 2, yOff: ((i % 7) - 3) * 0.55, offset: i / 24 });
  }

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 22;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lAm = getLine('amygdala', 1);
  const lSp = getLine('spine', 2);
  const lAd = getLine('adrenaline', 3);
  const lPu = getLine('pupil', 4);
  const lRe = getLine('redirect', 5);

  EVENTS = [
    { t: lAm.start + 0.12, type: 'break', pitchIndex: 1, intensity: 0.95 },
    { t: lSp.start + 0.15, type: 'bounce', pitchIndex: 6, intensity: 0.85 },
    { t: lAd.start + 0.14, type: 'break', pitchIndex: 2, intensity: 1.0 },
    { t: lPu.start + 0.18, type: 'bounce', pitchIndex: 7, intensity: 0.82 },
    { t: lPu.start + 0.85, type: 'bounce', pitchIndex: 8, intensity: 0.76 },
    { t: lRe.start + 0.20, type: 'bounce', pitchIndex: 9, intensity: 0.88 },
    { t: Math.min(DUR - 0.25, lRe.start + 1.35), type: 'win', pitchIndex: 10, intensity: 0.96 },
  ];

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  const lAm = getLine('amygdala', 1);
  const lSp = getLine('spine', 2);
  const lAd = getLine('adrenaline', 3);
  const lPu = getLine('pupil', 4);
  const lRe = getLine('redirect', 5);

  let activeCaption = SCRIPT[0].caption;
  for (let i = 0; i < SCRIPT.length; i++) {
    const ln = getLine(SCRIPT[i].id, i);
    if (t >= ln.start) activeCaption = ln.caption || SCRIPT[i].caption;
  }

  const pAm = smooth(lAm.start, lAm.start + 0.6, t);
  const pAd = smooth(lAd.start, lAd.start + 0.8, t);
  const pPu = smooth(lPu.start, lPu.start + 0.9, t);
  const pRe = smooth(lRe.start, lRe.start + 0.9, t);

  const bpm = Math.round(lerp(68, 152, pPu));

  // Amygdala threat radar pulse
  amygdalaOrb.scale.setScalar(1 + 0.28 * Math.sin(t * 14) * Math.max(0.3, pAm));
  amygdalaMat.emissiveIntensity = 0.8 + 1.2 * pAm;

  // Spinal lightning rings racing downward
  for (const sp of signalPulses) {
    const u = (t * 1.9 + sp.offset) % 1;
    sp.mesh.position.y = lerp(1.2, -2.4, u);
    sp.mesh.scale.setScalar(0.8 + 0.55 * Math.sin(u * Math.PI));
  }

  // Adrenaline explosion outward from adrenal glands
  for (const a of adrenalineOrbs) {
    a.mesh.visible = pAd > 0.05;
    if (!a.mesh.visible) continue;
    const u = (t * 0.9 + a.offset) % 1;
    const r = lerp(0.4, 2.7, u);
    a.mesh.position.set(Math.cos(a.ang + t) * r, -1.2 + a.yOff + u * 2.2, Math.sin(a.ang + t) * r);
    a.mesh.rotation.set(t * 4, t * 3, 0);
    a.mesh.scale.setScalar(Math.sin(u * Math.PI) * 1.35 * pAd);
  }

  // Dilating 3D Eye Pupil during pupil phase
  const eyeGroup = neuroGroup.userData.eyeGroup;
  eyeGroup.visible = t >= lPu.start && t < lRe.start + 0.6;
  if (eyeGroup.visible) {
    pupilDisc.scale.setScalar(lerp(0.65, 1.55, pPu));
  }

  neuroGroup.rotation.y = Math.sin(t * 0.45) * 0.42;

  const shake = microShake(t, lAm.start + 0.12, 0.2, 0.2) + microShake(t, lAd.start + 0.14, 0.22, 0.22);
  const { camera } = stage;
  camera.position.set(Math.sin(t * 0.35) * 1.4 + shake, 0.1 + shake * 0.5, 9.6);
  camera.lookAt(0, -0.25, 0);

  stage.composite(ctx, W, H);

  drawStudioHud(ctx, {
    W,
    H,
    channel: 'bio',
    badge: `T + ${Math.round(lerp(10, 200, clamp(t / DUR, 0, 1)))} ms · FIGHT-OR-FLIGHT 3D`,
    title: '0.2 SECONDS AFTER FEAR',
    subtitle: 'AMYGDALA → SPINAL CORD → ADRENALINE SURGE',
    caption: activeCaption,
    metrics: [
      { label: 'HEART RATE', value: `${bpm} BPM`, color: bpm > 120 ? '#FF2D55' : '#34C759' },
      { label: 'PUPIL SIZE', value: pPu > 0.3 ? '+140%' : 'NORMAL', color: '#38BDF8' },
      { label: 'MUSCLE FLOW', value: pRe > 0.3 ? 'MAX ↑↑' : 'RISING', color: '#FFD60A' },
    ],
    progress: t / Math.max(1, DUR),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
