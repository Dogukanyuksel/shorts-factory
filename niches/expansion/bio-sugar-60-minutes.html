<!doctype html>
<!--
  Bio Mechanics — What One Can of Soda Does to Your Body in 60 Minutes
  Y-LABS 3D Cinema Engine (Three.js PBR Bioluminescent Bloodstream Tunnel + Glucose/Insulin/Fat, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0D1117;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'One single can of soda packs ten teaspoons of sugar—watch what happens inside your body in sixty minutes.', caption: '39 GRAMS OF SUGAR' },
  { id: 'dissolve', text: 'In the first ten minutes, thirty-nine grams of liquid sugar flood straight into your bloodstream.', caption: '10 MIN · SUGAR FLOOD' },
  { id: 'spike', text: 'By minute twenty, blood glucose rockets upward, triggering a rapid dopamine and energy spike.', caption: '20 MIN · GLUCOSE SPIKE' },
  { id: 'insulin', text: 'Your pancreas fires massive waves of emerald insulin to unlock cells and pull that sugar out.', caption: '30 MIN · INSULIN SURGE' },
  { id: 'liver', text: 'Overwhelmed, your liver converts the excess glucose straight into glowing droplets of stored fat.', caption: '45 MIN · FAT STORAGE' },
  { id: 'crash', text: 'By minute fifty-five, blood sugar plummets below baseline—leaving you tired, foggy, and craving more.', caption: '55 MIN · SUGAR CRASH' },
];

let W = 720, H = 1280, FPS = 60, DUR = 22, LINES = [], EVENTS = [];
let stage = null, built = false;
let vesselRings = [], rbcMeshes = [], glucoseCubes = [], insulinOrbs = [], fatDroplets = [];
let vesselWallMat = null;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

function hash(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'bio',
    fov: 46,
    fogDensity: 0.045,
    addGrid: false,
  });
  const { scene } = stage;
  const mats = createMaterials('bio');

  // Translucent 3D Artery Tunnel Wall along Z axis
  const wallGeo = new THREE.CylinderGeometry(2.65, 2.65, 24, 32, 1, true);
  wallGeo.rotateX(Math.PI / 2);
  vesselWallMat = new THREE.MeshPhysicalMaterial({
    color: 0x9f1239,
    emissive: 0x4c0519,
    emissiveIntensity: 0.55,
    transparent: true,
    opacity: 0.32,
    roughness: 0.28,
    metalness: 0.1,
    side: THREE.BackSide,
    depthWrite: false,
  });
  const wall = new THREE.Mesh(wallGeo, vesselWallMat);
  wall.position.z = -4;
  scene.add(wall);

  // Pulsing arterial rib rings along tunnel
  vesselRings = [];
  const ringGeo = new THREE.TorusGeometry(2.58, 0.055, 10, 40);
  const ringMat = mats.glow(0xff2d55, 0.55, 0.25, 0.2);
  for (let i = 0; i < 16; i++) {
    const r = new THREE.Mesh(ringGeo, ringMat);
    r.position.z = -14 + i * 1.45;
    scene.add(r);
    vesselRings.push(r);
  }

  // 3D Red Blood Cells (flattened crimson discs with rim)
  rbcMeshes = [];
  const rbcGeo = new THREE.TorusGeometry(0.28, 0.13, 12, 22);
  const rbcMat = new THREE.MeshStandardMaterial({
    color: 0xe11d48,
    emissive: 0x881337,
    emissiveIntensity: 0.45,
    roughness: 0.26,
    metalness: 0.18,
  });
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(rbcGeo, rbcMat);
    m.scale.set(1, 1, 0.55);
    scene.add(m);
    rbcMeshes.push({
      mesh: m,
      ang: hash(i * 3.1) * Math.PI * 2,
      rad: 0.45 + hash(i * 5.7) * 1.45,
      zOff: hash(i * 7.3) * 18,
      speed: 2.6 + hash(i * 2.9) * 1.6,
    });
  }

  // 3D Crystalline Glucose Cubes (luminous white-gold octahedrons)
  glucoseCubes = [];
  const gluGeo = new THREE.OctahedronGeometry(0.22, 0);
  const gluMat = mats.glow(0xfef08a, 0.95, 0.12, 0.25);
  for (let i = 0; i < 32; i++) {
    const m = new THREE.Mesh(gluGeo, gluMat);
    scene.add(m);
    glucoseCubes.push({
      mesh: m,
      ang: hash(i * 11.3) * Math.PI * 2,
      rad: 0.2 + hash(i * 13.7) * 1.55,
      zOff: hash(i * 17.1) * 18,
      speed: 3.4 + hash(i * 19.3) * 2.0,
    });
  }

  // 3D Emerald Insulin Keys (glowing green icosahedrons)
  insulinOrbs = [];
  const insGeo = new THREE.IcosahedronGeometry(0.19, 0);
  const insMat = mats.glow(0x34c759, 1.1, 0.18, 0.35);
  for (let i = 0; i < 22; i++) {
    const m = new THREE.Mesh(insGeo, insMat);
    m.visible = false;
    scene.add(m);
    insulinOrbs.push({
      mesh: m,
      ang: hash(i * 23.1) * Math.PI * 2,
      rad: 0.35 + hash(i * 29.7) * 1.6,
      zOff: hash(i * 31.3) * 18,
    });
  }

  // 3D Golden Stored Fat Droplets (amber glossy spheres)
  fatDroplets = [];
  const fatGeo = new THREE.SphereGeometry(0.27, 18, 18);
  const fatMat = new THREE.MeshStandardMaterial({
    color: 0xf59e0b,
    emissive: 0xd97706,
    emissiveIntensity: 0.65,
    roughness: 0.14,
    metalness: 0.35,
  });
  for (let i = 0; i < 18; i++) {
    const m = new THREE.Mesh(fatGeo, fatMat);
    m.visible = false;
    scene.add(m);
    fatDroplets.push({
      mesh: m,
      ang: hash(i * 37.3) * Math.PI * 2,
      rad: 1.45 + hash(i * 41.1) * 0.65,
      zOff: hash(i * 43.7) * 14,
    });
  }

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 22;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lDis = getLine('dissolve', 1);
  const lSpk = getLine('spike', 2);
  const lIns = getLine('insulin', 3);
  const lLiv = getLine('liver', 4);
  const lCrs = getLine('crash', 5);

  EVENTS = [
    { t: lDis.start + 0.14, type: 'bounce', pitchIndex: 2, intensity: 0.60 },
    { t: lSpk.start + 0.12, type: 'break', pitchIndex: 5, intensity: 0.90 },
    { t: lIns.start + 0.15, type: 'bounce', pitchIndex: 7, intensity: 0.80 },
    { t: lLiv.start + 0.14, type: 'bounce', pitchIndex: 6, intensity: 0.74 },
    { t: lCrs.start + 0.12, type: 'break', pitchIndex: 1, intensity: 0.96 },
    { t: Math.min(DUR - 0.25, lCrs.start + 1.4), type: 'win', pitchIndex: 3, intensity: 0.85 },
  ];

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  const lDis = getLine('dissolve', 1);
  const lSpk = getLine('spike', 2);
  const lIns = getLine('insulin', 3);
  const lLiv = getLine('liver', 4);
  const lCrs = getLine('crash', 5);

  let activeCaption = SCRIPT[0].caption;
  for (let i = 0; i < SCRIPT.length; i++) {
    const ln = getLine(SCRIPT[i].id, i);
    if (t >= ln.start) activeCaption = ln.caption || SCRIPT[i].caption;
  }

  const pDis = smooth(lDis.start, lSpk.start, t);
  const pSpk = smooth(lSpk.start, lSpk.start + 1.2, t);
  const pIns = smooth(lIns.start, lIns.start + 1.1, t);
  const pLiv = smooth(lLiv.start, lLiv.start + 1.2, t);
  const pCrs = smooth(lCrs.start, lCrs.start + 1.4, t);

  // Simulated clinical timeline (0 -> 60 min) & Blood Glucose (mg/dL)
  const simMin = Math.round(clamp((t / Math.max(1, DUR)) * 60, 0, 60));
  let glucoseMg = 90;
  if (t < lSpk.start) glucoseMg = lerp(90, 148, pDis);
  else if (t < lIns.start) glucoseMg = lerp(148, 212, pSpk);
  else if (t < lLiv.start) glucoseMg = lerp(212, 165, pIns);
  else if (t < lCrs.start) glucoseMg = lerp(165, 118, pLiv);
  else glucoseMg = lerp(118, 66, pCrs);

  const flowMult = lerp(1.0, 1.85, pSpk) * lerp(1.0, 0.35, pCrs);
  const pulse = 1 + 0.045 * Math.sin(t * (5.5 + 3.5 * pSpk - 3.0 * pCrs));

  // Animate arterial rings
  for (let i = 0; i < vesselRings.length; i++) {
    const r = vesselRings[i];
    const z = ((i * 1.45 + t * 2.4 * flowMult) % 23.2) - 16.5;
    r.position.z = z;
    r.scale.setScalar(pulse);
  }

  // Animate RBCs
  for (const r of rbcMeshes) {
    const z = ((r.zOff + t * r.speed * flowMult) % 20) - 14.5;
    r.mesh.position.set(
      Math.cos(r.ang + t * 0.4) * r.rad,
      Math.sin(r.ang + t * 0.4) * r.rad,
      z,
    );
    r.mesh.rotation.set(t * 1.4 + r.zOff, t * 1.1, r.ang);
  }

  // Animate Glucose crystals (flood in at dissolve/spike, swept away by insulin/crash)
  const gluCount = Math.round(lerp(8, 32, pDis) * lerp(1.0, 0.18, pCrs));
  for (let i = 0; i < glucoseCubes.length; i++) {
    const g = glucoseCubes[i];
    g.mesh.visible = i < gluCount;
    if (!g.mesh.visible) continue;
    const z = ((g.zOff + t * g.speed * flowMult) % 20) - 14.5;
    const sc = lerp(0.85, 1.35, pSpk) * lerp(1.0, 0.55, pLiv);
    g.mesh.position.set(
      Math.cos(g.ang + t * 0.8) * g.rad,
      Math.sin(g.ang + t * 0.8) * g.rad,
      z,
    );
    g.mesh.rotation.set(t * 2.8 + i, t * 2.2, i);
    g.mesh.scale.setScalar(sc);
  }

  // Animate Emerald Insulin Surge
  for (let i = 0; i < insulinOrbs.length; i++) {
    const ins = insulinOrbs[i];
    ins.mesh.visible = pIns > 0.05 && pCrs < 0.85;
    if (!ins.mesh.visible) continue;
    const z = ((ins.zOff + t * 4.2 * flowMult) % 20) - 14.5;
    ins.mesh.position.set(
      Math.cos(ins.ang - t * 1.1) * ins.rad * pIns,
      Math.sin(ins.ang - t * 1.1) * ins.rad * pIns,
      z,
    );
    ins.mesh.rotation.set(t * 3, t * 2, 0);
    ins.mesh.scale.setScalar(pIns * (1 - 0.5 * pCrs));
  }

  // Animate Liver Fat Droplets
  for (let i = 0; i < fatDroplets.length; i++) {
    const f = fatDroplets[i];
    f.mesh.visible = pLiv > 0.05;
    if (!f.mesh.visible) continue;
    const z = ((f.zOff + t * 1.4) % 16) - 11.5;
    f.mesh.position.set(
      Math.cos(f.ang + t * 0.25) * f.rad,
      Math.sin(f.ang + t * 0.25) * f.rad,
      z,
    );
    f.mesh.scale.setScalar(pLiv * (0.9 + 0.15 * Math.sin(t * 4 + i)));
  }

  // Subtle wall tint shift on crash
  vesselWallMat.emissive.setHex(pCrs > 0.4 ? 0x1e1b4b : pSpk > 0.5 ? 0x7f1d1d : 0x4c0519);

  // Dynamic camera flying gently inside the bloodstream
  const { camera } = stage;
  camera.position.set(
    Math.sin(t * 0.65) * 0.55,
    Math.cos(t * 0.52) * 0.42,
    4.6 - 0.5 * Math.sin(t * 0.4),
  );
  camera.lookAt(Math.sin(t * 0.4) * 0.25, Math.cos(t * 0.35) * 0.2, -5.0);

  stage.composite(ctx, W, H);

  const stateCol = pCrs > 0.4 ? '#FF2D55' : pLiv > 0.4 ? '#F59E0B' : pIns > 0.4 ? '#34C759' : '#FFD60A';
  drawStudioHud(ctx, {
    W,
    H,
    channel: 'bio',
    badge: `T + ${simMin} MIN · INSIDE BLOODSTREAM 3D`,
    title: '1 CAN OF SODA (39g SUGAR)',
    subtitle: pCrs > 0.4 ? 'HYPOGLYCEMIC CRASH · CRAVING MORE' : pIns > 0.4 ? 'PANCREAS INSULIN SURGE ACTIVE' : 'LIVE GLUCOSE & INSULIN TELEMETRY',
    caption: activeCaption,
    metrics: [
      { label: 'BLOOD GLUCOSE', value: `${Math.round(glucoseMg)} mg/dL`, color: stateCol },
      { label: 'INSULIN', value: pIns > 0.3 ? (pCrs > 0.5 ? 'DROPPING' : 'SURGE ↑') : 'BASELINE', color: '#34C759' },
      { label: 'ENERGY', value: pCrs > 0.4 ? 'CRASH ↓' : pSpk > 0.4 ? 'SPIKE ↑↑' : 'RISING', color: pCrs > 0.4 ? '#FF2D55' : '#00F0FF' },
    ],
    progress: t / Math.max(1, DUR),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
