<!doctype html>
<!--
  Wealth Mechanics — The 50/30/20 Money Split That Builds Wealth on Any Salary
  Y-LABS 3D Cinema Engine (Three.js PBR Split Glass Vaults + 20-Year Compound Gold Towers, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#090D16;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  easeOutCubic,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'Most people earn five thousand dollars a month and still end the year broke. Here is the split that changes everything.', caption: 'THE 50/30/20 SPLIT' },
  { id: 'needs', text: 'First, fifty percent — twenty-five hundred dollars — flows straight into Needs: rent, groceries, and essential bills.', caption: '50% NEEDS · $2,500' },
  { id: 'wants', text: 'Next, thirty percent — fifteen hundred dollars — funds your Wants, so you actually enjoy life guilt-free.', caption: '30% WANTS · $1,500' },
  { id: 'future', text: 'The secret is the final twenty percent: one thousand dollars automatically locked into compounding investments every month.', caption: '20% FUTURE · $1,000' },
  { id: 'compound', text: 'Now fast-forward twenty years. Even if your salary never rises once, that twenty percent tank compounds at ten percent a year.', caption: 'YEARS 1 → 20 AT 10%' },
  { id: 'verdict', text: 'Two hundred forty thousand put in explodes to seven hundred fifty-nine thousand dollars. Systems beat willpower every time.', caption: '$759K ON FLAT PAY' },
];

const MONTHLY_RATE = 0.10 / 12;
function fvFuture(years) {
  if (years <= 0) return 0;
  const n = years * 12;
  return 1000 * (Math.pow(1 + MONTHLY_RATE, n) - 1) / MONTHLY_RATE;
}
const MAX_FV_20 = fvFuture(20); // $759,368.84

let W = 720, H = 1280, FPS = 60, DUR = 23, LINES = [], EVENTS = [];
let stage = null, built = false;
let splitGroup, compoundGroup;
let vaultObjs = [], pipeOrbs = [], towerBars = [], futureRing = null;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'wealth',
    fov: 38,
    fogDensity: 0.026,
    floorY: -2.1,
  });
  const { scene } = stage;
  const mats = createMaterials('wealth');

  // === GROUP A: 3D 50/30/20 SPLIT GLASS VAULTS ===
  splitGroup = new THREE.Group();
  scene.add(splitGroup);

  // Top Salary Manifold ($5,000/mo)
  const hubGeo = new THREE.CylinderGeometry(0.95, 1.05, 0.42, 36);
  const hub = new THREE.Mesh(hubGeo, mats.gold);
  hub.position.set(0, 2.05, 0);
  splitGroup.add(hub);
  splitGroup.add(addXrayEdges(hubGeo, 0xffd60a, 0.55));

  const VAULTS = [
    { x: -1.85, pct: 0.50, h: 2.8, hex: 0x38bdf8, css: '#38BDF8', lbl: '50% NEEDS' },
    { x: 0.0, pct: 0.30, h: 2.1, hex: 0xa78bfa, css: '#A78BFA', lbl: '30% WANTS' },
    { x: 1.85, pct: 0.20, h: 1.75, hex: 0x30d158, css: '#30D158', lbl: '20% FUTURE' },
  ];

  vaultObjs = [];
  pipeOrbs = [];
  for (let i = 0; i < VAULTS.length; i++) {
    const v = VAULTS[i];
    const g = new THREE.Group();
    g.position.set(v.x, -1.9, 0);

    const r = 0.62;
    // Glass cylinder casing
    const wallGeo = new THREE.CylinderGeometry(r, r, v.h, 28, 1, true);
    const wall = new THREE.Mesh(wallGeo, mats.xrayGlass);
    wall.position.y = v.h * 0.5;
    g.add(wall);
    const edge = addXrayEdges(new THREE.CylinderGeometry(r + 0.01, r + 0.01, v.h, 16, 1, true), v.hex, 0.48);
    edge.position.y = v.h * 0.5;
    g.add(edge);

    // Metallic collars
    const colGeo = new THREE.TorusGeometry(r, 0.045, 12, 32);
    const botC = new THREE.Mesh(colGeo, mats.steel);
    botC.rotation.x = Math.PI / 2;
    g.add(botC);
    const topC = new THREE.Mesh(colGeo, mats.glow(v.hex, 0.55, 0.2, 0.6));
    topC.rotation.x = Math.PI / 2;
    topC.position.y = v.h;
    g.add(topC);

    // Liquid energy core
    const liqMat = new THREE.MeshStandardMaterial({
      color: v.hex,
      emissive: v.hex,
      emissiveIntensity: 0.45,
      metalness: 0.52,
      roughness: 0.18,
    });
    const liq = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.85, r * 0.85, 1.0, 24), liqMat);
    liq.scale.set(1, 0.01, 1);
    g.add(liq);

    // Curved conduit pipe from top salary manifold to vault top
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(0, 1.85, 0),
      new THREE.Vector3(v.x * 0.65, 1.35, 0.15),
      new THREE.Vector3(v.x, -1.9 + v.h + 0.05, 0),
    );
    const tubeGeo = new THREE.TubeGeometry(curve, 24, 0.055, 10, false);
    const tube = new THREE.Mesh(tubeGeo, mats.translucent(v.hex, 0.34));
    splitGroup.add(tube);

    // Animated energy orbs flowing down each pipe
    for (let k = 0; k < 4; k++) {
      const orb = new THREE.Mesh(new THREE.SphereGeometry(0.095, 14, 14), mats.glow(v.hex, 1.0));
      splitGroup.add(orb);
      pipeOrbs.push({ orb, curve, vaultIdx: i, offset: k / 4 });
    }

    splitGroup.add(g);
    vaultObjs.push({ ...v, group: g, liq, liqMat });
  }

  // Spinning golden compound ring around 20% Future vault
  futureRing = new THREE.Mesh(new THREE.TorusGeometry(0.88, 0.04, 12, 48), mats.gold);
  futureRing.position.set(1.85, -1.0, 0);
  splitGroup.add(futureRing);

  // === GROUP B: 20-YEAR 3D COMPOUND WEALTH TOWERS ($240K IN -> $759K OUT) ===
  compoundGroup = new THREE.Group();
  compoundGroup.visible = false;
  scene.add(compoundGroup);

  towerBars = [];
  const barCount = 10; // Years 2,4,6,...,20
  for (let i = 0; i < barCount; i++) {
    const yr = (i + 1) * 2;
    const x = lerp(-2.65, 2.65, i / (barCount - 1));
    const contribH = (yr * 12000 / MAX_FV_20) * 4.4;
    const totalH = (fvFuture(yr) / MAX_FV_20) * 4.4;

    // Principal (base steel/emerald)
    const pMat = mats.glow(0x30d158, 0.35, 0.25, 0.6);
    const pBar = new THREE.Mesh(new THREE.BoxGeometry(0.40, 1.0, 0.44), pMat);
    pBar.position.set(x, -1.9, 0);
    compoundGroup.add(pBar);

    // Compound Gain (glowing gold top section)
    const gMat = mats.gold.clone();
    gMat.emissive = new THREE.Color(0xffd60a);
    gMat.emissiveIntensity = 0.35;
    const gBar = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.0, 0.46), gMat);
    gBar.position.set(x, -1.9, 0);
    compoundGroup.add(gBar);

    towerBars.push({ yr, x, contribH, totalH, pBar, gBar });
  }

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 23;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lNeeds = getLine('needs', 1);
  const lWants = getLine('wants', 2);
  const lFuture = getLine('future', 3);
  const lComp = getLine('compound', 4);
  const lVerd = getLine('verdict', 5);

  EVENTS = [
    { t: lNeeds.start + 0.15, type: 'bounce', pitchIndex: 3, intensity: 0.55 },
    { t: lWants.start + 0.15, type: 'bounce', pitchIndex: 5, intensity: 0.62 },
    { t: lFuture.start + 0.18, type: 'break', pitchIndex: 8, intensity: 0.80 },
    { t: lComp.start + 0.20, type: 'bounce', pitchIndex: 10, intensity: 0.85 },
    { t: lVerd.start + 0.18, type: 'win', pitchIndex: 12, intensity: 0.96 },
  ];

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  const lNeeds = getLine('needs', 1);
  const lWants = getLine('wants', 2);
  const lFuture = getLine('future', 3);
  const lComp = getLine('compound', 4);
  const lVerd = getLine('verdict', 5);

  let activeCaption = SCRIPT[0].caption;
  for (let i = 0; i < SCRIPT.length; i++) {
    const ln = getLine(SCRIPT[i].id, i);
    if (t >= ln.start) activeCaption = ln.caption || SCRIPT[i].caption;
  }

  const inCompound = t >= lComp.start;
  splitGroup.visible = !inCompound;
  compoundGroup.visible = inCompound;

  const { camera } = stage;

  let simYear = 0;
  let futureVal = 1000;
  if (!inCompound) {
    const f0 = smooth(lNeeds.start - 0.15, lNeeds.start + 1.1, t);
    const f1 = smooth(lWants.start - 0.15, lWants.start + 1.1, t);
    const f2 = smooth(lFuture.start - 0.15, lFuture.start + 1.1, t);
    const fills = [Math.max(0.22, f0), Math.max(0.18, f1), Math.max(0.18, f2)];
    const activeIdx = t >= lFuture.start ? 2 : t >= lWants.start ? 1 : 0;

    for (let i = 0; i < vaultObjs.length; i++) {
      const vo = vaultObjs[i];
      const fh = Math.max(0.05, fills[i] * (vo.h - 0.12));
      vo.liq.scale.set(1, fh, 1);
      vo.liq.position.y = fh * 0.5 + 0.04;
      vo.liqMat.emissiveIntensity = i === activeIdx ? 0.85 : 0.25;
    }

    for (const po of pipeOrbs) {
      const u = (t * 0.95 + po.offset) % 1;
      const p = po.curve.getPoint(u);
      po.orb.position.copy(p);
      po.orb.scale.setScalar(po.vaultIdx === activeIdx ? 1.25 : 0.7);
    }

    futureRing.rotation.set(t * 1.4, t * 2.1, 0);
    futureRing.scale.setScalar(t >= lFuture.start ? 1.15 + 0.08 * Math.sin(t * 7) : 0.85);

    const pFocus = smooth(lFuture.start, lFuture.start + 0.9, t);
    camera.position.set(
      lerp(Math.sin(t * 0.45) * 1.3, 2.2 + Math.sin(t * 0.8) * 0.4, pFocus),
      lerp(1.4, 0.8, pFocus),
      lerp(9.1, 6.8, pFocus),
    );
    camera.lookAt(lerp(0, 1.3, pFocus), -0.1, 0);
  } else {
    const pYr = easeOutCubic(clamp((t - lComp.start) / Math.max(0.1, lVerd.start - lComp.start), 0, 1));
    simYear = lerp(1, 20, pYr);
    futureVal = fvFuture(simYear);

    for (const tb of towerBars) {
      const prog = clamp((simYear - (tb.yr - 2)) / 2, 0, 1);
      const pH = Math.max(0.02, tb.contribH * prog);
      const gH = Math.max(0.02, Math.max(0, tb.totalH - tb.contribH) * prog);
      tb.pBar.scale.set(1, pH, 1);
      tb.pBar.position.y = -1.95 + pH * 0.5;
      tb.pBar.visible = prog > 0.01;

      tb.gBar.scale.set(1, gH, 1);
      tb.gBar.position.y = -1.95 + pH + gH * 0.5;
      tb.gBar.visible = prog > 0.01 && gH > 0.03;
    }

    const orbAngle = lerp(-0.28, 0.32, (t - lComp.start) / Math.max(1, DUR - lComp.start));
    camera.position.set(Math.sin(orbAngle) * 10.8, 1.85 + 0.25 * Math.sin(t * 0.7), Math.cos(orbAngle) * 10.8);
    camera.lookAt(0, 0.2, 0);
  }

  stage.composite(ctx, W, H);

  drawStudioHud(ctx, {
    W,
    H,
    channel: 'wealth',
    badge: inCompound ? '20-YEAR COMPOUND ENGINE · 10% APR' : '50 / 30 / 20 PAYCHECK ARCHITECTURE',
    title: inCompound ? '$759K FROM $1K/MO' : 'THE 50/30/20 SPLIT',
    subtitle: inCompound ? '$240K PUT IN → $519K FREE COMPOUND GAIN' : '$5,000/MO AUTOMATICALLY ROUTED',
    caption: activeCaption,
    metrics: inCompound
      ? [
          { label: 'YEAR', value: `${Math.round(simYear)} / 20`, color: '#FFD60A' },
          { label: 'PUT IN', value: '$' + Math.round(simYear * 12) + 'K', color: '#38BDF8' },
          { label: 'TOTAL WEALTH', value: '$' + Math.round(futureVal / 1000) + 'K', color: '#30D158' },
        ]
      : [
          { label: '50% NEEDS', value: '$2,500', color: '#38BDF8' },
          { label: '30% WANTS', value: '$1,500', color: '#A78BFA' },
          { label: '20% FUTURE', value: '$1,000', color: '#30D158' },
        ],
    progress: t / Math.max(1, DUR),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
