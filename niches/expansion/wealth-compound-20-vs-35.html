<!doctype html>
<!--
  Wealth Mechanics — Age 20 ($100/mo) vs Age 35 ($500/mo) Compound Interest Race (60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#030a08;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, t) => { const x = clamp((t - a) / Math.max(1e-5, b - a), 0, 1); return x * x * (3 - 2 * x); };
const easeOutCubic = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);

const SCRIPT = [
  { id: 'hook', text: 'Can investing one hundred dollars a month actually beat five hundred dollars a month?', caption: '$100/MO VS $500/MO' },
  { id: 'headstart', text: 'Green starts at age twenty with just one hundred bucks a month. For fifteen years, it quietly builds momentum.', caption: '15-YEAR HEAD START' },
  { id: 'latejoin', text: 'At age thirty-five, Gold enters the race — throwing in five times more cash every single month.', caption: '5× MORE EVERY MONTH' },
  { id: 'inflection', text: 'Watch age fifty to sixty-five. Gold sprints hard, but Green\'s exponential curve goes completely vertical!', caption: 'EXPONENTIAL TAKEOFF' },
  { id: 'breakdown', text: 'At sixty-five, Age Twenty finishes with two point one five million — crushing Age Thirty-Five by nearly four hundred thousand!', caption: '$2.15M VS $1.75M' },
  { id: 'law', text: 'Age Thirty-Five paid over three times more out of pocket and still lost. In compounding, time beats money every time.', caption: 'TIME BEATS MONEY' },
];

let W = 720, H = 1280, FPS = 60, DUR = 24, LINES = [], EVENTS = [];

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

window.init = (cfg) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 24;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lHead = getLine('headstart', 1);
  const lLate = getLine('latejoin', 2);
  const lInfl = getLine('inflection', 3);
  const lBrk = getLine('breakdown', 4);
  const lLaw = getLine('law', 5);

  EVENTS = [
    { t: lHead.start + 0.2, type: 'bounce', pitchIndex: 4, intensity: 0.6 },
    { t: lLate.start + 0.15, type: 'bounce', pitchIndex: 6, intensity: 0.72 },
    { t: lInfl.start + 0.2, type: 'break', pitchIndex: 9, intensity: 0.85 },
    { t: lBrk.start + 0.18, type: 'win', pitchIndex: 11, intensity: 0.95 },
    { t: lLaw.start + 0.22, type: 'win', pitchIndex: 12, intensity: 0.9 },
  ];
};

// Exact monthly compounding at 12% annual (1% per month)
const MONTHLY_RATE = 0.01;
function fvMonthly(monthlyPmt, years) {
  if (years <= 0) return 0;
  const n = years * 12;
  return monthlyPmt * (Math.pow(1 + MONTHLY_RATE, n) - 1) / MONTHLY_RATE;
}

const MAX_VAL_A = fvMonthly(100, 45); // $2,145,233 at Age 65
const MAX_VAL_B = fvMonthly(500, 30); // $1,747,482 at Age 65
const MAX_CHART_Y = 2300000;

function fmtMoney(v) {
  const n = Math.max(0, Math.round(v));
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(2) + 'M';
  if (n >= 100000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + n.toLocaleString('en-US');
}

function fmtExact(v) {
  return '$' + Math.max(0, Math.round(v)).toLocaleString('en-US');
}

function fitFont(text, basePx, maxW, weight = '800', family = '-apple-system, BlinkMacSystemFont, sans-serif') {
  let px = Math.round(basePx);
  ctx.font = `${weight} ${px}px ${family}`;
  const m = ctx.measureText(text).width || 1;
  if (m > maxW) px = Math.max(10, Math.floor(px * (maxW / m)));
  ctx.font = `${weight} ${px}px ${family}`;
  return px;
}

// Map time t deterministically to current simulated Age (20 -> 65)
function computeAge(t) {
  const lHook = getLine('hook', 0);
  const lHead = getLine('headstart', 1);
  const lLate = getLine('latejoin', 2);
  const lInfl = getLine('inflection', 3);
  const lBrk = getLine('breakdown', 4);

  if (t < lHead.start) {
    // Teaser preview pulse from 20 -> 24
    return lerp(20, 23, smooth(lHook.start, lHead.start, t));
  }
  if (t < lLate.start) {
    // 15-year head start: Age 23 -> 35
    return lerp(23, 35, smooth(lHead.start, lLate.start, t));
  }
  if (t < lInfl.start) {
    // Gold joins at 35, both climb to Age 50
    return lerp(35, 50, smooth(lLate.start, lInfl.start, t));
  }
  if (t < lBrk.start) {
    // Exponential takeoff: Age 50 -> 65
    return lerp(50, 65, smooth(lInfl.start, lBrk.start, t));
  }
  return 65;
}

function drawFrame(t) {
  const S = W / 720;
  // Safe zone: x in [W*0.07, W*0.86], y in [H*0.14, H*0.74]
  const safeL = W * 0.07;
  const safeR = W * 0.86;
  const safeW = safeR - safeL;
  const cx = (safeL + safeR) * 0.5;

  // Deep obsidian #030a08 background
  ctx.fillStyle = '#030a08';
  ctx.fillRect(0, 0, W, H);

  // Subtle emerald & gold ambient aura
  const bgG = ctx.createRadialGradient(cx, H * 0.36, 20 * S, cx, H * 0.42, W * 0.65);
  bgG.addColorStop(0, 'rgba(16, 185, 129, 0.11)');
  bgG.addColorStop(0.55, 'rgba(250, 204, 21, 0.035)');
  bgG.addColorStop(1, 'rgba(3, 10, 8, 0)');
  ctx.fillStyle = bgG;
  ctx.fillRect(0, 0, W, H);

  // Crisp subtle emerald grid
  ctx.strokeStyle = 'rgba(16, 185, 129, 0.045)';
  ctx.lineWidth = 1 * S;
  for (let x = 0; x < W; x += 42 * S) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 42 * S) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  const lLate = getLine('latejoin', 2);
  const lInfl = getLine('inflection', 3);
  const lBrk = getLine('breakdown', 4);
  const lLaw = getLine('law', 5);

  const curAge = computeAge(t);
  const valA = fvMonthly(100, Math.max(0, curAge - 20));
  const valB = fvMonthly(500, Math.max(0, curAge - 35));
  const contribA = Math.max(0, curAge - 20) * 12 * 100;
  const contribB = Math.max(0, curAge - 35) * 12 * 500;

  const goldActive = smooth(lLate.start - 0.1, lLate.start + 0.35, t);
  const finaleReveal = smooth(lBrk.start, lBrk.start + 0.45, t);
  const lawFocus = smooth(lLaw.start, lLaw.start + 0.4, t);

  // === 1. HEADER TITLE (y: H*0.145 .. H*0.185) ===
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  fitFont('AGE 20 vs AGE 35 RACE', 30 * S, safeW, '900');
  ctx.fillStyle = '#ecfdf5';
  ctx.fillText('AGE 20 vs AGE 35 RACE', cx, H * 0.156);

  fitFont('12% AVG COMPOUND RETURN · AGE 20 → 65', 14 * S, safeW, '700', 'ui-monospace, monospace');
  ctx.fillStyle = '#6ee7b7';
  ctx.fillText('12% AVG COMPOUND RETURN · AGE 20 → 65', cx, H * 0.180);
  ctx.restore();

  // === 2. LIVE SCOREBOARD CARDS (y: H*0.198 .. H*0.285) ===
  const cardGap = 12 * S;
  const cardW = (safeW - cardGap) * 0.5;
  const cardH = H * 0.086;
  const cardY = H * 0.198;

  // Card A: Age 20 ($100/mo) — Emerald
  const cardAX = safeL;
  ctx.save();
  ctx.fillStyle = 'rgba(6, 78, 59, 0.34)';
  ctx.strokeStyle = finaleReveal > 0.2 ? '#34d399' : 'rgba(16, 185, 129, 0.55)';
  ctx.lineWidth = (1.8 + finaleReveal * 1.4) * S;
  ctx.shadowColor = '#10b981';
  ctx.shadowBlur = (10 + finaleReveal * 14) * S;
  ctx.beginPath();
  ctx.roundRect(cardAX, cardY, cardW, cardH, 14 * S);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  fitFont('AGE 20 · $100/MO', 14 * S, cardW - 22 * S, '800', 'ui-monospace, monospace');
  ctx.fillStyle = '#34d399';
  ctx.fillText('AGE 20 · $100/MO', cardAX + 12 * S, cardY + 10 * S);

  fitFont(fmtExact(valA), 27 * S, cardW - 22 * S, '900', 'ui-monospace, monospace');
  ctx.fillStyle = '#ecfdf5';
  ctx.fillText(fmtExact(valA), cardAX + 12 * S, cardY + 31 * S);

  fitFont(`PUT IN: ${fmtMoney(contribA)}`, 13 * S, cardW - 22 * S, '700', 'ui-monospace, monospace');
  ctx.fillStyle = '#6ee7b7';
  ctx.fillText(`PUT IN: ${fmtMoney(contribA)}`, cardAX + 12 * S, cardY + cardH - 22 * S);
  ctx.restore();

  // Card B: Age 35 ($500/mo) — Gold
  const cardBX = safeL + cardW + cardGap;
  ctx.save();
  ctx.globalAlpha = lerp(0.45, 1.0, goldActive);
  ctx.fillStyle = 'rgba(66, 32, 6, 0.34)';
  ctx.strokeStyle = goldActive > 0.5 ? 'rgba(250, 204, 21, 0.65)' : 'rgba(250, 204, 21, 0.28)';
  ctx.lineWidth = 1.8 * S;
  ctx.shadowColor = '#facc15';
  ctx.shadowBlur = 10 * goldActive * S;
  ctx.beginPath();
  ctx.roundRect(cardBX, cardY, cardW, cardH, 14 * S);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  fitFont('AGE 35 · $500/MO', 14 * S, cardW - 22 * S, '800', 'ui-monospace, monospace');
  ctx.fillStyle = '#facc15';
  ctx.fillText('AGE 35 · $500/MO', cardBX + 12 * S, cardY + 10 * S);

  const bDisplay = curAge < 35 ? 'WAITING...' : fmtExact(valB);
  fitFont(bDisplay, 27 * S, cardW - 22 * S, '900', 'ui-monospace, monospace');
  ctx.fillStyle = curAge < 35 ? '#a16207' : '#fefce8';
  ctx.fillText(bDisplay, cardBX + 12 * S, cardY + 31 * S);

  fitFont(`PUT IN: ${fmtMoney(contribB)}`, 13 * S, cardW - 22 * S, '700', 'ui-monospace, monospace');
  ctx.fillStyle = '#fde047';
  ctx.fillText(`PUT IN: ${fmtMoney(contribB)}`, cardBX + 12 * S, cardY + cardH - 22 * S);
  ctx.restore();

  // === 3. TWIN EXPONENTIAL CURVES CHART (y: H*0.304 .. H*0.565) ===
  const chartL = safeL + 50 * S;
  const chartR = safeR - 8 * S;
  const chartTop = H * 0.312;
  const chartBot = H * 0.542;
  const chartW = chartR - chartL;
  const chartH = chartBot - chartTop;

  const ageToX = (age) => chartL + ((age - 20) / 45) * chartW;
  const valToY = (v) => chartBot - clamp(v / MAX_CHART_Y, 0, 1) * chartH;

  // Chart backdrop card
  ctx.save();
  ctx.fillStyle = 'rgba(5, 20, 16, 0.72)';
  ctx.strokeStyle = 'rgba(16, 185, 129, 0.2)';
  ctx.lineWidth = 1.4 * S;
  ctx.beginPath();
  ctx.roundRect(safeL, H * 0.298, safeW, H * 0.270, 16 * S);
  ctx.fill();
  ctx.stroke();

  // Horizontal Y-axis gridlines
  const yTicks = [0, 500000, 1000000, 1500000, 2000000];
  ctx.font = `700 ${Math.round(12 * S)}px ui-monospace, monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (const yt of yTicks) {
    const gy = valToY(yt);
    ctx.strokeStyle = yt === 0 ? 'rgba(148, 163, 184, 0.35)' : 'rgba(148, 163, 184, 0.12)';
    ctx.lineWidth = yt === 0 ? 1.8 * S : 1 * S;
    ctx.setLineDash(yt === 0 ? [] : [5 * S, 5 * S]);
    ctx.beginPath(); ctx.moveTo(chartL, gy); ctx.lineTo(chartR, gy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#64748b';
    const lbl = yt === 0 ? '$0' : (yt >= 1000000 ? `$${(yt / 1000000).toFixed(yt % 1000000 ? 1 : 0)}M` : `$${yt / 1000}K`);
    ctx.fillText(lbl, chartL - 7 * S, gy);
  }

  // Vertical Age 35 entry marker
  const x35 = ageToX(35);
  ctx.strokeStyle = `rgba(250, 204, 21, ${(0.22 + goldActive * 0.28).toFixed(3)})`;
  ctx.lineWidth = 1.5 * S;
  ctx.setLineDash([5 * S, 5 * S]);
  ctx.beginPath(); ctx.moveTo(x35, chartTop); ctx.lineTo(x35, chartBot); ctx.stroke();
  ctx.setLineDash([]);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = `800 ${Math.round(11 * S)}px ui-monospace, monospace`;
  ctx.fillStyle = 'rgba(250, 204, 21, 0.85)';
  ctx.fillText('AGE 35 JOINS', x35, chartTop + 4 * S);

  // X-axis age labels
  const ageTicks = [20, 30, 35, 45, 55, 65];
  ctx.font = `700 ${Math.round(12 * S)}px ui-monospace, monospace`;
  ctx.textBaseline = 'top';
  for (const at of ageTicks) {
    const ax = ageToX(at);
    ctx.fillStyle = at === 35 ? '#facc15' : '#94a3b8';
    ctx.fillText(`${at}`, ax, chartBot + 7 * S);
  }

  // Helper to draw filled + glowing curve
  function drawCurve(startAge, monthlyPmt, strokeCol, glowCol, fillTop, fillBot) {
    if (curAge <= startAge + 0.05) return;
    const steps = 90;
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const a = lerp(startAge, curAge, i / steps);
      const v = fvMonthly(monthlyPmt, a - startAge);
      pts.push({ x: ageToX(a), y: valToY(v) });
    }
    // Area fill
    const ag = ctx.createLinearGradient(0, chartTop, 0, chartBot);
    ag.addColorStop(0, fillTop);
    ag.addColorStop(1, fillBot);
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, chartBot);
    for (const p of pts) ctx.lineTo(p.x, p.y);
    ctx.lineTo(pts[pts.length - 1].x, chartBot);
    ctx.closePath();
    ctx.fill();

    // Glowing line
    ctx.save();
    ctx.strokeStyle = strokeCol;
    ctx.shadowColor = glowCol;
    ctx.shadowBlur = 14 * S;
    ctx.lineWidth = 3.8 * S;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i].x, pts[i].y);
      else ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.stroke();

    // Leading glowing orb
    const last = pts[pts.length - 1];
    const pulse = 1 + 0.16 * Math.sin(t * 7);
    ctx.fillStyle = glowCol;
    ctx.globalAlpha = 0.28;
    ctx.beginPath(); ctx.arc(last.x, last.y, 12 * pulse * S, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(last.x, last.y, 5.2 * S, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 2.5 * S;
    ctx.stroke();
    ctx.restore();
  }

  // Draw Gold first, then Emerald on top so winner pops
  drawCurve(35, 500, '#facc15', '#eab308', 'rgba(250, 204, 21, 0.20)', 'rgba(250, 204, 21, 0.0)');
  drawCurve(20, 100, '#10b981', '#10b981', 'rgba(16, 185, 129, 0.28)', 'rgba(16, 185, 129, 0.0)');

  // Live Age Pill inside chart top-left
  const pillW = 104 * S, pillH = 26 * S;
  ctx.fillStyle = 'rgba(16, 185, 129, 0.16)';
  ctx.strokeStyle = 'rgba(52, 211, 153, 0.5)';
  ctx.lineWidth = 1.4 * S;
  ctx.beginPath();
  ctx.roundRect(chartL + 8 * S, chartTop + 2 * S, pillW, pillH, 13 * S);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#ecfdf5';
  ctx.font = `900 ${Math.round(14 * S)}px ui-monospace, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`AGE ${Math.floor(curAge)}`, chartL + 8 * S + pillW * 0.5, chartTop + 2 * S + pillH * 0.5);

  // Finale +$398K Lead Callout Badge
  if (finaleReveal > 0.02) {
    const yA = valToY(MAX_VAL_A);
    const yB = valToY(MAX_VAL_B);
    const xEnd = ageToX(65);
    ctx.save();
    ctx.globalAlpha = finaleReveal;
    ctx.strokeStyle = '#34d399';
    ctx.lineWidth = 2.4 * S;
    ctx.beginPath();
    ctx.moveTo(xEnd - 12 * S, yA);
    ctx.lineTo(xEnd - 22 * S, yA);
    ctx.lineTo(xEnd - 22 * S, yB);
    ctx.lineTo(xEnd - 12 * S, yB);
    ctx.stroke();

    const badgeW = 158 * S, badgeH = 30 * S;
    const badgeX = xEnd - 28 * S - badgeW;
    const badgeY = (yA + yB) * 0.5 - badgeH * 0.5;
    ctx.fillStyle = '#065f46';
    ctx.strokeStyle = '#34d399';
    ctx.lineWidth = 2 * S;
    ctx.shadowColor = '#10b981';
    ctx.shadowBlur = 14 * S;
    ctx.beginPath();
    ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 10 * S);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ecfdf5';
    ctx.font = `900 ${Math.round(14 * S)}px ui-monospace, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+$398K WINNER!', badgeX + badgeW * 0.5, badgeY + badgeH * 0.5);
    ctx.restore();
  }
  ctx.restore();

  // === 4. BOTTOM PANEL: TOTAL CONTRIBUTED vs TOTAL WEALTH BARS (y: H*0.584 .. H*0.736) ===
  const panelY = H * 0.584;
  const panelH = H * 0.150; // ends at H*0.734 <= H*0.74
  ctx.save();
  ctx.fillStyle = 'rgba(5, 20, 16, 0.80)';
  ctx.strokeStyle = lawFocus > 0.2 ? 'rgba(52, 211, 153, 0.65)' : 'rgba(16, 185, 129, 0.24)';
  ctx.lineWidth = (1.6 + lawFocus * 1.2) * S;
  ctx.beginPath();
  ctx.roundRect(safeL, panelY, safeW, panelH, 16 * S);
  ctx.fill();
  ctx.stroke();

  // Section header
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  fitFont('OUT OF POCKET vs TOTAL WEALTH', 13 * S, safeW - 28 * S, '800', 'ui-monospace, monospace');
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('OUT OF POCKET vs TOTAL WEALTH', safeL + 16 * S, panelY + 20 * S);

  // Legend top-right
  ctx.textAlign = 'right';
  ctx.font = `700 ${Math.round(11 * S)}px ui-monospace, monospace`;
  ctx.fillStyle = '#cbd5e1';
  ctx.fillText('■ PAID IN   ■ TOTAL WEALTH', safeR - 14 * S, panelY + 20 * S);

  const barLeft = safeL + 16 * S;
  const barMaxW = safeW - 32 * S;
  const maxRef = MAX_VAL_A; // scale bars relative to $2.15M

  function drawComparisonRow(rowY, label, paid, total, colorMain, colorGlow, multText) {
    const rowBarH = 22 * S;
    const totalW = Math.max(10 * S, clamp(total / maxRef, 0, 1) * barMaxW);
    const paidW = Math.max(6 * S, clamp(paid / maxRef, 0, 1) * barMaxW);

    // Label row above bar
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.font = `800 ${Math.round(14 * S)}px -apple-system, sans-serif`;
    ctx.fillStyle = colorMain;
    ctx.fillText(label, barLeft, rowY - 4 * S);

    ctx.textAlign = 'right';
    ctx.font = `800 ${Math.round(13 * S)}px ui-monospace, monospace`;
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(`IN ${fmtMoney(paid)}  →  ${fmtMoney(total)} (${multText})`, barLeft + barMaxW, rowY - 4 * S);

    // Track background
    ctx.fillStyle = 'rgba(148, 163, 184, 0.10)';
    ctx.beginPath();
    ctx.roundRect(barLeft, rowY, barMaxW, rowBarH, 7 * S);
    ctx.fill();

    // Total wealth glowing bar
    ctx.save();
    ctx.fillStyle = colorMain;
    ctx.shadowColor = colorGlow;
    ctx.shadowBlur = 10 * S;
    ctx.beginPath();
    ctx.roundRect(barLeft, rowY, totalW, rowBarH, 7 * S);
    ctx.fill();
    ctx.restore();

    // Contributed (Paid In) overlay segment on the left
    ctx.fillStyle = 'rgba(248, 250, 252, 0.82)';
    ctx.beginPath();
    ctx.roundRect(barLeft, rowY, Math.min(paidW, totalW), rowBarH, [7 * S, 3 * S, 3 * S, 7 * S]);
    ctx.fill();
  }

  const multA = contribA > 100 ? (valA / contribA).toFixed(1) + '×' : '1.0×';
  const multB = contribB > 100 ? (valB / contribB).toFixed(1) + '×' : '0.0×';

  drawComparisonRow(panelY + 60 * S, 'AGE 20 ($100/mo)', contribA, valA, '#10b981', '#10b981', multA);
  drawComparisonRow(panelY + 122 * S, 'AGE 35 ($500/mo)', contribB, valB, '#facc15', '#eab308', multB);

  ctx.restore();
}

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    drawFrame((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};
window.ready = true;
</script>
