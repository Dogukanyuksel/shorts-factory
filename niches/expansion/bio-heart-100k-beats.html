<!doctype html>
<!--
  Bio Mechanics — How Your Heart Pumps 100,000 Times a Day Without Resting
  60fps, deterministic, audio-synced HTML5 Canvas medical cutaway
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#050712;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, t) => { const x = clamp((t - a) / Math.max(1e-5, b - a), 0, 1); return x * x * (3 - 2 * x); };
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const SCRIPT = [
  { id: 'hook', text: 'Your heart beats one hundred thousand times a day without ever taking a single break.', caption: '100,000 BEATS/DAY' },
  { id: 'return', text: 'Blue, oxygen-poor blood pours into the right side and gets pumped straight to your lungs.', caption: '1. DEOXYGENATED IN' },
  { id: 'oxygen', text: 'Freshly oxygenated crimson blood rushes back into the left atrium and drops through the mitral valve.', caption: '2. MITRAL VALVE' },
  { id: 'systole', text: 'Then the thick left ventricle squeezes hard, snapping the mitral shut and blasting the aortic valve open!', caption: '3. AORTIC SURGE' },
  { id: 'ecg', text: 'An electric spark triggers every beat in perfect rhythm, driving a live waveform through your chest.', caption: '4. ELECTRIC RHYTHM' },
  { id: 'scale', text: 'By midnight, this fist-sized engine has pumped over seven thousand two hundred liters of blood.', caption: '7,200 LITERS/DAY' },
];

let W = 720, H = 1280, FPS = 60, DUR = 22, LINES = [], EVENTS = [];

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

window.init = (cfg) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 22;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lRet = getLine('return', 1);
  const lOxy = getLine('oxygen', 2);
  const lSys = getLine('systole', 3);
  const lEcg = getLine('ecg', 4);
  const lSca = getLine('scale', 5);

  EVENTS = [
    { t: lRet.start + 0.14, type: 'bounce', pitchIndex: 2, intensity: 0.55 },
    { t: lOxy.start + 0.16, type: 'bounce', pitchIndex: 4, intensity: 0.65 },
    { t: lSys.start + 0.10, type: 'break', pitchIndex: 1, intensity: 1.0 },
    { t: lEcg.start + 0.12, type: 'bounce', pitchIndex: 6, intensity: 0.72 },
    { t: lEcg.start + 0.92, type: 'bounce', pitchIndex: 7, intensity: 0.68 },
    { t: lSca.start + 0.25, type: 'bounce', pitchIndex: 8, intensity: 0.75 },
    { t: Math.min(DUR - 0.25, lSca.start + 1.4), type: 'win', pitchIndex: 10, intensity: 0.96 },
  ];
};

function fitFont(text, basePx, maxW, weight = '900', family = '-apple-system, BlinkMacSystemFont, sans-serif') {
  let px = Math.round(basePx);
  ctx.font = `${weight} ${px}px ${family}`;
  const m = ctx.measureText(text).width || 1;
  if (m > maxW) px = Math.max(10, Math.floor(px * (maxW / m)));
  ctx.font = `${weight} ${px}px ${family}`;
  return px;
}

// Realistic P-QRS-T ECG wave function for phase u in [0, 1)
function ecgSample(u) {
  const p = ((u % 1) + 1) % 1;
  const g = (c, w, a) => a * Math.exp(-Math.pow((p - c) / w, 2));
  return (
    g(0.16, 0.032, 0.18) +   // P wave (atrial depolarization)
    g(0.285, 0.011, -0.18) + // Q dip
    g(0.315, 0.013, 1.0) +   // R spike (ventricular depolarization)
    g(0.348, 0.013, -0.28) + // S dip
    g(0.56, 0.055, 0.30)     // T wave (repolarization)
  );
}

// Cubic Bezier evaluator for blood particle paths
function bezier(p0, p1, p2, p3, u) {
  const m = 1 - u;
  const mm = m * m;
  const uu = u * u;
  return {
    x: mm * m * p0.x + 3 * mm * u * p1.x + 3 * m * uu * p2.x + uu * u * p3.x,
    y: mm * m * p0.y + 3 * mm * u * p1.y + 3 * m * uu * p2.y + uu * u * p3.y,
  };
}

function getActivePhase(t) {
  for (let i = SCRIPT.length - 1; i >= 0; i--) {
    const ln = getLine(SCRIPT[i].id, i);
    if (t >= ln.start) return { idx: i, line: ln };
  }
  return { idx: 0, line: getLine(SCRIPT[0].id, 0) };
}

function drawValveLeaflets(x, y, halfW, openAmt, angle, color, S) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const spread = lerp(0.08, 0.72, openAmt);
  ctx.strokeStyle = color;
  ctx.lineWidth = 4.2 * S;
  ctx.lineCap = 'round';
  ctx.shadowColor = color;
  ctx.shadowBlur = (6 + 10 * openAmt) * S;

  // Left leaflet
  ctx.beginPath();
  ctx.moveTo(-halfW, 0);
  ctx.quadraticCurveTo(-halfW * 0.45, halfW * spread * 0.65, -halfW * (0.06 + 0.45 * openAmt), halfW * spread);
  ctx.stroke();

  // Right leaflet
  ctx.beginPath();
  ctx.moveTo(halfW, 0);
  ctx.quadraticCurveTo(halfW * 0.45, halfW * spread * 0.65, halfW * (0.06 + 0.45 * openAmt), halfW * spread);
  ctx.stroke();

  // Hinge nodes
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(-halfW, 0, 3.2 * S, 0, Math.PI * 2);
  ctx.arc(halfW, 0, 3.2 * S, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFrame(t) {
  const S = W / 720;
  const cx = W * 0.465; // Centered inside [W*0.07, W*0.86] safe zone
  const safeLeft = W * 0.08;
  const safeRight = W * 0.85;
  const safeW = safeRight - safeLeft;

  const { idx: phaseIdx, line: activeLine } = getActivePhase(t);
  const phaseProg = clamp((t - activeLine.start) / Math.max(0.1, activeLine.end - activeLine.start), 0, 1);

  const lRet = getLine('return', 1);
  const lOxy = getLine('oxygen', 2);
  const lSys = getLine('systole', 3);
  const lEcg = getLine('ecg', 4);
  const lSca = getLine('scale', 5);

  // Cardiac cycle timing: 1.15 Hz baseline, accelerates slightly in final scale phase
  const speedBoost = smooth(lSca.start, DUR, t);
  const beatCycles = t * 1.18 + speedBoost * speedBoost * 2.4;
  const beatPhase = ((beatCycles % 1) + 1) % 1;

  // Ventricular systole occurs around beatPhase 0.30..0.54
  const sysWave = Math.exp(-Math.pow((beatPhase - 0.38) / 0.11, 2));
  // Atrial kick occurs around beatPhase 0.14..0.28
  const atrWave = Math.exp(-Math.pow((beatPhase - 0.18) / 0.08, 2));
  // Valve openings
  const mitralOpen = clamp(1 - smooth(0.28, 0.35, beatPhase) + smooth(0.54, 0.66, beatPhase), 0.04, 1);
  const aorticOpen = clamp(sysWave * 1.25 - 0.15, 0, 1);
  // Subtle emphasis boosts per phase
  const cyanHighlight = phaseIdx === 1 ? 1.0 : 0.68;
  const coralHighlight = (phaseIdx === 2 || phaseIdx === 3) ? 1.0 : 0.78;
  const ecgGlow = phaseIdx === 4 ? 1.0 : 0.35;

  // === 1. DEEP MIDNIGHT #050712 MEDICAL STUDIO BACKGROUND ===
  ctx.fillStyle = '#050712';
  ctx.fillRect(0, 0, W, H);

  const bgGlow = ctx.createRadialGradient(cx, H * 0.39, 18 * S, cx, H * 0.39, H * 0.44);
  bgGlow.addColorStop(0, `rgba(190,24,60,${(0.16 + 0.10 * sysWave).toFixed(3)})`);
  bgGlow.addColorStop(0.48, 'rgba(14,32,68,0.14)');
  bgGlow.addColorStop(1, 'rgba(5,7,18,0)');
  ctx.fillStyle = bgGlow;
  ctx.fillRect(0, 0, W, H);

  // Subtle diagnostic grid
  ctx.strokeStyle = 'rgba(56,189,248,0.045)';
  ctx.lineWidth = 1 * S;
  for (let x = safeLeft; x <= safeRight; x += 44 * S) {
    ctx.beginPath(); ctx.moveTo(x, H * 0.14); ctx.lineTo(x, H * 0.74); ctx.stroke();
  }
  for (let y = H * 0.14; y <= H * 0.74; y += 44 * S) {
    ctx.beginPath(); ctx.moveTo(safeLeft, y); ctx.lineTo(safeRight, y); ctx.stroke();
  }

  // === 2. 3D-SHADED 4-CHAMBER ANATOMICAL HEART CUTAWAY ===
  const hy = H * 0.388;
  const pumpScaleX = 1 - 0.045 * sysWave + 0.015 * atrWave;
  const pumpScaleY = 1 - 0.032 * sysWave + 0.012 * atrWave;

  ctx.save();
  ctx.translate(cx, hy);
  ctx.scale(pumpScaleX, pumpScaleY);

  // --- A. GREAT VESSELS BEHIND HEART ---
  // Superior Vena Cava (left upper blue-cyan vessel)
  ctx.save();
  const svcG = ctx.createLinearGradient(-130 * S, -170 * S, -65 * S, -170 * S);
  svcG.addColorStop(0, '#0c4a6e');
  svcG.addColorStop(0.45, '#0284c7');
  svcG.addColorStop(0.8, '#38bdf8');
  svcG.addColorStop(1, '#082f49');
  ctx.fillStyle = svcG;
  ctx.strokeStyle = '#7dd3fc';
  ctx.lineWidth = 2.2 * S;
  ctx.beginPath();
  ctx.moveTo(-124 * S, -190 * S);
  ctx.lineTo(-76 * S, -190 * S);
  ctx.quadraticCurveTo(-72 * S, -110 * S, -76 * S, -60 * S);
  ctx.lineTo(-124 * S, -60 * S);
  ctx.quadraticCurveTo(-126 * S, -115 * S, -124 * S, -190 * S);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Inferior Vena Cava (left lower blue-cyan vessel)
  ctx.beginPath();
  ctx.roundRect(-126 * S, 90 * S, 40 * S, 90 * S, 12 * S);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // Aortic Arch (sweeping crimson-coral arch with 3 carotid/subclavian branches)
  ctx.save();
  const aortaG = ctx.createLinearGradient(-40 * S, -210 * S, 110 * S, -70 * S);
  aortaG.addColorStop(0, '#9f1239');
  aortaG.addColorStop(0.35, '#f43f5e');
  aortaG.addColorStop(0.65, '#fb7185');
  aortaG.addColorStop(1, '#881337');
  ctx.strokeStyle = '#fda4af';
  ctx.lineWidth = 2.4 * S;
  ctx.fillStyle = aortaG;

  // 3 Top branches
  const branches = [-46, -12, 22];
  for (let b = 0; b < 3; b++) {
    const bx = branches[b] * S;
    ctx.beginPath();
    ctx.roundRect(bx - 10 * S, -225 * S, 20 * S, 48 * S, 8 * S);
    ctx.fill();
    ctx.stroke();
  }

  // Main Aortic Arch tube
  ctx.beginPath();
  ctx.moveTo(-12 * S, -42 * S);
  ctx.bezierCurveTo(-18 * S, -155 * S, -74 * S, -196 * S, 10 * S, -198 * S);
  ctx.bezierCurveTo(88 * S, -200 * S, 96 * S, -128 * S, 84 * S, -62 * S);
  ctx.lineTo(42 * S, -68 * S);
  ctx.bezierCurveTo(50 * S, -118 * S, 46 * S, -152 * S, 8 * S, -152 * S);
  ctx.bezierCurveTo(-24 * S, -152 * S, 22 * S, -118 * S, 28 * S, -42 * S);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Pulmonary Artery (cyan-indigo T-trunk arching in front of lower aorta)
  const paG = ctx.createLinearGradient(-40 * S, -135 * S, 125 * S, -95 * S);
  paG.addColorStop(0, '#0369a1');
  paG.addColorStop(0.45, '#22d3ee');
  paG.addColorStop(0.85, '#0ea5e9');
  paG.addColorStop(1, '#082f49');
  ctx.fillStyle = paG;
  ctx.strokeStyle = '#67e8f9';
  ctx.lineWidth = 2.2 * S;
  ctx.beginPath();
  ctx.moveTo(-48 * S, -18 * S);
  ctx.bezierCurveTo(-52 * S, -112 * S, 20 * S, -142 * S, 132 * S, -130 * S);
  ctx.lineTo(132 * S, -96 * S);
  ctx.bezierCurveTo(36 * S, -104 * S, -12 * S, -88 * S, -12 * S, -18 * S);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Pulmonary Veins (right side coral-red inlets into Left Atrium)
  ctx.fillStyle = '#e11d48';
  ctx.strokeStyle = '#fda4af';
  for (let v = 0; v < 2; v++) {
    const vy = (-64 + v * 34) * S;
    ctx.beginPath();
    ctx.roundRect(114 * S, vy, 58 * S, 22 * S, 9 * S);
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();

  // --- B. OUTER MYOCARDIUM SHELL (3D SCULPTED ANATOMICAL HEART BODY) ---
  ctx.save();
  ctx.shadowColor = `rgba(244,63,94,${(0.28 + 0.25 * sysWave).toFixed(2)})`;
  ctx.shadowBlur = 32 * S;
  const wallG = ctx.createRadialGradient(-45 * S, -50 * S, 24 * S, 10 * S, 20 * S, 235 * S);
  wallG.addColorStop(0, '#fb7185');
  wallG.addColorStop(0.28, '#be123c');
  wallG.addColorStop(0.65, '#881337');
  wallG.addColorStop(1, '#3b0718');
  ctx.fillStyle = wallG;
  ctx.strokeStyle = '#fda4af';
  ctx.lineWidth = 3 * S;
  ctx.beginPath();
  ctx.moveTo(0, -104 * S);
  ctx.bezierCurveTo(-96 * S, -120 * S, -172 * S, -48 * S, -162 * S, 36 * S);
  ctx.bezierCurveTo(-152 * S, 126 * S, -58 * S, 188 * S, 36 * S, 198 * S); // apex tilts slightly right (anatomical left)
  ctx.bezierCurveTo(134 * S, 184 * S, 178 * S, 88 * S, 166 * S, -16 * S);
  ctx.bezierCurveTo(158 * S, -96 * S, 84 * S, -118 * S, 0, -104 * S);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // Inner cutaway bevel rim (gives thick muscular wall depth)
  ctx.save();
  const bevelG = ctx.createLinearGradient(-150 * S, -90 * S, 150 * S, 160 * S);
  bevelG.addColorStop(0, '#4c0519');
  bevelG.addColorStop(0.5, '#1f0713');
  bevelG.addColorStop(1, '#2d0614');
  ctx.fillStyle = bevelG;
  ctx.beginPath();
  ctx.moveTo(0, -82 * S);
  ctx.bezierCurveTo(-78 * S, -94 * S, -142 * S, -34 * S, -134 * S, 34 * S);
  ctx.bezierCurveTo(-124 * S, 110 * S, -46 * S, 158 * S, 30 * S, 162 * S);
  ctx.bezierCurveTo(106 * S, 148 * S, 134 * S, 76 * S, 126 * S, -12 * S);
  ctx.bezierCurveTo(120 * S, -76 * S, 64 * S, -92 * S, 0, -82 * S);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // --- C. 4 HOLLOW CUTAWAY CHAMBERS ---
  // 1. Right Atrium (Viewer's Top-Left, Cyan Deoxygenated)
  const raG = ctx.createRadialGradient(-84 * S, -40 * S, 6 * S, -84 * S, -36 * S, 62 * S);
  raG.addColorStop(0, `rgba(34,211,238,${(0.55 * cyanHighlight).toFixed(2)})`);
  raG.addColorStop(0.65, `rgba(8,145,178,${(0.42 * cyanHighlight).toFixed(2)})`);
  raG.addColorStop(1, 'rgba(8,47,73,0.92)');
  ctx.fillStyle = raG;
  ctx.strokeStyle = 'rgba(103,232,249,0.55)';
  ctx.lineWidth = 1.8 * S;
  ctx.beginPath();
  ctx.ellipse(-86 * S, -34 * S, 44 * S, 42 * S, -0.18, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 2. Right Ventricle (Viewer's Bottom-Left, Cyan Deoxygenated)
  const rvG = ctx.createRadialGradient(-68 * S, 74 * S, 8 * S, -64 * S, 74 * S, 82 * S);
  rvG.addColorStop(0, `rgba(56,189,248,${(0.56 * cyanHighlight).toFixed(2)})`);
  rvG.addColorStop(0.6, `rgba(3,105,161,${(0.44 * cyanHighlight).toFixed(2)})`);
  rvG.addColorStop(1, 'rgba(7,35,58,0.95)');
  ctx.fillStyle = rvG;
  ctx.beginPath();
  ctx.moveTo(-118 * S, 22 * S);
  ctx.quadraticCurveTo(-124 * S, 118 * S, -22 * S, 146 * S);
  ctx.quadraticCurveTo(-8 * S, 86 * S, -14 * S, 18 * S);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // 3. Left Atrium (Viewer's Top-Right, Coral-Red Oxygenated)
  const laG = ctx.createRadialGradient(78 * S, -38 * S, 6 * S, 78 * S, -36 * S, 58 * S);
  laG.addColorStop(0, `rgba(251,113,133,${(0.68 * coralHighlight).toFixed(2)})`);
  laG.addColorStop(0.6, `rgba(225,29,72,${(0.52 * coralHighlight).toFixed(2)})`);
  laG.addColorStop(1, 'rgba(76,5,25,0.94)');
  ctx.fillStyle = laG;
  ctx.strokeStyle = 'rgba(253,164,175,0.65)';
  ctx.beginPath();
  ctx.ellipse(76 * S, -36 * S, 42 * S, 38 * S, 0.16, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 4. Left Ventricle (Viewer's Bottom-Right, Thick Wall, Coral-Red Oxygenated)
  const lvG = ctx.createRadialGradient(62 * S, 74 * S, 10 * S, 60 * S, 74 * S, 88 * S);
  lvG.addColorStop(0, `rgba(255,112,138,${(0.75 * coralHighlight + 0.2 * sysWave).toFixed(2)})`);
  lvG.addColorStop(0.58, `rgba(225,29,72,${(0.58 * coralHighlight).toFixed(2)})`);
  lvG.addColorStop(1, 'rgba(68,5,22,0.96)');
  ctx.fillStyle = lvG;
  ctx.beginPath();
  ctx.moveTo(14 * S, 16 * S);
  ctx.quadraticCurveTo(10 * S, 104 * S, 34 * S, 148 * S);
  ctx.quadraticCurveTo(116 * S, 120 * S, 114 * S, 24 * S);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Interventricular Septum (3D beveled muscular divider between right and left heart)
  const sepG = ctx.createLinearGradient(-16 * S, 0, 16 * S, 0);
  sepG.addColorStop(0, '#9f1239');
  sepG.addColorStop(0.5, '#fb7185');
  sepG.addColorStop(1, '#881337');
  ctx.fillStyle = sepG;
  ctx.beginPath();
  ctx.moveTo(-12 * S, -64 * S);
  ctx.quadraticCurveTo(-8 * S, 42 * S, -14 * S, 148 * S);
  ctx.lineTo(14 * S, 148 * S);
  ctx.quadraticCurveTo(10 * S, 42 * S, 12 * S, -64 * S);
  ctx.closePath();
  ctx.fill();

  // --- D. ANIMATED BLOOD STREAMLINES & ERYTHROCYTE PARTICLES ---
  // Deoxygenated (Cyan) path: SVC -> RA -> RV -> Pulmonary Artery
  const deoxP0 = { x: -100 * S, y: -178 * S };
  const deoxP1 = { x: -96 * S, y: -42 * S };
  const deoxP2 = { x: -72 * S, y: 120 * S };
  const deoxP3 = { x: -24 * S, y: -62 * S };
  const deoxOut0 = { x: -30 * S, y: -58 * S };
  const deoxOut1 = { x: -20 * S, y: -118 * S };
  const deoxOut2 = { x: 46 * S, y: -120 * S };
  const deoxOut3 = { x: 126 * S, y: -112 * S };

  for (let i = 0; i < 24; i++) {
    const u = ((t * 0.42 + i / 24) % 1 + 1) % 1;
    let pt;
    if (u < 0.68) {
      pt = bezier(deoxP0, deoxP1, deoxP2, deoxP3, u / 0.68);
    } else {
      pt = bezier(deoxOut0, deoxOut1, deoxOut2, deoxOut3, (u - 0.68) / 0.32);
    }
    const jitter = Math.sin(i * 4.7 + t * 5) * 6 * S;
    const pr = (4.2 + hash(i * 11) * 3.2) * S;
    ctx.fillStyle = `rgba(34,211,238,${(0.75 * cyanHighlight).toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(pt.x + jitter, pt.y + Math.cos(i * 3.1) * 4 * S, pr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(207,250,254,0.85)';
    ctx.beginPath();
    ctx.arc(pt.x + jitter - 1 * S, pt.y + Math.cos(i * 3.1) * 4 * S - 1 * S, pr * 0.42, 0, Math.PI * 2);
    ctx.fill();
  }

  // Oxygenated (Coral-Red) path: Pulmonary Veins -> LA -> Mitral -> LV -> Aortic Valve -> Aorta
  const oxP0 = { x: 158 * S, y: -46 * S };
  const oxP1 = { x: 82 * S, y: -38 * S };
  const oxP2 = { x: 74 * S, y: 128 * S };
  const oxP3 = { x: 18 * S, y: -36 * S };
  const oxOut0 = { x: 12 * S, y: -44 * S };
  const oxOut1 = { x: -24 * S, y: -168 * S };
  const oxOut2 = { x: 74 * S, y: -182 * S };
  const oxOut3 = { x: 64 * S, y: -68 * S };

  for (let i = 0; i < 28; i++) {
    const u = ((t * (0.46 + 0.14 * sysWave) + i / 28) % 1 + 1) % 1;
    let pt;
    if (u < 0.62) {
      pt = bezier(oxP0, oxP1, oxP2, oxP3, u / 0.62);
    } else {
      pt = bezier(oxOut0, oxOut1, oxOut2, oxOut3, (u - 0.62) / 0.38);
    }
    const jitter = Math.sin(i * 5.3 + t * 6) * 6 * S;
    const pr = (4.5 + hash(i * 17) * 3.4) * S;
    ctx.fillStyle = `rgba(255,77,109,${(0.84 * coralHighlight).toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(pt.x + jitter, pt.y + Math.cos(i * 2.9) * 4 * S, pr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,228,230,0.9)';
    ctx.beginPath();
    ctx.arc(pt.x + jitter - 1 * S, pt.y + Math.cos(i * 2.9) * 4 * S - 1 * S, pr * 0.42, 0, Math.PI * 2);
    ctx.fill();
  }

  // --- E. 4 ANIMATED VALVES (Tricuspid, Pulmonary, Mitral, Aortic) ---
  // Tricuspid (RA -> RV)
  drawValveLeaflets(-76 * S, 12 * S, 28 * S, mitralOpen, 0.08, '#bae6fd', S);
  // Pulmonary (RV -> Pulmonary Artery)
  drawValveLeaflets(-30 * S, -22 * S, 18 * S, aorticOpen, Math.PI - 0.15, '#67e8f9', S);
  // MITRAL VALVE (LA -> LV, hero animated valve)
  drawValveLeaflets(68 * S, 10 * S, 30 * S, mitralOpen, -0.08, phaseIdx === 2 ? '#fef08a' : '#fecdd3', S);
  // AORTIC VALVE (LV -> Aorta, hero animated valve)
  drawValveLeaflets(10 * S, -36 * S, 20 * S, aorticOpen, Math.PI + 0.15, phaseIdx === 3 ? '#fef08a' : '#fda4af', S);

  // --- F. ELECTRICAL CONDUCTION SYSTEM (SA NODE -> AV NODE -> PURKINJE FIBERS) ---
  if (ecgGlow > 0.2) {
    const pulseWave = clamp(1 - Math.abs(beatPhase - 0.24) * 5.5, 0, 1);
    const purkinjeWave = clamp(1 - Math.abs(beatPhase - 0.34) * 5.5, 0, 1);
    ctx.save();
    ctx.strokeStyle = `rgba(250,204,21,${(ecgGlow * (0.35 + 0.65 * purkinjeWave)).toFixed(2)})`;
    ctx.lineWidth = (2.4 + 2 * purkinjeWave) * S;
    ctx.shadowColor = '#facc15';
    ctx.shadowBlur = 16 * S * ecgGlow;

    // SA Node spark (upper RA)
    ctx.fillStyle = `rgba(254,240,138,${(ecgGlow * (0.45 + 0.55 * pulseWave)).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(-96 * S, -58 * S, (7 + 6 * pulseWave) * S, 0, Math.PI * 2); ctx.fill();

    // Conduction pathway down septum & up ventricular walls
    ctx.beginPath();
    ctx.moveTo(-96 * S, -58 * S);
    ctx.quadraticCurveTo(-36 * S, -28 * S, 0, -4 * S); // AV Node
    ctx.lineTo(0, 134 * S); // Bundle of His
    ctx.moveTo(0, 134 * S);
    ctx.quadraticCurveTo(-84 * S, 132 * S, -112 * S, 54 * S); // Right Purkinje
    ctx.moveTo(0, 134 * S);
    ctx.quadraticCurveTo(88 * S, 132 * S, 108 * S, 48 * S); // Left Purkinje
    ctx.stroke();
    ctx.restore();
  }

  // --- G. CRISP COMPACT ANATOMY TAGS (Inside heart safe bounds) ---
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  fitFont('RA', 16 * S, 36 * S, '800');
  ctx.fillStyle = 'rgba(207,250,254,0.88)';
  ctx.fillText('RA', -90 * S, -38 * S);
  ctx.fillText('RV', -64 * S, 78 * S);

  ctx.fillStyle = 'rgba(255,228,230,0.92)';
  ctx.fillText('LA', 78 * S, -38 * S);
  ctx.fillText('LV', 64 * S, 78 * S);

  // Highlight active valve callouts
  if (phaseIdx === 2) {
    fitFont('MITRAL VALVE', 15 * S, 115 * S, '900');
    ctx.fillStyle = '#fef08a';
    ctx.fillText('MITRAL VALVE', 74 * S, 32 * S);
  } else if (phaseIdx === 3) {
    fitFont('AORTIC VALVE', 15 * S, 115 * S, '900');
    ctx.fillStyle = '#fef08a';
    ctx.fillText('AORTIC VALVE', 12 * S, -64 * S);
  }
  ctx.restore();

  ctx.restore(); // end heart transform

  // === 3. LIVE ECG WAVEFORM MONITOR (y: H*0.562 to H*0.625) ===
  const ecgX = safeLeft;
  const ecgY = H * 0.562;
  const ecgW = safeW;
  const ecgH = H * 0.064;

  ctx.save();
  ctx.fillStyle = 'rgba(9,16,32,0.88)';
  ctx.strokeStyle = phaseIdx === 4 ? 'rgba(52,211,153,0.75)' : 'rgba(56,189,248,0.28)';
  ctx.lineWidth = (phaseIdx === 4 ? 2.2 : 1.4) * S;
  ctx.beginPath();
  ctx.roundRect(ecgX, ecgY, ecgW, ecgH, 12 * S);
  ctx.fill();
  ctx.stroke();

  // ECG grid lines
  ctx.strokeStyle = 'rgba(52,211,153,0.08)';
  ctx.lineWidth = 1 * S;
  ctx.beginPath();
  ctx.moveTo(ecgX + 10 * S, ecgY + ecgH * 0.62);
  ctx.lineTo(ecgX + ecgW - 10 * S, ecgY + ecgH * 0.62);
  ctx.stroke();

  // ECG trace
  const padX = 14 * S;
  const traceW = ecgW - padX * 2;
  const baseLineY = ecgY + ecgH * 0.64;
  const ampY = ecgH * 0.48;
  const samples = 96;

  ctx.strokeStyle = '#34d399';
  ctx.lineWidth = 2.8 * S;
  ctx.lineJoin = 'round';
  ctx.shadowColor = '#10b981';
  ctx.shadowBlur = 12 * S;
  ctx.beginPath();
  let lastX = ecgX + padX;
  let lastY = baseLineY;
  for (let i = 0; i <= samples; i++) {
    const frac = i / samples;
    const sx = ecgX + padX + frac * traceW;
    const sampleBeat = beatCycles - (1 - frac) * 2.2;
    const sy = baseLineY - ecgSample(sampleBeat) * ampY;
    if (i === 0) ctx.moveTo(sx, sy);
    else ctx.lineTo(sx, sy);
    lastX = sx;
    lastY = sy;
  }
  ctx.stroke();

  // Leading phosphor dot
  ctx.fillStyle = '#ecfdf5';
  ctx.beginPath();
  ctx.arc(lastX, lastY, 4.2 * S, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Compact ECG label inside top-left of monitor
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  fitFont('LIVE ECG • 72 BPM', 14 * S, 180 * S, '800');
  ctx.fillStyle = '#6ee7b7';
  ctx.fillText('LIVE ECG • 72 BPM', ecgX + 14 * S, ecgY + 8 * S);
  ctx.restore();

  // === 4. LIVE COUNTERS: BEATS TODAY (100,000) & LITERS PUMPED (7,200 L) ===
  const cardY = H * 0.635;
  const cardH = H * 0.052;
  const gap = 12 * S;
  const cardW = (safeW - gap) * 0.5;

  // Smooth exponential ramp up to 100,000 beats & 7,200 L by end of scale phase
  const progressAll = clamp(t / Math.max(1, DUR - 0.5), 0, 1);
  const easedCount = 0.08 + 0.92 * Math.pow(progressAll, 1.35);
  const beatsVal = Math.min(100000, Math.round(easedCount * 100000));
  const litersVal = Math.min(7200, Math.round(easedCount * 7200));

  function drawStatCard(x, label, valueText, accent) {
    ctx.save();
    ctx.fillStyle = 'rgba(15,23,42,0.88)';
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.6 * S;
    ctx.beginPath();
    ctx.roundRect(x, cardY, cardW, cardH, 12 * S);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    fitFont(label, 13 * S, cardW - 18 * S, '800');
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(label, x + cardW * 0.5, cardY + cardH * 0.30);

    fitFont(valueText, 24 * S, cardW - 18 * S, '900');
    ctx.fillStyle = '#f8fafc';
    ctx.fillText(valueText, x + cardW * 0.5, cardY + cardH * 0.70);
    ctx.restore();
  }

  drawStatCard(safeLeft, 'BEATS TODAY', beatsVal.toLocaleString('en-US'), 'rgba(251,113,133,0.65)');
  drawStatCard(safeLeft + cardW + gap, 'LITERS PUMPED', `${litersVal.toLocaleString('en-US')} L`, 'rgba(56,189,248,0.65)');

  // === 5. SAFE-ZONE HEADER & HIGH-CONTRAST PHASE PILL ===
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Top Header strictly inside y >= H*0.14
  fitFont('BIO MECHANICS • CARDIAC ENGINE', 22 * S, safeW, '800');
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('BIO MECHANICS • CARDIAC ENGINE', cx, H * 0.155);

  // Bottom Phase Pill strictly inside y <= H*0.74
  const pillW = Math.min(safeW, 430 * S);
  const pillH = 54 * S;
  const pillY = H * 0.715;
  const pop = 1 + 0.05 * Math.exp(-phaseProg * 14);

  ctx.save();
  ctx.translate(cx, pillY);
  ctx.scale(pop, pop);
  ctx.shadowColor = 'rgba(251,113,133,0.45)';
  ctx.shadowBlur = 20 * S;
  const pillG = ctx.createLinearGradient(-pillW * 0.5, 0, pillW * 0.5, 0);
  pillG.addColorStop(0, '#fb7185');
  pillG.addColorStop(1, '#f43f5e');
  ctx.fillStyle = pillG;
  ctx.beginPath();
  ctx.roundRect(-pillW * 0.5, -pillH * 0.5, pillW, pillH, pillH * 0.5);
  ctx.fill();
  ctx.shadowBlur = 0;

  fitFont(activeLine.caption, 28 * S, pillW - 36 * S, '900');
  ctx.fillStyle = '#ffffff';
  ctx.fillText(activeLine.caption, 0, 1 * S);
  ctx.restore();
  ctx.restore();
}

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    drawFrame((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};
window.ready = true;
</script>
