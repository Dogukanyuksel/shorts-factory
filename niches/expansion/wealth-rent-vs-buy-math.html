<!doctype html>
<!--
  Wealth Mechanics — 3D PBR: Rent vs Buy ($400K Home vs Investing the Difference)
  Y-LABS 3D Cinema Engine (Three.js PBR Architectural House Cutaway vs Gold Portfolio Tower, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#090D16;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  easeOutCubic,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'Everyone tells you renting is throwing money away. The math says otherwise for years.', caption: 'RENTING = WASTED?' },
  { id: 'unrecov', text: 'On a four hundred thousand dollar home, early mortgage interest, taxes, and repairs vanish first.', caption: '78% GOES TO INTEREST' },
  { id: 'invest', text: 'If you rent cheaper and invest the difference, your index portfolio pulls ahead fast.', caption: 'RENT + INVEST LEADS' },
  { id: 'cross', text: 'Equity only overtakes your invested cash around year nine — the true crossover point.', caption: 'YEAR 8.9 CROSSOVER' },
  { id: 'move', text: 'If you sell and move in year five, closing costs wipe out your entire home gain.', caption: 'SELL EARLY = LOSS' },
  { id: 'verdict', text: 'Buy only when you plan to stay ten years. Otherwise, let your invested cash compound.', caption: '10-YEAR STAY RULE' },
];

let W = 720, H = 1280, FPS = 60, DUR = 26, LINES = [], EVENTS = [];
let stage = null, built = false;
let houseGrp, equityFill, portfolioCol, portfolioCap, crossRing;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, idx) {
  const f = LINES.find((l) => l.id === id);
  if (f) return f;
  const seg = DUR / SCRIPT.length;
  return { id, start: idx * seg, end: (idx + 1) * seg, caption: SCRIPT[idx].caption };
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'wealth', fov: 38, fogDensity: 0.022, floorY: -2.4 });
  const { scene } = stage;
  const mats = createMaterials('wealth');

  // Split platform
  const platGeo = new THREE.BoxGeometry(5.8, 0.28, 2.6);
  const plat = new THREE.Mesh(platGeo, mats.darkMetal);
  plat.position.set(0, -2.26, 0);
  scene.add(plat);
  const platEdge = addXrayEdges(platGeo, 0xffd60a, 0.25);
  platEdge.position.copy(plat.position);
  scene.add(platEdge);

  // LEFT: 3D House wireframe + rising emerald equity core
  houseGrp = new THREE.Group();
  houseGrp.position.set(-1.45, -2.12, 0);

  const wallGeo = new THREE.BoxGeometry(1.7, 1.5, 1.5);
  const wallShell = new THREE.Mesh(wallGeo, mats.glass(0x38bdf8, 0.18));
  wallShell.position.y = 0.75;
  houseGrp.add(wallShell);
  const wallEdge = addXrayEdges(wallGeo, 0x38bdf8, 0.72);
  wallEdge.position.y = 0.75;
  houseGrp.add(wallEdge);

  const roofGeo = new THREE.ConeGeometry(1.32, 0.92, 4);
  const roof = new THREE.Mesh(roofGeo, mats.steel);
  roof.rotation.y = Math.PI / 4;
  roof.position.y = 1.96;
  houseGrp.add(roof);
  const roofEdge = addXrayEdges(roofGeo, 0xffd60a, 0.55);
  roofEdge.rotation.y = Math.PI / 4;
  roofEdge.position.y = 1.96;
  houseGrp.add(roofEdge);

  const eqGeo = new THREE.BoxGeometry(1.48, 1.0, 1.28);
  equityFill = new THREE.Mesh(eqGeo, mats.emerald);
  equityFill.position.y = 0.25;
  houseGrp.add(equityFill);
  scene.add(houseGrp);

  // RIGHT: Rent + Invest Gold Portfolio Column
  const portGeo = new THREE.BoxGeometry(1.15, 1.0, 1.15);
  portfolioCol = new THREE.Mesh(portGeo, mats.gold);
  portfolioCol.position.set(1.45, -1.62, 0);
  scene.add(portfolioCol);

  portfolioCap = new THREE.Mesh(new THREE.BoxGeometry(1.26, 0.12, 1.26), mats.glow(0xffd60a, 0.95));
  portfolioCap.position.set(1.45, -1.1, 0);
  scene.add(portfolioCap);

  // Crossover Halo Ring
  crossRing = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.04, 12, 64), mats.glow(0x30d158, 0.9));
  crossRing.rotation.x = Math.PI / 2;
  crossRing.position.set(0, -0.4, 0);
  scene.add(crossRing);

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  LINES = Array.isArray(cfg.lines) ? cfg.lines : [];
  cv.width = W;
  cv.height = H;
  buildScene();

  const lInvest = getLine('invest', 2);
  const lCross = getLine('cross', 3);
  const lVerd = getLine('verdict', 5);
  EVENTS = [
    { t: Math.max(0.1, lInvest.start - 0.04), type: 'bounce', intensity: 0.75 },
    { t: Math.max(0.2, lCross.start - 0.04), type: 'break', intensity: 1.0 },
    { t: Math.max(0.3, lVerd.start - 0.04), type: 'win', intensity: 0.9 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  const year = lerp(1, 15, easeOutCubic(p));
  // Portfolio leads years 1..8.9, then Buy equity accelerates past it
  const portVal = 40 + year * 18.5 + year * year * 0.45;
  const buyVal = year < 3 ? 25 + year * 9 : 25 + year * 14 + Math.pow(Math.max(0, year - 5), 1.65) * 4.1;

  const portH = clamp((portVal / 420) * 3.9, 0.35, 4.1);
  portfolioCol.scale.y = portH;
  portfolioCol.position.y = -2.12 + portH * 0.5;
  portfolioCap.position.y = -2.12 + portH + 0.06;

  const eqH = clamp((buyVal / 420) * 3.9, 0.25, 4.1);
  equityFill.scale.y = Math.min(1.42, eqH * 0.45);
  equityFill.position.y = equityFill.scale.y * 0.5;
  houseGrp.scale.setScalar(1 + clamp((year - 8.9) / 25, 0, 0.22));
  houseGrp.rotation.y = Math.sin(t * 0.5) * 0.18;

  const crossed = year >= 8.9;
  crossRing.position.y = -2.12 + Math.min(portH, eqH);
  crossRing.material.color.setHex(crossed ? 0x30d158 : 0xffd60a);
  crossRing.rotation.z = t * 0.8;

  const camA = lerp(-0.32, 0.32, p);
  stage.camera.position.set(Math.sin(camA) * 8.1, 1.05, Math.cos(camA) * 8.1);
  stage.camera.lookAt(0, 0.15, 0);

  stage.renderTo(ctx, W, H);

  const active = LINES.find((l) => t >= l.start && t <= l.end) || SCRIPT[Math.min(SCRIPT.length - 1, Math.floor(p * SCRIPT.length))];
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'wealth',
    title: 'RENT VS BUY ($400K)',
    subtitle: crossed ? 'BUY EQUITY OVERTAKES' : 'RENT + INVEST LEADS',
    progress: p,
    caption: active.caption,
    metrics: [
      { label: 'YEAR', value: `${year.toFixed(1)}`, color: '#FFFFFF' },
      { label: 'BUY NET', value: `$${Math.round(buyVal)}K`, color: '#30D158' },
      { label: 'RENT+INV', value: `$${Math.round(portVal)}K`, color: '#FFD60A' },
    ],
  });
};
</script>
