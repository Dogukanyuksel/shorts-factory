<!doctype html>
<!--
  Wealth Mechanics — 3D PBR: The Rule of 72 (How Fast Your Money Doubles)
  Y-LABS 3D Cinema Engine (Three.js PBR Gold Doubling Towers + Neon Rate Laser, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#090D16;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  easeOutCubic,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'Want to know in two seconds when your money doubles? Never guess again.', caption: '72 ÷ RATE = DOUBLING' },
  { id: 'formula', text: 'Just divide seventy-two by your yearly return rate. That single number predicts your future.', caption: 'THE RULE OF 72' },
  { id: 'low', text: 'At one percent in a normal bank account, your cash takes seventy-two years to double.', caption: '1% BANK = 72 YEARS' },
  { id: 'mid', text: 'At eight percent in an index fund, your money doubles every nine years automatically.', caption: '8% INDEX = 9 YEARS' },
  { id: 'high', text: 'Bump that return to twelve percent and your balance doubles every six years — exploding vertically.', caption: '12% = EVERY 6 YEARS' },
  { id: 'verdict', text: 'Small return differences feel invisible today, yet they decide whether you retire rich or broke.', caption: 'TIME × RATE = WEALTH' },
];

let W = 720, H = 1280, FPS = 60, DUR = 26, LINES = [], EVENTS = [];
let stage = null, built = false;
let towers = [], rings = [], laserBar, gridFloor;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, idx) {
  const f = LINES.find((l) => l.id === id);
  if (f) return f;
  const seg = DUR / SCRIPT.length;
  return { id, start: idx * seg, end: (idx + 1) * seg, caption: SCRIPT[idx].caption };
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'wealth', fov: 38, fogDensity: 0.022, floorY: -2.4 });
  const { scene } = stage;
  const mats = createMaterials('wealth');

  // Pedestal base
  const baseGeo = new THREE.BoxGeometry(5.6, 0.32, 2.2);
  const base = new THREE.Mesh(baseGeo, mats.darkMetal);
  base.position.set(0, -2.24, 0);
  scene.add(base);
  const baseEdge = addXrayEdges(baseGeo, 0xffd60a, 0.35);
  baseEdge.position.copy(base.position);
  scene.add(baseEdge);

  const specs = [
    { x: -1.75, color: 0xff3b30, mat: mats.crimson, label: '1%' },
    { x: 0.0, color: 0x30d158, mat: mats.emerald, label: '8%' },
    { x: 1.75, color: 0xffd60a, mat: mats.gold, label: '12%' },
  ];

  towers = specs.map((sp) => {
    const grp = new THREE.Group();
    grp.position.set(sp.x, -2.08, 0);
    const colGeo = new THREE.BoxGeometry(0.95, 1.0, 0.95);
    const mesh = new THREE.Mesh(colGeo, sp.mat);
    mesh.position.y = 0.5;
    grp.add(mesh);
    const edge = addXrayEdges(colGeo, sp.color, 0.45);
    edge.position.y = 0.5;
    grp.add(edge);

    const cap = new THREE.Mesh(new THREE.BoxGeometry(1.04, 0.1, 1.04), mats.glow(sp.color, 0.95));
    cap.position.y = 1.02;
    grp.add(cap);

    scene.add(grp);
    return { grp, mesh, edge, cap, color: sp.color, x: sp.x };
  });

  // Doubling milestone rings floating along Y
  rings = [1, 2, 3, 4].map((lvl) => {
    const r = new THREE.Mesh(
      new THREE.TorusGeometry(2.55, 0.022, 10, 64),
      mats.glow(0xffd60a, 0.55),
    );
    r.rotation.x = Math.PI / 2;
    r.position.y = -2.08 + lvl * 1.15;
    scene.add(r);
    return r;
  });

  laserBar = new THREE.Mesh(new THREE.BoxGeometry(5.8, 0.05, 0.05), mats.glow(0x00f0ff, 1.0));
  laserBar.position.set(0, -1.0, 0.72);
  scene.add(laserBar);

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  LINES = Array.isArray(cfg.lines) ? cfg.lines : [];
  cv.width = W;
  cv.height = H;
  buildScene();

  const lLow = getLine('low', 2);
  const lMid = getLine('mid', 3);
  const lHigh = getLine('high', 4);
  const lVerd = getLine('verdict', 5);
  EVENTS = [
    { t: Math.max(0.1, lLow.start - 0.04), type: 'bounce', intensity: 0.7 },
    { t: Math.max(0.2, lMid.start - 0.04), type: 'bounce', intensity: 0.85 },
    { t: Math.max(0.3, lHigh.start - 0.04), type: 'break', intensity: 1.0 },
    { t: Math.max(0.4, lVerd.start - 0.04), type: 'win', intensity: 0.95 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  const lLow = getLine('low', 2);
  const lMid = getLine('mid', 3);
  const lHigh = getLine('high', 4);

  const pLow = easeOutCubic(smooth(t, lLow.start, lLow.end));
  const pMid = easeOutCubic(smooth(t, lMid.start, lMid.end));
  const pHigh = easeOutCubic(smooth(t, lHigh.start, lHigh.end));

  // Heights over 36-year window: 1% -> 1.43x, 8% -> 16x (4 doublings), 12% -> 64x (6 doublings)
  const heights = [
    lerp(0.35, 0.75, pLow),
    lerp(0.35, 2.75, pMid),
    lerp(0.35, 4.85, pHigh),
  ];

  towers.forEach((tw, idx) => {
    const h = heights[idx];
    tw.mesh.scale.y = h;
    tw.mesh.position.y = h * 0.5;
    tw.edge.scale.y = h;
    tw.edge.position.y = h * 0.5;
    tw.cap.position.y = h + 0.05;
    tw.grp.rotation.y = Math.sin(t * 0.65 + idx) * 0.14;
  });

  rings.forEach((r, i) => {
    r.rotation.z = t * (0.25 + i * 0.08);
    r.material.opacity = 0.22 + 0.35 * clamp((heights[2] - i * 1.1) / 1.0, 0, 1);
  });

  laserBar.position.y = -2.08 + heights[2];

  // Smooth cinematic orbit camera
  const camAngle = lerp(-0.34, 0.36, p) + Math.sin(t * 0.45) * 0.04;
  stage.camera.position.set(Math.sin(camAngle) * 8.2, 0.95 + p * 0.75, Math.cos(camAngle) * 8.2);
  stage.camera.lookAt(0, 0.35, 0);

  stage.renderTo(ctx, W, H);

  const active = LINES.find((l) => t >= l.start && t <= l.end) || SCRIPT[Math.min(SCRIPT.length - 1, Math.floor(p * SCRIPT.length))];
  const mult12 = Math.round(lerp(1, 64, pHigh));
  const mult8 = Math.round(lerp(1, 16, pMid));
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'wealth',
    title: 'THE RULE OF 72',
    subtitle: '36-YEAR DOUBLING RACE',
    progress: p,
    caption: active.caption,
    metrics: [
      { label: '1% BANK', value: '1.4×', color: '#FF3B30' },
      { label: '8% INDEX', value: `${mult8}×`, color: '#30D158' },
      { label: '12% RATE', value: `${mult12}×`, color: '#FFD60A' },
    ],
  });
};
</script>
