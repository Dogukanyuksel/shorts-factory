<!doctype html>
<!--
  Wealth Mechanics — Format 1 (3D Mechanical Finance): Why Paying the Minimum on a $5,000 Credit Card Takes 16 Years
  Y-LABS 3D Cinema Engine (Three.js PBR Interlocking APR Ratchet Gears + Debt Load Block, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#090D16;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  easeOutCubic,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'Have a five thousand dollar credit card balance at twenty-four percent APR? Paying the minimum is a mathematical trap.', caption: '$5,000 AT 24% APR' },
  { id: 'refill', text: 'Watch what happens every month. You pay a slice down, then a crimson interest wave refills nearly eighty percent right back!', caption: '~80% REFILLED BY APR' },
  { id: 'minpath', text: 'At that pace, clearing five thousand dollars drags out for sixteen brutal years — costing over thirteen thousand dollars total.', caption: '16 YEARS · $13.3K PAID' },
  { id: 'extra', text: 'Now watch what happens when you add just one hundred extra dollars a month. Every extra dollar goes straight to principal.', caption: '+$100 EXTRA / MONTH' },
  { id: 'race', text: 'Green smashes the balance to zero in just three point three years, while Red is still trapped with over twelve years left!', caption: '3.3 YRS VS 16 YRS' },
  { id: 'verdict', text: 'One hundred extra bucks a month saves sixty-four hundred dollars in interest and gives you twelve years of your life back.', caption: '$6,400 SAVED' },
];

let W = 720, H = 1280, FPS = 60, DUR = 23, LINES = [], EVENTS = [];
let stage = null, built = false;
let aprGear, minGear, turboGear, debtBlock, debtCore, debtCoreMat, sparks = [], aprShockRing;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

function make3DGear({ radius, teeth, thickness, bodyMat, accentMat }) {
  const g = new THREE.Group();
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, thickness, Math.max(24, teeth * 2)), bodyMat);
  disc.rotation.x = Math.PI / 2;
  g.add(disc);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.34, radius * 0.34, thickness * 1.35, 20), accentMat);
  hub.rotation.x = Math.PI / 2;
  g.add(hub);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.72, thickness * 0.14, 10, 32), accentMat);
  rim.position.z = thickness * 0.52;
  g.add(rim);

  const toothW = (2 * Math.PI * radius) / (teeth * 2.1);
  const toothH = radius * 0.17;
  const tGeo = new THREE.BoxGeometry(toothW, toothH, thickness * 0.92);
  for (let i = 0; i < teeth; i++) {
    const a = (i / teeth) * Math.PI * 2;
    const tm = new THREE.Mesh(tGeo, bodyMat);
    tm.position.set(Math.cos(a) * (radius + toothH * 0.42), Math.sin(a) * (radius + toothH * 0.42), 0);
    tm.rotation.z = a + Math.PI / 2;
    g.add(tm);
  }
  return g;
}

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'wealth',
    fov: 38,
    fogDensity: 0.025,
    floorY: -2.6,
  });
  const { scene } = stage;
  const mats = createMaterials('wealth');

  // Heavy mechanical chassis frame behind gears
  const frameGeo = new THREE.BoxGeometry(5.8, 5.2, 0.28);
  const frame = new THREE.Mesh(frameGeo, mats.darkMetal);
  frame.position.set(0, 0.25, -0.65);
  scene.add(frame);
  const frameEdges = addXrayEdges(frameGeo, 0xffd60a, 0.24);
  frameEdges.position.copy(frame.position);
  scene.add(frameEdges);

  // 1. Center Giant Crimson 24% APR Ratchet Gear
  const aprMat = new THREE.MeshStandardMaterial({
    color: 0x991b1b,
    emissive: 0xdc2626,
    emissiveIntensity: 0.42,
    metalness: 0.78,
    roughness: 0.26,
  });
  aprGear = make3DGear({
    radius: 1.32,
    teeth: 18,
    thickness: 0.42,
    bodyMat: aprMat,
    accentMat: mats.glow(0xff3b30, 0.95),
  });
  aprGear.position.set(0, 0.55, 0);
  scene.add(aprGear);

  // 2. Left Small Weak Minimum-Payment Gear (steel + blue accent)
  minGear = make3DGear({
    radius: 0.72,
    teeth: 10,
    thickness: 0.36,
    bodyMat: mats.steel,
    accentMat: mats.glow(0x38bdf8, 0.75),
  });
  minGear.position.set(-1.95, 1.48, 0.05);
  scene.add(minGear);

  // 3. Right Emerald +$100/MO Turbo Overdrive Gear (slides in & crushes APR!)
  const turboMat = new THREE.MeshStandardMaterial({
    color: 0x15803d,
    emissive: 0x22c55e,
    emissiveIntensity: 0.55,
    metalness: 0.82,
    roughness: 0.20,
  });
  turboGear = make3DGear({
    radius: 1.05,
    teeth: 14,
    thickness: 0.44,
    bodyMat: turboMat,
    accentMat: mats.glow(0x30d158, 1.1),
  });
  turboGear.position.set(3.8, 1.45, 0.05);
  scene.add(turboGear);

  // 4. Suspended $5,000 Debt Load Cage below the gears
  debtBlock = new THREE.Group();
  debtBlock.position.set(0, -1.65, 0.2);

  const cageGeo = new THREE.BoxGeometry(2.8, 1.15, 0.95);
  const cage = new THREE.Mesh(cageGeo, mats.xrayGlass);
  debtBlock.add(cage);
  debtBlock.add(addXrayEdges(cageGeo, 0xffd60a, 0.55));

  debtCoreMat = new THREE.MeshStandardMaterial({
    color: 0xff3b30,
    emissive: 0xdc2626,
    emissiveIntensity: 0.65,
    metalness: 0.45,
    roughness: 0.22,
  });
  debtCore = new THREE.Mesh(new THREE.BoxGeometry(2.62, 0.96, 0.78), debtCoreMat);
  debtBlock.add(debtCore);
  scene.add(debtBlock);

  // 5. Glowing APR pulse shock ring
  aprShockRing = new THREE.Mesh(new THREE.TorusGeometry(1.55, 0.045, 12, 48), mats.glow(0xff3b30, 1.2));
  aprShockRing.position.set(0, 0.55, 0.28);
  scene.add(aprShockRing);

  // 6. Mechanical energy sparks flying off meshing teeth
  sparks = [];
  const spGeo = new THREE.OctahedronGeometry(0.08, 0);
  const spMat = mats.glow(0xffd60a, 1.4);
  for (let i = 0; i < 16; i++) {
    const m = new THREE.Mesh(spGeo, spMat);
    scene.add(m);
    sparks.push({ mesh: m, seed: i * 1.73 });
  }

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 23;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lRefill = getLine('refill', 1);
  const lMin = getLine('minpath', 2);
  const lExtra = getLine('extra', 3);
  const lRace = getLine('race', 4);
  const lVerd = getLine('verdict', 5);

  EVENTS = [
    { t: lRefill.start + 0.18, type: 'bounce', pitchIndex: 2, intensity: 0.70 },
    { t: lMin.start + 0.18, type: 'bounce', pitchIndex: 4, intensity: 0.65 },
    { t: lExtra.start + 0.15, type: 'break', pitchIndex: 8, intensity: 0.85 },
    { t: lRace.start + 0.20, type: 'win', pitchIndex: 11, intensity: 0.92 },
    { t: lVerd.start + 0.18, type: 'win', pitchIndex: 12, intensity: 0.95 },
  ];

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  const lRefill = getLine('refill', 1);
  const lMin = getLine('minpath', 2);
  const lExtra = getLine('extra', 3);
  const lRace = getLine('race', 4);
  const lVerd = getLine('verdict', 5);

  let activeCaption = SCRIPT[0].caption;
  for (let i = 0; i < SCRIPT.length; i++) {
    const ln = getLine(SCRIPT[i].id, i);
    if (t >= ln.start) activeCaption = ln.caption || SCRIPT[i].caption;
  }

  const pExtra = smooth(lExtra.start, lExtra.start + 1.0, t);
  const pRace = easeOutCubic(clamp((t - lRace.start) / Math.max(0.1, lVerd.start - lRace.start), 0, 1));

  // Balance simulation: before extra -> trapped near $4,850-$5,000 with 80% monthly refill; after extra -> crushed to $0!
  let balance = 5000;
  if (t < lExtra.start) {
    const cycle = (t * 1.15) % 1;
    // Pay down a slice, then crimson APR wave yanks 80% back
    const dip = cycle < 0.35 ? lerp(0, 420, cycle / 0.35) : lerp(420, 90, (cycle - 0.35) / 0.65);
    balance = 5000 - dip;
  } else {
    balance = lerp(4900, 0, pRace);
  }

  const balFrac = clamp(balance / 5000, 0.02, 1);

  // Gear rotation choreography
  if (t < lExtra.start) {
    // Ratchet tug-of-war: min gear tries to pull, APR gear yanks back harder
    const tug = Math.sin(t * 4.5) * 0.35;
    aprGear.rotation.z = -t * 1.45 + tug;
    minGear.rotation.z = t * 2.6 - tug * 1.8;
    aprShockRing.visible = true;
    const pulse = (t * 1.3) % 1;
    aprShockRing.scale.setScalar(0.85 + pulse * 0.65);
  } else {
    // Emerald Turbo gear slides in and overpowers the APR gear!
    turboGear.position.x = lerp(4.2, 2.22, pExtra);
    turboGear.rotation.z = t * 4.2;
    aprGear.rotation.z = -t * 3.3;
    minGear.rotation.z = t * 2.2;
    aprShockRing.visible = pRace < 0.8;
    aprShockRing.scale.setScalar(1.0 - pRace * 0.6);
  }

  // Update debt block core width + color shift (crimson -> emerald zeroed)
  debtCore.scale.set(balFrac, 1, 1);
  debtCore.position.x = -(1 - balFrac) * 1.31;
  const colRed = new THREE.Color(0xff3b30);
  const colGreen = new THREE.Color(0x30d158);
  debtCoreMat.color.copy(colRed).lerp(colGreen, pRace);
  debtCoreMat.emissive.copy(colRed).lerp(colGreen, pRace);

  // Flying sparks at active gear contact point
  const spX = t < lExtra.start ? -1.15 : 1.25;
  const spY = 1.15;
  for (const s of sparks) {
    const u = (t * 2.6 + s.seed) % 1;
    const ang = (s.seed * 2.3) % (Math.PI * 2);
    s.mesh.position.set(
      spX + Math.cos(ang) * u * 1.4,
      spY + Math.sin(ang) * u * 1.4 - u * u * 0.8,
      0.35 + Math.sin(s.seed) * 0.25,
    );
    s.mesh.scale.setScalar((1 - u) * 1.2);
  }

  // Camera Choreography: orbital view -> macro on APR gear -> heroic wide shot as turbo gear locks in
  const { camera } = stage;
  camera.position.set(
    Math.sin(t * 0.45) * 1.75 + lerp(0, 0.55, pExtra),
    0.55 + Math.cos(t * 0.5) * 0.28,
    lerp(9.6, 10.4, pExtra),
  );
  camera.lookAt(0, -0.1, 0);

  stage.composite(ctx, W, H);

  drawStudioHud(ctx, {
    W,
    H,
    channel: 'wealth',
    badge: t >= lExtra.start ? '+$100/MO OVERDRIVE · APR CRUSHED' : '24% APR RATCHET TRAP · 3D',
    title: 'CREDIT CARD MINIMUM TRAP',
    subtitle: t >= lExtra.start ? '3.3 YEARS · $6,400 INTEREST SAVED' : '$5,000 BALANCE → 16 YEARS AT MINIMUM',
    caption: activeCaption,
    metrics: [
      { label: 'BALANCE', value: '$' + Math.round(balance).toLocaleString('en-US'), color: balance < 500 ? '#30D158' : '#FF3B30' },
      { label: 'PAYOFF TIME', value: t >= lExtra.start ? '3.3 YRS' : '16.0 YRS', color: t >= lExtra.start ? '#30D158' : '#FFD60A' },
      { label: 'TOTAL PAID', value: t >= lExtra.start ? '$6,917' : '$13,301', color: t >= lExtra.start ? '#30D158' : '#FF3B30' },
    ],
    progress: t / Math.max(1, DUR),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
