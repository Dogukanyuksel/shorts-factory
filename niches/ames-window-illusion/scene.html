<!doctype html>
<!--
  Kinetic Lab HQ — The Ames Window 360° Brain Paradox (Real 3D PBR Rotating Trapezoid Window + Rigid Cyan Rod)
  Y-LABS 3D Cinema Engine (Three.js PBR, 60fps deterministic seamless loop)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0B0F19;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  drawStudioHud,
  lerp,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let W = 720, H = 1280, FPS = 60, DUR = 26, HOOK = 'CAN YOU SEE IT SPIN 360°?';
let stage = null, built = false, cachedEvents = [];
let pivotGroup, rodMesh, angleRing;

window.getEvents = () => cachedEvents;

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'physics',
    fov: 32,
    fogDensity: 0.022,
    floorY: -2.6,
  });
  const { scene } = stage;
  const mats = createMaterials('physics');

  // Pedestal rotation spindle
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.14, 2.4, 20), mats.darkMetal);
  stand.position.y = -1.6;
  scene.add(stand);

  // Rotating Ames Trapezoid Window Group (rotates full 360° continuously!)
  pivotGroup = new THREE.Group();
  pivotGroup.position.set(0, 0.25, 0);
  scene.add(pivotGroup);

  // Build authentic trapezoid outer frame + 6 inner window panes with painted-perspective depth
  const shape = new THREE.Shape();
  // Tall left edge (x=-1.65, y=±1.45) tapering sharply to short right edge (x=+1.65, y=±0.62)
  shape.moveTo(-1.65, -1.45);
  shape.lineTo(1.65, -0.62);
  shape.lineTo(1.65, 0.62);
  shape.lineTo(-1.65, 1.45);
  shape.closePath();

  // Cut 6 trapezoidal pane holes (2 rows x 3 columns)
  const cols = [-1.42, -0.48, 0.48, 1.42];
  for (let c = 0; c < 3; c++) {
    const x0 = cols[c] + 0.08;
    const x1 = cols[c + 1] - 0.08;
    const yTop = (x) => lerp(1.32, 0.52, (x + 1.65) / 3.3);
    for (const row of [-1, 1]) {
      const hole = new THREE.Path();
      const yInner = 0.08;
      if (row > 0) {
        hole.moveTo(x0, yInner);
        hole.lineTo(x1, yInner);
        hole.lineTo(x1, yTop(x1));
        hole.lineTo(x0, yTop(x0));
      } else {
        hole.moveTo(x0, -yTop(x0));
        hole.lineTo(x1, -yTop(x1));
        hole.lineTo(x1, -yInner);
        hole.lineTo(x0, -yInner);
      }
      hole.closePath();
      shape.holes.push(hole);
    }
  }

  const winGeo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.14,
    bevelEnabled: true,
    bevelSegments: 2,
    steps: 1,
    bevelSize: 0.025,
    bevelThickness: 0.025,
  });
  winGeo.translate(0, 0, -0.07);

  const winMat = new THREE.MeshStandardMaterial({
    color: 0xe2e8f0,
    emissive: 0x334155,
    emissiveIntensity: 0.25,
    metalness: 0.55,
    roughness: 0.28,
  });
  const winMesh = new THREE.Mesh(winGeo, winMat);
  pivotGroup.add(winMesh);

  // Subtle crimson marker on the TALL edge so viewers can track the impossible flip
  const tallMarker = new THREE.Mesh(new THREE.BoxGeometry(0.10, 2.75, 0.22), mats.glow(0xff3b30, 0.9));
  tallMarker.position.set(-1.65, 0, 0);
  pivotGroup.add(tallMarker);

  // Rigid glowing Cyan Rod passing STRAIGHT through the center pane — reveals the true 360° rotation!
  rodMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 3.6, 20), mats.glow(0x00f0ff, 1.3));
  rodMesh.rotation.z = Math.PI / 2;
  rodMesh.rotation.y = Math.PI / 2; // perpendicular to window plane
  pivotGroup.add(rodMesh);

  // Circular 360° reference ring below the window
  angleRing = new THREE.Mesh(new THREE.TorusGeometry(1.75, 0.025, 10, 64), mats.glow(0x00f0ff, 0.65));
  angleRing.rotation.x = Math.PI / 2;
  angleRing.position.set(0, -1.65, 0);
  scene.add(angleRing);

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  HOOK = cfg.hook || HOOK;
  cv.width = W;
  cv.height = H;

  cachedEvents = [];
  const turns = 4;
  for (let i = 0; i < turns * 2; i++) {
    cachedEvents.push({
      t: (i / (turns * 2)) * DUR + 0.15,
      type: i % 2 === 0 ? 'bounce' : 'break',
      pitchIndex: 4 + (i % 6),
      intensity: 0.72,
    });
  }

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  // Exact 4 full 360° rotations over DUR -> 100% seamless loop!
  const turns = 4;
  const theta = (t / Math.max(1, DUR)) * Math.PI * 2 * turns;
  pivotGroup.rotation.y = theta;

  const deg = Math.round(((theta * 180) / Math.PI) % 360);

  // Eye-level long-lens camera maximizes the Ames Window illusion!
  const { camera } = stage;
  camera.position.set(0, 0.35 + Math.sin((t / DUR) * Math.PI * 2) * 0.22, 10.6);
  camera.lookAt(0, 0.1, 0);

  stage.composite(ctx, W, H);

  drawStudioHud(ctx, {
    W,
    H,
    channel: 'physics',
    badge: HOOK,
    title: 'THE AMES WINDOW PARADOX',
    subtitle: 'YOUR BRAIN SEES IT ROCK · IT SPINS 360°',
    caption: deg > 160 && deg < 200 ? 'WATCH THE CYAN ROD PASS THROUGH!' : 'TRUE 360° ROTATION · ZERO TRICKS',
    metrics: [
      { label: 'TRUE ANGLE', value: `${deg}°`, color: '#00F0FF' },
      { label: 'BRAIN SEES', value: 'OSCILLATING', color: '#FF3B30' },
      { label: 'ILLUSION', value: '99.4% FAIL', color: '#FFD60A' },
    ],
    progress: (t % (DUR / turns)) / (DUR / turns),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
