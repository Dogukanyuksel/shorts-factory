<!doctype html>
<!--
  Niş #1: Physics Ring Escape Simulation (100% kodla çizilen, deterministik 60fps viral Shorts).
  Her çarpışmada pentatonik nota tetikler; her kırılan halkada neon parçacık patlaması ve kamera sarsıntısı üretir.
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#050712;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const RING_COLORS = ['#22d3ee', '#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#fb923c', '#facc15'];

let W = 720, H = 1280, FPS = 60, HOOK = 'CAN IT ESCAPE ALL 7 RINGS?';
let rings = [], ball = null, trail = [], sparks = [], waves = [], events = [];
let shake = 0, bounceCount = 0, brokenCount = 0, won = false, simTime = 0, rngState = 1;

function nextRand() {
  rngState = (rngState * 1664525 + 1013904223) >>> 0;
  return rngState / 4294967296;
}

function normAngle(a) {
  let x = a % (Math.PI * 2);
  if (x < 0) x += Math.PI * 2;
  return x;
}

function angleInGap(theta, gapCenter, gapHalf) {
  const diff = Math.abs(Math.atan2(Math.sin(theta - gapCenter), Math.cos(theta - gapCenter)));
  return diff <= gapHalf;
}

function spawnSparks(x, y, color, count = 28) {
  for (let i = 0; i < count; i++) {
    const a = nextRand() * Math.PI * 2;
    const sp = 140 + nextRand() * 440;
    sparks.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 0.45 + nextRand() * 0.45,
      maxLife: 0.9,
      size: 3 + nextRand() * 5,
      color,
    });
  }
}

window.init = (cfg) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  HOOK = cfg.hook || 'CAN IT ESCAPE ALL 7 RINGS?';
  cv.width = W;
  cv.height = H;
  rngState = (cfg.seed || 1) * 97531 + 17;

  const S = W / 720;
  const cx = W * 0.5, cy = H * 0.53;
  rings = [];
  for (let i = 0; i < 7; i++) {
    rings.push({
      r: (110 + i * 33) * S,
      angle: nextRand() * Math.PI * 2,
      speed: (i % 2 === 0 ? 1 : -1) * (1.25 - i * 0.08 + nextRand() * 0.25),
      gapHalf: 0.34 + (6 - i) * 0.015,
      color: RING_COLORS[i],
      broken: false,
      flash: 0,
    });
  }

  const startAng = nextRand() * Math.PI * 2;
  ball = {
    x: cx + Math.cos(startAng) * 24 * S,
    y: cy - 28 * S,
    vx: (nextRand() > 0.5 ? 1 : -1) * (240 + nextRand() * 90) * S,
    vy: (-180 - nextRand() * 90) * S,
    r: 16 * S,
    color: '#ffffff',
  };
  trail = [];
  sparks = [];
  waves = [];
  events = [];
  shake = 0;
  bounceCount = 0;
  brokenCount = 0;
  won = false;
  simTime = 0;
};

function stepPhysics(dt) {
  const S = W / 720;
  const cx = W * 0.5, cy = H * 0.53;
  const gravity = 820 * S;
  const subSteps = 4;
  const sdt = dt / subSteps;

  for (let s = 0; s < subSteps; s++) {
    simTime += sdt;
    ball.vy += gravity * sdt;
    ball.x += ball.vx * sdt;
    ball.y += ball.vy * sdt;

    for (const ring of rings) {
      if (ring.broken) continue;
      ring.angle = normAngle(ring.angle + ring.speed * sdt);
      if (ring.flash > 0) ring.flash = Math.max(0, ring.flash - sdt * 4);
    }

    // Aktif en içteki kırılmamış halka
    const active = rings.find((rg) => !rg.broken);
    if (active) {
      const dx = ball.x - cx, dy = ball.y - cy;
      const dist = Math.hypot(dx, dy);
      if (dist + ball.r >= active.r) {
        const theta = normAngle(Math.atan2(dy, dx));
        if (angleInGap(theta, active.angle, active.gapHalf)) {
          // Halka kırıldı!
          active.broken = true;
          brokenCount++;
          shake = 14 * S;
          waves.push({ r: active.r, color: active.color, alpha: 0.9 });
          for (let a = 0; a < Math.PI * 2; a += Math.PI / 14) {
            spawnSparks(cx + Math.cos(a) * active.r, cy + Math.sin(a) * active.r, active.color, 3);
          }
          events.push({ t: simTime, type: 'break', pitchIndex: brokenCount * 2, intensity: 0.95 });
          if (brokenCount === rings.length && !won) {
            won = true;
            events.push({ t: simTime + 0.08, type: 'win', pitchIndex: 10, intensity: 1.0 });
          }
        } else {
          // Halkadan sekme
          const nx = dx / Math.max(1e-4, dist);
          const ny = dy / Math.max(1e-4, dist);
          ball.x = cx + nx * (active.r - ball.r - 0.5);
          ball.y = cy + ny * (active.r - ball.r - 0.5);
          const dot = ball.vx * nx + ball.vy * ny;
          if (dot > 0) {
            const boost = 1.035;
            ball.vx = (ball.vx - 2 * dot * nx) * boost;
            ball.vy = (ball.vy - 2 * dot * ny) * boost;
            // Aşırı hızlanmayı kontrollü tut
            const spd = Math.hypot(ball.vx, ball.vy);
            const maxSpd = 1080 * S;
            if (spd > maxSpd) {
              ball.vx = (ball.vx / spd) * maxSpd;
              ball.vy = (ball.vy / spd) * maxSpd;
            }
            active.flash = 1.0;
            bounceCount++;
            shake = Math.max(shake, 4.5 * S);
            spawnSparks(ball.x + nx * ball.r, ball.y + ny * ball.r, active.color, 10);
            events.push({ t: simTime, type: 'bounce', pitchIndex: bounceCount, intensity: 0.8 });
          }
        }
      }
    }
  }

  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > 26) trail.shift();

  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= dt;
    if (p.life <= 0) sparks.splice(i, 1);
  }
  for (let i = waves.length - 1; i >= 0; i--) {
    waves[i].r += 260 * S * dt;
    waves[i].alpha -= dt * 2.2;
    if (waves[i].alpha <= 0) waves.splice(i, 1);
  }
  shake *= 0.84;
}

function drawFrame() {
  const S = W / 720;
  const cx = W * 0.5, cy = H * 0.53;

  // Derin koyu arka plan
  const bg = ctx.createRadialGradient(cx, cy, 40 * S, cx, cy, H * 0.65);
  bg.addColorStop(0, '#0f172a');
  bg.addColorStop(0.55, '#070b18');
  bg.addColorStop(1, '#03040a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // İnce neon ızgara
  ctx.strokeStyle = 'rgba(56,189,248,0.045)';
  ctx.lineWidth = 1.2 * S;
  for (let x = 0; x < W; x += 48 * S) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 48 * S) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  ctx.save();
  if (shake > 0.4) {
    ctx.translate((nextRand() - 0.5) * shake, (nextRand() - 0.5) * shake);
  }

  // Şok dalgaları
  for (const w of waves) {
    ctx.strokeStyle = w.color;
    ctx.globalAlpha = Math.max(0, w.alpha);
    ctx.lineWidth = 5 * S;
    ctx.beginPath(); ctx.arc(cx, cy, w.r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Dönen neon halkalar
  for (const rg of rings) {
    if (rg.broken) continue;
    ctx.save();
    ctx.strokeStyle = rg.flash > 0.2 ? '#ffffff' : rg.color;
    ctx.shadowColor = rg.color;
    ctx.shadowBlur = (16 + rg.flash * 18) * S;
    ctx.lineWidth = (10 + rg.flash * 4) * S;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, rg.r, rg.angle + rg.gapHalf, rg.angle + Math.PI * 2 - rg.gapHalf);
    ctx.stroke();
    ctx.restore();
  }

  // Parçacıklar
  for (const p of sparks) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10 * S;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * S, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Topun parlak izi
  const activeColor = rings.find((rg) => !rg.broken)?.color || '#facc15';
  for (let i = 1; i < trail.length; i++) {
    const k = i / trail.length;
    ctx.strokeStyle = activeColor;
    ctx.globalAlpha = k * 0.55;
    ctx.lineWidth = ball.r * 1.5 * k;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Parlak neon top
  ctx.save();
  ctx.shadowColor = activeColor;
  ctx.shadowBlur = 24 * S;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = activeColor;
  ctx.lineWidth = 4 * S;
  ctx.stroke();
  ctx.restore();
  ctx.restore();

  // Üst kanca başlığı (sessizde bile ilk 1 sn tutar)
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(42 * S)}px -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.75)';
  ctx.shadowBlur = 14 * S;
  ctx.fillText(HOOK, W * 0.5, H * 0.145);

  // Kalan halka sayacı
  const rem = rings.length - brokenCount;
  const pillText = rem > 0 ? `RINGS LEFT: ${rem}` : 'ESCAPED ALL 7!';
  ctx.font = `800 ${Math.round(28 * S)}px -apple-system, BlinkMacSystemFont, sans-serif`;
  const pillW = 280 * S, pillH = 54 * S, px = W * 0.5 - pillW / 2, py = H * 0.175;
  ctx.fillStyle = rem > 0 ? 'rgba(15,23,42,0.78)' : 'rgba(250,204,21,0.22)';
  ctx.strokeStyle = rem > 0 ? activeColor : '#facc15';
  ctx.lineWidth = 2.5 * S;
  ctx.beginPath(); ctx.roundRect(px, py, pillW, pillH, 27 * S); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = rem > 0 ? '#f8fafc' : '#fde047';
  ctx.fillText(pillText, W * 0.5, py + 37 * S);
  ctx.restore();
}

window.renderBatch = (_startFrame, count) => {
  const out = [];
  const dt = 1 / FPS;
  for (let i = 0; i < count; i++) {
    stepPhysics(dt);
    drawFrame();
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};
window.getEvents = () => events;
window.ready = true;
</script>
