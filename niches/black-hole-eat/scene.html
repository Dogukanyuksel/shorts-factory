<!doctype html>
<!--
  Kinetic Lab HQ — 3D PBR: Black Hole Tidal Disruption (Spaghettification)
  Y-LABS 3D Cinema Engine (Three.js PBR Event Horizon + Glowing Accretion Disk + Tidal Stream, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0B0F19;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let W = 720, H = 1280, FPS = 60, DUR = 26, EVENTS = [];
let stage = null, built = false;
let bhCore, photonRing, diskRings = [], debris = [];

window.getEvents = () => EVENTS;

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'physics', fov: 40, fogDensity: 0.018, floorY: -3.5 });
  const { scene } = stage;
  const mats = createMaterials('physics');

  // Pitch-black Event Horizon Sphere
  bhCore = new THREE.Mesh(
    new THREE.SphereGeometry(1.15, 36, 36),
    new THREE.MeshStandardMaterial({ color: 0x020308, metalness: 0.95, roughness: 0.08 }),
  );
  scene.add(bhCore);

  // Photon Sphere Ring (vertical lensing halo)
  photonRing = new THREE.Mesh(new THREE.TorusGeometry(1.38, 0.055, 16, 64), mats.glow(0xff9500, 1.0));
  scene.add(photonRing);

  // Multi-layered Accretion Disk
  const diskColors = [0xff3b30, 0xff9500, 0xfacc15, 0x00f0ff];
  diskRings = diskColors.map((col, i) => {
    const r = new THREE.Mesh(
      new THREE.TorusGeometry(1.65 + i * 0.42, 0.09 - i * 0.012, 14, 72),
      mats.glow(col, 0.92 - i * 0.14),
    );
    r.rotation.x = Math.PI / 2 + 0.18;
    scene.add(r);
    return r;
  });

  // 36 Star Debris Particles being spaghettified inward
  const pGeo = new THREE.SphereGeometry(0.085, 12, 12);
  for (let i = 0; i < 36; i++) {
    const m = new THREE.Mesh(pGeo, mats.glow(i % 3 === 0 ? 0x00f0ff : 0xff9500, 1.0));
    m.userData = {
      angle: (i / 36) * Math.PI * 2,
      baseR: 1.55 + (i % 9) * 0.28,
      yOff: ((i % 5) - 2) * 0.08,
      speed: 1.1 + (9 - (i % 9)) * 0.25,
    };
    scene.add(m);
    debris.push(m);
  }

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  cv.width = W;
  cv.height = H;
  buildScene();

  EVENTS = [
    { t: 3.0, type: 'bounce', intensity: 0.75 },
    { t: 10.5, type: 'break', intensity: 0.9 },
    { t: 18.0, type: 'break', intensity: 1.0 },
    { t: 23.0, type: 'win', intensity: 0.95 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  bhCore.scale.setScalar(1 + p * 0.22);
  photonRing.scale.setScalar(1 + p * 0.22);
  photonRing.rotation.y = t * 0.4;

  diskRings.forEach((r, i) => {
    r.rotation.z = t * (1.6 - i * 0.25);
  });

  debris.forEach((m) => {
    const shrink = 1 - ((p * 0.65 + (m.userData.angle / (Math.PI * 2)) * 0.2) % 0.55);
    const r = Math.max(1.22, m.userData.baseR * shrink);
    const a = m.userData.angle + t * m.userData.speed;
    m.position.set(Math.cos(a) * r, m.userData.yOff + Math.sin(a) * r * 0.18, Math.sin(a) * r);
    // Spaghettification stretch near horizon
    const stretch = clamp(2.6 / r, 1, 2.4);
    m.scale.set(stretch, 0.7, 0.7);
    m.rotation.y = -a;
  });

  const camA = lerp(-0.5, 0.65, p);
  stage.camera.position.set(Math.sin(camA) * 7.6, lerp(1.8, 0.7, p), Math.cos(camA) * 7.6);
  stage.camera.lookAt(0, 0, 0);

  stage.renderTo(ctx, W, H);

  const dilation = (1 + p * p * 18.4).toFixed(1);
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'physics',
    title: 'EVENT HORIZON 3D',
    subtitle: 'TIDAL SPAGHETTIFICATION',
    progress: p,
    caption: p < 0.35 ? 'PHOTON SPHERE ORBIT' : p < 0.72 ? 'TIDAL FORCE STRETCH' : 'TIME DILATION ×19',
    metrics: [
      { label: 'TIME SLOW', value: `${dilation}×`, color: '#00F0FF' },
      { label: 'DISK TEMP', value: '12M K', color: '#FF9500' },
      { label: 'ESCAPE', value: '> c', color: '#FF3B30' },
    ],
  });
};
</script>
