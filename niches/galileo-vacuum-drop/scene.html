<!doctype html>
<!--
  Kinetic Lab HQ — Galileo's Law in Vacuum: Bowling Ball vs Feather (1.00 ATM vs 0.00 ATM)
  Y-LABS 3D Cinema Engine (Three.js PBR Dual X-Ray Vacuum Chambers, 60fps deterministic seamless loop)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0B0F19;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let W = 720, H = 1280, FPS = 60, DUR = 30, HOOK = 'BOWLING BALL VS FEATHER IN VACUUM';
let stage = null, built = false, cachedEvents = [];

// 3D Handles
let leftBall, leftFeather, rightBall, rightFeather;
let airMolecules = [], leftShock, rightShock;

const TOP_Y = 2.65;
const BOT_Y = -2.05;
const DROP_H = TOP_Y - BOT_Y;

// Cycle timing inside DUR (2 complete dramatic drops -> seamless loop)
const CYCLE_DUR = 10.0;
const T_RELEASE = 1.2;
const T_VAC_LAND = 3.4;      // 2.20s freefall
const T_AIR_BALL = 3.44;     // 2.24s with slight drag
const T_AIR_FEATHER = 8.4;   // 7.20s slow flutter

window.getEvents = () => cachedEvents;

function makeBowlingBall(mats) {
  const g = new THREE.Group();
  const ballMat = new THREE.MeshStandardMaterial({
    color: 0x111827,
    emissive: 0x0f172a,
    emissiveIntensity: 0.25,
    metalness: 0.72,
    roughness: 0.14,
  });
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.36, 28, 28), ballMat));
  // Glowing equatorial ring for crisp readability
  const eq = new THREE.Mesh(new THREE.TorusGeometry(0.365, 0.018, 10, 32), mats.glow(0x00f0ff, 0.75));
  eq.rotation.x = Math.PI / 2;
  g.add(eq);
  // 3 classic finger holes
  const holeMat = new THREE.MeshBasicMaterial({ color: 0x020617 });
  const hPos = [[-0.08, 0.12, 0.33], [0.08, 0.12, 0.33], [0, -0.05, 0.35]];
  for (const [x, y, z] of hPos) {
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 10), holeMat);
    h.position.set(x, y, z);
    g.add(h);
  }
  return g;
}

function makeFeather(mats) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.022, 0.82, 10), mats.glow(0xfef3c7, 0.55));
  shaft.rotation.z = Math.PI / 2;
  g.add(shaft);
  // Translucent luminous vane barbs
  const vaneMat = new THREE.MeshStandardMaterial({
    color: 0xfde68a,
    emissive: 0xf59e0b,
    emissiveIntensity: 0.45,
    roughness: 0.35,
    metalness: 0.15,
    side: THREE.DoubleSide,
  });
  for (let i = -5; i <= 5; i++) {
    const w = 0.24 * Math.cos((i / 6) * (Math.PI * 0.48));
    const barb = new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.012, w * 2), vaneMat);
    barb.position.set(i * 0.062, 0, 0);
    g.add(barb);
  }
  return g;
}

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'physics',
    fov: 40,
    fogDensity: 0.024,
    floorY: -2.45,
  });
  const { scene } = stage;
  const mats = createMaterials('physics');

  // Dual X-Ray NASA Vacuum Chambers: Left (-1.55) = 1.00 ATM Air, Right (+1.55) = 0.00 ATM Vacuum
  const chamberXs = [-1.55, 1.55];
  const chamberCols = [0xff3b30, 0x00f0ff];

  for (let i = 0; i < 2; i++) {
    const cx = chamberXs[i];
    const col = chamberCols[i];
    const cg = new THREE.Group();
    cg.position.set(cx, 0.3, 0);

    const wallGeo = new THREE.CylinderGeometry(1.18, 1.18, 5.4, 32, 1, true);
    const wall = new THREE.Mesh(wallGeo, mats.xrayGlass);
    cg.add(wall);
    cg.add(addXrayEdges(new THREE.CylinderGeometry(1.20, 1.20, 5.4, 16, 1, true), col, 0.45));

    // Heavy machined steel top & bottom pressure caps
    const capGeo = new THREE.CylinderGeometry(1.26, 1.26, 0.24, 32);
    const topCap = new THREE.Mesh(capGeo, mats.darkMetal);
    topCap.position.y = 2.78;
    cg.add(topCap);
    const botCap = new THREE.Mesh(capGeo, mats.darkMetal);
    botCap.position.y = -2.72;
    cg.add(botCap);

    // Glowing status collar ring
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.24, 0.04, 12, 40), mats.glow(col, 0.85));
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 2.66;
    cg.add(ring);

    const botRing = new THREE.Mesh(new THREE.TorusGeometry(1.24, 0.04, 12, 40), mats.glow(col, 0.85));
    botRing.rotation.x = Math.PI / 2;
    botRing.position.y = -2.6;
    cg.add(botRing);

    scene.add(cg);
  }

  // Floating glowing air molecules ONLY inside Left Chamber (1.00 ATM)
  airMolecules = [];
  const molGeo = new THREE.SphereGeometry(0.055, 10, 10);
  const molMat = mats.glow(0xff6b6b, 0.85);
  for (let i = 0; i < 36; i++) {
    const m = new THREE.Mesh(molGeo, molMat);
    scene.add(m);
    airMolecules.push({
      mesh: m,
      ang: i * 2.39996,
      rad: 0.2 + ((i * 37) % 85) / 100,
      yBase: -2.0 + (i / 36) * 4.8,
      spd: 0.8 + (i % 5) * 0.25,
    });
  }

  // Balls & Feathers
  leftBall = makeBowlingBall(mats);
  leftFeather = makeFeather(mats);
  rightBall = makeBowlingBall(mats);
  rightFeather = makeFeather(mats);
  scene.add(leftBall, leftFeather, rightBall, rightFeather);

  // Impact shockwave rings on floor of each chamber
  leftShock = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.035, 10, 36), mats.glow(0xff3b30, 1.2));
  leftShock.rotation.x = Math.PI / 2;
  leftShock.position.set(-1.55, BOT_Y - 0.3, 0);
  leftShock.visible = false;

  rightShock = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.045, 10, 36), mats.glow(0x00f0ff, 1.4));
  rightShock.rotation.x = Math.PI / 2;
  rightShock.position.set(1.55, BOT_Y - 0.3, 0);
  rightShock.visible = false;
  scene.add(leftShock, rightShock);

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 30;
  HOOK = cfg.hook || HOOK;
  cv.width = W;
  cv.height = H;

  cachedEvents = [];
  const cycles = Math.max(1, Math.floor(DUR / CYCLE_DUR));
  for (let c = 0; c < cycles; c++) {
    const base = c * CYCLE_DUR;
    cachedEvents.push({ t: base + T_RELEASE, type: 'bounce', pitchIndex: 2, intensity: 0.55 });
    cachedEvents.push({ t: base + T_VAC_LAND, type: 'break', pitchIndex: 8, intensity: 0.96 });
    cachedEvents.push({ t: base + T_AIR_FEATHER, type: 'win', pitchIndex: 5, intensity: 0.72 });
  }

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  const cycleT = t % CYCLE_DUR;
  const elapsed = Math.max(0, cycleT - T_RELEASE);

  // Physics drop math (y = TOP_Y - 0.5 * a * dt^2)
  const vacProgress = clamp(elapsed / (T_VAC_LAND - T_RELEASE), 0, 1);
  const vacY = TOP_Y - DROP_H * (vacProgress * vacProgress);

  const airBallProg = clamp(elapsed / (T_AIR_BALL - T_RELEASE), 0, 1);
  const airBallY = TOP_Y - DROP_H * (airBallProg * airBallProg);

  const airFeaProg = clamp(elapsed / (T_AIR_FEATHER - T_RELEASE), 0, 1);
  // Terminal velocity linear-ish descent + aerodynamic flutter
  const airFeaY = TOP_Y - DROP_H * (0.25 * airFeaProg * airFeaProg + 0.75 * airFeaProg);
  const flutterX = airFeaProg > 0 && airFeaProg < 1 ? Math.sin(elapsed * 4.2) * 0.24 : 0;
  const flutterRot = airFeaProg > 0 && airFeaProg < 1 ? Math.sin(elapsed * 4.2) * 0.42 : 0;

  // Reset lift smoothly in last 1.0s of cycle for seamless loop
  const resetP = smooth(CYCLE_DUR - 1.1, CYCLE_DUR - 0.1, cycleT);
  const yLB = lerp(airBallY, TOP_Y, resetP);
  const yLF = lerp(airFeaY, TOP_Y, resetP);
  const yRB = lerp(vacY, TOP_Y, resetP);
  const yRF = lerp(vacY, TOP_Y, resetP);

  leftBall.position.set(-1.95, yLB, 0);
  leftBall.rotation.y = t * 1.2;
  leftFeather.position.set(-1.12 + flutterX * (1 - resetP), yLF, 0);
  leftFeather.rotation.set(0, t * 0.5, flutterRot * (1 - resetP));

  rightBall.position.set(1.15, yRB, 0);
  rightBall.rotation.y = t * 1.2;
  rightFeather.position.set(1.98, yRF, 0);
  rightFeather.rotation.set(0, 0, 0);

  // Air molecules swirl in left chamber
  for (const m of airMolecules) {
    const a = m.ang + t * m.spd;
    m.mesh.position.set(
      -1.55 + Math.cos(a) * m.rad,
      m.yBase + Math.sin(t * 2.1 + m.ang) * 0.18,
      Math.sin(a) * m.rad,
    );
  }

  // Impact shockwaves
  const rImp = clamp((cycleT - T_VAC_LAND) / 0.7, 0, 1);
  rightShock.visible = cycleT >= T_VAC_LAND && rImp < 1;
  if (rightShock.visible) {
    rightShock.scale.setScalar(0.4 + rImp * 2.1);
  }
  const lImp = clamp((cycleT - T_AIR_BALL) / 0.7, 0, 1);
  leftShock.visible = cycleT >= T_AIR_BALL && lImp < 1;
  if (leftShock.visible) {
    leftShock.scale.setScalar(0.4 + lImp * 1.8);
  }

  // Seamless orbital camera (full periodic wave over DUR)
  const { camera } = stage;
  const loopPhase = (t / Math.max(1, DUR)) * Math.PI * 2;
  camera.position.set(
    Math.sin(loopPhase) * 1.15,
    0.8 + Math.cos(loopPhase) * 0.3,
    11.6,
  );
  camera.lookAt(0, 0.1, 0);

  stage.composite(ctx, W, H);

  const inVacHit = cycleT >= T_VAC_LAND && cycleT < T_AIR_FEATHER;
  drawStudioHud(ctx, {
    W,
    H,
    channel: 'physics',
    badge: HOOK,
    title: 'GALILEO VACUUM DROP · 3D',
    subtitle: 'LEFT: 1.00 ATM AIR  |  RIGHT: 0.00 ATM VACUUM',
    caption: inVacHit ? 'EXACT TIE IN VACUUM: 2.20s!' : 'g = 9.81 m/s² INDEPENDENT OF MASS',
    metrics: [
      { label: 'AIR (1 ATM)', value: airFeaProg < 1 ? `${Math.min(7.2, elapsed).toFixed(2)}s` : '7.20s', color: '#FF3B30' },
      { label: 'VACUUM (0 ATM)', value: `${Math.min(2.2, elapsed).toFixed(2)}s`, color: '#00F0FF' },
      { label: 'GRAVITY', value: '9.81 m/s²', color: '#FFD60A' },
    ],
    progress: cycleT / CYCLE_DUR,
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
