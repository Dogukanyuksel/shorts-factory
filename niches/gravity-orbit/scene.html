<!doctype html>
<!-- 3-Body Gravitational Dance: Cyan, Gold & Magenta celestial bodies under N-body gravity -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#050712;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 720, H = 1280, FPS = 60, DUR = 32, HOOK = '3-BODY GRAVITY DANCE!';
let rng = 1, simTime = 0, events = [];
let bodies = [], stars = [], ripples = [], sparks = [];
let pairPrevDist = [99, 99, 99], pairCooling = [0, 0, 0];
let slingshotCount = 0, maxSpeed = 0, finaleTriggered = false;
let camX = 0, camY = 0, camScale = 1;

const rand = () => { rng = (rng * 1664525 + 1013904223) >>> 0; return rng / 4294967296; };

const G_CONST = 1.0;
const SOFT = 0.018;

function computeAcc(state) {
  const acc = [{ ax: 0, ay: 0 }, { ax: 0, ay: 0 }, { ax: 0, ay: 0 }];
  for (let i = 0; i < 3; i++) {
    for (let j = i + 1; j < 3; j++) {
      const dx = state[j].x - state[i].x;
      const dy = state[j].y - state[i].y;
      const r2 = dx * dx + dy * dy + SOFT;
      const invR3 = G_CONST / (r2 * Math.sqrt(r2));
      const fx = dx * invR3;
      const fy = dy * invR3;
      acc[i].ax += fx * state[j].m;
      acc[i].ay += fy * state[j].m;
      acc[j].ax -= fx * state[i].m;
      acc[j].ay -= fy * state[i].m;
    }
    // Gentle outer harmonic tether beyond r > 2.4 to guarantee bodies never escape viewport forever
    const r = Math.hypot(state[i].x, state[i].y);
    if (r > 2.15) {
      const pull = (r - 2.15) * 0.35;
      acc[i].ax -= (state[i].x / r) * pull;
      acc[i].ay -= (state[i].y / r) * pull;
    }
  }
  return acc;
}

window.init = (cfg) => {
  W = cfg.width || 720; H = cfg.height || 1280; FPS = cfg.fps || 60; DUR = cfg.seconds || 32;
  HOOK = cfg.hook || '3-BODY GRAVITY DANCE!';
  cv.width = W; cv.height = H;
  rng = ((cfg.seed || 1) * 2246822519 + 31) >>> 0;

  // Deterministic Chenciner-Montgomery Figure-8 choreography with subtle seed perturbation
  const p = (rand() - 0.5) * 0.085;
  const pv = (rand() - 0.5) * 0.07;
  const x1 = 0.97000436 + p, y1 = -0.24308753 - p * 0.4;
  const vx3 = -0.93240737 + pv, vy3 = -0.86473146 - pv * 0.5;
  const vx1 = -0.5 * vx3, vy1 = -0.5 * vy3;

  bodies = [
    { name: 'CYAN', col: '#22d3ee', rgb: '34,211,238', m: 1.0, x: x1, y: y1, vx: vx1, vy: vy1, trail: [] },
    { name: 'GOLD', col: '#facc15', rgb: '250,204,21', m: 1.02, x: -x1, y: -y1, vx: vx1, vy: vy1, trail: [] },
    { name: 'MAGENTA', col: '#f472b6', rgb: '244,114,182', m: 0.98, x: 0, y: 0, vx: vx3, vy: vy3, trail: [] },
  ];

  stars = Array.from({ length: 95 }, () => ({
    x: rand() * W,
    y: rand() * H,
    r: 0.8 + rand() * 1.9,
    phase: rand() * Math.PI * 2,
    spd: 1.2 + rand() * 2.5,
  }));

  ripples = []; sparks = [];
  pairPrevDist = [99, 99, 99];
  pairCooling = [0, 0, 0];
  slingshotCount = 0; maxSpeed = 0;
  camX = 0; camY = 0; camScale = 1;
  events = []; simTime = 0; finaleTriggered = false;
};

function step(dt) {
  simTime += dt;
  const isFinale = simTime >= DUR - 2.6;
  const timeScale = isFinale ? 0.25 : 0.72;
  const sub = 8;
  const h = (dt * timeScale) / sub;

  // Velocity Verlet integration
  for (let s = 0; s < sub; s++) {
    const acc0 = computeAcc(bodies);
    for (let i = 0; i < 3; i++) {
      bodies[i].x += bodies[i].vx * h + 0.5 * acc0[i].ax * h * h;
      bodies[i].y += bodies[i].vy * h + 0.5 * acc0[i].ay * h * h;
    }
    const acc1 = computeAcc(bodies);
    for (let i = 0; i < 3; i++) {
      bodies[i].vx += 0.5 * (acc0[i].ax + acc1[i].ax) * h;
      bodies[i].vy += 0.5 * (acc0[i].ay + acc1[i].ay) * h;
    }
  }

  // Record trails & track max speed
  for (const b of bodies) {
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 300) b.trail.shift();
    const spd = Math.hypot(b.vx, b.vy);
    if (spd > maxSpeed) maxSpeed = spd;
  }

  // Detect close-encounter gravitational slingshots
  const pairs = [[0, 1], [1, 2], [0, 2]];
  pairs.forEach(([i, j], idx) => {
    if (pairCooling[idx] > 0) pairCooling[idx] -= dt;
    const d = Math.hypot(bodies[i].x - bodies[j].x, bodies[i].y - bodies[j].y);
    if (!isFinale && pairCooling[idx] <= 0 && d < 0.58 && d > pairPrevDist[idx] && pairPrevDist[idx] < 0.56) {
      pairCooling[idx] = 0.55;
      slingshotCount++;
      const relSpd = Math.hypot(bodies[i].vx - bodies[j].vx, bodies[i].vy - bodies[j].vy);
      const mx = 0.5 * (bodies[i].x + bodies[j].x);
      const my = 0.5 * (bodies[i].y + bodies[j].y);
      ripples.push({ x: mx, y: my, r: 0.05, alpha: 1.0, col: bodies[i].col });
      for (let k = 0; k < 14; k++) {
        const ang = (k / 14) * Math.PI * 2 + rand() * 0.3;
        const v = 0.4 + rand() * 1.1;
        sparks.push({ x: mx, y: my, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, life: 1.0, col: k % 2 ? bodies[i].col : bodies[j].col });
      }
      const pitch = Math.min(13, Math.floor(relSpd * 3.8));
      events.push({
        t: simTime,
        type: relSpd > 2.3 ? 'break' : 'bounce',
        pitchIndex: pitch,
        intensity: Math.min(1.0, 0.45 + relSpd * 0.2),
      });
    }
    pairPrevDist[idx] = d;
  });

  // Update visual FX
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].r += dt * 1.15;
    ripples[i].alpha -= dt * 1.1;
    if (ripples[i].alpha <= 0) ripples.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    sparks[i].x += sparks[i].vx * dt;
    sparks[i].y += sparks[i].vy * dt;
    sparks[i].life -= dt * 1.6;
    if (sparks[i].life <= 0) sparks.splice(i, 1);
  }

  // Smooth camera tracking center of mass & bounding radius
  let cx = 0, cy = 0;
  for (const b of bodies) { cx += b.x; cy += b.y; }
  cx /= 3; cy /= 3;
  let maxR = 0.9;
  for (const b of bodies) maxR = Math.max(maxR, Math.hypot(b.x - cx, b.y - cy));
  const targetScale = Math.max(0.58, Math.min(1.18, 1.38 / (maxR + 0.35)));
  camX += (cx - camX) * 0.08;
  camY += (cy - camY) * 0.08;
  camScale += (targetScale - camScale) * 0.06;

  if (isFinale && !finaleTriggered) {
    finaleTriggered = true;
    events.push({ t: simTime, type: 'win', pitchIndex: 11, intensity: 1.0 });
  }
}

function toScreen(wx, wy) {
  const S = W / 720;
  const pxScale = 235 * S * camScale;
  return {
    x: W * 0.5 + (wx - camX) * pxScale,
    y: H * 0.48 + (wy - camY) * pxScale,
  };
}

function draw() {
  const S = W / 720;
  const isFinale = simTime >= DUR - 2.6;

  ctx.fillStyle = '#050712';
  ctx.fillRect(0, 0, W, H);

  // Subtle nebula backdrop
  const neb = ctx.createRadialGradient(W * 0.5, H * 0.48, 30 * S, W * 0.5, H * 0.48, 440 * S);
  neb.addColorStop(0, 'rgba(56,189,248,0.09)');
  neb.addColorStop(0.5, 'rgba(168,85,247,0.05)');
  neb.addColorStop(1, 'rgba(5,7,18,0)');
  ctx.fillStyle = neb;
  ctx.fillRect(0, 0, W, H);

  // Twinkling stars
  for (const st of stars) {
    const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(simTime * st.spd + st.phase));
    ctx.fillStyle = `rgba(226,232,240,${a.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r * S, 0, Math.PI * 2); ctx.fill();
  }

  // Gravity tether lines between bodies
  ctx.save();
  for (let i = 0; i < 3; i++) {
    for (let j = i + 1; j < 3; j++) {
      const p1 = toScreen(bodies[i].x, bodies[i].y);
      const p2 = toScreen(bodies[j].x, bodies[j].y);
      const d = Math.hypot(bodies[i].x - bodies[j].x, bodies[i].y - bodies[j].y);
      const alpha = Math.max(0.05, Math.min(0.45, 0.22 / (d + 0.2)));
      ctx.strokeStyle = `rgba(148,163,184,${alpha.toFixed(3)})`;
      ctx.lineWidth = (1.5 + alpha * 3) * S;
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
  }
  ctx.restore();

  // Slingshot ripples
  const pxScale = 235 * S * camScale;
  for (const rp of ripples) {
    const p = toScreen(rp.x, rp.y);
    ctx.save();
    ctx.strokeStyle = rp.col;
    ctx.globalAlpha = Math.max(0, rp.alpha);
    ctx.lineWidth = 4 * S;
    ctx.beginPath(); ctx.arc(p.x, p.y, rp.r * pxScale, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // Orbital trails
  for (const b of bodies) {
    const n = b.trail.length;
    if (n < 2) continue;
    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 1; i < n; i++) {
      const f = i / n;
      const p0 = toScreen(b.trail[i - 1].x, b.trail[i - 1].y);
      const p1 = toScreen(b.trail[i].x, b.trail[i].y);
      ctx.strokeStyle = `rgba(${b.rgb},${(f * f * 0.85).toFixed(3)})`;
      ctx.lineWidth = (1.5 + f * 5.2) * S;
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    }
    ctx.restore();
  }

  // Sparks
  for (const sp of sparks) {
    const p = toScreen(sp.x, sp.y);
    ctx.save();
    ctx.fillStyle = sp.col;
    ctx.globalAlpha = Math.max(0, sp.life);
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.2 * S, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Celestial bodies
  for (const b of bodies) {
    const p = toScreen(b.x, b.y);
    ctx.save();
    ctx.fillStyle = b.col;
    ctx.shadowColor = b.col;
    ctx.shadowBlur = 28 * S;
    ctx.beginPath(); ctx.arc(p.x, p.y, 17 * S, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x - 4 * S, p.y - 4 * S, 5.5 * S, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Top HOOK
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(40 * S)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(HOOK, W * 0.5, H * 0.11);

  // Bottom Telemetry HUD
  const boxX = W * 0.08, boxY = H * 0.84, boxW = W * 0.84, boxH = 92 * S;
  ctx.fillStyle = 'rgba(15,23,42,0.82)';
  ctx.strokeStyle = 'rgba(56,189,248,0.35)';
  ctx.lineWidth = 3 * S;
  ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 20 * S); ctx.fill(); ctx.stroke();

  ctx.font = `800 ${Math.round(22 * S)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#94a3b8';
  ctx.fillText('SLINGSHOTS', W * 0.28, boxY + 34 * S);
  ctx.fillText('PEAK VELOCITY', W * 0.72, boxY + 34 * S);
  ctx.font = `900 ${Math.round(32 * S)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#22d3ee';
  ctx.fillText(`${slingshotCount}`, W * 0.28, boxY + 74 * S);
  ctx.fillStyle = '#facc15';
  ctx.fillText(`${(maxSpeed * 28.4).toFixed(1)} km/s`, W * 0.72, boxY + 74 * S);

  if (isFinale) {
    ctx.fillStyle = 'rgba(2,6,18,0.88)';
    ctx.beginPath(); ctx.roundRect(W * 0.08, H * 0.42, W * 0.84, 148 * S, 26 * S); ctx.fill();
    ctx.strokeStyle = '#facc15'; ctx.lineWidth = 5 * S; ctx.stroke();
    ctx.font = `900 ${Math.round(42 * S)}px -apple-system, sans-serif`;
    ctx.fillStyle = '#fde047';
    ctx.fillText('GRAVITATIONAL HARMONY! 🌌', W * 0.5, H * 0.482);
    ctx.font = `700 ${Math.round(24 * S)}px -apple-system, sans-serif`;
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(`${slingshotCount} SLINGSHOTS · PEAK ${(maxSpeed * 28.4).toFixed(1)} km/s`, W * 0.5, H * 0.522);
  }
  ctx.restore();
}

window.renderBatch = (_startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    step(1 / FPS);
    draw();
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};
window.getEvents = () => events;
window.ready = true;
</script>
