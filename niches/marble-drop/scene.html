<!doctype html>
<!-- Simülasyon #5: 4-Marble Long Gravity Race (Kamera takipli 32 sn yarış + kesin kazanan!) -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#050712;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 720, H = 1280, FPS = 60, DUR = 32, HOOK = 'PICK A COLOR · WHO WINS?';
let pegs = [], marbles = [], events = [], simTime = 0, winner = null, rng = 1, camY = 0, finishY = 4400;
const COLORS = [
  { name: 'RED', col: '#ef4444' },
  { name: 'CYAN', col: '#38bdf8' },
  { name: 'GOLD', col: '#facc15' },
  { name: 'GREEN', col: '#4ade80' },
];
const rand = () => { rng = (rng * 1664525 + 1013904223) >>> 0; return rng / 4294967296; };

window.init = (cfg) => {
  W = cfg.width || 720; H = cfg.height || 1280; FPS = cfg.fps || 60; DUR = cfg.seconds || 32;
  HOOK = cfg.hook || 'PICK A COLOR · WHO WINS?';
  cv.width = W; cv.height = H;
  rng = (cfg.seed || 1) * 77113 + 11;
  const S = W / 720;
  pegs = [];
  const rows = 46;
  finishY = (340 + rows * 84 + 90) * S;
  for (let r = 0; r < rows; r++) {
    const cols = r % 2 === 0 ? 7 : 6;
    const spacing = 86 * S;
    const xStart = W * 0.5 - ((cols - 1) * spacing) / 2;
    for (let c = 0; c < cols; c++) {
      pegs.push({ x: xStart + c * spacing, y: (340 + r * 84) * S, r: 10 * S, flash: 0 });
    }
  }
  marbles = COLORS.map((c, i) => ({
    ...c, x: W * (0.28 + i * 0.145) + (rand() - 0.5) * 16 * S, y: 220 * S,
    vx: (rand() - 0.5) * 90 * S, vy: 20 * S, r: 17 * S, trail: [], done: false,
  }));
  events = []; simTime = 0; winner = null; camY = 0;
};

function step(dt) {
  const S = W / 720, sub = 4, sdt = dt / sub;
  for (let s = 0; s < sub; s++) {
    simTime += sdt;
    for (const p of pegs) if (p.flash > 0) p.flash = Math.max(0, p.flash - sdt * 4);
    for (const m of marbles) {
      if (m.done) continue;
      // 30 sn civarında mutlaka bitişe ulaşsın diye kontrollü yerçekimi
      const gBoost = simTime > DUR - 6 ? 680 : 390;
      m.vy = Math.min(380 * S, m.vy + gBoost * S * sdt);
      m.x += m.vx * sdt; m.y += m.vy * sdt;
      if (m.x < 56 * S) { m.x = 56 * S; m.vx = Math.abs(m.vx) * 0.7; }
      if (m.x > W - 56 * S) { m.x = W - 56 * S; m.vx = -Math.abs(m.vx) * 0.7; }
      for (const p of pegs) {
        if (Math.abs(p.y - m.y) > 45 * S) continue;
        const dx = m.x - p.x, dy = m.y - p.y, d = Math.hypot(dx, dy);
        if (d < m.r + p.r) {
          const nx = dx / Math.max(1e-4, d), ny = dy / Math.max(1e-4, d);
          m.x = p.x + nx * (m.r + p.r + 0.5); m.y = p.y + ny * (m.r + p.r + 0.5);
          const dot = m.vx * nx + m.vy * ny;
          if (dot < 0) {
            m.vx = (m.vx - 2 * dot * nx) * 0.65 + (rand() - 0.5) * 95 * S;
            m.vy = (m.vy - 2 * dot * ny) * 0.58;
            p.flash = 1;
            events.push({ t: simTime, type: 'bounce', pitchIndex: Math.floor((p.y / finishY) * 14), intensity: 0.45 });
          }
        }
      }
      if (m.y >= finishY) {
        m.y = finishY; m.done = true;
        if (!winner) { winner = m; events.push({ t: simTime, type: 'win', pitchIndex: 11, intensity: 1.0 }); }
      }
    }
  }
  const leadY = Math.max(...marbles.map((m) => m.y));
  const targetCam = Math.max(0, Math.min(finishY - H * 0.78, leadY - H * 0.55));
  camY += (targetCam - camY) * 0.1;
  for (const m of marbles) { m.trail.push({ x: m.x, y: m.y }); if (m.trail.length > 18) m.trail.shift(); }
}

function draw() {
  const S = W / 720;
  ctx.fillStyle = '#050712'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(0, -camY);

  ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 6 * S; ctx.setLineDash([16 * S, 10 * S]);
  ctx.beginPath(); ctx.moveTo(40 * S, finishY); ctx.lineTo(W - 40 * S, finishY); ctx.stroke();
  ctx.setLineDash([]);

  for (const p of pegs) {
    if (p.y < camY - 40 || p.y > camY + H + 40) continue;
    ctx.fillStyle = p.flash > 0.2 ? '#ffffff' : '#334155';
    ctx.strokeStyle = p.flash > 0.2 ? '#38bdf8' : '#64748b'; ctx.lineWidth = 2.5 * S;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  for (const m of marbles) {
    for (let i = 1; i < m.trail.length; i++) {
      ctx.strokeStyle = m.col; ctx.globalAlpha = (i / m.trail.length) * 0.55; ctx.lineWidth = m.r * (i / m.trail.length);
      ctx.beginPath(); ctx.moveTo(m.trail[i - 1].x, m.trail[i - 1].y); ctx.lineTo(m.trail[i].x, m.trail[i].y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.save(); ctx.fillStyle = m.col; ctx.shadowColor = m.col; ctx.shadowBlur = 18 * S;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(m.x - 5 * S, m.y - 5 * S, 5 * S, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  ctx.save(); ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(5,7,18,0.72)'; ctx.fillRect(0, 0, W, H * 0.16);
  ctx.font = `900 ${Math.round(40 * S)}px -apple-system, sans-serif`; ctx.fillStyle = '#ffffff';
  ctx.fillText(HOOK, W * 0.5, H * 0.11);
  if (winner) {
    ctx.fillStyle = 'rgba(2,6,18,0.85)';
    ctx.beginPath(); ctx.roundRect(W * 0.12, H * 0.44, W * 0.76, 128 * S, 26 * S); ctx.fill();
    ctx.strokeStyle = winner.col; ctx.lineWidth = 5 * S; ctx.stroke();
    ctx.font = `900 ${Math.round(52 * S)}px -apple-system, sans-serif`; ctx.fillStyle = winner.col;
    ctx.fillText(`${winner.name} WINS! 🏆`, W * 0.5, H * 0.505);
  }
  ctx.restore();
}

window.renderBatch = (_s, c) => {
  const out = [];
  for (let i = 0; i < c; i++) { step(1 / FPS); draw(); out.push(cv.toDataURL('image/jpeg', 0.92).slice(23)); }
  return out;
};
window.getEvents = () => events;
window.ready = true;
</script>
