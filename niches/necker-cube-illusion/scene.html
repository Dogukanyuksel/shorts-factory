<!doctype html>
<!--
  Kinetic Lab HQ — The Necker Cube Bistable Flip (3D PBR Wireframe + Neon Cyan/Magenta Faces, Orthographic Paradox)
  Y-LABS 3D Cinema Engine (Three.js PBR, 60fps deterministic seamless loop)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0B0F19;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  drawStudioHud,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let W = 720, H = 1280, FPS = 60, DUR = 26, HOOK = 'BLINK TO FLIP THIS 3D CUBE';
let stage = null, built = false, cachedEvents = [];
let cubeGroup, focusRing, cyanFaceMat, magFaceMat;

window.getEvents = () => cachedEvents;

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'physics',
    fov: 24, // Near-orthographic tele lens enhances bistable Necker depth ambiguity!
    fogDensity: 0.015,
    floorY: -2.8,
  });
  const { scene } = stage;
  const mats = createMaterials('physics');

  cubeGroup = new THREE.Group();
  cubeGroup.position.set(0, 0.25, 0);
  scene.add(cubeGroup);

  const S = 1.95;
  const half = S * 0.5;
  const corners = [
    [-half, -half, -half], [half, -half, -half], [half, half, -half], [-half, half, -half],
    [-half, -half, half], [half, -half, half], [half, half, half], [-half, half, half],
  ];
  const edges = [
    [0, 1], [1, 2], [2, 3], [3, 0],
    [4, 5], [5, 6], [6, 7], [7, 4],
    [0, 4], [1, 5], [2, 6], [3, 7],
  ];

  // Crisp glowing 3D cylindrical wireframe struts
  const strutMat = mats.glow(0xe2e8f0, 0.85, 0.2, 0.7);
  for (const [a, b] of edges) {
    const va = new THREE.Vector3(...corners[a]);
    const vb = new THREE.Vector3(...corners[b]);
    const len = va.distanceTo(vb);
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, len, 14), strutMat);
    cyl.position.copy(va).add(vb).multiplyScalar(0.5);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vb.clone().sub(va).normalize());
    cubeGroup.add(cyl);
  }

  // Luminous vertex spheres
  const vGeo = new THREE.SphereGeometry(0.11, 16, 16);
  for (const c of corners) {
    const m = new THREE.Mesh(vGeo, mats.glow(0x00f0ff, 1.1));
    m.position.set(c[0], c[1], c[2]);
    cubeGroup.add(m);
  }

  // Translucent Cyan Front Face & Magenta Back Face — equal visual weight creates instant bistable flip!
  cyanFaceMat = mats.translucent(0x00f0ff, 0.24);
  const cyanFace = new THREE.Mesh(new THREE.PlaneGeometry(S - 0.08, S - 0.08), cyanFaceMat);
  cyanFace.position.z = half;
  cubeGroup.add(cyanFace);

  magFaceMat = mats.translucent(0xff2d55, 0.24);
  const magFace = new THREE.Mesh(new THREE.PlaneGeometry(S - 0.08, S - 0.08), magFaceMat);
  magFace.position.z = -half;
  cubeGroup.add(magFace);

  // Center glowing golden focus ring (keeps eyes locked so blinking flips depth!)
  focusRing = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.035, 12, 36), mats.glow(0xffd60a, 1.3));
  cubeGroup.add(focusRing);

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  HOOK = cfg.hook || HOOK;
  cv.width = W;
  cv.height = H;

  cachedEvents = [];
  for (let i = 0; i < 6; i++) {
    cachedEvents.push({
      t: (i / 6) * DUR + 0.3,
      type: i % 2 === 0 ? 'bounce' : 'break',
      pitchIndex: 5 + (i % 5),
      intensity: 0.7,
    });
  }

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  // Exact periodic rotation over DUR -> 100% seamless loop
  const phase = (t / Math.max(1, DUR)) * Math.PI * 2;
  cubeGroup.rotation.y = 0.62 + Math.sin(phase * 2) * 0.32;
  cubeGroup.rotation.x = 0.45 + Math.cos(phase * 2) * 0.18;

  // Alternate subtle glow prominence between Cyan and Magenta to trigger perceptual flips
  const flipWave = 0.5 + 0.5 * Math.sin(phase * 3);
  cyanFaceMat.opacity = 0.14 + 0.22 * flipWave;
  magFaceMat.opacity = 0.14 + 0.22 * (1 - flipWave);
  focusRing.rotation.set(t * 1.4, t * 1.9, 0);

  const { camera } = stage;
  camera.position.set(0, 0.25, 11.4);
  camera.lookAt(0, 0.15, 0);

  stage.composite(ctx, W, H);

  const cyanFront = flipWave >= 0.5;
  drawStudioHud(ctx, {
    W,
    H,
    channel: 'physics',
    badge: HOOK,
    title: 'NECKER CUBE BISTABLE FLIP',
    subtitle: 'STARE AT THE GOLD RING · BLINK ONCE',
    caption: cyanFront ? 'CYAN FACE IN FRONT — OR IS IT?' : 'MAGENTA FACE IN FRONT — BLINK AGAIN!',
    metrics: [
      { label: 'STATE A', value: 'CYAN FRONT', color: '#00F0FF' },
      { label: 'STATE B', value: 'PINK FRONT', color: '#FF2D55' },
      { label: 'PERSPECTIVE', value: '0% CUES', color: '#FFD60A' },
    ],
    progress: (t / Math.max(1, DUR)),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
