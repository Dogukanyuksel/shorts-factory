<!doctype html>
<!--
  Kinetic Lab HQ — 3D PBR: Spacetime Gravity Funnel (Why Orbits Speed Up Near Gravity Wells)
  Y-LABS 3D Cinema Engine (Three.js PBR Warped Spacetime Funnel + Orbiting Satellites, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0B0F19;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  drawStudioHud,
  clamp,
  lerp,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let W = 720, H = 1280, FPS = 60, DUR = 26, EVENTS = [];
let stage = null, built = false;
let funnelMesh, coreStar, orbiters = [];

window.getEvents = () => EVENTS;

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'physics', fov: 40, fogDensity: 0.02, floorY: -3.2 });
  const { scene } = stage;
  const mats = createMaterials('physics');

  // 3D Spacetime Gravity Funnel (radial logarithmic well)
  const radSegs = 40, ringSegs = 28;
  const geo = new THREE.PlaneGeometry(7.2, 7.2, radSegs, ringSegs);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const r = Math.hypot(x, z);
    const depth = -2.4 / (r + 0.55);
    pos.setY(i, depth + 0.65);
  }
  geo.computeVertexNormals();
  funnelMesh = new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({
      color: 0x00f0ff,
      emissive: 0x00f0ff,
      emissiveIntensity: 0.25,
      wireframe: true,
      transparent: true,
      opacity: 0.55,
    }),
  );
  scene.add(funnelMesh);

  // Central Massive Star / Singularity
  coreStar = new THREE.Mesh(new THREE.SphereGeometry(0.45, 28, 28), mats.glow(0xff3b30, 1.0));
  coreStar.position.set(0, -1.55, 0);
  scene.add(coreStar);

  // 5 Orbiting Planets spiraling down the gravity well (Kepler angular momentum)
  const colors = [0x00f0ff, 0x38bdf8, 0xfacc15, 0x34d399, 0xff3b30];
  orbiters = colors.map((col, idx) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.16 + idx * 0.015, 20, 20), mats.glow(col, 0.95));
    m.userData = {
      startR: 2.95 - idx * 0.28,
      startA: idx * 1.25,
      decay: 0.068 + idx * 0.008,
    };
    scene.add(m);
    return m;
  });

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  cv.width = W;
  cv.height = H;
  buildScene();

  EVENTS = [
    { t: 2.0, type: 'bounce', intensity: 0.7 },
    { t: 9.0, type: 'bounce', intensity: 0.85 },
    { t: 16.5, type: 'break', intensity: 0.95 },
    { t: 22.0, type: 'win', intensity: 1.0 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  let maxVel = 0;
  orbiters.forEach((m) => {
    const r = Math.max(0.58, m.userData.startR * (1 - p * 0.72));
    // Conservation of angular momentum: omega ~ 1 / r^1.5
    const omega = 1.6 / Math.pow(r, 1.35);
    const a = m.userData.startA + t * omega;
    const y = -2.4 / (r + 0.55) + 0.82;
    m.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
    maxVel = Math.max(maxVel, omega * r * 14);
  });

  coreStar.scale.setScalar(1 + Math.sin(t * 5) * 0.06);
  funnelMesh.rotation.y = t * 0.12;

  const camA = t * 0.22;
  stage.camera.position.set(Math.sin(camA) * 7.8, lerp(3.4, 2.2, p), Math.cos(camA) * 7.8);
  stage.camera.lookAt(0, -0.55, 0);

  stage.renderTo(ctx, W, H);

  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'physics',
    title: 'SPACETIME GRAVITY WELL',
    subtitle: 'KEPLER ORBITAL ACCELERATION',
    progress: p,
    caption: p < 0.35 ? 'CURVED SPACETIME WELL' : p < 0.72 ? 'ANGULAR MOMENTUM SPIKE' : 'EVENT HORIZON VELOCITY',
    metrics: [
      { label: 'ORBIT VEL', value: `${maxVel.toFixed(1)} KM/S`, color: '#00F0FF' },
      { label: 'WELL DEPTH', value: `${(p * 9.8).toFixed(1)} G`, color: '#FF3B30' },
      { label: 'BODIES', value: '5 LIVE', color: '#FFFFFF' },
    ],
  });
};
</script>
