<!doctype html>
<!--
  Kinetic Lab HQ — 3D PBR: Twin Double Pendulums (0.001° Chaos Divergence)
  Y-LABS 3D Cinema Engine (Three.js PBR RK4 Twin Double Pendulums + 3D Neon Divergence Trail, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#0B0F19;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  drawStudioHud,
  clamp,
  lerp,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let W = 720, H = 1280, FPS = 60, DUR = 26, EVENTS = [];
let stage = null, built = false;
let pendA, pendB, trailA, trailB;
let simA = [], simB = [];

window.getEvents = () => EVENTS;

function precomputeDoublePendulum(th1Init, th2Init, steps, dt) {
  let th1 = th1Init, th2 = th2Init, w1 = 0, w2 = 0;
  const g = 9.81, L1 = 1.45, L2 = 1.45, m1 = 1, m2 = 1;
  const out = [];
  function deriv(t1, t2, o1, o2) {
    const d = t1 - t2;
    const den1 = (2 * m1 + m2 - m2 * Math.cos(2 * d));
    const a1 = (-g * (2 * m1 + m2) * Math.sin(t1) - m2 * g * Math.sin(t1 - 2 * t2) - 2 * Math.sin(d) * m2 * (o2 * o2 * L2 + o1 * o1 * L1 * Math.cos(d))) / (L1 * den1);
    const a2 = (2 * Math.sin(d) * (o1 * o1 * L1 * (m1 + m2) + g * (m1 + m2) * Math.cos(t1) + o2 * o2 * L2 * m2 * Math.cos(d))) / (L2 * den1);
    return [o1, o2, a1, a2];
  }
  for (let i = 0; i <= steps; i++) {
    const x1 = L1 * Math.sin(th1), y1 = 1.55 - L1 * Math.cos(th1);
    const x2 = x1 + L2 * Math.sin(th2), y2 = y1 - L2 * Math.cos(th2);
    out.push({ x1, y1, x2, y2, th1, th2 });
    const k1 = deriv(th1, th2, w1, w2);
    const k2 = deriv(th1 + 0.5 * dt * k1[0], th2 + 0.5 * dt * k1[1], w1 + 0.5 * dt * k1[2], w2 + 0.5 * dt * k1[3]);
    const k3 = deriv(th1 + 0.5 * dt * k2[0], th2 + 0.5 * dt * k2[1], w1 + 0.5 * dt * k2[2], w2 + 0.5 * dt * k2[3]);
    const k4 = deriv(th1 + dt * k3[0], th2 + dt * k3[1], w1 + dt * k3[2], w2 + dt * k3[3]);
    th1 += (dt / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
    th2 += (dt / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
    w1 += (dt / 6) * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
    w2 += (dt / 6) * (k1[3] + 2 * k2[3] + 2 * k3[3] + k4[3]);
  }
  return out;
}

function makePendulumRig(scene, mats, color, zOff) {
  const rodGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.45, 14);
  const arm1 = new THREE.Mesh(rodGeo, mats.steel);
  const arm2 = new THREE.Mesh(rodGeo, mats.steel);
  const bob1 = new THREE.Mesh(new THREE.SphereGeometry(0.18, 20, 20), mats.glow(color, 0.9));
  const bob2 = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 24), mats.glow(color, 1.0));
  scene.add(arm1, arm2, bob1, bob2);
  return { arm1, arm2, bob1, bob2, zOff };
}

function updateRig(rig, pt) {
  const p0x = 0, p0y = 1.55;
  rig.arm1.position.set((p0x + pt.x1) * 0.5, (p0y + pt.y1) * 0.5, rig.zOff);
  rig.arm1.rotation.z = pt.th1;
  rig.bob1.position.set(pt.x1, pt.y1, rig.zOff);

  rig.arm2.position.set((pt.x1 + pt.x2) * 0.5, (pt.y1 + pt.y2) * 0.5, rig.zOff);
  rig.arm2.rotation.z = pt.th2;
  rig.bob2.position.set(pt.x2, pt.y2, rig.zOff);
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'physics', fov: 40, fogDensity: 0.018, floorY: -2.8 });
  const { scene } = stage;
  const mats = createMaterials('physics');

  // Metallic Pivot Mount
  const pivot = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1.1, 20), mats.darkMetal);
  pivot.rotation.x = Math.PI / 2;
  pivot.position.set(0, 1.55, 0);
  scene.add(pivot);

  pendA = makePendulumRig(scene, mats, 0x00f0ff, 0.22);
  pendB = makePendulumRig(scene, mats, 0xff3b30, -0.22);

  // Trail lines
  const makeTrail = (color) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(180 * 3), 3));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.85 }));
    scene.add(line);
    return line;
  };
  trailA = makeTrail(0x00f0ff);
  trailB = makeTrail(0xff3b30);

  simA = precomputeDoublePendulum(2.35, 2.35, Math.ceil(DUR * 60) + 10, 1 / 60);
  simB = precomputeDoublePendulum(2.35 + 0.00018, 2.35, Math.ceil(DUR * 60) + 10, 1 / 60);
  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  cv.width = W;
  cv.height = H;
  buildScene();

  EVENTS = [
    { t: 4.5, type: 'bounce', intensity: 0.75 },
    { t: 11.2, type: 'break', intensity: 1.0 },
    { t: 18.0, type: 'bounce', intensity: 0.9 },
    { t: 23.0, type: 'win', intensity: 0.95 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);
  const idx = clamp(Math.floor(t * 60), 0, simA.length - 1);

  updateRig(pendA, simA[idx]);
  updateRig(pendB, simB[idx]);

  const fillTrail = (line, sim, zOff) => {
    const arr = line.geometry.attributes.position.array;
    const len = 180;
    for (let i = 0; i < len; i++) {
      const si = Math.max(0, idx - (len - 1 - i));
      arr[i * 3] = sim[si].x2;
      arr[i * 3 + 1] = sim[si].y2;
      arr[i * 3 + 2] = zOff;
    }
    line.geometry.attributes.position.needsUpdate = true;
  };
  fillTrail(trailA, simA, 0.22);
  fillTrail(trailB, simB, -0.22);

  const deltaDeg = (Math.abs(simA[idx].th2 - simB[idx].th2) * 180 / Math.PI) % 360;
  const camA = lerp(-0.34, 0.34, p);
  stage.camera.position.set(Math.sin(camA) * 7.8, 0.25, Math.cos(camA) * 7.8);
  stage.camera.lookAt(0, 0.1, 0);

  stage.renderTo(ctx, W, H);

  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'physics',
    title: '0.001° CHAOS SPLIT',
    subtitle: 'RK4 DOUBLE PENDULUM',
    progress: p,
    caption: deltaDeg < 5 ? 'IDENTICAL START (0.001°)' : deltaDeg < 45 ? 'MICRO DIVERGENCE GROWING' : 'TOTAL CHAOS EXPLOSION',
    metrics: [
      { label: 'INIT Δθ', value: '0.001°', color: '#FFFFFF' },
      { label: 'LIVE Δθ', value: `${deltaDeg.toFixed(1)}°`, color: deltaDeg > 15 ? '#FF3B30' : '#00F0FF' },
      { label: 'STATE', value: deltaDeg > 15 ? 'CHAOS' : 'SYNC', color: deltaDeg > 15 ? '#FF3B30' : '#30D158' },
    ],
  });
};
</script>
