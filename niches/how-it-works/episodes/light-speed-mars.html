<!doctype html>
<!-- Clear Mechanics (NASA/Space) — How Slow Is the Speed of Light in Space? -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#030612;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, t) => { const x = clamp((t - a) / Math.max(1e-5, b - a), 0, 1); return x * x * (3 - 2 * x); };

const SCRIPT = [
  { id: 'hook', text: 'Light is the fastest thing in the universe — yet in deep space, it looks painfully slow.', caption: 'LIGHT LOOKS SLOW?' },
  { id: 'earth', text: 'Around Earth, a beam of light circles the entire planet seven and a half times every single second.', caption: '7.5X PER SECOND' },
  { id: 'moon', text: 'Fire that same laser at the Moon, and it takes one point three full seconds just to arrive.', caption: '1.3 SEC TO MOON' },
  { id: 'mars', text: 'Now send a radio signal to Mars. Even at three hundred thousand kilometers per second, it crawls for minutes.', caption: 'MINUTES TO MARS' },
  { id: 'outro', text: 'Space is so unimaginably vast that even nature’s speed limit feels like slow motion.', caption: 'SPACE IS HUGE!' },
];

let W = 720, H = 1280, FPS = 60, DUR = 23, LINES = [], EVENTS = [];
window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;
window.init = (cfg) => {
  W = cfg.width || 720; H = cfg.height || 1280; FPS = cfg.fps || 60; DUR = cfg.duration || 23; LINES = cfg.lines || [];
  cv.width = W; cv.height = H;
  const byId = (id) => LINES.find((l) => l.id === id) || { start: 0, end: 3 };
  EVENTS = [
    { t: byId('moon').start + 0.3, type: 'bounce', pitchIndex: 5, intensity: 0.7 },
    { t: byId('mars').start + 0.3, type: 'bounce', pitchIndex: 8, intensity: 0.75 },
    { t: byId('outro').start + 0.2, type: 'win', pitchIndex: 11, intensity: 0.9 },
  ];
};

function drawFrame(t) {
  const S = W / 720;
  ctx.fillStyle = '#030612'; ctx.fillRect(0, 0, W, H);

  // 3 ölçekli ışık hızı şeridi
  const lanes = [
    { y: H * 0.34, label: 'EARTH ORBIT (40,000 km)', target: '7.5 loops/s', col: '#38bdf8', prog: (t * 2.4) % 1, rightCol: '#38bdf8', rightName: 'EARTH' },
    { y: H * 0.50, label: 'EARTH → MOON (384,400 km)', target: '1.3 seconds', col: '#facc15', prog: (t * 0.77) % 1, rightCol: '#cbd5e1', rightName: 'MOON' },
    { y: H * 0.66, label: 'EARTH → MARS (225,000,000 km)', target: '12.5 minutes', col: '#fb7185', prog: (t * 0.08) % 1, rightCol: '#ef4444', rightName: 'MARS' },
  ];

  for (const ln of lanes) {
    const x1 = 96 * S, x2 = W - 96 * S;
    ctx.strokeStyle = 'rgba(148,163,184,0.25)'; ctx.lineWidth = 3 * S;
    ctx.beginPath(); ctx.moveTo(x1, ln.y); ctx.lineTo(x2, ln.y); ctx.stroke();

    // Sol Dünya + Sağ Hedef
    ctx.fillStyle = '#2563eb'; ctx.beginPath(); ctx.arc(x1, ln.y, 18 * S, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = ln.rightCol; ctx.beginPath(); ctx.arc(x2, ln.y, 18 * S, 0, Math.PI * 2); ctx.fill();

    // Foton ışını
    const px = lerp(x1, x2, ln.prog);
    ctx.save();
    ctx.strokeStyle = ln.col; ctx.shadowColor = ln.col; ctx.shadowBlur = 18 * S; ctx.lineWidth = 6 * S;
    ctx.beginPath(); ctx.moveTo(Math.max(x1, px - 56 * S), ln.y); ctx.lineTo(px, ln.y); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(px, ln.y, 8 * S, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#e2e8f0'; ctx.font = `800 ${Math.round(19 * S)}px monospace`; ctx.textAlign = 'left';
    ctx.fillText(ln.label, x1 - 12 * S, ln.y - 30 * S);
    ctx.fillStyle = ln.col; ctx.textAlign = 'right';
    ctx.fillText(ln.target, x2 + 12 * S, ln.y - 30 * S);
  }

  ctx.fillStyle = '#38bdf8'; ctx.font = `800 ${Math.round(22 * S)}px monospace`; ctx.textAlign = 'center';
  ctx.fillText('SPEED OF LIGHT: 299,792 km/s', W * 0.5, H * 0.76);

  let activeLine = LINES[0];
  for (const l of LINES) if (t >= l.start) activeLine = l;
  ctx.save(); ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(31 * S)}px -apple-system, sans-serif`; ctx.fillStyle = '#93c5fd';
  ctx.fillText('HOW SLOW IS LIGHT IN SPACE?', W * 0.5, H * 0.125);
  if (activeLine) {
    const pop = 1 + 0.08 * Math.exp(-Math.max(0, t - activeLine.start) * 14);
    ctx.translate(W * 0.5, H * 0.715); ctx.scale(pop, pop);
    ctx.font = `900 ${Math.round(46 * S)}px -apple-system, sans-serif`;
    ctx.lineWidth = 10 * S; ctx.strokeStyle = '#020617'; ctx.strokeText(activeLine.caption, 0, 0);
    ctx.fillStyle = activeLine.id === 'outro' ? '#4ade80' : '#facc15';
    ctx.fillText(activeLine.caption, 0, 0);
  }
  ctx.restore();
}

window.renderBatch = (s, c) => {
  const out = [];
  for (let i = 0; i < c; i++) { drawFrame((s + i) / FPS); out.push(cv.toDataURL('image/jpeg', 0.92).slice(23)); }
  return out;
};
window.ready = true;
</script>
