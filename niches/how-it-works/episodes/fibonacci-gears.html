<!doctype html>
<!--
  Clear Mechanics — Fibonacci Gears (Non-Circular Golden Ratio Spiral Gears)
  Y-LABS 3D Cinema Engine (Three.js PBR Extruded Conjugate Spiral Gears + X-Ray Shafts, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#141414;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const PHI = (1 + Math.sqrt(5)) / 2; // 1.61803398875

const SCRIPT = [
  { id: 'hook', text: 'Can two lopsided spiral gears spin together without ever jamming?', caption: 'FIBONACCI GEARS' },
  { id: 'spiral', text: 'Each gear follows the golden ratio spiral — growing wider by phi as it turns.', caption: 'GOLDEN RATIO φ' },
  { id: 'distance', text: 'Watch the glowing contact point. As one radius shrinks, the other grows by the exact same amount.', caption: 'r₁ + r₂ = CONSTANT' },
  { id: 'teeth', text: 'Because their arc lengths match at every angle, every single tooth locks in smoothly.', caption: 'ZERO SLIP MESH' },
  { id: 'ratio', text: 'Drive the top gear at steady speed, and the bottom gear pulses from 0.62x to 1.62x speed!', caption: '0.62x → 1.62x' },
  { id: 'use', text: 'Engineers use non-circular gears like this in textile looms, printing presses, and robotic arms.', caption: 'MATH IN MOTION' },
];

let W = 720, H = 1280, FPS = 60, DUR = 22, LINES = [], EVENTS = [];
let stage = null, built = false, GEAR_DATA = null;
let gear1Group, gear2Group, contactOrb, contactRing, centerDistanceBar;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

function r1Norm(theta) {
  const wave = Math.cos(theta) + 0.14 * Math.sin(2 * theta);
  return Math.pow(PHI, 0.5 * wave);
}

function buildConjugateGears() {
  const N = 360;
  const dth = (Math.PI * 2) / N;
  const r1Raw = new Float64Array(N + 1);
  let rMax = 0;
  for (let i = 0; i <= N; i++) {
    r1Raw[i] = r1Norm(i * dth);
    if (r1Raw[i] > rMax) rMax = r1Raw[i];
  }

  let lo = rMax + 0.05, hi = rMax * 6.0;
  for (let iter = 0; iter < 50; iter++) {
    const mid = 0.5 * (lo + hi);
    let integ = 0;
    for (let i = 0; i < N; i++) {
      const rMid = 0.5 * (r1Raw[i] + r1Raw[i + 1]);
      integ += (rMid / (mid - rMid)) * dth;
    }
    if (integ > Math.PI * 2) lo = mid;
    else hi = mid;
  }
  const Dnorm = 0.5 * (lo + hi);
  const scale = 1.65;
  const D = Dnorm * scale;

  const th2Table = new Float64Array(N + 1);
  const r1Pts = [];
  const r2Pts = [];
  let acc2 = 0;
  for (let i = 0; i <= N; i++) {
    const th1 = i * dth;
    const r1 = r1Raw[i] * scale;
    const r2 = D - r1;
    th2Table[i] = acc2;
    r1Pts.push({ a: th1, r: r1 });
    r2Pts.push({ a: acc2, r: r2 });
    if (i < N) {
      const rMid = 0.5 * (r1Raw[i] + r1Raw[i + 1]);
      acc2 += (rMid / (Dnorm - rMid)) * dth;
    }
  }

  return { N, dth, D, scale, r1Raw, th2Table, r1Pts, r2Pts };
}

function createExtrudedSpiralGear(pts, teethCount, toothDepth, depth, bodyMat, accentMat) {
  const g = new THREE.Group();
  const shape = new THREE.Shape();
  const totalSamples = pts.length - 1;
  // Build smooth toothed contour around pitch curve
  const toothSteps = teethCount * 6;
  for (let i = 0; i <= toothSteps; i++) {
    const u = (i % toothSteps) / toothSteps;
    const idxF = u * totalSamples;
    const idx0 = Math.floor(idxF) % totalSamples;
    const idx1 = (idx0 + 1) % totalSamples;
    const frac = idxF - Math.floor(idxF);
    const a = lerp(pts[idx0].a, pts[idx1].a, frac);
    const rBase = lerp(pts[idx0].r, pts[idx1].r, frac);
    const phase = (i % 6) / 6;
    const tooth = phase < 0.45 ? toothDepth : -toothDepth * 0.65;
    const r = rBase + tooth;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  shape.closePath();

  // Center bore hole
  const hole = new THREE.Path();
  hole.absarc(0, 0, 0.34, 0, Math.PI * 2, true);
  shape.holes.push(hole);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 2,
    steps: 1,
    bevelSize: 0.035,
    bevelThickness: 0.035,
  });
  geo.translate(0, 0, -depth * 0.5);

  const mesh = new THREE.Mesh(geo, bodyMat);
  g.add(mesh);

  // Glowing rim indicator + spiral reference bar so speed pulses are unmistakable
  const hubCollar = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.055, 12, 32), accentMat);
  hubCollar.position.z = depth * 0.5 + 0.03;
  g.add(hubCollar);

  const indexBar = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.09, depth + 0.12), accentMat);
  indexBar.position.set(0.65, 0, 0);
  g.add(indexBar);

  return g;
}

function buildScene() {
  GEAR_DATA = buildConjugateGears();
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'explainer',
    fov: 38,
    fogDensity: 0.024,
    floorY: -3.2,
  });
  const { scene } = stage;
  const mats = createMaterials('explainer');

  const halfD = GEAR_DATA.D * 0.5;

  // Machined steel housing plate behind gears
  const backGeo = new THREE.BoxGeometry(5.6, GEAR_DATA.D + 3.6, 0.25);
  const backPlate = new THREE.Mesh(backGeo, mats.darkMetal);
  backPlate.position.set(0, 0, -0.58);
  scene.add(backPlate);
  const backEdges = addXrayEdges(backGeo, 0xff9500, 0.28);
  backEdges.position.copy(backPlate.position);
  scene.add(backEdges);

  // Top Drive Gear (Brushed Steel + Orange Accent)
  gear1Group = createExtrudedSpiralGear(GEAR_DATA.r1Pts, 28, 0.095, 0.38, mats.steel, mats.primary);
  gear1Group.position.set(0, halfD, 0);
  scene.add(gear1Group);

  // Bottom Driven Gear (Warm Titanium Gold + Cyan Accent)
  const drivenMat = new THREE.MeshStandardMaterial({
    color: 0xd97706,
    emissive: 0x78350f,
    emissiveIntensity: 0.22,
    metalness: 0.88,
    roughness: 0.22,
  });
  gear2Group = createExtrudedSpiralGear(GEAR_DATA.r2Pts, 28, 0.095, 0.38, drivenMat, mats.accent);
  gear2Group.position.set(0, -halfD, 0);
  scene.add(gear2Group);

  // Center shafts
  const shaftGeo = new THREE.CylinderGeometry(0.24, 0.24, 1.4, 24);
  shaftGeo.rotateX(Math.PI / 2);
  const s1 = new THREE.Mesh(shaftGeo, mats.steel);
  s1.position.set(0, halfD, 0);
  const s2 = new THREE.Mesh(shaftGeo, mats.steel);
  s2.position.set(0, -halfD, 0);
  scene.add(s1, s2);

  // Glowing Contact Point Orb + Pulsing Halo Ring along center line
  contactOrb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 18, 18), mats.glow(0x38bdf8, 1.4));
  contactRing = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.028, 12, 32), mats.glow(0xff9500, 1.2));
  scene.add(contactOrb, contactRing);

  // Translucent center-distance guide bar (r1 + r2 = D)
  centerDistanceBar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.028, 0.028, GEAR_DATA.D, 12),
    mats.glow(0x38bdf8, 0.7),
  );
  centerDistanceBar.position.set(0, 0, 0.36);
  scene.add(centerDistanceBar);

  built = true;
}

function sampleGear2(th1) {
  const { N, dth, r1Raw, th2Table, scale, D } = GEAR_DATA;
  const wrapped = ((th1 % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  const fullTurns = Math.floor(th1 / (Math.PI * 2));
  const f = wrapped / dth;
  const i0 = Math.floor(f) % N;
  const i1 = i0 + 1;
  const frac = f - Math.floor(f);
  const r1 = lerp(r1Raw[i0], r1Raw[i1], frac) * scale;
  const th2 = fullTurns * Math.PI * 2 + lerp(th2Table[i0], th2Table[i1], frac);
  const r2 = D - r1;
  return { r1, r2, th2, ratio: r1 / Math.max(0.01, r2) };
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 22;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lSpi = getLine('spiral', 1);
  const lDis = getLine('distance', 2);
  const lTee = getLine('teeth', 3);
  const lRat = getLine('ratio', 4);
  const lUse = getLine('use', 5);

  EVENTS = [
    { t: lSpi.start + 0.15, type: 'bounce', pitchIndex: 3, intensity: 0.60 },
    { t: lDis.start + 0.15, type: 'bounce', pitchIndex: 5, intensity: 0.72 },
    { t: lTee.start + 0.15, type: 'break', pitchIndex: 8, intensity: 0.85 },
    { t: lRat.start + 0.18, type: 'bounce', pitchIndex: 10, intensity: 0.88 },
    { t: lUse.start + 0.20, type: 'win', pitchIndex: 12, intensity: 0.92 },
  ];

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  const lDis = getLine('distance', 2);
  const lTee = getLine('teeth', 3);
  const lRat = getLine('ratio', 4);

  let activeCaption = SCRIPT[0].caption;
  for (let i = 0; i < SCRIPT.length; i++) {
    const ln = getLine(SCRIPT[i].id, i);
    if (t >= ln.start) activeCaption = ln.caption || SCRIPT[i].caption;
  }

  // Constant-speed top drive gear (3 full turns over DUR for crisp loopability)
  const th1 = (t / Math.max(1, DUR)) * Math.PI * 2 * 3.0;
  const { r1, r2, th2, ratio } = sampleGear2(th1);

  // Align pitch contact along vertical Y axis (-PI/2 on gear 1, +PI/2 on gear 2)
  gear1Group.rotation.z = -Math.PI * 0.5 - th1;
  gear2Group.rotation.z = Math.PI * 0.5 + th2;

  const halfD = GEAR_DATA.D * 0.5;
  const contactY = halfD - r1;
  contactOrb.position.set(0, contactY, 0.32);
  contactRing.position.set(0, contactY, 0.34);
  contactRing.scale.setScalar(0.95 + 0.18 * Math.sin(t * 8));

  // Camera Choreography: 3/4 establishing -> macro zoom into meshing teeth -> heroic angle
  const { camera } = stage;
  const pMacro = smooth(lDis.start, lTee.start + 0.6, t) * (1 - smooth(lRat.start + 2.0, lRat.start + 3.2, t));
  camera.position.set(
    lerp(Math.sin(t * 0.42) * 2.4, 1.45 + Math.sin(t * 0.7) * 0.35, pMacro),
    lerp(0.6, contactY * 0.5, pMacro),
    lerp(9.6, 5.8, pMacro),
  );
  camera.lookAt(0, lerp(0, contactY * 0.65, pMacro), 0);

  stage.composite(ctx, W, H);

  drawStudioHud(ctx, {
    W,
    H,
    channel: 'explainer',
    badge: 'GOLDEN RATIO φ = 1.618 · 3D PBR',
    title: 'FIBONACCI SPIRAL GEARS',
    subtitle: 'NON-CIRCULAR ZERO-SLIP CONJUGATE MESH',
    caption: activeCaption,
    metrics: [
      { label: 'DRIVE r₁', value: `${r1.toFixed(2)}`, color: '#FF9500' },
      { label: 'DRIVEN r₂', value: `${r2.toFixed(2)}`, color: '#38BDF8' },
      { label: 'SPEED RATIO', value: `${ratio.toFixed(2)}×`, color: '#FFD60A' },
    ],
    progress: t / Math.max(1, DUR),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
