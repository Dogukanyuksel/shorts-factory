<!doctype html>
<!--
  Clear Mechanics — 3D PBR: How an Electric Motor Delivers 100% Torque at 0 RPM
  Y-LABS 3D Cinema Engine (Three.js PBR 3-Phase Copper Stator Coils + Rotating Magnetic Flux + Steel Rotor, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#141414;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'Why does an electric car launch violently off the line while gas engines hesitate?', caption: '100% TORQUE AT 0 RPM' },
  { id: 'stator', text: 'Inside the casing sit six copper stator coils wired to three-phase alternating current.', caption: '3-PHASE COPPER STATOR' },
  { id: 'flux', text: 'As current pulses around the ring, it creates an invisible rotating magnetic field.', caption: 'ROTATING MAGNETIC FIELD' },
  { id: 'rotor', text: 'The central magnet rotor locks onto that spinning field with instant electromagnetic force.', caption: 'ZERO GEAR DELAY' },
  { id: 'eff', text: 'With only one moving part, ninety-two percent of battery energy becomes pure wheel motion.', caption: '92% EFFICIENCY' },
  { id: 'verdict', text: 'No pistons, no transmission lag — just pure spinning magnetism from zero to redline.', caption: 'PURE MAGNETIC TORQUE' },
];

let W = 720, H = 1280, FPS = 60, DUR = 26, LINES = [], EVENTS = [];
let stage = null, built = false;
let coils = [], rotorGrp, fluxRing, fluxOrb;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, idx) {
  const f = LINES.find((l) => l.id === id);
  if (f) return f;
  const seg = DUR / SCRIPT.length;
  return { id, start: idx * seg, end: (idx + 1) * seg, caption: SCRIPT[idx].caption };
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'explainer', fov: 38, fogDensity: 0.02, floorY: -2.6 });
  const { scene } = stage;
  const mats = createMaterials('explainer');

  // Outer translucent stator housing
  const shellGeo = new THREE.CylinderGeometry(2.35, 2.35, 1.35, 36, 1, true);
  shellGeo.rotateX(Math.PI / 2);
  const shell = new THREE.Mesh(shellGeo, mats.glass(0x38bdf8, 0.16));
  scene.add(shell);
  scene.add(addXrayEdges(shellGeo, 0x38bdf8, 0.35));

  // 6 Copper Stator Coils
  const coilGeo = new THREE.BoxGeometry(0.55, 0.65, 0.95);
  coils = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const mat = mats.copper.clone();
    const m = new THREE.Mesh(coilGeo, mat);
    m.position.set(Math.cos(a) * 1.72, Math.sin(a) * 1.72, 0);
    m.rotation.z = a;
    scene.add(m);
    coils.push({ m, mat, angle: a, phase: i % 3 });
  }

  // Central Rotor + Shaft
  rotorGrp = new THREE.Group();
  const rCore = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 1.12, 28), mats.steel);
  rCore.rotation.x = Math.PI / 2;
  rotorGrp.add(rCore);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 2.4, 20), mats.darkMetal);
  shaft.rotation.x = Math.PI / 2;
  rotorGrp.add(shaft);
  const northPole = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.98, 1.18), mats.glow(0xff3b30, 0.9));
  northPole.position.y = 0.45;
  rotorGrp.add(northPole);
  const southPole = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.98, 1.18), mats.glow(0x38bdf8, 0.9));
  southPole.position.y = -0.45;
  rotorGrp.add(southPole);
  scene.add(rotorGrp);

  // Rotating Magnetic Flux Halo
  fluxRing = new THREE.Mesh(new THREE.TorusGeometry(1.32, 0.045, 12, 48), mats.glow(0xff9500, 0.95));
  scene.add(fluxRing);
  fluxOrb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), mats.glow(0xff9500, 1.0));
  scene.add(fluxOrb);

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  LINES = Array.isArray(cfg.lines) ? cfg.lines : [];
  cv.width = W;
  cv.height = H;
  buildScene();

  const lFlux = getLine('flux', 2);
  const lRotor = getLine('rotor', 3);
  const lEff = getLine('eff', 4);
  EVENTS = [
    { t: Math.max(0.1, lFlux.start - 0.04), type: 'bounce', intensity: 0.8 },
    { t: Math.max(0.2, lRotor.start - 0.04), type: 'break', intensity: 1.0 },
    { t: Math.max(0.3, lEff.start - 0.04), type: 'win', intensity: 0.9 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  const lFlux = getLine('flux', 2);
  const boost = smooth(t, lFlux.start, lFlux.end);
  const fieldAngle = t * (2.6 + boost * 5.2);

  rotorGrp.rotation.z = fieldAngle - 0.18;
  fluxOrb.position.set(Math.cos(fieldAngle) * 1.32, Math.sin(fieldAngle) * 1.32, 0.65);

  coils.forEach((c) => {
    const wave = Math.max(0, Math.cos(fieldAngle - c.angle));
    c.mat.emissive.setHex(0xff9500);
    c.mat.emissiveIntensity = 0.12 + wave * 1.1;
  });

  const camA = lerp(-0.52, 0.52, p);
  stage.camera.position.set(Math.sin(camA) * 7.8, 0.72, Math.cos(camA) * 7.8);
  stage.camera.lookAt(0, 0, 0);

  stage.renderTo(ctx, W, H);

  const active = LINES.find((l) => t >= l.start && t <= l.end) || SCRIPT[Math.min(SCRIPT.length - 1, Math.floor(p * SCRIPT.length))];
  const rpm = Math.round(lerp(400, 16000, p));
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'explainer',
    title: '3-PHASE ELECTRIC MOTOR',
    subtitle: 'ROTATING MAGNETIC FLUX',
    progress: p,
    caption: active.caption,
    metrics: [
      { label: 'RPM', value: `${rpm.toLocaleString()}`, color: '#38BDF8' },
      { label: 'TORQUE', value: '100%', color: '#FF9500' },
      { label: 'EFFICIENCY', value: '92%', color: '#30D158' },
    ],
  });
};
</script>
