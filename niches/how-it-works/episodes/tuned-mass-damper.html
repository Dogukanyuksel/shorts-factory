<!doctype html>
<!-- How It Actually Works — The 660-Ton Skyscraper Pendulum -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#070d1a;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / Math.max(1e-5, b - a), 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, u) => a + (b - a) * u;

const SCRIPT = [
  { id: 'hook', text: "Near the top of Taipei 101 hangs a giant steel ball.", caption: "GIANT STEEL BALL" },
  { id: 'mass', text: "It weighs around 660 tons and swings like a pendulum.", caption: "660 TONS" },
  { id: 'lag', text: "When wind pushes the tower one way, the ball lags behind.", caption: "IT LAGS BEHIND" },
  { id: 'counter', text: "Its swing works against the building's sway.", caption: "OPPOSITE SWAY" },
  { id: 'heat', text: "Hydraulic dampers turn that motion into heat.", caption: "MOTION TO HEAT" },
  { id: 'outro', text: "The result: far less sway, even in typhoons.", caption: "CALMER TOWER" },
];

let W = 720, H = 1280, FPS = 60, DUR = 24, LINES = [], EVENTS = [];
window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;
window.init = (cfg) => {
  W = cfg.width || 720; H = cfg.height || 1280; FPS = cfg.fps || 60; DUR = cfg.duration || 24; LINES = cfg.lines || [];
  cv.width = W; cv.height = H;
  const byId = (id) => LINES.find((l) => l.id === id) || { start: 0, end: 3 };
  EVENTS = [
    { t: byId('mass').start + 0.25, type: 'bounce', pitchIndex: 3, intensity: 0.65 },
    { t: byId('lag').start + 0.25, type: 'bounce', pitchIndex: 6, intensity: 0.7 },
    { t: byId('counter').start + 0.25, type: 'break', pitchIndex: 8, intensity: 0.8 },
    { t: byId('heat').start + 0.25, type: 'bounce', pitchIndex: 5, intensity: 0.65 },
    { t: byId('outro').start + 0.2, type: 'win', pitchIndex: 10, intensity: 0.9 },
  ];
};

function rrect(x, y, w, h, r) {
  const rr = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function drawArrow(x1, y1, x2, y2, color, lw, head) {
  const ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(ang - 0.5) * head, y2 - Math.sin(ang - 0.5) * head);
  ctx.lineTo(x2 - Math.cos(ang + 0.5) * head, y2 - Math.sin(ang + 0.5) * head);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawFrame(t) {
  const S = W / 720;
  const byId = (id) => LINES.find((l) => l.id === id) || { start: 0, end: 3 };
  const LMass = byId('mass');
  const LLag = byId('lag');
  const LCounter = byId('counter');
  const LHeat = byId('heat');
  const LOutro = byId('outro');

  const pMass = smooth(LMass.start, LMass.start + 0.45, t) * (1 - smooth(LLag.start, LLag.start + 0.35, t));
  const pWind = smooth(LLag.start, LLag.start + 0.5, t);
  const pCounter = smooth(LCounter.start, LCounter.start + 0.45, t);
  const pHeat = smooth(LHeat.start, LHeat.start + 0.45, t);
  const pCalm = smooth(LOutro.start, LOutro.start + 0.7, t);

  // Blueprint background
  const bg = ctx.createRadialGradient(W * 0.5, H * 0.48, 40 * S, W * 0.5, H * 0.48, H * 0.68);
  bg.addColorStop(0, '#0d2240'); bg.addColorStop(0.6, '#071124'); bg.addColorStop(1, '#040812');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(56,189,248,0.06)'; ctx.lineWidth = 1.2 * S;
  for (let x = 0; x < W; x += 40 * S) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40 * S) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  // Physics of tower sway vs out-of-phase tuned mass pendulum
  const omega = 2.4;
  // Sway amplitude grows during wind, then gets damped by 40%+ during outro!
  const swayAmp = lerp(0.012, 0.085, pWind) * lerp(1.0, 0.42, pCalm);
  const towerTilt = Math.sin(t * omega) * swayAmp;
  // Pendulum lags behind building acceleration (~115 deg phase shift!)
  const pendAmp = lerp(0.06, 0.28, Math.max(smooth(LMass.start, LMass.start + 0.5, t) * 0.5, pWind)) * lerp(1.0, 0.65, pCalm);
  const pendRelAngle = Math.sin(t * omega - 2.05) * pendAmp;

  const baseX = W * 0.5;
  const baseY = H * 0.77;
  const zoom = 1 + smooth(0, DUR, t) * 0.05;

  ctx.save();
  ctx.translate(W * 0.5, H * 0.46); ctx.scale(zoom, zoom); ctx.translate(-W * 0.5, -H * 0.46);

  // 1) Typhoon Wind Streaks blasting from the left
  if (pWind > 0.02) {
    ctx.save();
    ctx.globalAlpha = pWind * 0.85;
    for (let i = 0; i < 9; i++) {
      const wy = H * 0.2 + i * 56 * S;
      const wx = ((t * (480 + (i % 3) * 110) * S + i * 130 * S) % (W + 220 * S)) - 160 * S;
      const wlen = (95 + (i % 4) * 35) * S;
      const wg = ctx.createLinearGradient(wx, wy, wx + wlen, wy);
      wg.addColorStop(0, 'rgba(56,189,248,0)');
      wg.addColorStop(0.7, 'rgba(56,189,248,0.75)');
      wg.addColorStop(1, 'rgba(224,242,254,0.95)');
      ctx.strokeStyle = wg; ctx.lineWidth = (2.5 + (i % 2) * 1.5) * S; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + wlen, wy); ctx.stroke();
    }
    // Wind label on left
    drawArrow(44 * S, H * 0.34, 148 * S, H * 0.34, '#38bdf8', 5 * S, 14 * S);
    ctx.fillStyle = '#38bdf8';
    ctx.font = `900 ${Math.round(18 * S)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('TYPHOON', 94 * S, H * 0.315);
    ctx.fillText('WIND', 94 * S, H * 0.375);
    ctx.restore();
  }

  // 2) Taipei 101 Stepped Skyscraper Silhouette (pivoting slightly from base)
  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.rotate(towerTilt);

  // Stepped pagoda-style tiers (iconic Taipei 101 flared segments)
  const tiers = [
    { y0: 0, y1: -95 * S, w0: 158 * S, w1: 146 * S },
    { y0: -95 * S, y1: -195 * S, w0: 136 * S, w1: 152 * S },
    { y0: -195 * S, y1: -295 * S, w0: 132 * S, w1: 148 * S },
    { y0: -295 * S, y1: -415 * S, w0: 132 * S, w1: 154 * S },
    { y0: -415 * S, y1: -535 * S, w0: 136 * S, w1: 158 * S },
  ];
  for (const seg of tiers) {
    const sg = ctx.createLinearGradient(-seg.w1, seg.y1, seg.w1, seg.y0);
    sg.addColorStop(0, '#1e293b'); sg.addColorStop(0.5, '#334155'); sg.addColorStop(1, '#0f172a');
    ctx.fillStyle = sg;
    ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2.5 * S;
    ctx.beginPath();
    ctx.moveTo(-seg.w0, seg.y0);
    ctx.lineTo(-seg.w1, seg.y1);
    ctx.lineTo(seg.w1, seg.y1);
    ctx.lineTo(seg.w0, seg.y0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  // Spire at very top
  ctx.fillStyle = '#475569'; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2.5 * S;
  ctx.beginPath();
  ctx.moveTo(-54 * S, -535 * S); ctx.lineTo(-12 * S, -610 * S);
  ctx.lineTo(12 * S, -610 * S); ctx.lineTo(54 * S, -535 * S);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 4 * S;
  ctx.beginPath(); ctx.moveTo(0, -610 * S); ctx.lineTo(0, -662 * S); ctx.stroke();

  // 3) Giant Circular Cutaway Chamber near the top (Floors 87-92)
  const chY = -395 * S;
  const chR = 132 * S;
  ctx.save();
  ctx.fillStyle = '#071124';
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4 * S;
  ctx.beginPath(); ctx.arc(0, chY, chR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.clip();

  // Subtle floor grid inside cutaway chamber
  ctx.strokeStyle = 'rgba(148,163,184,0.16)'; ctx.lineWidth = 1.5 * S;
  for (let fy = chY - chR; fy <= chY + chR; fy += 26 * S) {
    ctx.beginPath(); ctx.moveTo(-chR, fy); ctx.lineTo(chR, fy); ctx.stroke();
  }

  // Pendulum suspension pivot at top of chamber
  const pivotY = chY - 108 * S;
  const cableLen = 122 * S;
  const ballX = Math.sin(pendRelAngle) * cableLen;
  const ballY = pivotY + Math.cos(pendRelAngle) * cableLen;
  const ballR = 54 * S;

  // Hydraulic Damper Pistons below the sphere (connect ball bottom to chamber walls)
  const leftAnchor = { x: -112 * S, y: chY + 94 * S };
  const rightAnchor = { x: 112 * S, y: chY + 94 * S };
  const ballBot = { x: ballX, y: ballY + ballR * 0.72 };
  const heatGlow = pHeat * (0.55 + 0.45 * Math.abs(Math.cos(t * omega - 2.05)));

  const drawDamper = (ax, ay, bx, by) => {
    const mx = lerp(ax, bx, 0.55), my = lerp(ay, by, 0.55);
    // Outer hydraulic cylinder (glows warm orange/red during heat phase)
    ctx.strokeStyle = heatGlow > 0.15 ? `rgb(${Math.round(lerp(100, 249, heatGlow))},${Math.round(lerp(116, 115, heatGlow))},${Math.round(lerp(139, 22, heatGlow))})` : '#64748b';
    ctx.shadowColor = '#f97316'; ctx.shadowBlur = heatGlow * 22 * S;
    ctx.lineWidth = 16 * S; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(mx, my); ctx.stroke();
    ctx.shadowBlur = 0;
    // Inner chrome piston rod
    ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 7 * S;
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(bx, by); ctx.stroke();
  };
  drawDamper(leftAnchor.x, leftAnchor.y, ballBot.x - 10 * S, ballBot.y);
  drawDamper(rightAnchor.x, rightAnchor.y, ballBot.x + 10 * S, ballBot.y);

  // Rising thermal heat waves from hydraulic dampers
  if (pHeat > 0.08) {
    for (let h = 0; h < 6; h++) {
      const hu = ((t * 1.3 + h * 0.23) % 1);
      const hx = (h % 2 === 0 ? -56 : 56) * S + Math.sin(t * 7 + h) * 8 * S;
      const hy = chY + 86 * S - hu * 64 * S;
      ctx.strokeStyle = `rgba(251,146,60,${((1 - hu) * pHeat * 0.85).toFixed(2)})`;
      ctx.lineWidth = 3 * S;
      ctx.beginPath(); ctx.arc(hx, hy, (6 + hu * 8) * S, Math.PI, Math.PI * 2); ctx.stroke();
    }
  }

  // 4 Steel Suspension Cables
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3.2 * S;
  for (const ox of [-22 * S, -8 * S, 8 * S, 22 * S]) {
    ctx.beginPath(); ctx.moveTo(ox, pivotY); ctx.lineTo(ballX + ox * 0.65, ballY - ballR * 0.55); ctx.stroke();
  }
  // Top structural beam
  ctx.fillStyle = '#475569';
  ctx.fillRect(-52 * S, pivotY - 12 * S, 104 * S, 14 * S);

  // Giant 660-Ton Golden Steel Sphere (layered plates)
  const bgBall = ctx.createRadialGradient(ballX - 18 * S, ballY - 18 * S, 6 * S, ballX, ballY, ballR);
  bgBall.addColorStop(0, '#fef9c3');
  bgBall.addColorStop(0.35, '#facc15');
  bgBall.addColorStop(0.75, '#ca8a04');
  bgBall.addColorStop(1, '#713f12');
  ctx.fillStyle = bgBall;
  ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 3 * S;
  ctx.beginPath(); ctx.arc(ballX, ballY, ballR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // Horizontal steel plate seam lines across sphere
  ctx.strokeStyle = 'rgba(113,63,18,0.45)'; ctx.lineWidth = 1.6 * S;
  for (let sy = -36 * S; sy <= 36 * S; sy += 12 * S) {
    const hw = Math.sqrt(Math.max(0, ballR * ballR - sy * sy));
    ctx.beginPath(); ctx.moveTo(ballX - hw, ballY + sy); ctx.lineTo(ballX + hw, ballY + sy); ctx.stroke();
  }
  // 660T stamp on sphere
  ctx.fillStyle = '#020617';
  ctx.font = `900 ${Math.round(20 * S)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('660 T', ballX, ballY + 7 * S);

  ctx.restore(); // end cutaway clip

  // Counter-Phase Opposing Force Arrows during 'lag' & 'counter'
  if (pWind > 0.15 && pCalm < 0.8) {
    ctx.save();
    ctx.globalAlpha = clamp(pWind * (1 - pCalm * 0.6), 0, 1);
    const towerDir = towerTilt >= 0 ? 1 : -1;
    // Building sway arrow above chamber
    drawArrow(0, chY - chR - 28 * S, towerDir * 82 * S, chY - chR - 28 * S, '#fb923c', 5.5 * S, 14 * S);
    ctx.fillStyle = '#fb923c';
    ctx.font = `900 ${Math.round(16 * S)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('TOWER SWAY', 0, chY - chR - 46 * S);

    if (pCounter > 0.1) {
      ctx.globalAlpha = pCounter * (1 - pCalm * 0.6);
      const ballDir = pendRelAngle >= 0 ? 1 : -1;
      drawArrow(0, chY + chR + 28 * S, ballDir * 82 * S, chY + chR + 28 * S, '#4ade80', 5.5 * S, 14 * S);
      ctx.fillStyle = '#4ade80';
      ctx.fillText('COUNTER-SWING', 0, chY + chR + 54 * S);
    }
    ctx.restore();
  }

  ctx.restore(); // end tower tilt

  // Ground foundation bar
  ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 3 * S;
  ctx.fillRect(W * 0.12, baseY, W * 0.76, 16 * S);
  ctx.strokeRect(W * 0.12, baseY, W * 0.76, 16 * S);

  ctx.restore(); // end zoom

  // Mass Spec Badge (Mass phase)
  if (pMass > 0.05) {
    ctx.save();
    ctx.globalAlpha = pMass;
    ctx.fillStyle = 'rgba(15,23,42,0.9)'; ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3 * S;
    rrect(W * 0.5 - 210 * S, H * 0.175, 420 * S, 52 * S, 12 * S); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#facc15'; ctx.textAlign = 'center';
    ctx.font = `900 ${Math.round(20 * S)}px -apple-system, sans-serif`;
    ctx.fillText('660 METRIC TONS · 5.5 m STEEL BALL', W * 0.5, H * 0.175 + 33 * S);
    ctx.restore();
  }

  // Thermal Heat Callout (Heat phase)
  if (pHeat > 0.05 && pCalm < 0.7) {
    ctx.save();
    ctx.globalAlpha = pHeat * (1 - pCalm);
    ctx.fillStyle = 'rgba(67,20,7,0.9)'; ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 3 * S;
    rrect(W * 0.5 - 195 * S, H * 0.175, 390 * S, 52 * S, 12 * S); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fdba74'; ctx.textAlign = 'center';
    ctx.font = `900 ${Math.round(20 * S)}px -apple-system, sans-serif`;
    ctx.fillText('HYDRAULIC DAMPERS → HEAT', W * 0.5, H * 0.175 + 33 * S);
    ctx.restore();
  }

  // Sway Reduction Meter Badge (Outro phase)
  if (pCalm > 0.05) {
    ctx.save();
    ctx.globalAlpha = pCalm;
    const mx = W * 0.5, my = H * 0.175;
    ctx.fillStyle = 'rgba(15,23,42,0.92)'; ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 3.5 * S;
    rrect(mx - 190 * S, my, 380 * S, 64 * S, 14 * S); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4ade80'; ctx.textAlign = 'center';
    ctx.font = `900 ${Math.round(28 * S)}px -apple-system, sans-serif`;
    ctx.fillText('-40% TOWER SWAY', mx, my + 42 * S);
    ctx.restore();
  }

  // Top Title & Bottom Viral Caption
  let activeLine = LINES[0];
  for (const l of LINES) if (t >= l.start) activeLine = l;
  ctx.save(); ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(32 * S)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#93c5fd';
  ctx.fillText('THE 660-TON SKYSCRAPER PENDULUM', W * 0.5, H * 0.125, W * 0.92);
  if (activeLine) {
    const pop = 1 + 0.08 * Math.exp(-Math.max(0, t - activeLine.start) * 14);
    ctx.translate(W * 0.5, H * 0.84); ctx.scale(pop, pop);
    ctx.font = `900 ${Math.round(46 * S)}px -apple-system, sans-serif`;
    ctx.lineWidth = 10 * S; ctx.strokeStyle = '#020617'; ctx.strokeText(activeLine.caption, 0, 0);
    ctx.fillStyle = activeLine.id === 'outro' || activeLine.id === 'counter' ? '#4ade80' : activeLine.id === 'heat' ? '#fb923c' : '#facc15';
    ctx.fillText(activeLine.caption, 0, 0);
  }
  ctx.restore();
}

window.renderBatch = (s, c) => {
  const out = [];
  for (let i = 0; i < c; i++) { drawFrame((s + i) / FPS); out.push(cv.toDataURL('image/jpeg', 0.92).slice(23)); }
  return out;
};
window.ready = true;
</script>
