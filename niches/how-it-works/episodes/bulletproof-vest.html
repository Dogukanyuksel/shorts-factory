<!doctype html>
<!--
  Clear Mechanics — 3D PBR: How Kevlar Stops a 9mm Bullet Without Steel
  Y-LABS 3D Cinema Engine (Three.js PBR Multi-Layer Woven Kevlar Mesh + 9mm Projectile Deformation + Shockwave Ripple, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#141414;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  microShake,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'How does soft woven fabric stop a nine-millimeter bullet traveling faster than sound?', caption: 'FABRIC VS 9MM BULLET' },
  { id: 'weave', text: 'Kevlar fibers are five times stronger than steel by weight, woven into a tight net.', caption: '5× STRONGER THAN STEEL' },
  { id: 'impact', text: 'The moment the bullet strikes, it twists into the weave instead of slicing through.', caption: '0.1 MS IMPACT CATCH' },
  { id: 'spread', text: 'Thirty stacked layers stretch like a soccer net, spreading kinetic energy across the entire chest.', caption: '30 LAYERS SPREAD FORCE' },
  { id: 'flatten', text: 'The lead core flattens into a mushroom shape, bleeding off all forward momentum.', caption: 'BULLET FLATTENS FLAT' },
  { id: 'verdict', text: 'It does not block the bullet like a wall — it catches and spreads the shockwave.', caption: 'ENERGY DISPERSED' },
];

let W = 720, H = 1280, FPS = 60, DUR = 26, LINES = [], EVENTS = [];
let stage = null, built = false;
let layers = [], bulletGrp, shockRing;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, idx) {
  const f = LINES.find((l) => l.id === id);
  if (f) return f;
  const seg = DUR / SCRIPT.length;
  return { id, start: idx * seg, end: (idx + 1) * seg, caption: SCRIPT[idx].caption };
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'explainer', fov: 38, fogDensity: 0.02, floorY: -2.6 });
  const { scene } = stage;
  const mats = createMaterials('explainer');

  // 6 visual Kevlar weave planes (representing 30 stacked layers)
  layers = [];
  for (let i = 0; i < 6; i++) {
    const geo = new THREE.PlaneGeometry(3.4, 3.4, 18, 18);
    const mat = new THREE.MeshStandardMaterial({
      color: i === 0 ? 0xff9500 : 0xf59e0b,
      emissive: 0xff9500,
      emissiveIntensity: 0.12,
      wireframe: true,
      transparent: true,
      opacity: 0.72 - i * 0.07,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.z = -0.35 - i * 0.28;
    const baseZ = new Float32Array(geo.attributes.position.count);
    scene.add(mesh);
    layers.push({ mesh, geo, baseZ, idx: i });
  }

  // 9mm Copper-Jacketed Bullet
  bulletGrp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.65, 24), mats.copper);
  body.rotation.x = Math.PI / 2;
  bulletGrp.add(body);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 16), mats.copper);
  tip.position.z = -0.32;
  bulletGrp.add(tip);
  bulletGrp.position.set(0, 0, 2.8);
  scene.add(bulletGrp);

  // Impact Shockwave Ring
  shockRing = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.04, 12, 48), mats.glow(0x38bdf8, 1.0));
  shockRing.position.z = -0.25;
  scene.add(shockRing);

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  LINES = Array.isArray(cfg.lines) ? cfg.lines : [];
  cv.width = W;
  cv.height = H;
  buildScene();

  const lImp = getLine('impact', 2);
  const lSpr = getLine('spread', 3);
  const lFlat = getLine('flatten', 4);
  EVENTS = [
    { t: Math.max(0.1, lImp.start - 0.04), type: 'break', intensity: 1.0 },
    { t: Math.max(0.2, lSpr.start - 0.04), type: 'bounce', intensity: 0.9 },
    { t: Math.max(0.3, lFlat.start - 0.04), type: 'win', intensity: 0.85 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  const lImp = getLine('impact', 2);
  const lFlat = getLine('flatten', 4);
  const approach = smooth(t, 0, lImp.start);
  const catchP = smooth(t, lImp.start, lFlat.end);
  const deform = Math.sin(catchP * Math.PI * 0.72);

  // Bullet travels in along -Z, embeds and flattens into mushroom shape
  const bz = lerp(2.85, -0.25, approach) - deform * 0.72;
  bulletGrp.position.set(0, 0, bz);
  bulletGrp.rotation.z = t * (14 * (1 - catchP * 0.92));
  bulletGrp.scale.set(1 + catchP * 0.55, 1 + catchP * 0.55, lerp(1.0, 0.42, catchP));

  // Deform Kevlar mesh layers into parabolic net + radial shock ripple
  layers.forEach(({ geo, idx }) => {
    const pos = geo.attributes.position;
    const layerFactor = Math.max(0.15, 1 - idx * 0.14);
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i);
      const vy = pos.getY(i);
      const dist = Math.hypot(vx, vy);
      const cone = -deform * 1.15 * layerFactor * Math.exp(-dist * dist * 0.85);
      const ripple = catchP > 0.02 ? Math.sin(dist * 7 - catchP * 14) * 0.08 * deform * Math.exp(-dist * 0.5) : 0;
      pos.setZ(i, cone + ripple);
    }
    pos.needsUpdate = true;
  });

  shockRing.visible = catchP > 0.02;
  shockRing.scale.setScalar(0.5 + catchP * 3.4);
  shockRing.material.opacity = clamp(1 - catchP * 0.85, 0.1, 1);

  const shake = microShake(t, lImp.start, 0.45, 0.16);
  const camA = lerp(-0.72, 0.62, p);
  stage.camera.position.set(Math.sin(camA) * 7.4 + shake.x, 0.55 + shake.y, Math.cos(camA) * 7.4);
  stage.camera.lookAt(0, 0, -0.5);

  stage.renderTo(ctx, W, H);

  const active = LINES.find((l) => t >= l.start && t <= l.end) || SCRIPT[Math.min(SCRIPT.length - 1, Math.floor(p * SCRIPT.length))];
  const speedMs = Math.round(lerp(360, 0, catchP));
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'explainer',
    title: 'KEVLAR BALLISTIC WEAVE',
    subtitle: '30-LAYER ENERGY DISPERSION',
    progress: p,
    caption: active.caption,
    metrics: [
      { label: 'VELOCITY', value: `${speedMs} M/S`, color: speedMs > 100 ? '#FF3B30' : '#30D158' },
      { label: 'LAYERS', value: '30× KEVLAR', color: '#FF9500' },
      { label: 'ENERGY', value: '510 J', color: '#38BDF8' },
    ],
  });
};
</script>
