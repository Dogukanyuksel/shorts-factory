<!doctype html>
<!--
  Clear Mechanics — 3D PBR: How Disc Brakes Stop 2 Tons at 600°C Without Melting
  Y-LABS 3D Cinema Engine (Three.js PBR Vented Brake Rotor + Hydraulic Caliper Pistons + Thermal Glow, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#141414;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  microShake,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'Your foot presses gently on one pedal — yet it stops two tons of spinning steel dead.', caption: '2 TONS → 0 KM/H' },
  { id: 'hydro', text: 'Brake fluid multiplies your foot pressure forty times using Pascal’s hydraulic law.', caption: '40× HYDRAULIC FORCE' },
  { id: 'clamp', text: 'Twin pistons slam high-friction pads onto a cast-iron rotor spinning at highway speed.', caption: 'CALIPER CLAMPING' },
  { id: 'heat', text: 'All that kinetic energy converts into pure heat — glowing cherry-red past six hundred degrees.', caption: '600°C THERMAL GLOW' },
  { id: 'vents', text: 'Internal cooling vanes spin like a turbine, pumping cold air out to prevent brake fade.', caption: 'INTERNAL COOLING VANES' },
  { id: 'verdict', text: 'Every hard stop turns motion into heat — and those hidden vents keep your brakes alive.', caption: 'MOTION → HEAT → STOP' },
];

let W = 720, H = 1280, FPS = 60, DUR = 26, LINES = [], EVENTS = [];
let stage = null, built = false;
let rotorGrp, rotorMat, padFront, padBack, caliperGrp, sparks = [];

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, idx) {
  const f = LINES.find((l) => l.id === id);
  if (f) return f;
  const seg = DUR / SCRIPT.length;
  return { id, start: idx * seg, end: (idx + 1) * seg, caption: SCRIPT[idx].caption };
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'explainer', fov: 38, fogDensity: 0.02, floorY: -2.6 });
  const { scene } = stage;
  const mats = createMaterials('explainer');

  // Spinning Vented Rotor
  rotorGrp = new THREE.Group();
  rotorMat = new THREE.MeshStandardMaterial({
    color: 0x94a3b8,
    emissive: 0xff3b00,
    emissiveIntensity: 0.0,
    metalness: 0.88,
    roughness: 0.24,
  });
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 1.95, 0.22, 48), rotorMat);
  disc.rotation.x = Math.PI / 2;
  rotorGrp.add(disc);

  const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.76, 0.82, 0.48, 24), mats.darkMetal);
  hat.rotation.x = Math.PI / 2;
  rotorGrp.add(hat);

  // Drilled cooling slots on rotor face
  const holeGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.26, 10);
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const r = i % 2 === 0 ? 1.28 : 1.62;
    const h = new THREE.Mesh(holeGeo, mats.darkMetal);
    h.rotation.x = Math.PI / 2;
    h.position.set(Math.cos(a) * r, Math.sin(a) * r, 0);
    rotorGrp.add(h);
  }
  scene.add(rotorGrp);

  // Hydraulic Caliper Housing (Orange Performance Finish)
  caliperGrp = new THREE.Group();
  caliperGrp.position.set(1.55, 0.25, 0);
  const bodyGeo = new THREE.BoxGeometry(0.95, 1.65, 0.88);
  const body = new THREE.Mesh(bodyGeo, mats.glass(0xff9500, 0.34));
  caliperGrp.add(body);
  caliperGrp.add(addXrayEdges(bodyGeo, 0xff9500, 0.82));

  padFront = new THREE.Mesh(new THREE.BoxGeometry(0.65, 1.15, 0.14), mats.copper);
  padFront.position.set(-0.08, 0, 0.32);
  caliperGrp.add(padFront);

  padBack = new THREE.Mesh(new THREE.BoxGeometry(0.65, 1.15, 0.14), mats.copper);
  padBack.position.set(-0.08, 0, -0.32);
  caliperGrp.add(padBack);
  scene.add(caliperGrp);

  // Friction heat sparks
  const spGeo = new THREE.SphereGeometry(0.055, 8, 8);
  for (let i = 0; i < 20; i++) {
    const s = new THREE.Mesh(spGeo, mats.glow(0xff9500, 1.0));
    s.userData = { seed: i * 1.37 };
    scene.add(s);
    sparks.push(s);
  }

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  LINES = Array.isArray(cfg.lines) ? cfg.lines : [];
  cv.width = W;
  cv.height = H;
  buildScene();

  const lClamp = getLine('clamp', 2);
  const lHeat = getLine('heat', 3);
  const lVents = getLine('vents', 4);
  EVENTS = [
    { t: Math.max(0.1, lClamp.start - 0.04), type: 'break', intensity: 0.9 },
    { t: Math.max(0.2, lHeat.start - 0.04), type: 'break', intensity: 1.0 },
    { t: Math.max(0.3, lVents.start - 0.04), type: 'win', intensity: 0.85 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  const lClamp = getLine('clamp', 2);
  const lHeat = getLine('heat', 3);
  const lVents = getLine('vents', 4);

  const clampP = smooth(t, lClamp.start, lClamp.start + 0.9);
  const heatP = smooth(t, lHeat.start, lHeat.end) * (1 - smooth(t, lVents.start, lVents.end) * 0.45);
  const spinRate = lerp(9.5, 1.4, smooth(t, lClamp.start, DUR));

  rotorGrp.rotation.z -= spinRate * 0.025 + t * 0.0;
  rotorGrp.rotation.z = -(t * 6.5 - clampP * Math.max(0, t - lClamp.start) * 4.2);

  const padZ = lerp(0.34, 0.18, clampP);
  padFront.position.z = padZ;
  padBack.position.z = -padZ;

  rotorMat.emissiveIntensity = heatP * 1.35;

  sparks.forEach((s, i) => {
    const phase = (t * 2.8 + s.userData.seed) % 1;
    s.visible = clampP > 0.3 && heatP > 0.15;
    s.position.set(1.45 + phase * 1.4, -0.35 - phase * 1.6 + Math.sin(i) * 0.25, Math.cos(i * 3) * 0.35);
    s.scale.setScalar(1 - phase * 0.8);
  });

  const shake = microShake(t, lClamp.start, 0.5, 0.1);
  const camA = lerp(-0.55, 0.48, p);
  stage.camera.position.set(Math.sin(camA) * 7.6 + shake.x, 0.65 + shake.y, Math.cos(camA) * 7.6);
  stage.camera.lookAt(0.25, 0, 0);

  stage.renderTo(ctx, W, H);

  const active = LINES.find((l) => t >= l.start && t <= l.end) || SCRIPT[Math.min(SCRIPT.length - 1, Math.floor(p * SCRIPT.length))];
  const tempC = Math.round(90 + heatP * 540);
  const kmh = Math.round(lerp(140, 0, smooth(t, lClamp.start, lVents.end)));
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'explainer',
    title: 'HYDRAULIC DISC BRAKE',
    subtitle: '600°C THERMAL CONVERSION',
    progress: p,
    caption: active.caption,
    metrics: [
      { label: 'SPEED', value: `${kmh} KM/H`, color: '#38BDF8' },
      { label: 'ROTOR TEMP', value: `${tempC}°C`, color: tempC > 350 ? '#FF3B30' : '#FF9500' },
      { label: 'FORCE', value: `${Math.round(clampP * 40)}×`, color: '#FFFFFF' },
    ],
  });
};
</script>
