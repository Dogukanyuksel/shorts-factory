<!doctype html>
<!--
  Clear Mechanics — 3D PBR: How an Airbag Explodes & Saves You in 30 Milliseconds
  Y-LABS 3D Cinema Engine (Three.js PBR Steering Column Cutaway + Accelerometer + 30ms Nitrogen Cushion, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#141414;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
  easeOutBack,
  microShake,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: 'An airbag does not inflate with air — it fires a controlled explosion inches from your face.', caption: '30 MS EXPLOSION' },
  { id: 'sensor', text: 'At impact, a microscopic accelerometer detects sudden deceleration in just fifteen milliseconds.', caption: '15 MS CRASH SENSOR' },
  { id: 'ignite', text: 'An electric spark ignites solid propellant pellets, instantly generating sixty liters of nitrogen gas.', caption: '60L NITROGEN GAS' },
  { id: 'deploy', text: 'The nylon bag bursts through the steering wheel at three hundred kilometers per hour.', caption: '300 KM/H DEPLOYMENT' },
  { id: 'vent', text: 'Before your head even touches it, rear vents already deflate the bag to cushion the blow.', caption: 'VENTED SOFT CATCH' },
  { id: 'verdict', text: 'From impact to full deflation takes less time than a single blink of your eye.', caption: 'FASTER THAN A BLINK' },
];

let W = 720, H = 1280, FPS = 60, DUR = 26, LINES = [], EVENTS = [];
let stage = null, built = false;
let wheelGrp, canister, sparkOrb, airbagMesh, gasParticles = [];

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, idx) {
  const f = LINES.find((l) => l.id === id);
  if (f) return f;
  const seg = DUR / SCRIPT.length;
  return { id, start: idx * seg, end: (idx + 1) * seg, caption: SCRIPT[idx].caption };
}

function buildScene() {
  stage = createStudioStage({ width: W, height: H, channel: 'explainer', fov: 38, fogDensity: 0.02, floorY: -2.6 });
  const { scene } = stage;
  const mats = createMaterials('explainer');

  // Steering Wheel Rim + Spokes
  wheelGrp = new THREE.Group();
  wheelGrp.position.set(0, 0, -1.1);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.75, 0.16, 16, 48), mats.darkMetal);
  wheelGrp.add(rim);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.72, 0.45, 24), mats.steel);
  hub.rotation.x = Math.PI / 2;
  wheelGrp.add(hub);
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 + Math.PI / 6;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.55, 0.16), mats.steel);
    spoke.position.set(Math.cos(a) * 0.9, Math.sin(a) * 0.9, -0.04);
    spoke.rotation.z = a - Math.PI / 2;
    wheelGrp.add(spoke);
  }
  scene.add(wheelGrp);

  // Propellant Canister & Igniter Core
  canister = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.35, 24), mats.copper);
  canister.rotation.x = Math.PI / 2;
  canister.position.set(0, 0, -0.82);
  scene.add(canister);

  sparkOrb = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16), mats.glow(0xff9500, 1.0));
  sparkOrb.position.set(0, 0, -0.62);
  scene.add(sparkOrb);

  // Deployable 3D Airbag Cushion
  const bagGeo = new THREE.SphereGeometry(1.45, 28, 22);
  bagGeo.scale(1.08, 1.0, 0.72);
  airbagMesh = new THREE.Mesh(bagGeo, mats.glass(0x38bdf8, 0.38));
  airbagMesh.add(addXrayEdges(bagGeo, 0xff9500, 0.42));
  airbagMesh.position.set(0, 0, 0.45);
  scene.add(airbagMesh);

  // Nitrogen expansion particles
  const pGeo = new THREE.SphereGeometry(0.08, 10, 10);
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(pGeo, mats.glow(i % 2 === 0 ? 0xff9500 : 0x38bdf8, 0.95));
    m.userData = { a: (i / 24) * Math.PI * 2, r: 0.4 + (i % 4) * 0.32 };
    scene.add(m);
    gasParticles.push(m);
  }

  built = true;
}

window.initScene = function (cfg = {}) {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 26;
  LINES = Array.isArray(cfg.lines) ? cfg.lines : [];
  cv.width = W;
  cv.height = H;
  buildScene();

  const lIgnite = getLine('ignite', 2);
  const lDeploy = getLine('deploy', 3);
  const lVent = getLine('vent', 4);
  EVENTS = [
    { t: Math.max(0.1, lIgnite.start - 0.04), type: 'break', intensity: 1.0 },
    { t: Math.max(0.2, lDeploy.start - 0.04), type: 'break', intensity: 1.0 },
    { t: Math.max(0.3, lVent.start - 0.04), type: 'bounce', intensity: 0.75 },
  ];
};

window.renderFrame = function (t) {
  if (!built) window.initScene({ width: W, height: H, fps: FPS, duration: DUR });
  const p = clamp(t / DUR, 0, 1);

  const lIgnite = getLine('ignite', 2);
  const lDeploy = getLine('deploy', 3);
  const lVent = getLine('vent', 4);

  const igniteP = smooth(t, lIgnite.start, lIgnite.start + 0.6);
  const deployP = easeOutBack(smooth(t, lDeploy.start, lDeploy.start + 0.85));
  const ventP = smooth(t, lVent.start, lVent.end);

  const bagScale = clamp(0.14 + deployP * 0.92 - ventP * 0.28, 0.14, 1.15);
  airbagMesh.scale.setScalar(bagScale);
  airbagMesh.position.z = lerp(-0.55, 0.68, clamp(deployP, 0, 1)) - ventP * 0.25;

  sparkOrb.scale.setScalar(0.3 + igniteP * (1 - ventP * 0.8) * 1.45 + Math.sin(t * 25) * 0.1);
  sparkOrb.visible = igniteP > 0.02;

  gasParticles.forEach((m) => {
    const spread = clamp(deployP, 0, 1) * m.userData.r * 1.65;
    const a = m.userData.a + t * 2.2;
    m.position.set(Math.cos(a) * spread, Math.sin(a) * spread, lerp(-0.6, 0.85, clamp(deployP, 0, 1)));
    m.visible = igniteP > 0.05;
  });

  const shake = microShake(t, lDeploy.start, 0.45, 0.18);
  const camA = lerp(-0.48, 0.48, p);
  stage.camera.position.set(Math.sin(camA) * 7.6 + shake.x, 0.55 + shake.y, Math.cos(camA) * 7.6);
  stage.camera.lookAt(0, 0, 0);

  stage.renderTo(ctx, W, H);

  const active = LINES.find((l) => t >= l.start && t <= l.end) || SCRIPT[Math.min(SCRIPT.length - 1, Math.floor(p * SCRIPT.length))];
  const ms = Math.round(clamp(p * 55, 0, 55));
  drawStudioHud(ctx, {
    width: W,
    height: H,
    channel: 'explainer',
    title: 'AIRBAG 30MS DEPLOY',
    subtitle: 'NITROGEN INFLATOR CUTAWAY',
    progress: p,
    caption: active.caption,
    metrics: [
      { label: 'ELAPSED', value: `${ms} ms`, color: '#FF9500' },
      { label: 'GAS VOL', value: `${Math.round(clamp(deployP, 0, 1) * 60)} L`, color: '#38BDF8' },
      { label: 'SPEED', value: '300 KM/H', color: '#FFFFFF' },
    ],
  });
};
</script>
