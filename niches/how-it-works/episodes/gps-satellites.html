<!doctype html>
<!-- How It Actually Works — GPS Satellites -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#070d1a;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / Math.max(1e-5, b - a), 0, 1); return x * x * (3 - 2 * x); };

const SCRIPT = [
  { id: 'hook', text: 'How does your phone pinpoint you anywhere on Earth to within feet?', caption: 'PINPOINT ACCURACY' },
  { id: 'orbit', text: 'High above, 30 GPS satellites orbit 12,500 miles in space with atomic clocks.', caption: 'ATOMIC CLOCKS' },
  { id: 'signal', text: 'Each satellite beams down radio timestamps traveling at the speed of light.', caption: 'LIGHT-SPEED SIGNALS' },
  { id: 'circle1', text: 'One satellite measures signal delay, placing you somewhere on a huge circle.', caption: '1ST RANGE CIRCLE' },
  { id: 'trilat', text: 'Adding a second and third satellite narrows the overlap to one exact spot.', caption: 'TRILATERATION!' },
  { id: 'outro', text: 'Lock onto four satellites and GPS nails your exact location and altitude!', caption: 'LOCATION LOCKED!' },
];

let W = 720, H = 1280, FPS = 60, DUR = 24, LINES = [], EVENTS = [];
window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;
window.init = (cfg) => {
  W = cfg.width || 720; H = cfg.height || 1280; FPS = cfg.fps || 60; DUR = cfg.duration || 24; LINES = cfg.lines || [];
  cv.width = W; cv.height = H;
  const byId = (id) => LINES.find((l) => l.id === id) || { start: 0, end: 3 };
  EVENTS = [
    { t: byId('orbit').start + 0.25, type: 'bounce', pitchIndex: 4, intensity: 0.55 },
    { t: byId('signal').start + 0.25, type: 'bounce', pitchIndex: 6, intensity: 0.65 },
    { t: byId('circle1').start + 0.25, type: 'bounce', pitchIndex: 7, intensity: 0.7 },
    { t: byId('trilat').start + 0.2, type: 'break', pitchIndex: 9, intensity: 0.85 },
    { t: byId('outro').start + 0.2, type: 'win', pitchIndex: 11, intensity: 0.95 },
  ];
};

function drawSatellite(x, y, angle, color, S, label) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  // Solar panels
  ctx.fillStyle = '#1d4ed8';
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 2 * S;
  ctx.fillRect(-38 * S, -7 * S, 24 * S, 14 * S);
  ctx.strokeRect(-38 * S, -7 * S, 24 * S, 14 * S);
  ctx.fillRect(14 * S, -7 * S, 24 * S, 14 * S);
  ctx.strokeRect(14 * S, -7 * S, 24 * S, 14 * S);
  // Gold foil bus
  ctx.fillStyle = '#facc15';
  ctx.strokeStyle = '#fef08a';
  ctx.fillRect(-11 * S, -10 * S, 22 * S, 20 * S);
  ctx.strokeRect(-11 * S, -10 * S, 22 * S, 20 * S);
  // Antenna dish
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, 14 * S, 5 * S, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  if (label) {
    ctx.fillStyle = color;
    ctx.font = `800 ${Math.round(16 * S)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(label, x, y - 24 * S);
  }
}

function drawFrame(t) {
  const S = W / 720;
  const byId = (id) => LINES.find((l) => l.id === id) || { start: 0, end: 3 };
  const pOrbit = smooth(byId('orbit').start, byId('orbit').start + 0.6, t);
  const pSig = smooth(byId('signal').start, byId('signal').start + 0.6, t);
  const pC1 = smooth(byId('circle1').start, byId('circle1').start + 0.7, t);
  const pTri = smooth(byId('trilat').start, byId('trilat').start + 0.8, t);
  const pOutro = smooth(byId('outro').start, byId('outro').start + 0.6, t);

  // Blueprint background + grid
  const bg = ctx.createRadialGradient(W * 0.5, H * 0.52, 40 * S, W * 0.5, H * 0.52, H * 0.65);
  bg.addColorStop(0, '#0d2240'); bg.addColorStop(0.6, '#071124'); bg.addColorStop(1, '#040812');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(56,189,248,0.06)'; ctx.lineWidth = 1.2 * S;
  for (let x = 0; x < W; x += 40 * S) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40 * S) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  const cx = W * 0.5, cy = H * 0.54;
  const earthR = 148 * S;
  const orbitR = 268 * S;
  const zoom = 1 + smooth(0, DUR, t) * 0.05;

  ctx.save();
  ctx.translate(cx, cy); ctx.scale(zoom, zoom); ctx.translate(-cx, -cy);

  // Orbit ring
  ctx.strokeStyle = `rgba(148,163,184,${(0.18 + pOrbit * 0.25).toFixed(2)})`;
  ctx.lineWidth = 2 * S;
  ctx.setLineDash([8 * S, 8 * S]);
  ctx.beginPath(); ctx.arc(cx, cy, orbitR, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // Earth atmosphere glow
  const atmo = ctx.createRadialGradient(cx, cy, earthR * 0.85, cx, cy, earthR * 1.24);
  atmo.addColorStop(0, 'rgba(56,189,248,0.35)');
  atmo.addColorStop(1, 'rgba(56,189,248,0)');
  ctx.fillStyle = atmo;
  ctx.beginPath(); ctx.arc(cx, cy, earthR * 1.24, 0, Math.PI * 2); ctx.fill();

  // Earth sphere
  const eg = ctx.createRadialGradient(cx - 45 * S, cy - 45 * S, 18 * S, cx, cy, earthR);
  eg.addColorStop(0, '#1e40af'); eg.addColorStop(0.65, '#0f2859'); eg.addColorStop(1, '#061229');
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(cx, cy, earthR, 0, Math.PI * 2); ctx.fill();

  // Earth lat/lon grid + stylized landmasses (clipped to Earth)
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, earthR, 0, Math.PI * 2); ctx.clip();
  ctx.strokeStyle = 'rgba(56,189,248,0.16)';
  ctx.lineWidth = 1.4 * S;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.ellipse(cx, cy, earthR * (0.28 + Math.abs(i) * 0.24), earthR, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - earthR, cy + i * 48 * S); ctx.lineTo(cx + earthR, cy + i * 48 * S); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(34,197,94,0.22)';
  ctx.beginPath();
  ctx.ellipse(cx - 48 * S, cy - 32 * S, 46 * S, 36 * S, -0.3, 0, Math.PI * 2);
  ctx.ellipse(cx + 52 * S, cy - 18 * S, 52 * S, 44 * S, 0.2, 0, Math.PI * 2);
  ctx.ellipse(cx - 18 * S, cy + 56 * S, 34 * S, 42 * S, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 3 * S;
  ctx.beginPath(); ctx.arc(cx, cy, earthR, 0, Math.PI * 2); ctx.stroke();

  // Target phone point on Earth
  const tx = cx + 22 * S;
  const ty = cy - 16 * S;

  // Satellite positions (gently drifting along orbit)
  const drift = Math.sin(t * 0.35) * 0.06;
  const sats = [
    { a: -Math.PI * 0.78 + drift, col: '#38bdf8', name: 'SAT-1', show: 1, circle: pC1 },
    { a: -Math.PI * 0.22 + drift, col: '#fb923c', name: 'SAT-2', show: 1, circle: pTri },
    { a: Math.PI * 0.68 + drift, col: '#e879f9', name: 'SAT-3', show: 1, circle: pTri },
    { a: Math.PI * 0.24 + drift, col: '#4ade80', name: 'SAT-4', show: pOutro, circle: pOutro },
  ];

  // Draw trilateration range circles (each passes EXACTLY through (tx, ty))
  for (const s of sats) {
    if (s.show < 0.02) continue;
    const sx = cx + Math.cos(s.a) * orbitR;
    const sy = cy + Math.sin(s.a) * orbitR;
    const dist = Math.hypot(tx - sx, ty - sy);

    // Light-speed radio pulse beams
    if (pSig > 0.05) {
      ctx.save();
      ctx.globalAlpha = pSig * s.show;
      ctx.strokeStyle = s.col;
      ctx.lineWidth = 2 * S;
      ctx.setLineDash([6 * S, 10 * S]);
      ctx.lineDashOffset = -t * 160 * S;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.setLineDash([]);

      // Moving light-speed packet
      const u = (t * 1.4 + s.a) % 1;
      const px = sx + (tx - sx) * u;
      const py = sy + (ty - sy) * u;
      ctx.fillStyle = s.col;
      ctx.beginPath(); ctx.arc(px, py, 5 * S, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Intersecting trilateration circle
    if (s.circle > 0.02) {
      const r = dist * s.circle;
      ctx.save();
      ctx.globalAlpha = 0.85 * s.circle;
      ctx.strokeStyle = s.col;
      ctx.lineWidth = 3.5 * S;
      ctx.shadowColor = s.col;
      ctx.shadowBlur = 10 * S;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  // Draw satellites on top
  for (const s of sats) {
    if (s.show < 0.02) continue;
    ctx.save();
    ctx.globalAlpha = s.show;
    const sx = cx + Math.cos(s.a) * orbitR;
    const sy = cy + Math.sin(s.a) * orbitR;
    drawSatellite(sx, sy, s.a + Math.PI * 0.5, s.col, S, s.name);
    ctx.restore();
  }

  // Phone / User Pin & Lock Reticle at (tx, ty)
  const lockPulse = 1 + Math.sin(t * 9) * 0.14;
  ctx.save();
  ctx.translate(tx, ty);
  // Phone icon
  ctx.fillStyle = '#0f172a';
  ctx.strokeStyle = pOutro > 0.2 ? '#4ade80' : '#f8fafc';
  ctx.lineWidth = 3 * S;
  ctx.fillRect(-10 * S, -16 * S, 20 * S, 32 * S);
  ctx.strokeRect(-10 * S, -16 * S, 20 * S, 32 * S);
  ctx.fillStyle = pOutro > 0.2 ? '#4ade80' : '#38bdf8';
  ctx.fillRect(-6 * S, -11 * S, 12 * S, 19 * S);

  // Target lock ring when trilateration converges
  if (pTri > 0.1) {
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 3.5 * S;
    ctx.shadowColor = '#22c55e';
    ctx.shadowBlur = 14 * S;
    ctx.beginPath(); ctx.arc(0, 0, 26 * S * lockPulse, 0, Math.PI * 2); ctx.stroke();
    // Crosshair ticks
    for (let k = 0; k < 4; k++) {
      const ca = k * Math.PI * 0.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ca) * 20 * S, Math.sin(ca) * 20 * S);
      ctx.lineTo(Math.cos(ca) * 36 * S, Math.sin(ca) * 36 * S);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  // Coordinate readout banner
  if (pOutro > 0.05) {
    ctx.save();
    ctx.globalAlpha = pOutro;
    ctx.fillStyle = 'rgba(2,6,23,0.85)';
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 2.5 * S;
    ctx.fillRect(cx - 185 * S, cy - 352 * S, 370 * S, 46 * S);
    ctx.strokeRect(cx - 185 * S, cy - 352 * S, 370 * S, 46 * S);
    ctx.fillStyle = '#4ade80';
    ctx.font = `900 ${Math.round(22 * S)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('LOCKED · 37.77°N  122.42°W  ±3m', cx, cy - 321 * S);
    ctx.restore();
  } else if (pSig > 0.05) {
    ctx.save();
    ctx.globalAlpha = pSig;
    ctx.fillStyle = '#38bdf8';
    ctx.font = `800 ${Math.round(21 * S)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('c = 299,792 km/s · Δt = 0.067s', cx, cy - 328 * S);
    ctx.restore();
  }

  ctx.restore();

  // Top title + animated bottom caption
  let activeLine = LINES[0];
  for (const l of LINES) if (t >= l.start) activeLine = l;
  ctx.save(); ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(34 * S)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#93c5fd';
  ctx.fillText('HOW GPS SATELLITES WORK', W * 0.5, H * 0.125);
  if (activeLine) {
    const pop = 1 + 0.08 * Math.exp(-Math.max(0, t - activeLine.start) * 14);
    ctx.translate(W * 0.5, H * 0.715); ctx.scale(pop, pop);
    ctx.font = `900 ${Math.round(46 * S)}px -apple-system, sans-serif`;
    ctx.lineWidth = 10 * S; ctx.strokeStyle = '#020617'; ctx.strokeText(activeLine.caption, 0, 0);
    ctx.fillStyle = activeLine.id === 'trilat' || activeLine.id === 'outro' ? '#4ade80' : '#facc15';
    ctx.fillText(activeLine.caption, 0, 0);
  }
  ctx.restore();
}

window.renderBatch = (s, c) => {
  const out = [];
  for (let i = 0; i < c; i++) { drawFrame((s + i) / FPS); out.push(cv.toDataURL('image/jpeg', 0.92).slice(23)); }
  return out;
};
window.ready = true;
</script>
