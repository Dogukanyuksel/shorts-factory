<!doctype html>
<!--
  Clear Mechanics — Potential vs Kinetic Energy (3D PBR Pendulum Gantry + Live Conservation Columns)
  Y-LABS 3D Cinema Engine (Three.js PBR, 60fps deterministic)
-->
<meta charset="utf-8">
<style>html,body{margin:0;background:#141414;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module" data-engine="three">
import * as THREE from 'https://local.shorts/three.module.js';
import {
  createStudioStage,
  createMaterials,
  addXrayEdges,
  drawStudioHud,
  clamp,
  lerp,
  smooth,
} from 'https://local.shorts/ylabs-3d-kit.js';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const SCRIPT = [
  { id: 'hook', text: "Where does a pendulum's speed go when it stops at the top?", caption: 'POTENTIAL VS KINETIC' },
  { id: 'peak', text: 'At the highest point, speed drops to zero. All the energy is stored as potential energy from height.', caption: 'MAX POTENTIAL (mgh)' },
  { id: 'fall', text: 'As gravity pulls it down, height turns directly into speed — trading blue potential for red kinetic.', caption: 'ENERGY TRANSFER' },
  { id: 'bottom', text: 'At the very bottom, height hits zero and velocity peaks. Kinetic energy reaches one hundred percent!', caption: 'MAX KINETIC (½mv²)' },
  { id: 'total', text: 'Now watch the cyan bar on the right. Total energy never flickers — not even a single percent.', caption: 'TOTAL = CONSTANT' },
  { id: 'law', text: 'Energy is never created or destroyed. It only changes form, swing after swing.', caption: 'CONSERVATION OF ENERGY' },
];

let W = 720, H = 1280, FPS = 60, DUR = 22, LINES = [], EVENTS = [];
let stage = null, built = false;
let pendPivot, bobMesh, bobMat, bobHalo, peBar, keBar, totBar;

window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;

function getLine(id, fallbackIdx) {
  const found = LINES.find((l) => l.id === id);
  if (found) return found;
  const seg = DUR / SCRIPT.length;
  return { id, start: fallbackIdx * seg, end: (fallbackIdx + 1) * seg, caption: SCRIPT[fallbackIdx].caption };
}

function buildScene() {
  stage = createStudioStage({
    width: W,
    height: H,
    channel: 'explainer',
    fov: 38,
    fogDensity: 0.024,
    floorY: -2.4,
  });
  const { scene } = stage;
  const mats = createMaterials('explainer');

  // Industrial Machined Steel Pendulum Gantry Frame
  const gantry = new THREE.Group();
  const topBeam = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.24, 0.44), mats.darkMetal);
  topBeam.position.set(0, 2.55, 0);
  gantry.add(topBeam);
  gantry.add(addXrayEdges(new THREE.BoxGeometry(5.22, 0.26, 0.46), 0xff9500, 0.35)).position.set(0, 2.55, 0);

  for (const sx of [-2.35, 2.35]) {
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.16, 4.95, 18), mats.steel);
    pillar.position.set(sx, 0.08, -0.15);
    gantry.add(pillar);
  }

  // Pivot bearing collar
  const pivotCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.55, 24), mats.primary);
  pivotCollar.rotation.x = Math.PI / 2;
  pivotCollar.position.set(0, 2.45, 0);
  gantry.add(pivotCollar);
  scene.add(gantry);

  // Glowing 3D Arc Guide Track showing full swing path
  const arcPts = [];
  const L = 3.15;
  const maxA = 0.88;
  for (let i = 0; i <= 40; i++) {
    const a = lerp(-maxA, maxA, i / 40);
    arcPts.push(new THREE.Vector3(Math.sin(a) * L, 2.45 - Math.cos(a) * L, 0));
  }
  const arcCurve = new THREE.CatmullRomCurve3(arcPts);
  const arcTube = new THREE.Mesh(new THREE.TubeGeometry(arcCurve, 48, 0.032, 8, false), mats.translucent(0x38bdf8, 0.42));
  scene.add(arcTube);

  // Pendulum Arm + Luminous PBR Bob
  pendPivot = new THREE.Group();
  pendPivot.position.set(0, 2.45, 0);
  scene.add(pendPivot);

  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, L, 16), mats.steel);
  rod.position.y = -L * 0.5;
  pendPivot.add(rod);

  bobMat = new THREE.MeshStandardMaterial({
    color: 0x38bdf8,
    emissive: 0x0284c7,
    emissiveIntensity: 0.72,
    metalness: 0.78,
    roughness: 0.16,
  });
  bobMesh = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 32), bobMat);
  bobMesh.position.y = -L;
  pendPivot.add(bobMesh);

  bobHalo = new THREE.Mesh(new THREE.TorusGeometry(0.54, 0.032, 12, 36), mats.glow(0xff9500, 1.0));
  bobHalo.position.y = -L;
  pendPivot.add(bobHalo);

  // 3D Live Energy Conservation Glass Columns in lower-rear stage (PE, KE, TOTAL=100%)
  const colXs = [-1.45, 0.0, 1.45];
  const colHex = [0x38bdf8, 0xff3b30, 0x00f0ff];
  const barRefs = [];
  for (let i = 0; i < 3; i++) {
    const cg = new THREE.Group();
    cg.position.set(colXs[i], -2.35, -1.35);

    const shellGeo = new THREE.CylinderGeometry(0.32, 0.32, 2.1, 24, 1, true);
    const shell = new THREE.Mesh(shellGeo, mats.xrayGlass);
    shell.position.y = 1.05;
    cg.add(shell);
    const edge = addXrayEdges(new THREE.CylinderGeometry(0.33, 0.33, 2.1, 14, 1, true), colHex[i], 0.42);
    edge.position.y = 1.05;
    cg.add(edge);

    const bar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.26, 0.26, 1.0, 20),
      mats.glow(colHex[i], 0.75, 0.2, 0.45),
    );
    cg.add(bar);
    scene.add(cg);
    barRefs.push(bar);
  }
  [peBar, keBar, totBar] = barRefs;

  built = true;
}

window.init = (cfg = {}) => {
  W = cfg.width || 720;
  H = cfg.height || 1280;
  FPS = cfg.fps || 60;
  DUR = cfg.duration || 22;
  LINES = cfg.lines || [];
  cv.width = W;
  cv.height = H;

  const lPeak = getLine('peak', 1);
  const lFall = getLine('fall', 2);
  const lBot = getLine('bottom', 3);
  const lTot = getLine('total', 4);
  const lLaw = getLine('law', 5);

  EVENTS = [
    { t: lPeak.start + 0.25, type: 'bounce', pitchIndex: 4, intensity: 0.6 },
    { t: lFall.start + 0.2, type: 'bounce', pitchIndex: 6, intensity: 0.65 },
    { t: lBot.start + 0.2, type: 'break', pitchIndex: 8, intensity: 0.85 },
    { t: lTot.start + 0.2, type: 'bounce', pitchIndex: 10, intensity: 0.75 },
    { t: lLaw.start + 0.25, type: 'win', pitchIndex: 12, intensity: 0.95 },
  ];

  if (!built) buildScene();
};

function renderSceneAt(t) {
  if (!built) buildScene();

  const lPeak = getLine('peak', 1);
  const lBot = getLine('bottom', 3);
  const lTot = getLine('total', 4);

  let activeCaption = SCRIPT[0].caption;
  for (let i = 0; i < SCRIPT.length; i++) {
    const ln = getLine(SCRIPT[i].id, i);
    if (t >= ln.start) activeCaption = ln.caption || SCRIPT[i].caption;
  }

  // Smooth harmonic pendulum swing (5 complete swings over DUR)
  const omega = (Math.PI * 2 * 5) / Math.max(1, DUR);
  const maxAngle = 0.86;
  const theta = maxAngle * Math.cos(omega * t);
  pendPivot.rotation.z = theta;

  // Exact physics conservation: PE = (1 - cos(theta)) / (1 - cos(maxAngle)), KE = 1 - PE
  const peFrac = clamp((1 - Math.cos(theta)) / Math.max(1e-5, 1 - Math.cos(maxAngle)), 0, 1);
  const keFrac = clamp(1 - peFrac, 0, 1);

  // Bob shifts color smoothly between Electric Blue (PE) and Fiery Orange-Red (KE)
  const colPE = new THREE.Color(0x38bdf8);
  const colKE = new THREE.Color(0xff3b30);
  bobMat.color.copy(colPE).lerp(colKE, keFrac);
  bobMat.emissive.copy(colPE).lerp(colKE, keFrac);
  bobHalo.rotation.set(t * 2.5, t * 3.2, 0);
  bobHalo.scale.setScalar(0.95 + 0.22 * keFrac);

  // Update 3D Conservation Columns
  const maxBarH = 1.98;
  const peH = Math.max(0.04, peFrac * maxBarH);
  const keH = Math.max(0.04, keFrac * maxBarH);
  peBar.scale.set(1, peH, 1);
  peBar.position.y = peH * 0.5 + 0.04;
  keBar.scale.set(1, keH, 1);
  keBar.position.y = keH * 0.5 + 0.04;
  totBar.scale.set(1, maxBarH, 1);
  totBar.position.y = maxBarH * 0.5 + 0.04;

  // Dynamic camera choreography
  const { camera } = stage;
  const pTot = smooth(lTot.start, lTot.start + 1.0, t);
  camera.position.set(
    Math.sin(t * 0.4) * 1.9 + lerp(0, 0.7, pTot),
    lerp(0.65, -0.1, pTot),
    lerp(9.8, 9.2, pTot),
  );
  camera.lookAt(0, 0.0, -0.35);

  stage.composite(ctx, W, H);

  drawStudioHud(ctx, {
    W,
    H,
    channel: 'explainer',
    badge: 'CONSERVATION OF ENERGY · 3D PBR',
    title: 'POTENTIAL VS KINETIC',
    subtitle: 'mgh  +  ½mv²  =  100% CONSTANT',
    caption: activeCaption,
    metrics: [
      { label: 'POTENTIAL (PE)', value: `${Math.round(peFrac * 100)}%`, color: '#38BDF8' },
      { label: 'KINETIC (KE)', value: `${Math.round(keFrac * 100)}%`, color: '#FF3B30' },
      { label: 'TOTAL ENERGY', value: '100%', color: '#00F0FF' },
    ],
    progress: t / Math.max(1, DUR),
  });
}

window.renderFrame = (t) => {
  renderSceneAt(t);
  return cv.toDataURL('image/jpeg', 0.92).slice(23);
};

window.renderBatch = (startFrame, count) => {
  const out = [];
  for (let i = 0; i < count; i++) {
    renderSceneAt((startFrame + i) / FPS);
    out.push(cv.toDataURL('image/jpeg', 0.92).slice(23));
  }
  return out;
};

window.ready = true;
</script>
