<!doctype html>
<!-- How It Actually Works — Jet Engine -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#070d1a;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const smooth = (a, b, t) => { const x = clamp((t - a) / Math.max(1e-5, b - a), 0, 1); return x * x * (3 - 2 * x); };

const SCRIPT = [
  { id: 'hook', text: 'How does a jet engine scream forward with 100,000 pounds of thrust?', caption: '100,000 LBS THRUST!' },
  { id: 'intake', text: 'First, giant titanium fan blades suck in massive amounts of cold air.', caption: 'GIANT INTAKE FAN' },
  { id: 'compress', text: 'Spinning compressor stages squeeze that air to 40 times normal pressure.', caption: '40X COMPRESSION' },
  { id: 'combust', text: 'Fuel sprays into the chamber and ignites in a 2,000-degree inferno.', caption: '2,000°C IGNITION!' },
  { id: 'turbine', text: 'Blasting hot gas spins the rear turbine, powering the front fan shaft.', caption: 'TURBINE SPIN' },
  { id: 'outro', text: 'Superheated exhaust rockets out the nozzle, blasting the jet forward!', caption: 'PURE JET THRUST!' },
];

let W = 720, H = 1280, FPS = 60, DUR = 24, LINES = [], EVENTS = [];
window.getScript = () => SCRIPT;
window.getEvents = () => EVENTS;
window.init = (cfg) => {
  W = cfg.width || 720; H = cfg.height || 1280; FPS = cfg.fps || 60; DUR = cfg.duration || 24; LINES = cfg.lines || [];
  cv.width = W; cv.height = H;
  const byId = (id) => LINES.find((l) => l.id === id) || { start: 0, end: 3 };
  EVENTS = [
    { t: byId('intake').start + 0.25, type: 'bounce', pitchIndex: 3, intensity: 0.6 },
    { t: byId('compress').start + 0.25, type: 'bounce', pitchIndex: 5, intensity: 0.7 },
    { t: byId('combust').start + 0.2, type: 'break', pitchIndex: 8, intensity: 0.9 },
    { t: byId('turbine').start + 0.25, type: 'bounce', pitchIndex: 7, intensity: 0.7 },
    { t: byId('outro').start + 0.2, type: 'win', pitchIndex: 10, intensity: 0.95 },
  ];
};

function drawFrame(t) {
  const S = W / 720;
  const byId = (id) => LINES.find((l) => l.id === id) || { start: 0, end: 3 };
  const pIntake = smooth(byId('intake').start, byId('intake').start + 0.6, t);
  const pComp = smooth(byId('compress').start, byId('compress').start + 0.6, t);
  const pComb = smooth(byId('combust').start, byId('combust').start + 0.5, t);
  const pTurb = smooth(byId('turbine').start, byId('turbine').start + 0.6, t);
  const pOutro = smooth(byId('outro').start, byId('outro').start + 0.6, t);

  // Blueprint background + grid
  const bg = ctx.createRadialGradient(W * 0.5, H * 0.5, 40 * S, W * 0.5, H * 0.5, H * 0.65);
  bg.addColorStop(0, '#0d2240'); bg.addColorStop(0.6, '#071124'); bg.addColorStop(1, '#040812');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(56,189,248,0.06)'; ctx.lineWidth = 1.2 * S;
  for (let x = 0; x < W; x += 40 * S) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40 * S) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  const cx = W * 0.49, cy = H * 0.50;
  const zoom = 1 + smooth(0, DUR, t) * 0.06;
  const spinSpeed = 7 + pIntake * 6 + pComb * 9 + pOutro * 6;
  const spinPhase = t * spinSpeed;

  ctx.save();
  ctx.translate(cx, cy); ctx.scale(zoom, zoom); ctx.translate(-cx, -cy);

  // Subtle vibration during full thrust
  const shakeY = pOutro * Math.sin(t * 55) * 2.2 * S;
  ctx.translate(0, shakeY);

  // Engine geometry anchors (relative to cx, cy)
  const xIn = cx - 235 * S;
  const xFan = cx - 190 * S;
  const xComp1 = cx - 135 * S;
  const xComp2 = cx - 55 * S;
  const xComb1 = cx - 35 * S;
  const xComb2 = cx + 70 * S;
  const xTurb = cx + 115 * S;
  const xNoz = cx + 215 * S;

  // Exhaust flame plume (behind nozzle)
  if (pComb > 0.05) {
    const thrustLen = (100 + pOutro * 125 + Math.sin(t * 42) * 14) * S * pComb;
    const plumeGrad = ctx.createLinearGradient(xNoz, cy, xNoz + thrustLen, cy);
    plumeGrad.addColorStop(0, 'rgba(254,240,138,0.95)');
    plumeGrad.addColorStop(0.28, 'rgba(251,146,60,0.85)');
    plumeGrad.addColorStop(0.65, 'rgba(239,68,68,0.45)');
    plumeGrad.addColorStop(1, 'rgba(239,68,68,0)');
    ctx.fillStyle = plumeGrad;
    ctx.beginPath();
    ctx.moveTo(xNoz - 5 * S, cy - 52 * S);
    ctx.quadraticCurveTo(xNoz + thrustLen * 0.5, cy - 30 * S, xNoz + thrustLen, cy);
    ctx.quadraticCurveTo(xNoz + thrustLen * 0.5, cy + 30 * S, xNoz - 5 * S, cy + 52 * S);
    ctx.closePath();
    ctx.fill();

    // Supersonic shock diamonds
    for (let d = 0; d < 3; d++) {
      const dx = xNoz + (28 + d * 42) * S * (0.7 + pOutro * 0.45);
      const dw = (18 - d * 3) * S * pComb;
      const dh = (22 - d * 4) * S * pComb;
      ctx.fillStyle = `rgba(254,249,195,${(0.55 - d * 0.14).toFixed(2)})`;
      ctx.beginPath();
      ctx.moveTo(dx - dw, cy);
      ctx.lineTo(dx, cy - dh);
      ctx.lineTo(dx + dw, cy);
      ctx.lineTo(dx, cy + dh);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Interior dark chamber fill
  ctx.fillStyle = '#0a1628';
  ctx.beginPath();
  ctx.moveTo(xIn, cy - 132 * S);
  ctx.bezierCurveTo(xFan + 40 * S, cy - 140 * S, xComb1, cy - 95 * S, xComb2, cy - 95 * S);
  ctx.lineTo(xTurb + 25 * S, cy - 92 * S);
  ctx.lineTo(xNoz, cy - 54 * S);
  ctx.lineTo(xNoz, cy + 54 * S);
  ctx.lineTo(xTurb + 25 * S, cy + 92 * S);
  ctx.lineTo(xComb2, cy + 95 * S);
  ctx.bezierCurveTo(xComb1, cy + 95 * S, xFan + 40 * S, cy + 140 * S, xIn, cy + 132 * S);
  ctx.closePath();
  ctx.fill();

  // Internal airflow streamlines & particles
  for (let row = 0; row < 6; row++) {
    const side = row < 3 ? -1 : 1;
    const idx = row % 3;
    const rFrac = 0.32 + idx * 0.27;
    const speed = (280 + pIntake * 140 + pOutro * 180) * S;

    for (let p = 0; p < 5; p++) {
      const u = ((t * speed / (520 * S) + p * 0.2 + row * 0.13) % 1);
      const px = xIn - 80 * S + u * (xNoz - xIn + 210 * S);
      let halfH = 122 * S;
      if (px > xFan && px <= xComp2) {
        const k = clamp((px - xFan) / (xComp2 - xFan), 0, 1);
        halfH = (122 - k * 42) * S;
      } else if (px > xComp2 && px <= xTurb) {
        halfH = 80 * S;
      } else if (px > xTurb) {
        const k = clamp((px - xTurb) / (xNoz - xTurb), 0, 1);
        halfH = (80 - k * 32) * S;
      }
      const py = cy + side * halfH * rFrac + Math.sin(u * 16 + row) * 3 * S;

      let col = '#38bdf8';
      let rad = 4.2 * S;
      if (px > xComp1 && px <= xComb1 && pComp > 0.1) {
        col = '#facc15';
        rad = (4.2 + pComp * 1.4) * S;
      } else if (px > xComb1 && pComb > 0.1) {
        col = px > xNoz ? '#fef08a' : '#fb923c';
        rad = (5.2 + pComb * 1.6) * S;
      }
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse(px, py, rad * (px > xComb1 ? 2.2 : 1.5), rad * 0.75, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Combustion chamber fire glow (upper & lower annular burners)
  if (pComb > 0.05) {
    for (const side of [-1, 1]) {
      const by = cy + side * 48 * S;
      const fireG = ctx.createRadialGradient(xComb1 + 35 * S, by, 4 * S, xComb1 + 48 * S, by, 68 * S);
      fireG.addColorStop(0, `rgba(254,249,195,${(0.95 * pComb).toFixed(2)})`);
      fireG.addColorStop(0.45, `rgba(251,146,60,${(0.85 * pComb).toFixed(2)})`);
      fireG.addColorStop(1, 'rgba(239,68,68,0)');
      ctx.fillStyle = fireG;
      ctx.beginPath();
      ctx.ellipse(xComb1 + 48 * S, by, (58 + Math.sin(t * 36 + side) * 6) * S, (28 + Math.cos(t * 30) * 3) * S, 0, 0, Math.PI * 2);
      ctx.fill();

      // Fuel injector nozzle
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(xComb1 - 8 * S, by - 5 * S, 16 * S, 10 * S);
    }
  }

  // Central rotating shaft
  const shaftGrad = ctx.createLinearGradient(0, cy - 16 * S, 0, cy + 16 * S);
  shaftGrad.addColorStop(0, pTurb > 0.2 ? '#fde047' : '#94a3b8');
  shaftGrad.addColorStop(0.5, '#f8fafc');
  shaftGrad.addColorStop(1, pTurb > 0.2 ? '#f59e0b' : '#475569');
  ctx.fillStyle = shaftGrad;
  ctx.fillRect(xFan - 10 * S, cy - 12 * S, (xTurb - xFan + 36 * S), 24 * S);
  // Shaft rotation stripes
  ctx.strokeStyle = 'rgba(15,23,42,0.5)';
  ctx.lineWidth = 3 * S;
  for (let i = 0; i < 8; i++) {
    const sy = cy - 10 * S + ((spinPhase * 12 + i * 7) % 20) * S;
    ctx.beginPath(); ctx.moveTo(xFan, sy); ctx.lineTo(xTurb + 20 * S, sy); ctx.stroke();
  }

  // Nose cone (spinner)
  const coneG = ctx.createLinearGradient(xIn - 25 * S, cy - 28 * S, xFan, cy + 28 * S);
  coneG.addColorStop(0, '#f8fafc'); coneG.addColorStop(1, '#475569');
  ctx.fillStyle = coneG;
  ctx.beginPath();
  ctx.moveTo(xFan, cy - 26 * S);
  ctx.quadraticCurveTo(xIn - 26 * S, cy, xFan, cy + 26 * S);
  ctx.closePath();
  ctx.fill();

  // Giant Intake Fan blades
  for (let b = 0; b < 10; b++) {
    const a = (b / 10) * Math.PI * 2 + spinPhase;
    const yOff = Math.sin(a) * 116 * S;
    const depth = Math.cos(a);
    ctx.strokeStyle = depth > 0 ? '#e2e8f0' : '#64748b';
    ctx.lineWidth = (7 + depth * 3) * S;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(xFan, cy + yOff * 0.22);
    ctx.lineTo(xFan + depth * 9 * S, cy + yOff);
    ctx.stroke();
  }

  // 4 Compressor stages (gradually shorter blades)
  for (let st = 0; st < 4; st++) {
    const sx = xComp1 + st * 26 * S;
    const maxR = (104 - st * 11) * S;
    for (let b = 0; b < 8; b++) {
      const a = (b / 8) * Math.PI * 2 + spinPhase * (1.1 + st * 0.1) + st;
      const yOff = Math.sin(a) * maxR;
      const depth = Math.cos(a);
      ctx.strokeStyle = pComp > 0.2 ? (depth > 0 ? '#fde047' : '#ca8a04') : (depth > 0 ? '#cbd5e1' : '#475569');
      ctx.lineWidth = (4.5 + depth * 1.5) * S;
      ctx.beginPath();
      ctx.moveTo(sx, cy + yOff * 0.2);
      ctx.lineTo(sx + depth * 5 * S, cy + yOff);
      ctx.stroke();
    }
  }

  // 2 Rear Turbine stages
  for (let st = 0; st < 2; st++) {
    const tx = xTurb + st * 24 * S;
    const maxR = (76 + st * 6) * S;
    for (let b = 0; b < 8; b++) {
      const a = (b / 8) * Math.PI * 2 + spinPhase * 1.3 + st * 0.7;
      const yOff = Math.sin(a) * maxR;
      const depth = Math.cos(a);
      ctx.strokeStyle = pTurb > 0.2 ? (depth > 0 ? '#fb923c' : '#c2410c') : (depth > 0 ? '#cbd5e1' : '#475569');
      ctx.lineWidth = (5 + depth * 1.8) * S;
      ctx.beginPath();
      ctx.moveTo(tx, cy + yOff * 0.22);
      ctx.lineTo(tx - depth * 6 * S, cy + yOff);
      ctx.stroke();
    }
  }

  // Outer cutaway metallic nacelle walls (top & bottom)
  ctx.lineWidth = 8 * S;
  ctx.strokeStyle = '#94a3b8';
  ctx.lineCap = 'round';
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(xIn, cy + side * 132 * S);
    ctx.bezierCurveTo(xFan + 40 * S, cy + side * 140 * S, xComb1, cy + side * 95 * S, xComb2, cy + side * 95 * S);
    ctx.lineTo(xTurb + 25 * S, cy + side * 92 * S);
    ctx.lineTo(xNoz, cy + side * 54 * S);
    ctx.stroke();
    // Bright highlight edge
    ctx.lineWidth = 2.5 * S;
    ctx.strokeStyle = '#e2e8f0';
    ctx.stroke();
    ctx.lineWidth = 8 * S;
    ctx.strokeStyle = '#94a3b8';
  }

  // Stage labels & indicators
  ctx.font = `800 ${Math.round(19 * S)}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  if (pIntake > 0.05) {
    ctx.globalAlpha = pIntake;
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('1. INTAKE', xFan, cy - 162 * S);
  }
  if (pComp > 0.05) {
    ctx.globalAlpha = pComp;
    ctx.fillStyle = '#facc15';
    ctx.fillText('2. COMPRESS', (xComp1 + xComp2) * 0.5, cy + 148 * S);
  }
  if (pComb > 0.05) {
    ctx.globalAlpha = pComb;
    ctx.fillStyle = '#fb923c';
    ctx.fillText('3. IGNITE', (xComb1 + xComb2) * 0.5 + 8 * S, cy - 128 * S);
  }
  if (pTurb > 0.05) {
    ctx.globalAlpha = pTurb;
    ctx.fillStyle = '#f97316';
    ctx.fillText('4. TURBINE', xTurb + 10 * S, cy + 148 * S);
  }

  // Forward Thrust Arrow in outro
  if (pOutro > 0.05) {
    ctx.globalAlpha = pOutro;
    const ay = cy - 208 * S;
    const alen = (140 + Math.sin(t * 7) * 14) * S * pOutro;
    ctx.strokeStyle = '#4ade80'; ctx.fillStyle = '#4ade80';
    ctx.shadowColor = '#22c55e'; ctx.shadowBlur = 16 * S;
    ctx.lineWidth = 8 * S;
    ctx.beginPath(); ctx.moveTo(cx + alen * 0.5, ay); ctx.lineTo(cx - alen * 0.5, ay); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - alen * 0.5 - 22 * S, ay);
    ctx.lineTo(cx - alen * 0.5 + 6 * S, ay - 15 * S);
    ctx.lineTo(cx - alen * 0.5 + 6 * S, ay + 15 * S);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.font = `900 ${Math.round(28 * S)}px -apple-system, sans-serif`;
    ctx.fillText('← FORWARD THRUST', cx, ay - 26 * S);
  }

  ctx.globalAlpha = 1;
  ctx.restore();

  // Top title + animated bottom caption
  let activeLine = LINES[0];
  for (const l of LINES) if (t >= l.start) activeLine = l;
  ctx.save(); ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(34 * S)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#93c5fd';
  ctx.fillText('HOW A JET ENGINE WORKS', W * 0.5, H * 0.125);
  if (activeLine) {
    const pop = 1 + 0.08 * Math.exp(-Math.max(0, t - activeLine.start) * 14);
    ctx.translate(W * 0.5, H * 0.84); ctx.scale(pop, pop);
    ctx.font = `900 ${Math.round(46 * S)}px -apple-system, sans-serif`;
    ctx.lineWidth = 10 * S; ctx.strokeStyle = '#020617'; ctx.strokeText(activeLine.caption, 0, 0);
    ctx.fillStyle = activeLine.id === 'combust' || activeLine.id === 'outro' ? '#4ade80' : '#facc15';
    ctx.fillText(activeLine.caption, 0, 0);
  }
  ctx.restore();
}

window.renderBatch = (s, c) => {
  const out = [];
  for (let i = 0; i < c; i++) { drawFrame((s + i) / FPS); out.push(cv.toDataURL('image/jpeg', 0.92).slice(23)); }
  return out;
};
window.ready = true;
</script>
